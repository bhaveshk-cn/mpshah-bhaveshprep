<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MP Shah Companion</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E7C70">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#F2F5F8;--card:#fff;--ink:#101828;--muted:#667085;--line:#E4E7EC;--teal:#0E7C70;--tealbg:#E3F4F1;--indigo:#4053D6;--indigobg:#EAEDFC;--amber:#E39A0B;--amberbg:#FEF4DE;--violet:#7A5AF8;--violetbg:#F0EBFF;--red:#D92D20;--redbg:#FDECEA;--green:#12A15F;--greenbg:#E4F7EE;--r:20px;--sh:0 4px 18px rgba(16,24,40,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C111D;--card:#161B26;--ink:#F2F4F7;--muted:#98A2B3;--line:#252C3B;--tealbg:#0F2A27;--indigobg:#1A1F3D;--amberbg:#2E2410;--violetbg:#231B3D;--redbg:#341613;--greenbg:#0F2A1E;--teal:#2EC4B1;--indigo:#8B9BFF;--violet:#A58BFF;--amber:#F5B83D;--red:#FF6B5E;--green:#3DD68C;--sh:none}}
:root[data-theme=dark]{--bg:#0C111D;--card:#161B26;--ink:#F2F4F7;--muted:#98A2B3;--line:#252C3B;--tealbg:#0F2A27;--indigobg:#1A1F3D;--amberbg:#2E2410;--violetbg:#231B3D;--redbg:#341613;--greenbg:#0F2A1E;--teal:#2EC4B1;--indigo:#8B9BFF;--violet:#A58BFF;--amber:#F5B83D;--red:#FF6B5E;--green:#3DD68C;--sh:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.shell{max-width:600px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header.top h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.02em}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;font-size:1.15rem}
.back{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:6px 0;font-size:.95rem}
h2{font-size:1.25rem;font-weight:800;margin:22px 0 10px;letter-spacing:-.01em}
p{margin:0 0 .7em}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
/* home */
.hello{font-size:1.05rem;color:var(--muted);margin:4px 0 2px}
.count{display:inline-flex;align-items:baseline;gap:8px;background:var(--amberbg);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;margin:4px 0 16px}
.count b{font-size:1.15rem;color:var(--amber)}
.today{background:var(--teal);color:#fff;border-radius:24px;padding:22px;cursor:pointer;border:0;width:100%;text-align:left;display:block;margin-bottom:16px}
.today small{opacity:.85;font-weight:600}
.today h3{font-size:1.4rem;margin:6px 0 8px;font-weight:800;line-height:1.2}
.today .go{display:inline-block;background:#fff;color:var(--teal);border-radius:999px;padding:7px 16px;font-weight:800;margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:var(--r);padding:18px 16px;text-align:left;cursor:pointer;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.tile .em{font-size:1.8rem}
.tile b{font-size:1.1rem;font-weight:800;display:block}
.tile span{font-size:.86rem;opacity:.85}
.t-teal{background:var(--tealbg);color:var(--ink)}.t-teal b{color:var(--teal)}
.t-indigo{background:var(--indigobg);color:var(--ink)}.t-indigo b{color:var(--indigo)}
.t-amber{background:var(--amberbg);color:var(--ink)}.t-amber b{color:var(--amber)}
.t-violet{background:var(--violetbg);color:var(--ink)}.t-violet b{color:var(--violet)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);margin:14px 0;cursor:text;border:0;width:100%;text-align:left;color:var(--muted)}
/* segmented */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--sh);margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:480px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.pick{background:var(--card);border:0;border-radius:16px;padding:14px;text-align:left;cursor:pointer;box-shadow:var(--sh);min-height:96px;display:flex;flex-direction:column;gap:6px}
.pick .em{font-size:1.5rem}.pick b{font-size:.95rem;line-height:1.25}.pick span{font-size:.8rem;color:var(--muted)}
/* brief */
.bhead{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.bhead .em{font-size:2.2rem;width:64px;height:64px;border-radius:18px;background:var(--tealbg);display:grid;place-items:center;flex:0 0 auto}
.bhead h1{font-size:1.45rem;margin:0;font-weight:800;line-height:1.2}
.lbl{font-size:.82rem;font-weight:800;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.know li{margin:0 0 8px}
ol.ask{padding-left:0;list-style:none;counter-reset:q;margin:0}
ol.ask li{counter-increment:q;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
ol.ask li:last-child{border:0}
ol.ask li:before{content:counter(q);flex:0 0 28px;height:28px;border-radius:50%;background:var(--indigobg);color:var(--indigo);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--amberbg);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600}
.avoid{background:var(--redbg);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.avoid .lbl{color:var(--red)}
.cta{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--indigo);color:#fff;text-align:center}
.cta.teal{background:var(--teal)}.cta.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.row{display:flex;gap:10px}.row>*{flex:1}
/* meeting */
.askbig{background:var(--indigo);color:#fff;border-radius:24px;padding:24px 22px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
.askbig .q{font-size:1.35rem;font-weight:800;line-height:1.3}
.askbig .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.askbig .nav button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.cap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.cap button{border:0;border-radius:14px;padding:12px 4px;font-weight:800;cursor:pointer;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);box-shadow:var(--sh)}
.cap button .em{font-size:1.3rem}
.cap button.on{background:var(--teal);color:#fff}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);min-height:84px;resize:vertical}
input[type=text],input[type=search],select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.note{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.note:last-child{border:0}
.tag{flex:0 0 auto;font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 7px;height:fit-content;background:var(--tealbg);color:var(--teal)}
.del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem}
/* learn */
.deck{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:10px;width:100%;text-align:left;cursor:pointer}
.ring{width:46px;height:46px;flex:0 0 auto}
.deck b{display:block;font-size:1rem}.deck span{font-size:.82rem;color:var(--muted)}
.slide{border-radius:28px;padding:30px 24px;min-height:min(62vh,520px);display:flex;flex-direction:column;justify-content:center;color:#fff;position:relative}
.c-teal{background:linear-gradient(160deg,#0E7C70,#0A5B53)}.c-amber{background:linear-gradient(160deg,#C9800A,#A86500)}.c-red{background:linear-gradient(160deg,#C2382D,#9B2219)}.c-indigo{background:linear-gradient(160deg,#4053D6,#2C3BA8)}.c-violet{background:linear-gradient(160deg,#7A5AF8,#5839D1)}
.bars{display:flex;gap:4px;position:absolute;top:16px;left:20px;right:20px}
.bars i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}.bars i.on{background:#fff}
.slide .big{font-size:clamp(3rem,14vw,4.6rem);font-weight:800;line-height:1;margin-bottom:12px;letter-spacing:-.03em}
.slide h3{font-size:1.6rem;font-weight:800;line-height:1.2;margin:0 0 12px}
.slide p{font-size:1.15rem;line-height:1.5;opacity:.95;margin:0}
.slide .tipbtn{margin-top:20px;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;align-self:flex-start}
.slide .tip{margin-top:18px;background:rgba(255,255,255,.16);border-radius:16px;padding:14px 16px;font-size:1.05rem}
.slidenav{display:flex;gap:10px;margin-top:14px}
.slidenav button{flex:1}
/* practice */
.pcard{display:flex;gap:14px;align-items:center;border:0;border-radius:var(--r);padding:18px;width:100%;text-align:left;cursor:pointer;margin-bottom:12px}
.pcard .em{font-size:2rem}.pcard b{font-size:1.1rem;display:block}.pcard span{font-size:.88rem;color:var(--muted)}
.qcard{background:var(--card);border-radius:24px;padding:24px 20px;box-shadow:var(--sh);margin-bottom:14px}
.qcard .q{font-size:1.25rem;font-weight:800;line-height:1.35;margin-bottom:18px}
.opts{display:grid;gap:8px}
.opts button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-weight:700;cursor:pointer;text-align:left}
.opts button.right{border-color:var(--green);background:var(--greenbg)}.opts button.wrong{border-color:var(--red);background:var(--redbg)}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:.95rem}
.fb.good{background:var(--greenbg)}.fb.bad{background:var(--redbg)}.fb.mid{background:var(--amberbg)}
.bubble{background:var(--indigobg);border-radius:18px 18px 18px 6px;padding:14px 16px;margin:0 0 14px}
.bubble small{display:block;font-weight:800;color:var(--indigo);margin-bottom:4px}
.me{background:var(--tealbg);border-radius:18px 18px 6px 18px;padding:12px 16px;margin:0 0 6px 30px;font-weight:600}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 14px}.meter i{display:block;height:100%;background:var(--teal)}
.say .no,.say .yes{border-radius:14px;padding:12px 14px;margin-top:10px}
.say .no{background:var(--redbg)}.say .yes{background:var(--greenbg)}
/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.bottom .in{display:flex;max-width:600px;width:100%}
nav.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;padding:6px 0;border-radius:12px}
nav.bottom a .em{display:block;font-size:1.3rem;line-height:1.3;filter:grayscale(1);opacity:.7}
nav.bottom a.on{color:var(--teal)}nav.bottom a.on .em{filter:none;opacity:1}
/* search results */
.res{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);border:0;width:100%;text-align:left;cursor:pointer;display:block}
.res small{color:var(--muted);font-weight:700;font-size:.75rem}
.sheet{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;font-size:.9rem}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.steps{position:relative;margin:0;padding:0;list-style:none}
.steps li{position:relative;padding:0 0 16px 44px}
.steps li:before{content:attr(data-n);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.steps li:after{content:'';position:absolute;left:14px;top:32px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child:after{display:none}
.steps b{display:block;font-size:1rem}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;margin:4px 6px 0 0;background:var(--indigobg);color:var(--indigo)}
.pill.sys{background:var(--tealbg);color:var(--teal)}
.pill.v{background:var(--violetbg);color:var(--violet)}
.analogy{font-size:1.15rem;line-height:1.5;font-weight:600}
.term{display:block;width:100%;text-align:left;border:0;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.term b{font-size:1rem}.term span{display:block;color:var(--muted);margin-top:4px}
.term .hint{color:var(--teal);font-size:.8rem;font-weight:700}
.opp{border-left:4px solid var(--violet);padding:8px 12px;margin-bottom:10px;background:var(--bg);border-radius:0 12px 12px 0}
.ev{font-size:.95rem;margin-bottom:8px;padding-left:12px;border-left:3px solid var(--amber)}
.secnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--card);font-size:.75rem;font-weight:800;margin-right:4px}
.done-badge{position:absolute;top:10px;right:12px;font-size:1rem}
.pick{position:relative}
.trackbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.trackbar i{display:block;height:100%;background:var(--teal)}
.concept h3{font-size:.85rem;font-weight:800;color:var(--muted);margin:0 0 6px;text-transform:none}
.mq{margin-top:14px}
.mq .q{font-weight:800;margin-bottom:10px}
.tile.wide{grid-column:1/-1;min-height:110px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.jump{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin-bottom:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--bg);z-index:4}
.jump button{flex:0 0 auto;border:0;background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--ink)}
.src{margin-bottom:14px}.src:last-child{margin-bottom:0}
.src .h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;margin-bottom:6px}
.src ul{margin:0;padding-left:18px}.src li{margin-bottom:5px;font-size:.95rem}
.badge{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px}
.b-str{background:var(--tealbg);color:var(--teal)}.b-gap{background:var(--indigobg);color:var(--indigo)}.b-said{background:var(--violetbg);color:var(--violet)}.b-kz{background:var(--amberbg);color:var(--amber)}
.roles div{padding:8px 0;border-bottom:1px solid var(--line)}.roles div:last-child{border:0}
.roles b{display:block}.roles span{color:var(--muted);font-size:.92rem}
.deep{font-size:1.02rem;line-height:1.65}
.kpi{display:inline-block;background:var(--bg);border-radius:10px;padding:6px 10px;margin:0 6px 6px 0;font-size:.88rem;font-weight:600}
.card[id]{scroll-margin-top:140px}
</style></head><body>
