sions"],"a":0,"w":"Cash."},{"q":"Charge lag is:","o":["Time from service to charge","Staff delays"],"a":0,"w":"Billing speed."},{"q":"Clean claim rate is:","o":["Accepted first time","Paper claims"],"a":0,"w":"Quality."}]},{"t":"Operational metrics","s":"Measures of flow, waiting and productivity.","deep":"Waiting times at each step, turnaround times (lab, radiology, discharge), clinic utilisation, theatre utilisation, first-case start, cancellations, no-show rate, staff productivity and overtime. Operations leaders manage by these numbers.","keys":["Waiting and TAT","Utilisation","Cancellations and no-shows"],"an":"Like an airport tracking on-time departures and turnaround.","h":"A theatre with late first cases loses capacity every day.","m":"ICT asked for waiting-time TAT at every service point; radiology wants workload and TAT dashboards.","mist":["Measuring averages only"],"ask":["Which three numbers does the COO watch weekly?"],"qs":[{"q":"First-case start measures:","o":["Whether the day's first surgery starts on time","Registration"],"a":0,"w":"Theatre."},{"q":"No-show rate affects:","o":["Clinic utilisation","Pharmacy stock"],"a":0,"w":"Lost capacity."},{"q":"Averages can hide:","o":["Long waits for some patients","Nothing"],"a":0,"w":"Distribution."}]},{"t":"Cost and investment basics","s":"How hospitals think about spending.","deep":"Capital expenditure (capex) buys assets such as equipment and buildings; operating expenditure (opex) covers running costs such as salaries, consumables and subscriptions. Cloud and software-as-a-service shift spending from capex to opex. Investments are judged on payback, benefits, risk and strategic fit.","keys":["Capex vs opex","Payback and benefits","SaaS shifts costs to opex"],"an":"Like buying a car (capex) vs paying for taxis (opex).","h":"A new MRI is capex; a teleradiology service is opex.","m":"MP Shah's investment test: clinical impact, safety, affordability, operational feasibility, sustainable value.","mist":["Ignoring running costs"],"ask":["How are capex and opex approved?"],"qs":[{"q":"Salaries are:","o":["Opex","Capex"],"a":0,"w":"Running cost."},{"q":"A new MRI is:","o":["Capex","Opex"],"a":0,"w":"Asset."},{"q":"SaaS typically shifts cost to:","o":["Opex","Capex"],"a":0,"w":"Subscriptions."}]}]},{"t":"Digital health and telemedicine","e":"📱","c":"teal","items":[{"t":"Telemedicine models","s":"Four main ways care is delivered remotely.","deep":"Synchronous video or phone consultations; asynchronous store-and-forward (images or reports sent for later review, e.g. teledermatology, teleradiology); remote patient monitoring (devices sending readings from home); and tele-expertise between clinicians. Each needs scheduling, identity checks, consent, documentation, prescribing rules and payment.","keys":["Video consults","Store-and-forward","Remote monitoring","Clinician to clinician"],"an":"Like banking: branch, phone, app, and automatic alerts.","h":"A diabetic patient sends glucose readings weekly; a nurse reviews and escalates.","m":"Shiraz asked for telemedicine to be in scope; the strategy names virtual-care channels.","mist":["Assuming video alone is telemedicine"],"ask":["Which services could safely move to virtual reviews?"],"qs":[{"q":"Teleradiology is:","o":["Store-and-forward","Remote surgery"],"a":0,"w":"Asynchronous."},{"q":"Remote monitoring sends:","o":["Readings from home devices","Bills"],"a":0,"w":"RPM."},{"q":"Telemedicine needs:","o":["Identity, consent, documentation, payment","Only a camera"],"a":0,"w":"Full workflow."}]},{"t":"Patient portals and apps","s":"Self-service for patients.","deep":"Portals and apps let patients book, pay, view results and bills, message the hospital and manage family profiles. Sensitive results may need restrictions. Adoption depends on usefulness and simplicity.","keys":["Booking, payments, results, bills","Family profiles","Restrict sensitive results"],"an":"Like an airline app for bookings and boarding passes.","h":"A patient checks lab results on the app instead of queuing.","m":"Hospedia's patient app (Phase 2) includes appointments, M-Pesa, reports and bills; gap register restricts HIV results from the portal.","mist":["Building features nobody uses"],"ask":["What do patients most want to do without calling?"],"qs":[{"q":"The Hospedia patient app is in:","o":["Phase 2","Phase 1"],"a":0,"w":"Per Shiraz."},{"q":"Sensitive results may need:","o":["Restrictions on the portal","Public display"],"a":0,"w":"Privacy."},{"q":"Adoption depends on:","o":["Usefulness and simplicity","App colour"],"a":0,"w":"Value."}]},{"t":"Digital front door","s":"All the ways patients first reach the hospital.","deep":"Website, search, call centre, WhatsApp, apps, symptom checkers and referral portals together form the digital front door. The aim is one consistent experience: find a doctor, book, prepare, pay and get reminders, with seamless handover to staff.","keys":["Website, calls, WhatsApp, apps","One consistent experience","Handover to staff"],"an":"Like a shop's website, phone line and front counter working as one.","h":"A patient books on WhatsApp, receives preparation instructions and a payment link.","m":"Strategy: \"convenient physical and digital access\" as a differentiator.","mist":["Channels that do not share data"],"ask":["Which channels do patients use most?"],"qs":[{"q":"The digital front door includes:","o":["Website, calls, messaging, apps","Only the main gate"],"a":0,"w":"Channels."},{"q":"Key goal:","o":["Consistent experience across channels","More channels"],"a":0,"w":"Integration."},{"q":"WhatsApp in Kenya is:","o":["A major patient channel","Rarely used"],"a":0,"w":"Context."}]},{"t":"Payments and M-Pesa","s":"Mobile money is central to Kenyan healthcare payments.","deep":"M-Pesa supports payments via paybill and till numbers, and STK push (the hospital sends a payment prompt to the patient's phone). Integration reduces cashier queues and reconciliation work. Card payments and bank platforms run alongside.","keys":["Paybill and till","STK push prompts","Automatic reconciliation"],"an":"Like contactless payment, but on any phone.","h":"A cashier triggers an STK push; the patient approves on their phone.","m":"Gap register requests M-Pesa SDK push, Equity pin pads and Absa card integration.","mist":["Manual reconciliation of mobile payments"],"ask":["How are M-Pesa payments matched to bills today?"],"qs":[{"q":"STK push:","o":["Sends a payment prompt to the patient's phone","Prints a receipt"],"a":0,"w":"M-Pesa."},{"q":"Integration reduces:","o":["Reconciliation work","Revenue"],"a":0,"w":"Efficiency."},{"q":"Paybill numbers are used for:","o":["Mobile payments","Lab tests"],"a":0,"w":"Payments."}]},{"t":"Remote and home care","s":"Care beyond the hospital walls.","deep":"Home visits, post-discharge follow-up calls, medication delivery, home sample collection and remote monitoring extend care and can reduce readmissions. They need scheduling, logistics, documentation and payment models.","keys":["Follow-up calls","Home sample collection","Medication delivery"],"an":"Like after-sales service for care.","h":"A nurse calls each discharged patient within 48 hours.","m":"The strategy calls for continuity after patients leave; follow-up ownership is a known gap.","mist":["No owner for follow-up"],"ask":["Who calls patients after discharge?"],"qs":[{"q":"Follow-up calls aim to:","o":["Improve continuity and reduce readmissions","Sell packages only"],"a":0,"w":"Care."},{"q":"Home care needs:","o":["Logistics and documentation","Nothing"],"a":0,"w":"Operations."},{"q":"The strategy emphasises:","o":["Continuity after discharge","Closing clinics"],"a":0,"w":"Patient-Centric Care."}]}]},{"t":"Discovery and analysis","e":"🔍","c":"amber","items":[{"t":"Symptom vs root cause","s":"A symptom is what people complain about. The root cause is why it happens.","an":"A headache is the symptom; dehydration may be the cause.","h":"\"Discharges are slow\" is a symptom; late doctor charges and insurer approvals are causes.","m":"Example from the gap register: \"doctors can overwrite other doctors' notes\" is a symptom of missing access controls; \"blank fields in the discharge TAT report\" may be a reporting defect, not missing data.","qs":[{"q":"\"Staff enter data twice\" is:","o":["A symptom","A root cause"],"a":0,"w":"Ask why."},{"q":"You stop asking \"why\" when:","o":["You reach something actionable, or you are guessing","After exactly five"],"a":0,"w":"Do not invent links."},{"q":"\"Reports have blank fields although data exists\" suggests:","o":["A reporting or mapping defect","No data captured"],"a":0,"w":"ICT gap item."}],"deep":"A symptom is what people complain about; a root cause is why it happens. Solving symptoms creates temporary relief; solving causes changes outcomes. Causes are often process, ownership or data issues rather than technology.","keys":["Ask why until actionable","Validate causes with evidence","Causes are often non-technical"],"mist":["Jumping to a solution after the first complaint","Choosing a cause without evidence"],"ask":["Why does that happen?","How do you know?"]},{"t":"Five Whys","s":"Ask why repeatedly until you reach an actionable cause.","an":"A child asking why, but with discipline.","h":"Slow discharge, billing slow, insurer waits, invoice late, doctor charges late, no reminder.","m":"Use it in every department session, especially when a requirement in the gap register states a solution rather than a problem.","qs":[{"q":"If you are guessing at the third why, you should:","o":["Mark it as an open question","Keep guessing"],"a":0,"w":"Evidence first."},{"q":"Five Whys aims for:","o":["An actionable cause","A long list"],"a":0,"w":"Action."},{"q":"If a gap register item states a solution, you should:","o":["Ask what problem it solves","Accept it as the requirement"],"a":0,"w":"Problem first."}],"deep":"Five Whys is a simple discipline: ask why repeatedly until you reach a cause you can act on. The number five is a guide, not a rule. Stop when you are guessing and record the open question instead.","keys":["Iterate why","Stop at actionable or uncertain","Record gaps as questions"],"mist":["Inventing answers to complete five","Stopping at the first why"],"ask":["Why does that step take so long?","What would have to be true for it to be faster?"]},{"t":"AS-IS and TO-BE","s":"AS-IS is how work happens today, including workarounds. TO-BE is how it should work.","an":"A before-and-after floor plan for a renovation.","h":"Map what people actually do, not what the policy says.","m":"The discovery plan requires MP Shah to approve the AS-IS before TO-BE is finalised. Hospedia's customised workflows, the gap register and existing studies give a head start.","qs":[{"q":"AS-IS should show:","o":["Real practice including Excel and paper","The official policy"],"a":0,"w":"Reality."},{"q":"The gap between AS-IS and TO-BE becomes:","o":["Requirements","Invoices"],"a":0,"w":"What must change."},{"q":"Who approves the AS-IS in our plan?","o":["MP Shah","Capital Numbers"],"a":0,"w":"Plan step."}],"deep":"AS-IS documents how work truly happens today, including paper, Excel and WhatsApp workarounds. TO-BE describes the improved future. The gap between them becomes requirements and opportunities. AS-IS must be validated with the people who do the work.","keys":["Map reality, not policy","Include workarounds","Validate with the client before TO-BE"],"mist":["Mapping from the SOP only","Skipping client validation"],"ask":["Can you show me the actual screen or form?","What happens when the system is down?"]},{"t":"Requirements","s":"Business: the outcome needed. Functional: what the system does. Non-functional: how well.","an":"\"Arrive on time\" (business), \"show live traffic\" (functional), \"update every minute\" (non-functional).","h":"Notify pharmacy when discharge starts; within one minute; audit logged.","m":"Most gap register items are functional requirements written by users; ICT items such as AD authentication, IP restriction and audit logs are non-functional.","qs":[{"q":"\"Notification within one minute\" is:","o":["Non-functional","Business"],"a":0,"w":"How well."},{"q":"A user story looks like:","o":["As a [role], I want [x], so that [y]","A price list"],"a":0,"w":"Standard format."},{"q":"\"Authenticate users via Active Directory\" is:","o":["Non-functional (security)","A business outcome"],"a":0,"w":"ICT requirement."}],"deep":"Business requirements state outcomes; functional requirements state what the system must do; non-functional requirements state how well (speed, security, availability). User stories express needs from a role's point of view. Acceptance criteria define done.","keys":["Business, functional, non-functional","User stories","Acceptance criteria"],"mist":["Treating a solution as a requirement","Forgetting non-functional needs"],"ask":["How will we know this works?","How fast or secure must it be?"]},{"t":"Prioritisation","s":"Rank opportunities on value and feasibility using agreed criteria.","an":"Choosing which house repairs to do first: leaking roof before new curtains.","h":"Quick wins first, foundations next, strategic bets later.","m":"Use MP Shah's own investment test: clinical impact, patient safety, affordability, operational feasibility, sustainable value. Hospedia phases affect timing.","qs":[{"q":"MP Shah's Board was told to start with:","o":["No-capex quick wins","The biggest AI project"],"a":0,"w":"Sequencing."},{"q":"A high-value, low-feasibility item needs:","o":["Foundations fixed first","Immediate build"],"a":0,"w":"Strategic bet."},{"q":"A use case that depends on Hospedia Phase 2 should be:","o":["Sequenced after Phase 2","Started immediately"],"a":0,"w":"Dependency."}],"deep":"Prioritisation ranks opportunities on value and feasibility using agreed, transparent criteria. Quick wins have high value and low effort; strategic bets need foundations first. Sequencing must respect dependencies such as Hospedia go-live.","keys":["Agreed criteria","Quick wins vs strategic bets","Dependencies drive sequence"],"mist":["Prioritising by excitement","Ignoring Hospedia dependency"],"ask":["What must exist before this can start?","Who benefits, and how much?"]},{"t":"Business case and baseline","s":"A business case shows value, cost and risk. A baseline is today's measured performance.","an":"You cannot claim weight loss without weighing yourself first.","h":"\"Billing clearance 195 minutes today; target a third less; validate in a pilot.\"","m":"Baselines can come from Hospedia reports, finance data, departmental logs and existing studies. Always state source and assumptions.","qs":[{"q":"Without a baseline you should say:","o":["Baseline measurement required","Expect 50% savings"],"a":0,"w":"Never fabricate."},{"q":"Who owns pricing?","o":["Subhankar","You"],"a":0,"w":"Commercial ownership."},{"q":"Who owns pricing?","o":["Subhankar","Any team member"],"a":0,"w":"RACI."}],"deep":"A business case sets out value, cost, risk and timing. Value needs a baseline: today's measured performance. Without a baseline, benefits are guesses. Pricing and commercial terms belong to Subhankar.","keys":["Baseline first","Benefits as ranges with assumptions","No invented ROI"],"mist":["Promising savings without data","Quoting prices yourself"],"ask":["How is this measured today?","What would success look like in numbers?"]},{"t":"Evidence labels","s":"Confirmed, client-reported, observed, inference, hypothesis, open question.","an":"A journalist distinguishing verified facts from sources' claims.","h":"\"Shiraz said Hospedia has no AI\" is client-reported, not confirmed.","m":"Shiraz's comments are client-reported; the contract is confirmed; our classification of opportunities is inference.","qs":[{"q":"A stakeholder's statement is:","o":["Client-reported","Confirmed fact"],"a":0,"w":"Until validated."},{"q":"\"Billing likely drives discharge delay\" is:","o":["An inference","A decision"],"a":0,"w":"Reasonable interpretation."},{"q":"A clause in the signed Hospedia contract is:","o":["Confirmed","A hypothesis"],"a":0,"w":"Documented."}],"deep":"Label every finding: confirmed, client-reported, observed, inference, hypothesis or open question. This prevents opinions turning into \"facts\" in the final deck.","keys":["Six labels","Never upgrade silently","Track sources"],"mist":["Writing a client opinion as fact","Losing the source"],"ask":["Where did this come from?","Has anyone verified it?"]}]},{"t":"Consulting and discovery craft","e":"🧭","c":"amber","items":[{"t":"Interviewing well","s":"Getting real answers, not polite ones.","deep":"Use open questions (\"walk me through\"), follow-ups (\"what happens next?\", \"why?\"), and silence. Ask for examples and numbers. Separate facts from opinions. Avoid leading questions and solutions. End by confirming what you heard.","keys":["Open questions","Follow the thread","Ask for examples","Confirm understanding"],"an":"Like a journalist interview, not a survey.","h":"Instead of \"Is billing slow?\", ask \"Walk me through the last discharge you handled.\"","m":"Department sessions onsite depend on this skill.","mist":["Leading questions","Talking more than listening"],"ask":["Can you show me the last time this happened?"],"qs":[{"q":"An open question:","o":["Invites explanation","Gets yes or no"],"a":0,"w":"Technique."},{"q":"Silence in interviews:","o":["Encourages people to add detail","Is rude"],"a":0,"w":"Tool."},{"q":"Avoid:","o":["Leading questions","Follow-ups"],"a":0,"w":"Bias."}]},{"t":"Observation (go and see)","s":"Watch the work where it happens.","deep":"Observation reveals workarounds, interruptions and waiting that people forget to mention. Stand at the counter, follow a patient, watch a screen. Note times, steps, handoffs, paper and Excel. Respect privacy and clinical priorities.","keys":["See real work","Note workarounds and waits","Respect privacy"],"an":"Like watching a kitchen during dinner service, not reading the menu.","h":"Following a sample from collection to result shows where it waits.","m":"Shiraz specifically wants on-the-ground observation and informal conversations.","mist":["Relying only on interviews"],"ask":["May I shadow this process for 30 minutes?"],"qs":[{"q":"Observation reveals:","o":["Workarounds and waits","Only policies"],"a":0,"w":"Reality."},{"q":"Shiraz expects:","o":["On-the-ground discovery","Remote only"],"a":0,"w":"Approach."},{"q":"During observation, always:","o":["Respect privacy and care","Interrupt clinicians"],"a":0,"w":"Ethics."}]},{"t":"Process mapping notations","s":"Ways to draw processes clearly.","deep":"Swimlane diagrams show steps by role; BPMN is a formal notation with standard symbols; SIPOC lists Suppliers, Inputs, Process, Outputs, Customers; value stream maps show time and waste. Pick the simplest that answers the question.","keys":["Swimlanes","BPMN","SIPOC","Value stream maps"],"an":"Like choosing between a sketch, a map and a blueprint.","h":"A swimlane of discharge shows handoffs between doctor, nurse, billing and pharmacy.","m":"The As-Is pack uses process maps per department.","mist":["Over-detailed diagrams nobody reads"],"ask":["Does this map show where time is lost?"],"qs":[{"q":"Swimlanes show:","o":["Steps by role","Revenue"],"a":0,"w":"Responsibility."},{"q":"SIPOC stands for:","o":["Suppliers, Inputs, Process, Outputs, Customers","A software"],"a":0,"w":"Scope tool."},{"q":"Value stream maps highlight:","o":["Time and waste","Staff names"],"a":0,"w":"Lean."}]},{"t":"Prioritisation frameworks","s":"Common tools to rank options.","deep":"MoSCoW (Must, Should, Could, Won't), value vs effort matrices, weighted scoring with agreed criteria, RICE (Reach, Impact, Confidence, Effort). The best framework is transparent and agreed with the client. At MP Shah, use their investment test.","keys":["MoSCoW","Value vs effort","Weighted scoring","Use client criteria"],"an":"Like ranking house repairs by urgency and cost.","h":"Quick wins sit in high value, low effort.","m":"The plan scores use cases on criteria aligned with MP Shah's investment test.","mist":["Hidden or changing criteria"],"ask":["Which criteria matter most to leadership?"],"qs":[{"q":"MoSCoW includes:","o":["Must, Should, Could, Won't","Monday to Sunday"],"a":0,"w":"Framework."},{"q":"Quick wins are:","o":["High value, low effort","Low value, high effort"],"a":0,"w":"Matrix."},{"q":"Best criteria are:","o":["Transparent and agreed","Secret"],"a":0,"w":"Trust."}]},{"t":"Synthesis and storytelling","s":"Turning notes into insight.","deep":"Group findings into themes (affinity mapping), look for patterns across departments, separate symptoms from causes, then tell the story: Situation, Complication, Question, Answer (SCQA), or lead with the answer and support it with evidence (pyramid principle).","keys":["Affinity mapping","Patterns across departments","SCQA or answer-first"],"an":"Like turning a pile of puzzle pieces into a picture.","h":"\"Visibility of results\" appears in OPD, lab, radiology and discharge: a cross-department theme.","m":"The final presentation must turn department findings into a clear roadmap.","mist":["Presenting raw notes"],"ask":["What three themes explain most of what we saw?"],"qs":[{"q":"SCQA stands for:","o":["Situation, Complication, Question, Answer","Scope, Cost, Quality, Agility"],"a":0,"w":"Story structure."},{"q":"Affinity mapping groups:","o":["Findings into themes","People into teams"],"a":0,"w":"Synthesis."},{"q":"Answer-first means:","o":["Lead with the conclusion","Hide the conclusion"],"a":0,"w":"Pyramid principle."}]},{"t":"Writing minutes and follow-ups","s":"Turn meetings into commitments.","deep":"Good minutes record date, attendees, decisions, actions (owner and date), open questions and next steps, using precise certainty language. Send within 24 hours. Keep off-record content out. Follow up on actions politely and specifically.","keys":["Decisions, actions, owners, dates","Certainty words matter","Send within 24 hours"],"an":"Like a receipt for a conversation.","h":"\"MP Shah indicated\" vs \"MP Shah agreed\" changes obligations.","m":"You own action tracking and continuity in the RACI.","mist":["Vague actions without owners"],"ask":["Who owns this, and by when?"],"qs":[{"q":"Minutes should be sent:","o":["Within 24 hours","Next month"],"a":0,"w":"Momentum."},{"q":"Every action needs:","o":["Owner and date","Only a description"],"a":0,"w":"Accountability."},{"q":"Off-record remarks:","o":["Stay out of minutes","Go in bold"],"a":0,"w":"Trust."}]},{"t":"Handling difficult moments","s":"Stay calm, factual and helpful.","deep":"When stakeholders disagree, acknowledge, restate, ask for evidence and record both views. When asked for commitments, capture and align internally. When criticised, thank, correct facts, fix the issue. When conversations drift, park the topic and return to the objective.","keys":["Acknowledge and restate","Record both views","Capture, then align internally","Park and return"],"an":"Like a referee: calm, fair, keeps the game moving.","h":"Two departments describe the same system differently: log both, validate with Arun.","m":"Your RACI role includes escalation to Subhankar when issues become material.","mist":["Arguing to win","Promising to please"],"ask":["Can we capture both views and validate?"],"qs":[{"q":"When two stakeholders disagree, you should:","o":["Record both and validate","Choose one"],"a":0,"w":"Evidence."},{"q":"When asked for a commitment:","o":["Capture and align internally","Agree immediately"],"a":0,"w":"Scope."},{"q":"Parking a topic means:","o":["Noting it for later","Ignoring it forever"],"a":0,"w":"Facilitation."}]}]},{"t":"People and communication","e":"🤝","c":"teal","items":[{"t":"Who decides what","s":"Problem owner, sponsor, technical evaluator, budget owner, approver and procurement are often different people.","an":"Buying a family car: one person needs it, one pays, one checks the engine.","h":"The Head of Radiology owns the problem; the CIO evaluates; the CEO approves.","m":"Known: Shiraz (sponsor, AI adoption), CEO (approver of plan). Unknown: CIO's role, budget owner, procurement path.","qs":[{"q":"Shiraz is best described as:","o":["Champion; authority to confirm","Final approver"],"a":0,"w":"Do not assume."},{"q":"The biggest stakeholder gap now is:","o":["The CIO","The Kaizen team"],"a":0,"w":"Not engaged."},{"q":"The technical evaluator is most likely:","o":["The CIO","The catering manager"],"a":0,"w":"Technology owner."}],"deep":"Buying and change decisions involve several roles: problem owner, sponsor, technical evaluator, budget owner, approver and procurement. They are often different people. Map them early.","keys":["Problem owner, sponsor, evaluator, budget owner, approver","Different people, different concerns"],"mist":["Assuming the sponsor approves","Ignoring procurement"],"ask":["Who else should see this before a decision?","How are digital investments approved?"]},{"t":"Managing a champion","s":"Champions open doors but can narrow your view.","an":"A good friend introducing you at a party: do not only talk to them all night.","h":"Use Shiraz to reach the CIO, clinicians and leaders.","m":"Shiraz is candid and supportive; his off-record views stay off-record. Ask him to bring in the CIO and department heads.","qs":[{"q":"Routing everything through Shiraz:","o":["Narrows your view","Is ideal"],"a":0,"w":"Broaden access."},{"q":"His off-record comments belong in:","o":["Nowhere written","The MoM"],"a":0,"w":"Never repeat."},{"q":"Off-record comments belong:","o":["Nowhere in writing","In the MoM"],"a":0,"w":"Confidentiality."}],"deep":"A champion advocates for you inside the client. Support them with clear, forwardable updates, keep their confidence, and use them to reach others without becoming dependent on one voice.","keys":["Make them look good","Keep confidences","Broaden access"],"mist":["Routing everything through the champion","Repeating private comments"],"ask":["Who else should we involve?","What would help you internally?"]},{"t":"Executive communication","s":"Context, finding, implication, decision. Two to four sentences.","an":"A news headline and first paragraph, not the whole article.","h":"\"Discharge is our biggest issue; billing clearance takes 195 minutes; beds are blocked; we suggest focusing on insurer approvals.\"","m":"Quote the strategy: \"speed at every major patient touchpoint\", \"trusted enterprise data\", \"responsible use of AI\".","qs":[{"q":"Executives first want:","o":["The implication and decision","The architecture"],"a":0,"w":"So what."},{"q":"A number in an executive message needs:","o":["A source","Rounding up"],"a":0,"w":"Traceable."},{"q":"The first thing an executive wants is:","o":["The implication and decision","The tech stack"],"a":0,"w":"So what."}],"deep":"Executives want context, finding, implication and decision in a few sentences, in their language. Numbers need sources. Technical detail is available on request.","keys":["Four beats","Their strategy words","Short and sourced"],"mist":["Leading with architecture","Unsourced numbers"],"ask":["What decision do you need from them?","What will they repeat to the Board?"]},{"t":"Translating technical language","s":"Turn technical facts into what they mean for the business.","an":"A mechanic saying \"your car will be fine for a month, then needs brakes\" instead of part numbers.","h":"\"No write API\" becomes \"new tools can read but not update records\".","m":"Example: \"Hospedia exposes read-only batch exports\" means new tools can see yesterday's data but cannot update records or alert in real time.","qs":[{"q":"\"Batch nightly\" means for users:","o":["Data updates once a day","Real-time alerts"],"a":0,"w":"Daily refresh."},{"q":"Before sharing a technical translation externally:","o":["Check with Arun","Just send it"],"a":0,"w":"Accuracy."},{"q":"Before sharing a translation externally:","o":["Validate with Arun","Send immediately"],"a":0,"w":"Accuracy."}],"deep":"Turn technical facts into business meaning: what changes, for whom, and what decision follows. Check the translation with the technical owner before sharing.","keys":["Fact, meaning, decision","Check with Arun"],"mist":["Oversimplifying into something wrong","Sharing without Arun's check"],"ask":["What does this mean for the user?","What decision does it affect?"]},{"t":"Saying the right level of certainty","s":"Discussed, proposed, indicated, confirmed, agreed are different levels.","an":"\"Maybe dinner\" is not \"booked a table\".","h":"\"MP Shah indicated interest\" is not \"MP Shah agreed\".","m":"Shiraz confirmed the remote week but not the onsite dates in his email; write exactly that.","qs":[{"q":"Shiraz said \"tentatively okay\" to dates. Write:","o":["MP Shah indicated tentative agreement","MP Shah agreed"],"a":0,"w":"Match the evidence."},{"q":"\"Our current understanding is\" signals:","o":["Best evidence, may change","A final decision"],"a":0,"w":"Honest uncertainty."},{"q":"Shiraz \"tentatively\" accepted dates. Write:","o":["Indicated tentative agreement","Agreed"],"a":0,"w":"Precision."}],"deep":"Discussed, proposed, indicated, confirmed and agreed are different. Wrong words in minutes create false commitments or false confidence.","keys":["Match words to evidence","Minutes are records"],"mist":["Writing \"agreed\" for \"discussed\""],"ask":["Did they confirm or indicate?"]},{"t":"Handling scope requests","s":"New requests are captured, understood, taken to Subhankar, then answered.","an":"A builder asked to add a room: they check cost and time before saying yes.","h":"\"Can you also look at procurement?\"","m":"The holistic scope (telemedicine, modules, data) is already a scope question for Subhankar under the proposal's change control.","qs":[{"q":"A COO asks for extra analysis. You say:","o":["Let me capture it and align internally before confirming","Yes, of course"],"a":0,"w":"Scope path."},{"q":"Who decides scope changes?","o":["Subhankar","You"],"a":0,"w":"Governance."},{"q":"The proposal's mechanism for scope changes is:","o":["Change control with written approval","Verbal agreement"],"a":0,"w":"Proposal V1.1."}],"deep":"Capture the request, understand why, take it to Subhankar, decide impact, then respond. Never yes or no in the room.","keys":["Capture, understand, escalate, respond","Scope belongs to Subhankar"],"mist":["Saying yes to please","Saying no to protect"],"ask":["What would you need from it, and by when?"]},{"t":"Vendor neutrality","s":"Respect the client's existing vendors. Position as complementary.","an":"A new contractor does not insult the previous builder in front of the homeowner.","h":"\"We build on what Hospedia delivers.\"","m":"Our Hospedia queries ask about scope, APIs, phases and data use. Finance users' concerns about Hospedia are noted, never amplified.","qs":[{"q":"A manager calls Hospedia \"a disaster\". You:","o":["Acknowledge and stay neutral","Agree"],"a":0,"w":"Neutral."},{"q":"Our questions to ITDose should be:","o":["Factual","Evaluative"],"a":0,"w":"Scope, APIs, phases."},{"q":"If asked whether Hospedia \"can't do this\", you say:","o":["We will confirm with Hospedia what is planned","Hospedia cannot do it"],"a":0,"w":"Neutral."}],"deep":"Respect the client's existing vendors. Ask factual questions, never evaluative ones, and position as complementary. Never hide your involvement.","keys":["Complement, never compete","Factual questions only","Transparent always"],"mist":["Agreeing with criticism","Concealing involvement"],"ask":["What is planned in Hospedia for this?"]}]}],"gloss":[["ADT","Admission, Discharge, Transfer events","Hospital operations"],["ALOS","Average length of stay","Hospital operations"],["ANC","Antenatal care (pregnancy clinic)","Hospital operations"],["Bed occupancy","% of beds in use","Hospital operations"],["Casualty","Emergency departmen cism.","Making technical promises without Arun."]},{"n":"Dr Thuku","i":"🩻","r":"Head of Radiology (spelling to confirm)","know":["Radiologist with an IT degree.","Built his own radiology system with AI-assisted coding. Hospedia accepted it cannot replicate it.","Wants AI to push urgent X-rays up his list; thinking about a pneumothorax model."],"ask":["What problem were you solving when you built your system?","What data does it use, and where does it run?","Which studies go unreported today, and what happens to those patients?","What should AI do for you, and what must it never do?","How would you check an AI result before trusting it?"],"listen":["Data location and privacy details","\"We only report acute cases\"","How proud he is of what he built"],"avoid":["Calling his system risky or \"vibe coded\".","Promising fracture AI. Ours was a proof of concept."]},{"n":"CEO","i":"🏛️","r":"Approves the discovery plan","know":["Must approve the dates and plan.","The strategy is his frame: two pillars, three enablers, three phases."],"ask":["Which outcome matters most to you in the next 12 months?","What constraints should we respect: budget, people, timing?","How are investment decisions made here?"],"listen":["Strategy words he repeats","Board expectations","Affordability concerns"],"avoid":["Technical detail.","Any price, even a rough one."]},{"n":"Dr John (COO)","i":"⚙️","r":"Operations (named in Feb 2026)","know":["Named as needed for internal alignment.","Silent since. Confirm he is still in role."],"ask":["Where do patients wait longest, in your view?","Which support services cause the most complaints?","What has already been tried to fix patient flow?"],"listen":["Throughput and bed pressure","Food, linen, parking (top Kaizen complaints)"],"avoid":["Saying yes to extra scope in the room."]},{"n":"ITDose (Hospedia)","i":"🏗️","r":"Hospital system vendor","know":["Signed contract; in UAT, not live.","Phase 1: registration, OPD, doctors, lab, radiology, pharmacy, inventory, finance. Phase 2: queues, patient app, portals.","No AI today. Their AI map is aspirational."],"ask":["Module scope and go-live date per phase?","Which APIs exist, read or write, and can third parties build on them?","What is the plan for historical Kranium data?","Will MP Shah data ever be used to train your models?"],"listen":["What is still being customised","What they say is \"out of scope\""],"avoid":["Any criticism. We complement Hospedia.","Hiding our involvement."]},{"n":"Kaizen study team","i":"📈","r":"MP Shah staff who mapped the patient journey","know":["Analysed 963,766 patient journeys.","Built a tracker of 59 to 62 actions with owners.","Told the Board: quick wins before big spending."],"ask":["Which actions are closed, and which are stuck?","Can we use the Excel tracker?","What surprised you most in the study?"],"listen":["Why actions stalled","Which owners are most engaged"],"avoid":["Appearing to redo or criticise their work."]}],"sims":[{"id":"cc","title":"Credit Control: \"Our biggest problem is rejections\"","intro":"You are in a session with the Head of Credit Control. Virender and Arun are with you.","start":"a","nodes":{"a":{"s":"Head of Credit Control","q":"\"Honestly, our biggest headache is insurance rejections. We lose a lot of money there.\"","c":[{"t":"\"Would an AI tool that predicts denials help you?\"","n":"a1","p":0,"f":"You jumped straight to a solution. She now evaluates your idea instead of describing her problem, and you still do not know why claims are rejected."},{"t":"\"What are the most common reasons claims get rejected, and how do you know?\"","n":"b","p":2,"f":"Good. You asked for the cause and the evidence in one question."},{"t":"\"Hospedia will fix most of that, won't it?\"","n":"a2","p":0,"f":"An assumption, and it pulls the vendor into a pain conversation. You also signal you have not looked."}]},"a1":{"s":"Head of Credit Control","q":"\"Maybe? I don't know what that would look like. Can you send a demo?\"","c":[{"t":"Recover: \"Before any demo, help me understand what actually gets rejected.\"","n":"b","p":1,"f":"Good recovery. Always pull back to the problem."}]},"a2":{"s":"Head of Credit Control","q":"\"They say so. We will see. We raised forty requirements.\"","c":[{"t":"Recover: \"Can you walk us through the top rejection reasons today?\"","n":"b","p":1,"f":"Recovered. Note the forty requirements: ask for the list later."}]},"b":{"s":"Head of Credit Control","q":"\"Exclusions billed by mistake, missing documents, and the EDI dropping claims. We track it in Excel.\"","c":[{"t":"\"Could we see that Excel, even a sample?\"","n":"c","p":2,"f":"Excellent. A workaround is evidence. The sheet may give you baselines and categories."},{"t":"\"So you need an AI to catch exclusions.\"","n":"c2","p":0,"f":"Still solutioning. Exclusions are usually rules; you have not checked how they are configured."},{"t":"\"How many rejections a month, and roughly what value?\"","n":"c","p":2,"f":"Good. You are building the business case baseline."}]},"c2":{"s":"Arun","q":"(quietly) \"Let's check how exclusions are mapped to schemes first.\"","c":[{"t":"\"Thanks Arun. Could you show us how an exclusion is set up for a scheme?\"","n":"c","p":1,"f":"Good use of your technical colleague. Let him lead that thread."}]},"c":{"s":"Head of Credit Control","q":"\"Sure. About 180 rejections a month. The EDI ones are the worst, we resubmit manually.\"","c":[{"t":"\"Which EDI causes most problems? Arun, can you pick up the integration side?\"","n":"end","p":2,"f":"You connected a business finding to the technical owner in real time. That is your core job."},{"t":"\"OK, we will design something for that.\"","n":"end","p":0,"f":"An implicit commitment, with no owner and no scope check. Capture instead, then route."}]},"end":{"end":true}}},{"id":"rad","title":"Radiology: the champion and his system","intro":"Dr Thuku has just demonstrated the radiology system he built himself. He is proud of it.","start":"a","nodes":{"a":{"s":"Dr Thuku","q":"\"So, can Capital Numbers make this production-ready and add AI fracture detection?\"","c":[{"t":"\"Yes, we have done fracture detection before. We can do it.\"","n":"a1","p":0,"f":"A commitment you are not authorised to make, plus a capability claim. Our fracture work was a proof of concept. This is Arun's call and then Subhankar's."},{"t":"\"What you have built shows exactly what the department needs. Can you tell us what problem you were solving first?\"","n":"b","p":2,"f":"Respect first, then problem. He feels heard, and you learn his priorities."},{"t":"\"Vibe-coded tools are risky with patient data.\"","n":"a2","p":0,"f":"True in principle, but it lands as dismissive. You risk losing your strongest clinical champion."}]},"a1":{"s":"Dr Thuku","q":"\"Great. When can you start?\"","c":[{"t":"Recover: \"Let me make sure we understand your workflow and data properly first, so whatever we suggest actually works here.\"","n":"b","p":1,"f":"Recovered, but you created an expectation. Note it for Subhankar."}]},"a2":{"s":"Dr Thuku","q":"\"It is working better than anything the vendors gave us.\"","c":[{"t":"Recover: \"That is clear. Help us understand how you built it, and where it runs.\"","n":"b","p":1,"f":"Recovered by switching to curiosity."}]},"b":{"s":"Dr Thuku","q":"\"Reporting backlog. I cannot report every X-ray. Non-urgent ones just do not get reported.\"","c":[{"t":"\"What happens to those patients today? Do the referring doctors read the images themselves?\"","n":"c","p":2,"f":"You went to impact and risk. That is how you size a clinical problem."},{"t":"\"AI can read the X-rays for you.\"","n":"c","p":0,"f":"Overclaim. AI can help prioritise; the radiologist remains accountable. Never imply replacement."}]},"c":{"s":"Dr Thuku","q":"\"Mostly yes. Some are missed. I would like AI to push urgent ones up my list.\"","c":[{"t":"\"Arun, could you explore with Dr Thuku what data and PACS access a prioritisation tool would need?\"","n":"end","p":2,"f":"Clean handover to the technical owner with a specific question."},{"t":"\"We will put that in our proposal.\"","n":"end","p":0,"f":"Premature. Capture as a signal; the roadmap decides."}]},"end":{"end":true}}},{"id":"ceo","title":"The corridor price question","intro":"Onsite day 4. The CEO stops you in the corridor after a session.","start":"a","nodes":{"a":{"s":"CEO","q":"\"Shiraz tells me about this data lake idea. Roughly what would that cost us?\"","c":[{"t":"\"Around fifty to eighty thousand dollars, depending.\"","n":"a1","p":0,"f":"You invented a number. It will become the anchor for every future conversation. Pricing is Subhankar's."},{"t":"\"It depends on scope, data volume and how it connects to Hospedia. We are assessing that now, and we will bring a reliable view with the roadmap.\"","n":"b","p":2,"f":"Honest, confident and not evasive. You explained what drives the cost."},{"t":"\"I am not sure, I will ask.\"","n":"b","p":1,"f":"Honest, but weak. Explain what the answer depends on so you sound in control."}]},"a1":{"s":"CEO","q":"\"That much? We were thinking much less.\"","c":[{"t":"Recover: \"That was a rough guess and I should not have given one. Let us come back with a properly scoped view.\"","n":"b","p":1,"f":"Owning it is right. Tell Subhankar the same day."}]},"b":{"s":"CEO","q":"\"Fine. What would we actually get from it?\"","c":[{"t":"\"One trusted place for data across Kranium and Hospedia, so reports and future AI use the same numbers. Your strategy calls it trusted enterprise data.\"","n":"c","p":2,"f":"Business value in his language, tied to his own strategy."},{"t":"\"A medallion architecture with bronze, silver and gold layers on a lakehouse.\"","n":"c","p":0,"f":"Technically right, but meaningless to a CEO. Translate."}]},"c":{"s":"CEO","q":"\"Good. Make sure it is in the final presentation.\"","c":[{"t":"\"Will do. I will also make sure Subhankar has your interest on record.\"","n":"end","p":2,"f":"You captured an executive signal and routed it to the commercial owner."},{"t":"\"Absolutely, we will prioritise it.\"","n":"end","p":0,"f":"Prioritisation comes from evidence across all opportunities, not one corridor chat."}]},"end":{"end":true}}},{"id":"scope","title":"Scope creep: \"Can you also review procurement?\"","intro":"Onsite day 3. The COO joins the end of a session and makes a request.","start":"a","nodes":{"a":{"s":"COO","q":"\"While you are here, can your team also do a deep review of our procurement process next week?\"","c":[{"t":"\"Of course, we can fit that in.\"","n":"a1","p":0,"f":"An unauthorised scope commitment. It affects timeline, effort and possibly commercials. Only Subhankar can agree this."},{"t":"\"That sounds valuable. What would you want to come out of it, and what prompted it now?\"","n":"b","p":2,"f":"You understood the request before reacting. That is the first step of the scope path."},{"t":"\"Sorry, that is out of scope.\"","n":"a2","p":0,"f":"Rejecting immediately damages the relationship and may miss a real need or a future opportunity."}]},"a1":{"s":"COO","q":"\"Great, I will tell the procurement team to expect you.\"","c":[{"t":"Recover: \"Let me just confirm timing with my lead first, so we do it properly. I will come back to you tomorrow.\"","n":"b","p":1,"f":"Recovered, but you created an expectation. Tell Subhankar today."}]},"a2":{"s":"COO","q":"\"Oh. I thought this was a hospital-wide review.\"","c":[{"t":"Recover: \"It is broad. Let me understand what you need and check how best to cover it.\"","n":"b","p":1,"f":"Recovered by returning to understanding."}]},"b":{"s":"COO","q":"\"Stock-outs keep delaying procedures. I want to know whether the new system will fix it.\"","c":[{"t":"\"Let me capture exactly that, and align internally on how and when we can look at it. I will confirm by tomorrow.\"","n":"c","p":2,"f":"The scope script, used well: capture, align, confirm, with a time commitment you control."},{"t":"\"Hospedia will definitely fix stock-outs.\"","n":"c","p":0,"f":"A claim about the vendor you cannot make. Stock accuracy may be process, data and configuration."}]},"c":{"s":"You, later","q":"(Back at the hotel.) What do you do next?","c":[{"t":"Send Subhankar a short note: request, why, link to strategy and Kaizen, likely effort, options, decision needed by tomorrow.","n":"end","p":2,"f":"Exactly the escalation structure. Material, clear, with a decision deadline."},{"t":"Ask Virender to start on it tomorrow morning.","n":"end","p":0,"f":"You assigned work that has not been agreed. Scope first, then ownership."}]},"end":{"end":true}}},{"id":"contra","title":"Contradiction: \"The lab is fully integrated\"","intro":"Morning: ICT says the lab system is fully integrated. Afternoon: lab staff show you re-typing analyser results by hand.","start":"a","nodes":{"a":{"s":"Lab technologist","q":"\"We type the results from this screen into that one. Every day.\"","c":[{"t":"\"But ICT told us this morning it was integrated.\"","n":"a1","p":0,"f":"You set two teams against each other in front of a junior staff member. Record, do not confront."},{"t":"\"Could you show me which results you re-type, and roughly how many a day?\"","n":"b","p":2,"f":"You gathered evidence neutrally. Observation beats opinion."}]},"a1":{"s":"Lab technologist","q":"\"Well, maybe for some machines. Not these.\"","c":[{"t":"Recover: \"That is really helpful. Which machines are not connected?\"","n":"b","p":1,"f":"Recovered into specifics. Both statements may be true for different analysers."}]},"b":{"s":"Lab technologist","q":"\"The serology and the two chemistry analysers. Maybe 200 results a day.\"","c":[{"t":"Log it as a contradiction: ICT statement vs lab observation, with a possible explanation (some analysers interfaced, some not). Ask Arun to validate with ICT.","n":"end","p":2,"f":"Perfect discovery discipline: both sources recorded, explanation offered, validation owner assigned."},{"t":"Note that ICT was wrong.","n":"end","p":0,"f":"You chose a side without validation, and the note could leak. Different people often experience the same system differently."}]},"end":{"end":true}}},{"id":"cio","title":"Bringing in the CIO","intro":"Two days before onsite. The CIO has not been in any session. You call Shiraz.","start":"a","nodes":{"a":{"s":"Shiraz","q":"\"Hi Bhavesh. All set for next week?\"","c":[{"t":"\"Almost. Should we be talking to the CIO or not? He seems to be missing.\"","n":"a1","p":0,"f":"Blunt and slightly accusatory. It can read as criticism of Shiraz or the CIO."},{"t":"\"Nearly. Since the CIO owns the Hospedia rollout and several Kaizen actions, would it help if we briefed him directly before we arrive?\"","n":"b","p":2,"f":"You gave a reason rooted in his ownership, and offered help rather than a complaint."}]},"a1":{"s":"Shiraz","q":"\"He is very busy with the go-live.\"","c":[{"t":"Recover: \"Completely understand. Even 20 minutes would help us avoid duplicating his work. Would that be possible?\"","n":"b","p":1,"f":"Recovered by making it small and in his interest."}]},"b":{"s":"Shiraz","q":"\"Good idea. He is stretched, but I will ask. What would you cover?\"","c":[{"t":"\"Our plan, what we have learned from the Hospedia scope, and three questions only he can answer. Twenty minutes.\"","n":"c","p":2,"f":"Specific, short, respectful of his time."},{"t":"\"Everything, really. Our full approach.\"","n":"c","p":0,"f":"Vague and long. Busy executives say no to open-ended asks."}]},"c":{"s":"Shiraz","q":"\"Send me a short note I can forward.\"","c":[{"t":"Send a 5-line note Shiraz can forward, and copy Subhankar on the stakeholder gap.","n":"end","p":2,"f":"You made the champion's job easy and kept governance informed."},{"t":"Email the CIO directly, bypassing Shiraz.","n":"end","p":0,"f":"You went around your champion after he offered to help. That costs trust."}]},"end":{"end":true}}}],"sort":[{"x":"Lab tests are forgotten 4 to 5 times a day and nobody is alerted","a":"Automation","w":"Known rules: if an order is pending beyond a time limit, alert. No learning needed."},{"x":"A quarter of all calls are just people asking to be transferred","a":"Automation","w":"An IVR menu or directory routes these. AI is overkill for a known list of destinations."},{"x":"The Board wants to see discharge time broken down by stage, every day","a":"Analytics","w":"The data exists; people need to see it. A dashboard, not a model."},{"x":"Lab results do not reach the HMIS, so doctors do not know they are ready","a":"Integration","w":"Data is not moving between systems. Connect them first."},{"x":"Consultants arrive late, so booked appointments are not honoured","a":"Process fix","w":"The root cause is behaviour and scheduling discipline. Technology cannot fix a late consultant."},{"x":"Sonographers leave the room to type reports, wasting scan time","a":"AI","w":"Speech-to-text understands spoken language. Even dictaphones help; speech AI goes further."},{"x":"Radiologists cannot report every X-ray; urgent ones need to rise to the top","a":"AI","w":"Interpreting images to prioritise needs computer vision. Clinical validation and oversight required."},{"x":"Insurer EDI systems drop claims, causing rejections","a":"Integration","w":"A broken connection between systems. Fix the interface."},{"x":"Patients arrive for scans without fasting or a full bladder","a":"Automation","w":"Send preparation instructions automatically when the scan is booked. Rules, not AI."},{"x":"Pharmacy and billing want to know tonight who will likely go home tomorrow","a":"AI","w":"Predicting discharges from patterns in history is a predictive model. Useful once data is reliable."},{"x":"The reporting desk is empty when transcriptionists all take lunch at once","a":"Process fix","w":"Stagger the breaks. Kaizen listed this as a zero-cost quick win."},{"x":"Finance cannot see profit and loss by department","a":"Analytics","w":"Reporting on existing data, once revenue mapping is clean."},{"x":"Staff ask HR the same policy questions every week","a":"AI","w":"A policy assistant that answers from approved documents (RAG). Only worth it if volume is real and policies are current."},{"x":"The same patient has three different records","a":"Process fix","w":"Mostly registration discipline and validation rules. Matching tools can help, but process comes first."},{"x":"Pharmacy does not know a discharge has started","a":"Integration","w":"The HIS should notify pharmacy when the discharge event happens. An event or webhook, not AI."},{"x":"Doctors spend evenings writing discharge summaries","a":"AI","w":"Generative AI can draft from the record for doctor review. Real value, but it does not touch the 195-minute billing bottleneck."}],"buckets":["AI","Automation","Analytics","Integration","Process fix"],"sayAll":[{"s":"\"How much will it cost?\"","no":"\"Probably around fifty thousand.\"","yes":"\"It depends on scope, integration and data. We will bring a reliable view once those are confirmed, and Subhankar will take you through it.\""},{"s":"Client criticises Hospedia","no":"\"Yes, we noticed the UI looks very dated too.\"","yes":"\"That is helpful context. Our focus is on complementing what Hospedia delivers.\""},{"s":"\"Can your team also look at procurement next week?\"","no":"\"Sure, we will add it.\"","yes":"\"That sounds valuable. Let me capture exactly what you need and align internally on timing before I confirm.\""},{"s":"We captured something wrongly","no":"\"I am so sorry, that is completely our fault, we will be more careful, apologies again.\"","yes":"\"Thank you for pointing that out. We captured it incorrectly and will correct the documents.\""},{"s":"\"Can you start building now?\"","no":"\"Yes, we are ready.\"","yes":"\"We can plan that properly. First we need to confirm a few dependencies so it succeeds.\""},{"s":"\"Why another workshop?\"","no":"\"We just need more information.\"","yes":"\"It closes one specific gap, how insurance approvals flow, which decides whether this is feasible. We will keep it to 45 minutes.\""},{"s":"\"Are you saying our systems are bad?\"","no":"\"Well, there are a lot of gaps.\"","yes":"\"Not at all. Every hospital has gaps between systems. Our job is to find the most valuable ones to close.\""},{"s":"Client asks if you have done this before","no":"\"We have done this many times.\"","yes":"\"We have relevant work, for example a chest X-ray screening project. Let me share what applies and what would be new here.\""},{"s":"Talking about AI accuracy","no":"\"Our model is 95% accurate.\"","yes":"\"In testing on that project it reached around 81% accuracy. It would need validating on MP Shah data before anyone relies on it.\""},{"s":"Calling the schedule","no":"\"Our project plan\"","yes":"\"Our discovery plan\" or \"workshop plan\""},{"s":"Colleague is mid-question when you want to move on","no":"\"Sorry to cut you down, to save time...\"","yes":"Let the thread finish if the client is describing real pain. Note the time and catch up later."},{"s":"Client: \"We need AI\"","no":"\"Great, here are six use cases.\"","yes":"\"What outcome are you hoping AI will help you achieve?\""},{"s":"Arun says: \"Hospedia exposes read APIs only, through a nightly batch export. No FHIR.\" How do you explain it to Shiraz?","no":"","yes":"New tools could read Hospedia data but not update it, and only once a day. That works for dashboards and planning, but not for real-time alerts or anything that writes back. We should ask ITDose whether more is planned."},{"s":"Arun says: \"The model achieved 0.85 recall and 0.78 precision on the validation set.\" How do you explain it to CEO?","no":"","yes":"It caught about 85 of every 100 real cases in testing, and about three in four of its alerts were correct. The radiologist still reviews everything; it would help sort the queue, not replace judgement."},{"s":"Arun says: \"Patient master data has duplicate UHIDs; MPI deduplication is required before analytics.\" How do you explain it to CEO?","no":"","yes":"Some patients exist more than once in the system. Until we clean that up, any report on patient numbers or outcomes will be wrong, so it has to come first."},{"s":"Arun says: \"The integration would need a middleware layer with HL7 v2 listeners because the lab analysers do not support FHIR.\" How do you explain it to Head of Laboratory?","no":"","yes":"Your analysers speak an older standard, so we would need a small connecting system in between. It is common and workable, but it adds some setup time."},{"s":"Arun says: \"Data residency requirements under the DPA may restrict hosting PHI on AWS regions outside Kenya.\" How do you explain it to Shiraz?","no":"","yes":"Kenyan data protection rules may limit storing patient data in cloud centres outside Kenya. Before choosing AWS for anything with patient data, we should confirm what is allowed."},{"s":"Arun says: \"A PoC in silent mode for 6 weeks on retrospective DICOM studies before any clinical exposure.\" How do you explain it to Board member?","no":"","yes":"We would first test the tool quietly on past scans, without any doctor relying on it, to prove it is safe and accurate here before it touches a real patient."}]}</script><script>(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const KEY='mpshah-companion-v5';
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
S=Object.assign({dq:{},cq:{},sort:{},sim:{},si:0,yi:0,seg:'d',terms:{}},S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1700)}
const ymd=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysTo=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(ymd()+'T00:00:00'))/864e5);
const first=s=>{const i=s.indexOf('. ');return (i>20&&i<200?s.slice(0,i+1):s)};
const chip=s=>s.replace(/\s*\([^)]*\)\s*$/,'');
const NAVS=[['','🏠','Home'],['hospital','🏥','Hospital'],['learn','📖','Learn'],['practice','🎯','Practice']];
const top=(t,back)=>`<header class="top"><div>${back!=null?`<button class="back" data-go="${back}">‹ Back</button>`:''}<h1>${t}</h1></div><div style="display:flex;gap:8px"><button class="iconbtn" data-go="find" aria-label="Search">🔍</button><button class="iconbtn" data-act="settings" aria-label="Settings">⚙️</button></div></header>`;
const dDone=i=>{const a=S.dq[i]||{};return D.lessons[i].quiz.every((_,k)=>a[k]!=null)};
const cKey=(t,i)=>t+'-'+i;
const cDone=(t,i)=>{const a=S.cq[cKey(t,i)]||{};return D.tracks[t].items[i].qs.every((_,k)=>a[k]!=null)};
function mcq(q,ans,act,ids){const done=ans!=null;return `<div class="mq"><div class="q">${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<button data-act="${act}" ${ids} data-o="${k}" class="${done?(k===q.a?'right':k===ans?'wrong':''):''}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div>${done?`<div class="fb ${ans===q.a?'good':'bad'}">${ans===q.a?'👍 Right. ':'Not quite. '}${esc(q.w)}</div>`:''}</div>`}
const V={};
V.home=()=>{let n=daysTo('2026-10-12'),l='days to the remote week';if(n<=0){n=daysTo('2026-10-21');l='days to Nairobi'}if(n<=0){n=Math.max(0,daysTo('2026-11-15'));l='days left in discovery'}
 const dd=D.lessons.filter((_,i)=>dDone(i)).length;let ct=0,cd=0;D.tracks.forEach((t,ti)=>t.items.forEach((_,i)=>{ct++;if(cDone(ti,i))cd++}));
 let next=null;for(let ti=0;ti<D.tracks.length&&!next;ti++)for(let i=0;i<D.tracks[ti].items.length;i++)if(!cDone(ti,i)){next=[ti,i];break}
 const nd=D.depts.findIndex((_,i)=>!dDone(i));
 return `${top('Hi Bhavesh')}<div class="count"><b>${n}</b> ${l}</div>
 ${next?`<button class="today" data-go="concept/${next[0]}/${next[1]}"><small>Next idea to learn</small><h3>${esc(D.tracks[next[0]].items[next[1]].t)}</h3><span class="go">Learn it</span></button>`:''}
 <div class="tiles">
 <button class="tile t-teal" data-go="${nd>=0?'dept/'+nd:'hospital'}"><span class="em">🏥</span><div><b>Hospital</b><span>${dd} of ${D.depts.length} departments learned</span></div></button>
 <button class="tile t-amber" data-go="learn"><span class="em">📖</span><div><b>Learn</b><span>${cd} of ${ct} ideas understood</span></div></button>
 <button class="tile t-violet wide" data-go="practice"><span class="em">🎯</span><div><b>Practice</b><span>Rehearse real conversations and decisions</span></div></button></div>
 <button class="search" data-go="find">🔍 Look up a term, department or person</button>`};
V.hospital=()=>{const seg=S.seg;const dd=D.lessons.filter((_,i)=>dDone(i)).length;
 const items=seg==='p'?D.people.map((p,i)=>`<button class="pick" data-go="person/${i}"><span class="em">${p.i}</span><b>${esc(p.n)}</b><span>${esc(p.r)}</span></button>`):D.depts.map((x,i)=>`<button class="pick" data-go="dept/${i}">${dDone(i)?'<span class="done-badge">✅</span>':''}<span class="em">${D.icons[i]}</span><b>${esc(x.n)}</b></button>`);
 return `${top('The hospital')}<p class="muted">${seg==='p'?'The people you will work with, and how to approach them.':`Learn each department in depth: who works there, how a day runs, systems today and in Hospedia, data, KPIs, what MP Shah's sources say, and how to prepare. ${dd} of ${D.depts.length} done.`}</p><div class="seg"><button data-act="seg" data-v="d" class="${seg!=='p'?'on':''}">Departments</button><button data-act="seg" data-v="p" class="${seg==='p'?'on':''}">People</button></div><div class="grid g3">${items.join('')}</div>`};
V.dept=(i)=>{i=+i;const x=D.depts[i],L=D.lessons[i];if(!x)return V.hospital();const a=S.dq[i]||{};const right=L.quiz.filter((q,k)=>a[k]===q.a).length;

document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!g.disabled){go(g.dataset.go);return}
 const an=e.target.closest('nav.bottom a');if(an&&an.getAttribute('href')===location.hash){e.preventDefault();route();return}
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,d=el.dataset;
 if(a==='seg'){S.seg=d.v;save();route()}
 else if(a==='gcat'){S.gcat=d.v;save();route()}
 else if(a==='jump'){const t=document.getElementById(d.id);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(a==='term'){S.terms[d.k]=!S.terms[d.k];save();keep()}
 else if(a==='dq'){S.dq[d.i]=S.dq[d.i]||{};S.dq[d.i][d.k]=+d.o;save();keep();if(dDone(+d.i))toast('Department lesson complete')}
 else if(a==='cq'){const k=cKey(d.t,d.i);S.cq[k]=S.cq[k]||{};S.cq[k][d.k]=+d.o;save();keep()}
 else if(a==='mixq'){S.mixA[S.mixI]=+d.o;save();keep()}
 else if(a==='mixnext'){S.mixI++;save();route()}
 else if(a==='simstart'){const sc=D.sims[+d.i];S.simState={i:+d.i,at:sc.start,h:[]};save();go('sim')}
 else if(a==='simpick'){const st=S.simState,sc=D.sims[st.i],nd=sc.nodes[st.at],c=nd.c[+d.k];st.h.push({s:nd.s,q:nd.q,t:c.t,p:c.p,f:c.f});st.at=c.n;save();route();const ls=document.querySelectorAll('.fb');if(ls.length)ls[ls.length-1].scrollIntoView({block:'center'})}
 else if(a==='sortpick'){S.sort[Math.min(S.si,D.sort.length-1)]=d.b;save();keep()}
 else if(a==='sortnext'){S.si++;save();route()}
 else if(a==='sortreset'){S.sort={};S.si=0;save();route()}
 else if(a==='sayshow'){$('#sans').hidden=false;el.remove()}
 else if(a==='say'){S.yi=(S.yi||0)+ +d.d;save();route()}
 else if(a==='sayjump'){S.yi=+d.i;save();go('say')}
 else if(a==='settings'){const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div class="in"><h2 style="margin-top:0">Settings</h2><p class="muted">Your progress stays in this browser. Export a backup to move it to another device.</p><div style="display:grid;gap:10px"><button class="cta ghost" data-act="theme">Switch light / dark</button><button class="cta ghost" data-act="export">Export backup</button><label class="cta ghost" style="cursor:pointer">Import backup<input type="file" id="imp" accept="application/json" hidden></label><button class="cta ghost" data-act="wipe" style="color:var(--red)">Reset progress</button><button class="cta" data-act="closesheet">Done</button></div></div>`;s.addEventListener('click',ev=>{if(ev.target===s)s.remove()});document.body.appendChild(s)}
 else if(a==='closesheet'){const s=$('.sheet');if(s)s.remove()}
 else if(a==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('mpshah-theme',r.dataset.theme)}catch(x){}}
 else if(a==='export'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='mpshah-companion-backup.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup downloaded')}
 else if(a==='wipe'){if(confirm('Reset all progress on this device?')){try{localStorage.removeItem(KEY)}catch(x){}location.hash='#/';location.reload()}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#res').innerHTML=results(S.q)}else if(e.target.id==='gq'){S.gq=e.target.value;save();const p=e.target.selectionStart;route();const n=$('#gq');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='imp'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();toast('Backup imported');const s=$('.sheet');if(s)s.remove();route()}catch(x){toast('That file is not a valid backup')}};r.readAsText(e.target.files[0])}});
try{const t=localStorage.getItem('mpshah-theme');if(t)document.documentElement.dataset.theme=t}catch(x){}
route();
})();
</script></body></html>
