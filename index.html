<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MP Shah Companion</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E7C70">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#F2F5F8;--card:#fff;--ink:#101828;--muted:#667085;--line:#E4E7EC;--teal:#0E7C70;--tealbg:#E3F4F1;--indigo:#4053D6;--indigobg:#EAEDFC;--amber:#E39A0B;--amberbg:#FEF4DE;--violet:#7A5AF8;--violetbg:#F0EBFF;--red:#D92D20;--redbg:#FDECEA;--green:#12A15F;--greenbg:#E4F7EE;--r:20px;--sh:0 4px 18px rgba(16,24,40,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C111D;--card:#161B26;--ink:#F2F4F7;--muted:#98A2B3;--line:#252C3B;--tealbg:#0F2A27;--indigobg:#1A1F3D;--amberbg:#2E2410;--violetbg:#231B3D;--redbg:#341613;--greenbg:#0F2A1E;--teal:#2EC4B1;--indigo:#8B9BFF;--violet:#A58BFF;--amber:#F5B83D;--red:#FF6B5E;--green:#3DD68C;--sh:none}}
:root[data-theme=dark]{--bg:#0C111D;--card:#161B26;--ink:#F2F4F7;--muted:#98A2B3;--line:#252C3B;--tealbg:#0F2A27;--indigobg:#1A1F3D;--amberbg:#2E2410;--violetbg:#231B3D;--redbg:#341613;--greenbg:#0F2A1E;--teal:#2EC4B1;--indigo:#8B9BFF;--violet:#A58BFF;--amber:#F5B83D;--red:#FF6B5E;--green:#3DD68C;--sh:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.shell{max-width:600px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header.top h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.02em}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;font-size:1.15rem}
.back{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:6px 0;font-size:.95rem}
h2{font-size:1.25rem;font-weight:800;margin:22px 0 10px;letter-spacing:-.01em}
p{margin:0 0 .7em}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
/* home */
.hello{font-size:1.05rem;color:var(--muted);margin:4px 0 2px}
.count{display:inline-flex;align-items:baseline;gap:8px;background:var(--amberbg);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;margin:4px 0 16px}
.count b{font-size:1.15rem;color:var(--amber)}
.today{background:var(--teal);color:#fff;border-radius:24px;padding:22px;cursor:pointer;border:0;width:100%;text-align:left;display:block;margin-bottom:16px}
.today small{opacity:.85;font-weight:600}
.today h3{font-size:1.4rem;margin:6px 0 8px;font-weight:800;line-height:1.2}
.today .go{display:inline-block;background:#fff;color:var(--teal);border-radius:999px;padding:7px 16px;font-weight:800;margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:var(--r);padding:18px 16px;text-align:left;cursor:pointer;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.tile .em{font-size:1.8rem}
.tile b{font-size:1.1rem;font-weight:800;display:block}
.tile span{font-size:.86rem;opacity:.85}
.t-teal{background:var(--tealbg);color:var(--ink)}.t-teal b{color:var(--teal)}
.t-indigo{background:var(--indigobg);color:var(--ink)}.t-indigo b{color:var(--indigo)}
.t-amber{background:var(--amberbg);color:var(--ink)}.t-amber b{color:var(--amber)}
.t-violet{background:var(--violetbg);color:var(--ink)}.t-violet b{color:var(--violet)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);margin:14px 0;cursor:text;border:0;width:100%;text-align:left;color:var(--muted)}
/* segmented */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--sh);margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:480px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.pick{background:var(--card);border:0;border-radius:16px;padding:14px;text-align:left;cursor:pointer;box-shadow:var(--sh);min-height:96px;display:flex;flex-direction:column;gap:6px}
.pick .em{font-size:1.5rem}.pick b{font-size:.95rem;line-height:1.25}.pick span{font-size:.8rem;color:var(--muted)}
/* brief */
.bhead{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.bhead .em{font-size:2.2rem;width:64px;height:64px;border-radius:18px;background:var(--tealbg);display:grid;place-items:center;flex:0 0 auto}
.bhead h1{font-size:1.45rem;margin:0;font-weight:800;line-height:1.2}
.lbl{font-size:.82rem;font-weight:800;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.know li{margin:0 0 8px}
ol.ask{padding-left:0;list-style:none;counter-reset:q;margin:0}
ol.ask li{counter-increment:q;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
ol.ask li:last-child{border:0}
ol.ask li:before{content:counter(q);flex:0 0 28px;height:28px;border-radius:50%;background:var(--indigobg);color:var(--indigo);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--amberbg);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600}
.avoid{background:var(--redbg);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.avoid .lbl{color:var(--red)}
.cta{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--indigo);color:#fff;text-align:center}
.cta.teal{background:var(--teal)}.cta.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.row{display:flex;gap:10px}.row>*{flex:1}
/* meeting */
.askbig{background:var(--indigo);color:#fff;border-radius:24px;padding:24px 22px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
.askbig .q{font-size:1.35rem;font-weight:800;line-height:1.3}
.askbig .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.askbig .nav button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.cap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.cap button{border:0;border-radius:14px;padding:12px 4px;font-weight:800;cursor:pointer;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);box-shadow:var(--sh)}
.cap button .em{font-size:1.3rem}
.cap button.on{background:var(--teal);color:#fff}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);min-height:84px;resize:vertical}
input[type=text],input[type=search],select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.note{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.note:last-child{border:0}
.tag{flex:0 0 auto;font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 7px;height:fit-content;background:var(--tealbg);color:var(--teal)}
.del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem}
/* learn */
.deck{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:10px;width:100%;text-align:left;cursor:pointer}
.ring{width:46px;height:46px;flex:0 0 auto}
.deck b{display:block;font-size:1rem}.deck span{font-size:.82rem;color:var(--muted)}
.slide{border-radius:28px;padding:30px 24px;min-height:min(62vh,520px);display:flex;flex-direction:column;justify-content:center;color:#fff;position:relative}
.c-teal{background:linear-gradient(160deg,#0E7C70,#0A5B53)}.c-amber{background:linear-gradient(160deg,#C9800A,#A86500)}.c-red{background:linear-gradient(160deg,#C2382D,#9B2219)}.c-indigo{background:linear-gradient(160deg,#4053D6,#2C3BA8)}.c-violet{background:linear-gradient(160deg,#7A5AF8,#5839D1)}
.bars{display:flex;gap:4px;position:absolute;top:16px;left:20px;right:20px}
.bars i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}.bars i.on{background:#fff}
.slide .big{font-size:clamp(3rem,14vw,4.6rem);font-weight:800;line-height:1;margin-bottom:12px;letter-spacing:-.03em}
.slide h3{font-size:1.6rem;font-weight:800;line-height:1.2;margin:0 0 12px}
.slide p{font-size:1.15rem;line-height:1.5;opacity:.95;margin:0}
.slide .tipbtn{margin-top:20px;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;align-self:flex-start}
.slide .tip{margin-top:18px;background:rgba(255,255,255,.16);border-radius:16px;padding:14px 16px;font-size:1.05rem}
.slidenav{display:flex;gap:10px;margin-top:14px}
.slidenav button{flex:1}
/* practice */
.pcard{display:flex;gap:14px;align-items:center;border:0;border-radius:var(--r);padding:18px;width:100%;text-align:left;cursor:pointer;margin-bottom:12px}
.pcard .em{font-size:2rem}.pcard b{font-size:1.1rem;display:block}.pcard span{font-size:.88rem;color:var(--muted)}
.qcard{background:var(--card);border-radius:24px;padding:24px 20px;box-shadow:var(--sh);margin-bottom:14px}
.qcard .q{font-size:1.25rem;font-weight:800;line-height:1.35;margin-bottom:18px}
.opts{display:grid;gap:8px}
.opts button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-weight:700;cursor:pointer;text-align:left}
.opts button.right{border-color:var(--green);background:var(--greenbg)}.opts button.wrong{border-color:var(--red);background:var(--redbg)}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:.95rem}
.fb.good{background:var(--greenbg)}.fb.bad{background:var(--redbg)}.fb.mid{background:var(--amberbg)}
.bubble{background:var(--indigobg);border-radius:18px 18px 18px 6px;padding:14px 16px;margin:0 0 14px}
.bubble small{display:block;font-weight:800;color:var(--indigo);margin-bottom:4px}
.me{background:var(--tealbg);border-radius:18px 18px 6px 18px;padding:12px 16px;margin:0 0 6px 30px;font-weight:600}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 14px}.meter i{display:block;height:100%;background:var(--teal)}
.say .no,.say .yes{border-radius:14px;padding:12px 14px;margin-top:10px}
.say .no{background:var(--redbg)}.say .yes{background:var(--greenbg)}
/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.bottom .in{display:flex;max-width:600px;width:100%}
nav.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;padding:6px 0;border-radius:12px}
nav.bottom a .em{display:block;font-size:1.3rem;line-height:1.3;filter:grayscale(1);opacity:.7}
nav.bottom a.on{color:var(--teal)}nav.bottom a.on .em{filter:none;opacity:1}
/* search results */
.res{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);border:0;width:100%;text-align:left;cursor:pointer;display:block}
.res small{color:var(--muted);font-weight:700;font-size:.75rem}
.sheet{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;font-size:.9rem}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

closes.","Which call types take the longest, and which could be answered without an agent?","Why do transfers make up a quarter of calls? Where do callers want to go?","What happens at 10:00 that makes the service level drop?","How do bookings made by phone reach the doctor's schedule, and why are they sometimes not honoured on arrival?","What does KATi record, and can we see a sample export?","Have you tried any self-service or automated options before? What happened?","Which languages do callers use?"],"listen":["\"We just transfer them\" (directory gap)","\"The system does not show the doctor's real availability\" (integration/scheduling root cause)","\"We are short at peak\" (staffing, not technology)","Multilingual needs (Swahili, English, others)"],"red":["Jumping to \"AI voice bot\" before checking whether an IVR or directory solves 24% of volume.","Proposing booking automation when the underlying problem is unreliable consultant availability (Kaizen ID 16)."],"lead":"Virender (process), Arun (telephony, integration, AI feasibility)"},{"n":"Patient Registration, Front Desk and Queue Management","what":"Creates or retrieves the patient record, captures demographics and payer details, issues queue tickets and guides the patient to the next step.","flow":"Arrival → QMS ticket → registration (new) or retrieval (review) → payer verification → issue UHID/card → direct to triage or billing.","people":"Front desk, customer care, cashiers, IT.","sys":"QMS, Kranium registration, Hospedia patient registration (UHID, biometrics, photo), website appointment portal.","data":"Demographics, UHID, insurer and scheme, contact details, visit history, queue timestamps.","kpi":"Registration time, queue wait, duplicate record rate, data completeness.","ev":["QMS used inconsistently across OPD and specialty clinics; recommendation: single ticket for the entire patient journey (Kaizen ID 1, CIO).","Patient emails and mobile numbers not verified; recommend OTP (Kaizen ID 10).","No mandatory pre-registration capture (Kaizen ID 11).","Gap register: name duplicate checks, field validations, drop-downs instead of free text, scheme search, biometric identification.","Patient: \"Improve on the ticketing experience, it ends when I get to see the doctor, after that no visibility.\""],"opp":[["End-to-end single ticket and journey visibility","Software + integration","QMS-HIS integration first; QMS is Hospedia Phase 2"],["Online pre-registration with OTP verification","Software","Simple, high value, data quality gain"],["Duplicate patient detection (master patient index)","Data quality + rules, possibly ML matching","Foundation for any analytics or AI"],["Patient-facing queue position by SMS/WhatsApp","Automation + integration","Addresses visibility complaints"]],"q":["How does a new patient get registered today, step by step?","How often do you find duplicate patient records? How are they fixed?","What payer information do you capture, and what happens when it is wrong?","When is a queue ticket issued, and where does the patient lose visibility?","Which fields are free text today? Which cause problems later in billing?"],"listen":["\"We create a new file because we cannot find the old one\" (duplicates)","\"The insurer rejects because the scheme is wrong\" (registration root cause of claim rejections)","\"The QMS does not talk to the system\""],"red":["Treating data quality as an AI problem. It is first a process, validation and configuration problem."],"lead":"Virender; Arun for QMS and master patient index"},{"n":"Outpatient Department (OPD) and Specialty Clinics","what":"Consultations for new and review patients across general and specialty clinics; ordering diagnostics and prescriptions.","flow":"Triage → consultation → orders → (diagnostics) → review → prescription → exit or admission.","people":"Doctors (consultants, private admitting doctors), nurses, clinic coordinators.","sys":"Kranium doctors module, Hospedia OPD physician order entry, EMR, triage forms.","data":"Vitals, history, diagnosis (ICD-10), orders, prescriptions, notes, referrals.","kpi":"Wait to consultation, consultation duration, patients per session, appointment adherence, documentation completeness.","ev":["Appointments not honoured at the front desk (Kaizen ID 2).","Consultant availability undermines the appointment system (Kaizen ID 16, CMO/DCMO).","Patient: \"My appointment was 8.45am but I was seen at 11.30am.\"","Gap register: show previous lab and radiology results on one screen, alerts when results publish, audit log of who viewed records, prevent overwriting other doctors' notes, voice dictation (Augnito), Elsevier clinical pathways integration."],"opp":[["Unified results view and result-ready alerts","Software + integration","Clear, low clinical risk, high frustration relief"],["Clinical documentation assistance (dictation or ambient scribe)","Speech AI / GenAI + integration","Competitive space (UK vendor, Augnito); needs clinician validation"],["Clinic schedule reliability analytics","Analytics","Root cause may be consultant behaviour, not technology"],["Clinical decision support (pathways, drug interactions)","Clinical AI / rules","Hospedia scope ambiguity; Elsevier, UpToDate, MIMS requested"]],"q":["From the moment a patient sits down, what does the doctor do on the screen?","How long does documentation take per patient? Is it done during or after the consultation?","How do you find previous results today?","What would you stop doing if the system did it for you?","How are referrals to other doctors handled and tracked?","What makes a clinic run late?"],"listen":["\"I write it later at night\" (documentation burden)","\"I cannot see the old report\" (integration)","\"Consultants come late\" (people and governance, not technology)"],"red":["Assuming doctors want AI. Ask what they want removed from their day.","Clinical decision support claims without clinical governance."],"lead":"Virender (workflow), Arun (EMR, speech AI feasibi ctive, Assessment, Plan clinical note format","Clinical and quality"],["Structured reporting","Templates with fixed sections (e.g. BI-RADS) enabling analytics and AI","Clinical and quality"],["Adjudication","Insurer's decision to pay or reject a claim","Revenue and insurance"],["Aged debtors","Unpaid amounts by age","Revenue and insurance"],["Charge capture","Recording every billable item","Revenue and insurance"],["Co-pay","Portion the patient pays","Revenue and insurance"],["Credit control","Department managing insurance and corporate debt","Revenue and insurance"],["Credit note","Reduction of an issued bill","Revenue and insurance"],["Debtor days","Average time to collect","Revenue and insurance"],["Denial / rejection","Claim refused by payer","Revenue and insurance"],["EDI","Electronic data interchange with insurers (Smart, M-Tiba, Slade, LCT)","Revenue and insurance"],["eTIMS","KRA electronic tax invoice management system (applicability to confirm)","Revenue and insurance"],["Exclusion","Service not covered by a scheme","Revenue and insurance"],["LPO","Local purchase order","Revenue and insurance"],["Pre-authorisation","Insurer approval before treatment","Revenue and insurance"],["RCM","Revenue cycle management","Revenue and insurance"],["Remittance","Payment advice from insurer","Revenue and insurance"],["SHA / SHIF","Social Health Authority / Social Health Insurance Fund (Kenya public scheme)","Revenue and insurance"],["Split bill","Bill divided across insurer, corporate and patient","Revenue and insurance"],["TPA","Third-party administrator for claims","Revenue and insurance"],["Write-off","Debt removed as uncollectable","Revenue and insurance"],["API","Interface for systems to exchange data","Technology and data"],["Audit trail","Log of who viewed or changed what","Technology and data"],["Bronze / Silver / Gold","Medallion data layers: raw, cleaned, business-ready","Technology and data"],["Data dictionary","Description of every table and field","Technology Ambient scribe","Listens to consultation and drafts the note","AI"],["ASR","Automatic speech recognition","AI"],["Bias","Systematic error affecting some groups","AI"],["Computer vision","AI interpreting images","AI"],["Drift","Model performance degrading as data changes","AI"],["Embedding","Numeric representation of text for search","AI"],["F1","Balance of precision and recall","AI"],["False negative","Missed true case","AI"],["False positive","False alarm","AI"],["Fine-tuning","Further training a model on specific data","AI"],["Grounding","Tying GenAI answers to source data","AI"],["Guardrails","Controls limiting what AI can say or do","AI"],["Hallucination","Confident but false GenAI output","AI"],["Human-in-the-loop","Human reviews or approves AI output","AI"],["LLM","Large language model","AI"],["ML","Machine learning","AI"],["NLP","Natural language processing","AI"],["PoC","Proof of concept","AI"],["Precision","% of flags that are correct","AI"],["RAG","Retrieval-augmented generation","AI"],["Recall / sensitivity","% of true cases caught","AI"],["Silent mode","AI runs without showing outputs, for validation","AI"],["SLM","Small language model, specialised and lighter","AI"],["Specificity","% of negatives correctly cleared","AI"],["Training data","Examples a model learns from","AI"],["Vector database","Store for embeddings used in RAG","AI"],["Acceptance criteria","Conditions proving a requirement is met","Business analysis and commercial"],["AS-IS / TO-BE","Current / future process","Business analysis and commercial"],["Baseline","Current measured performance","Business analysis and commercial"],["Business case","Justification: value, cost, risk","Business analysis and commercial"],["Change request","Formal scope change","Business analysis and commercial"],["Fishbone","Root-cause diagram","Business analysis and commercial"],["Five Whys","Iterative root-cause questioning","Business analysis and commercial"],["Functional requirement","What a system must do","Business analysis and commercial"],["Gap analysis","Difference between current and target","Business analysis and commercial"],["MoM","Minutes of meeting","Business analysis and commercial"],["Non-functional requirement","Performance, security, usability constraints","Business analysis and commercial"],["RACI","Responsible, Accountable, Consulted, Informed","Business analysis and commercial"],["ROI","Return on investment","Business analysis and commercial"],["SoW","Statement of work","Business analysis and commercial"],["Swimlane","Process map lane per role","Business analysis and commercial"],["T&M","Time and materials","Business analysis and commercial"],["User story","As a [role], I want [x], so that [y]","Business analysis and commercial"]],"icons":["📞","🧾","🩺","🚑","🛏️","❤️","🧤","🧪","🩻","💊","🚪","💳","📑","📊","🗂️","👥","📦","🍽️","🖥️","✅"],"people":[{"n":"Shiraz Dadar","i":"🤝","r":"Our main contact, drives AI adoption","know":["Stepped away as head of IT in 2024; now focuses on AI adoption and board consultation.","Candid. Wants on-the-ground discovery, likes Gantt charts.","Shared the strategy, Hospedia scope and regulatory links quickly."],"ask":["How should we involve the CIO before we arrive?","Which departments should we see in the remote week?","Who approves the discovery plan, and by when?","What would make this discovery a success for you?","What is your current title, so we use it correctly?"],"listen":["Names of people we have not met","Anything about budget or the Board","What the CEO cares about"],"avoid":["Repeating his off-record views on Hospedia.","Routing everything through him alone."]},{"n":"The CIO","i":"🖥️","r":"Runs IT and the Hospedia rollout (name unknown)","know":["Owns the Hospedia implementation.","Owns several Kaizen digital actions, including AI call deflection.","Not yet engaged by us. This is our biggest stakeholder gap."],"ask":["What does success look like for Hospedia go-live?","Which integrations worry you most?","What can Hospedia expose to other systems, and on what terms?","What must any new system respect: security, hosting, data?","How much support capacity does ICT have for new tools?"],"listen":["\"We depend on the vendor for every change\"","\"We have no sandbox\"","Go-live dates and pressure points"],"avoid":["Surprising him with vendor criticism.","Making technical promises without Arun."]},{"n":"Dr Thuku","i":"🩻","r":"Head of Radiology (spelling to confirm)","know":["Radiologist with an IT degree.","Built his own radiology system with AI-assisted coding. Hospedia accepted it cannot replicate it.","Wants AI to push urgent X-rays up his list; thinking about a pneumothorax model."],"ask":["What problem were you solving when you built your system?","What data does it use, and where does it run?","Which studies go unreported today, and what happens to those patients?","What should AI do for you, and what must it never do?","How would you check an AI result before trusting it?"],"listen":["Data location and privacy details","\"We only report acute cases\"","How proud he is of what he built"],"avoid":["Calling his system risky or \"vibe coded\".","Promising fracture AI. Ours was a proof of concept."]},{"n":"CEO","i":"🏛️","r":"Approves the discovery plan","know":["Must approve the dates and plan.","The strategy is his frame: two pillars, three enablers, three phases."],"ask":["Which outcome matters most to you in the next 12 months?","What constraints should we respect: budget, people, timing?","How are investment decisions made here?"],"listen":["Strategy words he repeats","Board expectations","Affordability concerns"],"avoid":["Technical detail.","Any price, even a rough one."]},{"n":"Dr John (COO)","i":"⚙️","r":"Operations (named in Feb 2026)","know":["Named as needed for internal alignment.","Silent since. Confirm he is still in role."],"ask":["Where do patients wait longest, in your view?","Which support services cause the most complaints?","What has already been tried to fix patient flow?"],"listen":["Throughput and bed pressure","Food, linen, parking (top Kaizen complaints)"],"avoid":["Saying yes to extra scope in the room."]},{"n":"ITDose (Hospedia)","i":"🏗️","r":"Hospital system vendor","know":["Signed contract; in UAT, not live.","Phase 1: registration, OPD, doctors, lab, radiology, pharmacy, inventory, finance. Phase 2: queues, patient app, portals.","No AI today. Their AI map is aspirational."],"ask":["Module scope and go-live date per phase?","Which APIs exist, read or write, and can third parties build on them?","What is the plan for historical Kranium data?","Will MP Shah data ever be used to train your models?"],"listen":["What is still being customised","What they say is \"out of scope\""],"avoid":["Any criticism. We complement Hospedia.","Hiding our involvement."]},{"n":"Kaizen study team","i":"📈","r":"MP Shah staff who mapped the patient journey","know":["Analysed 963,766 patient journeys.","Built a tracker of 59 to 62 actions with owners.","Told the Board: quick wins before big spending."],"ask":["Which actions are closed, and which are stuck?","Can we use the Excel tracker?","What surprised you most in the study?"],"listen":["Why actions stalled","Which owners are most engaged"],"avoid":["Appearing to redo or criticise their work."]}],"decks":[{"t":"Your role in 60 seconds","c":"teal","s":[{"t":"You are the bridge.","x":"MP Shah, you, Arun and Virender, Subhankar. Your job is to keep the engagement moving."},{"t":"Coordinate. Do not absorb.","x":"Technical questions go to Arun. Process questions go to Virender. Scope, price and contract go to Subhankar."},{"t":"Capture, route, track, close.","x":"Every action gets an owner and a date. Nothing is left as \"we discussed it\"."},{"t":"Never commit scope on your own.","x":"Say: \"Let me capture exactly what you need and align internally before I confirm.\""},{"q":"A doctor asks \"can you build this?\" What do you say?","tip":"\"Great question. Let me make sure Arun picks it up, so our answer is realistic.\" Then log it."}]},{"t":"Grace's journey","c":"amber","s":[{"t":"Meet Grace.","x":"41, insured through her employer, pelvic pain for two weeks. Fictional, but every problem she meets is documented."},{"big":"25%","t":"She calls at 10am.","x":"At the 10:00 peak, only about a quarter of calls are answered in time. She gives up and books online."},{"t":"She arrives for 08:45.","x":"Her booking is not honoured. She queues like a walk-in and is seen at 11:30."},{"big":"2.5 hrs","t":"Her lab test.","x":"Promised in 45 minutes. Nobody tells her it is ready; she keeps walking back to ask."},{"t":"Her ultrasound.","x":"Nobody told her she needed a full bladder. One machine handles everything. She waits until after 4pm."},{"big":"195 min","t":"Her discharge.","x":"Dressed by 9am. The surgeon posts charges late; the insurer approves slowly. She leaves at 4pm."},{"t":"Her follow-up.","x":"She was promised a call. Nobody calls. Three weeks later she walks in sick."},{"q":"Grace met at least twelve departments. Which three problems would you show the CEO?","tip":"Waiting and visibility, discharge billing clearance, and contact centre access. All are measured, all hit many patients."}]},{"t":"Why discharges take 5 hours","c":"red","s":[{"big":"309 min","t":"Median discharge time.","x":"From the doctor's decision to the patient leaving. 67.5% take more than 4 hours."},{"big":"195 min","t":"Billing clearance alone.","x":"The biggest stage by far. It is the bottleneck in 1,338 tracked discharges."},{"t":"Why billing is slow.","x":"Doctors post charges late. Insurers take time to approve the final bill. Nobody tracks it live."},{"t":"So what helps?","x":"Charge reminders, insurer approval tracking, a live stage dashboard. Integration and automation, not AI."},{"q":"Someone wants an AI discharge summary first. What do you say?","tip":"\"Useful later, but it does not touch the 195-minute billing stage. Let us fix that first.\""}]},{"t":"How money flows","c":"teal","s":[{"t":"Most patients are insured.","x":"Over half of all journeys are insured review outpatients. Insurance touches almost everyone."},{"t":"The revenue cycle.","x":"Register, pre-authorise, capture charges, code, bill, submit claim, insurer decides, payment, reconcile."},{"t":"Errors travel.","x":"A wrong scheme typed at registration becomes a rejected claim weeks later."},{"t":"Credit Control feels it most.","x":"They raised the largest block of Hospedia requirements: rejections, EDI problems, reconciliation in Excel."},{"q":"Where would you look first to cut claim rejections?","tip":"The top rejection reasons, and how they are recorded. Then registration data quality and insurer EDI links."}]},{"t":"The hospital's systems","c":"indigo","s":[{"t":"HIS runs the hospital.","x":"Registration, orders, wards, billing. MP Shah is moving from Kranium to Hospedia."},{"t":"EMR is the clinical record.","x":"Notes, diagnoses, results, medicines. It lives inside the HIS."},{"t":"LIS runs the lab.","x":"Samples, results, quality checks. MP Shah has a separate lab system today."},{"t":"RIS and PACS run radiology.","x":"RIS manages bookings and reports. PACS stores the images. MP Shah's PACS is RadWeb."},{"q":"Explain PACS vs RIS to a finance director in one sentence.","tip":"\"RIS manages the radiology appointments and reports; PACS stores the scans themselves.\""}]},{"t":"How systems talk","c":"indigo","s":[{"t":"An API is a doorway.","x":"One system asks another for data through it. No doorway, no clean integration."},{"t":"Three standards to recognise.","x":"HL7 v2: older hospital messages. FHIR: modern and web-friendly. DICOM: images."},{"t":"Read or write?","x":"Read-only means new tools can look but not update the record. That changes what is possible."},{"t":"Rights matter too.","x":"Even if APIs exist, the contract may limit who can build on them. That is why we asked ITDose."},{"q":"Arun says \"read-only, nightly batch\". What does that mean for Shiraz?","tip":"New tools can see yesterday's data but cannot update records or send real-time alerts."}]},{"t":"AI or not AI?","c":"violet","s":[{"t":"Start with the problem.","x":"Never \"where can we put AI?\". Always \"what is broken, for whom, and why?\""},{"t":"Five honest answers.","x":"Process fix. Integration. Automation. Analytics. AI. In that order of simplicity."},{"t":"When is it really AI?","x":"Language, images, speech, prediction or generation, where simpler options fall short."},{"t":"Saying \"not AI\" builds trust.","x":"Clients remember the partner who told them the simple answer."},{"q":"\"Lab tests are forgotten daily.\" AI or not?","tip":"Not AI. A rule: if an order is pending too long, alert someone. Automation."}]},{"t":"Is the data ready?","c":"violet","s":[{"t":"\"We have the data\" means little.","x":"It usually only means the data exists somewhere."},{"t":"The ladder.","x":"Exists. Accessible. Usable. Good quality. Enough history. Labelled. Can flow back. Governed."},{"t":"Labels are the usual trap.","x":"To predict claim rejections, rejection reasons must be recorded consistently. Often they are not."},{"t":"Unknown is a good answer.","x":"Every unknown becomes a question for the right owner."},{"q":"For denial prediction, which rung would you check first at MP Shah?","tip":"Labels: are rejection reasons captured consistently? The Credit Control Excel may be the only source."}]},{"t":"Judging AI honestly","c":"violet","s":[{"t":"Accuracy can mislead.","x":"If a condition is rare, a model that always says \"no\" looks accurate."},{"t":"Recall: did it catch the real cases?","x":"Missing a real case is a false negative. In screening, that is the dangerous error."},{"t":"Precision: are its alerts right?","x":"Too many false alarms and clinicians stop looking."},{"t":"Say it honestly.","x":"\"Our chest X-ray screening work reached around 81% accuracy on its data. It would need testing on MP Shah images.\""},{"q":"For urgent X-ray triage, which matters more: recall or precision?","tip":"Recall. Missing an urgent case is worse than an extra alert, as long as alerts stay manageable."}]},{"t":"The people who matter","c":"teal","s":[{"t":"Champions open doors.","x":"Shiraz opens doors. But do not route everything through one person."},{"t":"The missing CIO.","x":"He runs IT and Hospedia, and owns digital Kaizen actions. We have not met him. Fix that first."},{"t":"Respect clinicians.","x":"Lead with their workflow and their patients. Use titles. Ask, do not tell."},{"t":"Record facts, not opinions.","x":"What was said, observed or confirmed. Never guess motives."},{"q":"How would you ask Shiraz about involving the CIO?","tip":"\"Since he owns the Hospedia rollout, would it help if we briefed him directly before we arrive?\""}]},{"t":"Talking to executives","c":"amber","s":[{"t":"Four beats.","x":"Context. Finding. Implication. Decision."},{"t":"Use their words.","x":"\"Speed at every touchpoint.\" \"Trusted enterprise data.\" Their strategy, quoted back."},{"t":"Numbers with a source.","x":"\"Kaizen measured 195 minutes in billing clearance.\" Never a number you cannot trace."},{"t":"No architecture.","x":"Executives want what it means, not how it works."},{"q":"Translate: \"Data is fragmented across three databases.\"","tip":"\"Teams cannot see one trusted picture, so reports take manual effort and may disagree.\""}]},{"t":"When the client asks for more","c":"red","s":[{"t":"It will happen.","x":"Another department. Another workshop. A prototype. A quick estimate."},{"t":"Never yes in the room.","x":"Never no either. Both damage you."},{"t":"The path.","x":"Capture. Understand why. Take it to Subhankar. Decide impact. Respond."},{"t":"The script.","x":"\"That sounds valuable. Let me capture exactly what you need and align internally on timing before I confirm.\""},{"q":"The CEO asks: \"Roughly what would the data lake cost?\"","tip":"\"It depends on scope, data and how it connects to Hospedia. We will bring a reliable view with the roadmap.\""}]},{"t":"Hospedia: complement, never compete","c":"indigo","s":[{"t":"MP Shah chose Hospedia.","x":"It is signed and mid-implementation. Respect that decision in every room."},{"t":"Our position.","x":"\"We build on what Hospedia delivers.\" Always."},{"t":"Off-record stays off-record.","x":"Shiraz shared private views. They never appear in any document or conversation."},{"t":"Find the white space.","x":"Integrations, data platform, analytics, governance and AI layers Hospedia does not cover."},{"q":"A finance manager says Hospedia is \"a disaster\". You say?","tip":"\"That is helpful context. Our focus is on complementing what Hospedia delivers.\" Then note the pain, not the opinion."}]},{"t":"Running a great workshop","c":"teal","s":[{"t":"Before.","x":"One-sentence objective. Five must-ask questions. Agree who covers what with Arun and Virender."},{"t":"Open.","x":"\"We want to see how it works through your eyes. We are not here to sell.\""},{"t":"During.","x":"Let them walk you through it. Follow pain and workarounds. Ask \"why\" twice."},{"t":"Close.","x":"\"Let me recap: what we heard, what we agreed, who does what by when.\""},{"t":"After.","x":"Recap email within 24 hours. Update actions. Note one question you should have asked."},{"q":"A colleague is mid-question while the client describes real pain. Do you move on?","tip":"No. Let the thread run. Pain is where the value is."}]}],"sims":[{"id":"cc","title":"Credit Control: \"Our biggest problem is rejections\"","intro":"You are in a session with the Head of Credit Control. Virender and Arun are with you.","start":"a","nodes":{"a":{"s":"Head of Credit Control","q":"\"Honestly, our biggest headache is insurance rejections. We lose a lot of money there.\"","c":[{"t":"\"Would an AI tool that predicts denials help you?\"","n":"a1","p":0,"f":"You jumped straight to a solution. She now evaluates your idea instead of describing her problem, and you still do not know why claims are rejected."},{"t":"\"What are the most common reasons claims get rejected, and how do you know?\"","n":"b","p":2,"f":"Good. You asked for the cause and the evidence in one question."},{"t":"\"Hospedia will fix most of that, won't it?\"","n":"a2","p":0,"f":"An assumption, and it pulls the vendor into a pain conversation. You also signal you have not looked."}]},"a1":{"s":"Head of Credit Control","q":"\"Maybe? I don't know what that would look like. Can you send a demo?\"","c":[{"t":"Recover: \"Before any demo, help me understand what actually gets rejected.\"","n":"b","p":1,"f":"Good recovery. Always pull back to the problem."}]},"a2":{"s":"Head of Credit Control","q":"\"They say so. We will see. We raised forty requirements.\"","c":[{"t":"Recover: \"Can you walk us through the top rejection reasons today?\"","n":"b","p":1,"f":"Recovered. Note the forty requirements: ask for the list later."}]},"b":{"s":"Head of Credit Control","q":"\"Exclusions billed by mistake, missing documents, and the EDI dropping claims. We track it in Excel.\"","c":[{"t":"\"Could we see that Excel, even a sample?\"","n":"c","p":2,"f":"Excellent. A workaround is evidence. The sheet may give you baselines and categories."},{"t":"\"So you need an AI to catch exclusions.\"","n":"c2","p":0,"f":"Still solutioning. Exclusions are usually rules; you have not checked how they are configured."},{"t":"\"How many rejections a month, and roughly what value?\"","n":"c","p":2,"f":"Good. You are building the business case baseline."}]},"c2":{"s":"Arun","q":"(quietly) \"Let's check how exclusions are mapped to schemes first.\"","c":[{"t":"\"Thanks Arun. Could you show us how an exclusion is set up for a scheme?\"","n":"c","p":1,"f":"Good use of your technical colleague. Let him lead that thread."}]},"c":{"s":"Head of Credit Control","q":"\"Sure. About 180 rejections a month. The EDI ones are the worst, we resubmit manually.\"","c":[{"t":"\"Which EDI causes most problems? Arun, can you pick up the integration side?\"","n":"end","p":2,"f":"You connected a business finding to the technical owner in real time. That is your core job."},{"t":"\"OK, we will design something for that.\"","n":"end","p":0,"f":"An implicit commitment, with no owner and no scope check. Capture instead, then route."}]},"end":{"end":true}}},{"id":"rad","title":"Radiology: the champion and his system","intro":"Dr Thuku has just demonstrated the radiology system he built himself. He is proud of it.","start":"a","nodes":{"a":{"s":"Dr Thuku","q":"\"So, can Capital Numbers make this production-ready and add AI fracture detection?\"","c":[{"t":"\"Yes, we have done fracture detection before. We can do it.\"","n":"a1","p":0,"f":"A commitment you are not authorised to make, plus a capability claim. Our fracture work was a proof of concept. This is Arun's call and then Subhankar's."},{"t":"\"What you have built shows exactly what the department needs. Can you tell us what problem you were solving first?\"","n":"b","p":2,"f":"Respect first, then problem. He feels heard, and you learn his priorities."},{"t":"\"Vibe-coded tools are risky with patient data.\"","n":"a2","p":0,"f":"True in principle, but it lands as dismissive. You risk losing your strongest clinical champion."}]},"a1":{"s":"Dr Thuku","q":"\"Great. When can you start?\"","c":[{"t":"Recover: \"Let me make sure we understand your workflow and data properly first, so whatever we suggest actually works here.\"","n":"b","p":1,"f":"Recovered, but you created an expectation. Note it for Subhankar."}]},"a2":{"s":"Dr Thuku","q":"\"It is working better than anything the vendors gave us.\"","c":[{"t":"Recover: \"That is clear. Help us understand how you built it, and where it runs.\"","n":"b","p":1,"f":"Recovered by switching to curiosity."}]},"b":{"s":"Dr Thuku","q":"\"Reporting backlog. I cannot report every X-ray. Non-urgent ones just do not get reported.\"","c":[{"t":"\"What happens to those patients today? Do the referring doctors read the images themselves?\"","n":"c","p":2,"f":"You went to impact and risk. That is how you size a clinical problem."},{"t":"\"AI can read the X-rays for you.\"","n":"c","p":0,"f":"Overclaim. AI can help prioritise; the radiologist remains accountable. Never imply replacement."}]},"c":{"s":"Dr Thuku","q":"\"Mostly yes. Some are missed. I would like AI to push urgent ones up my list.\"","c":[{"t":"\"Arun, could you explore with Dr Thuku what data and PACS access a prioritisation tool would need?\"","n":"end","p":2,"f":"Clean handover to the technical owner with a specific question."},{"t":"\"We will put that in our proposal.\"","n":"end","p":0,"f":"Premature. Capture as a signal; the roadmap decides."}]},"end":{"end":true}}},{"id":"ceo","title":"The corridor price question","intro":"Onsite day 4. The CEO stops you in the corridor after a session.","start":"a","nodes":{"a":{"s":"CEO","q":"\"Shiraz tells me about this data lake idea. Roughly what would that cost us?\"","c":[{"t":"\"Around fifty to eighty thousand dollars, depending.\"","n":"a1","p":0,"f":"You invented a number. It will become the anchor for every future conversation. Pricing is Subhankar's."},{"t":"\"It depends on scope, data volume and how it connects to Hospedia. We are assessing that now, and we will bring a reliable view with the roadmap.\"","n":"b","p":2,"f":"Honest, confident and not evasive. You explained what drives the cost."},{"t":"\"I am not sure, I will ask.\"","n":"b","p":1,"f":"Honest, but weak. Explain what the answer depends on so you sound in control."}]},"a1":{"s":"CEO","q":"\"That much? We were thinking much less.\"","c":[{"t":"Recover: \"That was a rough guess and I should not have given one. Let us come back with a properly scoped view.\"","n":"b","p":1,"f":"Owning it is right. Tell Subhankar the same day."}]},"b":{"s":"CEO","q":"\"Fine. What would we actually get from it?\"","c":[{"t":"\"One trusted place for data across Kranium and Hospedia, so reports and future AI use the same numbers. Your strategy calls it trusted enterprise data.\"","n":"c","p":2,"f":"Business value in his language, tied to his own strategy."},{"t":"\"A medallion architecture with bronze, silver and gold layers on a lakehouse.\"","n":"c","p":0,"f":"Technically right, but meaningless to a CEO. Translate."}]},"c":{"s":"CEO","q":"\"Good. Make sure it is in the final presentation.\"","c":[{"t":"\"Will do. I will also make sure Subhankar has your interest on record.\"","n":"end","p":2,"f":"You captured an executive signal and routed it to the commercial owner."},{"t":"\"Absolutely, we will prioritise it.\"","n":"end","p":0,"f":"Prioritisation comes from evidence across all opportunities, not one corridor chat."}]},"end":{"end":true}}},{"id":"scope","title":"Scope creep: \"Can you also review procurement?\"","intro":"Onsite day 3. The COO joins the end of a session and makes a request.","start":"a","nodes":{"a":{"s":"COO","q":"\"While you are here, can your team also do a deep review of our procurement process next week?\"","c":[{"t":"\"Of course, we can fit that in.\"","n":"a1","p":0,"f":"An unauthorised scope commitment. It affects timeline, effort and possibly commercials. Only Subhankar can agree this."},{"t":"\"That sounds valuable. What would you want to come out of it, and what prompted it now?\"","n":"b","p":2,"f":"You understood the request before reacting. That is the first step of the scope path."},{"t":"\"Sorry, that is out of scope.\"","n":"a2","p":0,"f":"Rejecting immediately damages the relationship and may miss a real need or a future opportunity."}]},"a1":{"s":"COO","q":"\"Great, I will tell the procurement team to expect you.\"","c":[{"t":"Recover: \"Let me just confirm timing with my lead first, so we do it properly. I will come back to you tomorrow.\"","n":"b","p":1,"f":"Recovered, but you created an expectation. Tell Subhankar today."}]},"a2":{"s":"COO","q":"\"Oh. I thought this was a hospital-wide review.\"","c":[{"t":"Recover: \"It is broad. Let me understand what you need and check how best to cover it.\"","n":"b","p":1,"f":"Recovered by returning to understanding."}]},"b":{"s":"COO","q":"\"Stock-outs keep delaying procedures. I want to know whether the new system will fix it.\"","c":[{"t":"\"Let me capture exactly that, and align internally on how and when we can look at it. I will confirm by tomorrow.\"","n":"c","p":2,"f":"The scope script, used well: capture, align, confirm, with a time commitment you control."},{"t":"\"Hospedia will definitely fix stock-outs.\"","n":"c","p":0,"f":"A claim about the vendor you cannot make. Stock accuracy may be process, data and configuration."}]},"c":{"s":"You, later","q":"(Back at the hotel.) What do you do next?","c":[{"t":"Send Subhankar a short note: request, why, link to strategy and Kaizen, likely effort, options, decision needed by tomorrow.","n":"end","p":2,"f":"Exactly the escalation structure. Material, clear, with a decision deadline."},{"t":"Ask Virender to start on it tomorrow morning.","n":"end","p":0,"f":"You assigned work that has not been agreed. Scope first, then ownership."}]},"end":{"end":true}}},{"id":"contra","title":"Contradiction: \"The lab is fully integrated\"","intro":"Morning: ICT says the lab system is fully integrated. Afternoon: lab staff show you re-typing analyser results by hand.","start":"a","nodes":{"a":{"s":"Lab technologist","q":"\"We type the results from this screen into that one. Every day.\"","c":[{"t":"\"But ICT told us this morning it was integrated.\"","n":"a1","p":0,"f":"You set two teams against each other in front of a junior staff member. Record, do not confront."},{"t":"\"Could you show me which results you re-type, and roughly how many a day?\"","n":"b","p":2,"f":"You gathered evidence neutrally. Observation beats opinion."}]},"a1":{"s":"Lab technologist","q":"\"Well, maybe for some machines. Not these.\"","c":[{"t":"Recover: \"That is really helpful. Which machines are not connected?\"","n":"b","p":1,"f":"Recovered into specifics. Both statements may be true for different analysers."}]},"b":{"s":"Lab technologist","q":"\"The serology and the two chemistry analysers. Maybe 200 results a day.\"","c":[{"t":"Log it as a contradiction: ICT statement vs lab observation, with a possible explanation (some analysers interfaced, some not). Ask Arun to validate with ICT.","n":"end","p":2,"f":"Perfect discovery discipline: both sources recorded, explanation offered, validation owner assigned."},{"t":"Note that ICT was wrong.","n":"end","p":0,"f":"You chose a side without validation, and the note could leak. Different people often experience the same system differently."}]},"end":{"end":true}}},{"id":"cio","title":"Bringing in the CIO","intro":"Two days before onsite. The CIO has not been in any session. You call Shiraz.","start":"a","nodes":{"a":{"s":"Shiraz","q":"\"Hi Bhavesh. All set for next week?\"","c":[{"t":"\"Almost. Should we be talking to the CIO or not? He seems to be missing.\"","n":"a1","p":0,"f":"Blunt and slightly accusatory. It can read as criticism of Shiraz or the CIO."},{"t":"\"Nearly. Since the CIO owns the Hospedia rollout and several Kaizen actions, would it help if we briefed him directly before we arrive?\"","n":"b","p":2,"f":"You gave a reason rooted in his ownership, and offered help rather than a complaint."}]},"a1":{"s":"Shiraz","q":"\"He is very busy with the go-live.\"","c":[{"t":"Recover: \"Completely understand. Even 20 minutes would help us avoid duplicating his work. Would that be possible?\"","n":"b","p":1,"f":"Recovered by making it small and in his interest."}]},"b":{"s":"Shiraz","q":"\"Good idea. He is stretched, but I will ask. What would you cover?\"","c":[{"t":"\"Our plan, what we have learned from the Hospedia scope, and three questions only he can answer. Twenty minutes.\"","n":"c","p":2,"f":"Specific, short, respectful of his time."},{"t":"\"Everything, really. Our full approach.\"","n":"c","p":0,"f":"Vague and long. Busy executives say no to open-ended asks."}]},"c":{"s":"Shiraz","q":"\"Send me a short note I can forward.\"","c":[{"t":"Send a 5-line note Shiraz can forward, and copy Subhankar on the stakeholder gap.","n":"end","p":2,"f":"You made the champion's job easy and kept governance informed."},{"t":"Email the CIO directly, bypassing Shiraz.","n":"end","p":0,"f":"You went around your champion after he offered to help. That costs trust."}]},"end":{"end":true}}}],"sort":[{"x":"Lab tests are forgotten 4 to 5 times a day and nobody is alerted","a":"Automation","w":"Known rules: if an order is pending beyond a time limit, alert. No learning needed."},{"x":"A quarter of all calls are just people asking to be transferred","a":"Automation","w":"An IVR menu or directory routes these. AI is overkill for a known list of destinations."},{"x":"The Board wants to see discharge time broken down by stage, every day","a":"Analytics","w":"The data exists; people need to see it. A dashboard, not a model."},{"x":"Lab results do not reach the HMIS, so doctors do not know they are ready","a":"Integration","w":"Data is not moving between systems. Connect them first."},{"x":"Consultants arrive late, so booked appointments are not honoured","a":"Process fix","w":"The root cause is behaviour and scheduling discipline. Technology cannot fix a late consultant."},{"x":"Sonographers leave the room to type reports, wasting scan time","a":"AI","w":"Speech-to-text understands spoken language. Even dictaphones help; speech AI goes further."},{"x":"Radiologists cannot report every X-ray; urgent ones need to rise to the top","a":"AI","w":"Interpreting images to prioritise needs computer vision. Clinical validation and oversight required."},{"x":"Insurer EDI systems drop claims, causing rejections","a":"Integration","w":"A broken connection between systems. Fix the interface."},{"x":"Patients arrive for scans without fasting or a full bladder","a":"Automation","w":"Send preparation instructions automatically when the scan is booked. Rules, not AI."},{"x":"Pharmacy and billing want to know tonight who will likely go home tomorrow","a":"AI","w":"Predicting discharges from patterns in history is a predictive model. Useful once data is reliable."},{"x":"The reporting desk is empty when transcriptionists all take lunch at once","a":"Process fix","w":"Stagger the breaks. Kaizen listed this as a zero-cost quick win."},{"x":"Finance cannot see profit and loss by department","a":"Analytics","w":"Reporting on existing data, once revenue mapping is clean."},{"x":"Staff ask HR the same policy questions every week","a":"AI","w":"A policy assistant that answers from approved documents (RAG). Only worth it if volume is real and policies are current."},{"x":"The same patient has three different records","a":"Process fix","w":"Mostly registration discipline and validation rules. Matching tools can help, but process comes first."},{"x":"Pharmacy does not know a discharge has started","a":"Integration","w":"The HIS should notify pharmacy when the discharge event happens. An event or webhook, not AI."},{"x":"Doctors spend evenings writing discharge summaries","a":"AI","w":"Generative AI can draft from the record for doctor review. Real value, but it does not touch the 195-minute billing bottleneck."}],"buckets":["AI","Automation","Analytics","Integration","Process fix"],"sayAll":[{"s":"\"How much will it cost?\"","no":"\"Probably around fifty thousand.\"","yes":"\"It depends on scope, integration and data. We will bring a reliable view once those are confirmed, and Subhankar will take you through it.\""},{"s":"Client criticises Hospedia","no":"\"Yes, we noticed the UI looks very dated too.\"","yes":"\"That is helpful context. Our focus is on complementing what Hospedia delivers.\""},{"s":"\"Can your team also look at procurement next week?\"","no":"\"Sure, we will add it.\"","yes":"\"That sounds valuable. Let me capture exactly what you need and align internally on timing before I confirm.\""},{"s":"We captured something wrongly","no":"\"I am so sorry, that is completely our fault, we will be more careful, apologies again.\"","yes":"\"Thank you for pointing that out. We captured it incorrectly and will correct the documents.\""},{"s":"\"Can you start building now?\"","no":"\"Yes, we are ready.\"","yes":"\"We can plan that properly. First we need to confirm a few dependencies so it succeeds.\""},{"s":"\"Why another workshop?\"","no":"\"We just need more information.\"","yes":"\"It closes one specific gap, how insurance approvals flow, which decides whether this is feasible. We will keep it to 45 minutes.\""},{"s":"\"Are you saying our systems are bad?\"","no":"\"Well, there are a lot of gaps.\"","yes":"\"Not at all. Every hospital has gaps between systems. Our job is to find the most valuable ones to close.\""},{"s":"Client asks if you have done this before","no":"\"We have done this many times.\"","yes":"\"We have relevant work, for example a chest X-ray screening project. Let me share what applies and what would be new here.\""},{"s":"Talking about AI accuracy","no":"\"Our model is 95% accurate.\"","yes":"\"In testing on that project it reached around 81% accuracy. It would need validating on MP Shah data before anyone relies on it.\""},{"s":"Calling the schedule","no":"\"Our project plan\"","yes":"\"Our discovery plan\" or \"workshop plan\""},{"s":"Colleague is mid-question when you want to move on","no":"\"Sorry to cut you down, to save time...\"","yes":"Let the thread finish if the client is describing real pain. Note the time and catch up later."},{"s":"Client: \"We need AI\"","no":"\"Great, here are six use cases.\"","yes":"\"What outcome are you hoping AI will help you achieve?\""},{"s":"Arun says: \"Hospedia exposes read APIs only, through a nightly batch export. No FHIR.\" How do you explain it to Shiraz?","no":"","yes":"New tools could read Hospedia data but not update it, and only once a day. That works for dashboards and planning, but not for real-time alerts or anything that writes back. We should ask ITDose whether more is planned."},{"s":"Arun says: \"The model achieved 0.85 recall and 0.78 precision on the validation set.\" How do you explain it to CEO?","no":"","yes":"It caught about 85 of every 100 real cases in testing, and about three in four of its alerts were correct. The radiologist still reviews everything; it would help sort the queue, not replace judgement."},{"s":"Arun says: \"Patient master data has duplicate UHIDs; MPI deduplication is required before analytics.\" How do you explain it to CEO?","no":"","yes":"Some patients exist more than once in the system. Until we clean that up, any report on patient numbers or outcomes will be wrong, so it has to come first."},{"s":"Arun says: \"The integration would need a middleware layer with HL7 v2 listeners because the lab analysers do not support FHIR.\" How do you explain it to Head of Laboratory?","no":"","yes":"Your analysers speak an older standard, so we would need a small connecting system in between. It is common and workable, but it adds some setup time."},{"s":"Arun says: \"Data residency requirements under the DPA may restrict hosting PHI on AWS regions outside Kenya.\" How do you explain it to Shiraz?","no":"","yes":"Kenyan data protection rules may limit storing patient data in cloud centres outside Kenya. Before choosing AWS for anything with patient data, we should confirm what is allowed."},{"s":"Arun says: \"A PoC in silent mode for 6 weeks on retrospective DICOM studies before any clinical exposure.\" How do you explain it to Board member?","no":"","yes":"We would first test the tool quietly on past scans, without any doctor relying on it, to prove it is safe and accurate here before it touches a real patient."}]}</script><script>(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const KEY='mpshah-companion-v2';
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
S=Object.assign({decks:{},sort:{},sim:{},notes:[],ctx:null,mq:0,si:0,yi:0,cap:'Fact',seg:'d'},S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1700)}
const ymd=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysTo=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(ymd()+'T00:00:00'))/864e5);
const first=s=>{const i=s.indexOf('. ');return (i>20&&i<200?s.slice(0,i+1):s)};
const chip=s=>s.replace(/\s*\([^)]*\)\s*$/,'');
// briefs
function brief(k,i){if(k==='p'){const p=D.people[i];return {k,i,n:p.n,em:p.i,sub:p.r,know:p.know,ask:p.ask,listen:p.listen,avoid:p.avoid,lead:''}}
 const x=D.depts[i];return {k,i,n:x.n,em:D.icons[i],sub:x.what,know:x.ev.slice(0,3).map(first),ask:x.q,listen:x.listen.slice(0,3).map(chip),avoid:x.red,lead:x.lead}}
function copyText(t,ok){const f=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(ok)}catch(e){toast('Select and copy manually')}ta.remove()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast(ok),f);else f()}
const NAVS=[['','🏠','Home'],['prep','🗂️','Prepare'],['meet','🎙️','Meeting'],['learn','📖','Learn'],['practice','🎯','Practice']];
const top=(t,back)=>`<header class="top"><div>${back?`<button class="back" data-go="${back}">‹ Back</button>`:''}<h1>${t}</h1></div><div style="display:flex;gap:8px"><button class="iconbtn" data-go="find" aria-label="Search">🔍</button><button class="iconbtn" data-act="settings" aria-label="Settings">⚙️</button></div></header>`;
const V={};
V.home=()=>{let n=daysTo('2026-10-12'),l='days to the remote week';if(n<=0){n=daysTo('2026-10-21');l='days to Nairobi'}if(n<=0){n=Math.max(0,daysTo('2026-11-15'));l='days left in discovery'}
 const nd=D.decks.findIndex((d,i)=>!S.decks[i]||!S.decks[i].done);const di=nd<0?0:nd;const dk=D.decks[di];const done=Object.values(S.decks).filter(x=>x.done).length;
 return `${top('Hi Bhavesh')}<div class="count"><b>${n}</b> ${l}</div>
 <button class="today" data-go="deck/${di}/0"><small>${nd<0?'All lessons done. Revisit one':'Your 5 minutes today'}</small><h3>${esc(dk.t)}</h3><span class="go">Start</span></button>
 <div class="tiles">
 <button class="tile t-teal" data-go="prep"><span class="em">🗂️</span><div><b>Prepare</b><span>Before you walk into a room</span></div></button>
 <button class="tile t-indigo" data-go="meet"><span class="em">🎙️</span><div><b>Meeting</b><span>Questions and quick notes, live</span></div></button>
 <button class="tile t-amber" data-go="learn"><span class="em">📖</span><div><b>Learn</b><span>${done} of ${D.decks.length} lessons done</span></div></button>
 <button class="tile t-violet" data-go="practice"><span class="em">🎯</span><div><b>Practice</b><span>Rehearse the hard moments</span></div></button></div>
 <button class="search" data-go="find">🔍 Look up a term, department or person</button>`};
V.prep=()=>{const seg=S.seg;
 const items=seg==='p'?D.people.map((p,i)=>`<button class="pick" data-go="brief/p/${i}"><span class="em">${p.i}</span><b>${esc(p.n)}</b><span>${esc(p.r)}</span></button>`):D.depts.map((x,i)=>`<button class="pick" data-go="brief/d/${i}"><span class="em">${D.icons[i]}</span><b>${esc(x.n)}</b></button>`);
 return `${top('Prepare')}<p class="muted">Who are you meeting? Pick one and get a two-minute brief.</p><div class="seg"><button data-act="seg" data-v="d" class="${seg!=='p'?'on':''}">Departments</button><button data-act="seg" data-v="p" class="${seg==='p'?'on':''}">People</button></div><div class="grid g3">${items.join('')}</div>`};
V.brief=(k,i)=>{const b=brief(k,+i);
 return `${top('',  'prep')}<div class="bhead"><span class="em">${b.em}</span><div><h1>${esc(b.n)}</h1><span class="muted">${esc(b.sub.length>110?b.sub.slice(0,108)+'...':b.sub)}</span></div></div>
 <div class="card"><div class="lbl">💡 Know before you go</div><ul class="know" style="padding-left:18px;margin:0">${b.know.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
 <div class="card"><div class="lbl">❓ Ask these first</div><ol class="ask">${b.ask.slice(0,5).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
 <div class="card"><div class="lbl">👂 Listen for</div><div class="chips">${b.listen.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>
 <div class="avoid"><div class="lbl">⛔ Avoid</div>${b.avoid.map(x=>`<p style="margin:0 0 4px">${esc(x)}</p>`).join('')}</div>
 ${b.lead?`<p class="muted">From our side: ${esc(b.lead)}</p>`:''}
 <button class="cta" data-act="startmeet" data-k="${k}" data-i="${i}">Start a meeting with this</button>`};
V.meet=()=>{const c=S.ctx;const b=c?brief(c.k,c.i):null;const qs=b?b.ask:['Can you walk me through how this works today?','Where does it slow down or break?','How often does that happen, and what does it cost?','Which system supports this, and where is the data?','What has already been tried?','Who would need to approve a change?'];
 const qi=Math.min(S.mq,qs.length-1);const sess=c?b.n:'General';const notes=S.notes.filter(n=>n.s===sess);
 const caps=[['Fact','📌'],['Action','✅'],['Question','❓'],['Decision','⚖️']];
 return `${top('Meeting')}<div class="row" style="align-items:center;margin-bottom:12px"><div style="flex:3"><span class="muted" style="font-size:.85rem">Meeting with</span><br><b>${b?b.em+' '+esc(b.n):'Anyone (general questions)'}</b></div><button class="cta ghost" style="flex:1;padding:10px;font-size:.9rem" data-go="prep">Change</button></div>
 <div class="askbig"><div><span style="opacity:.8;font-size:.85rem;font-weight:700">Ask next</span><div class="q">${esc(qs[qi])}</div></div><div class="nav"><button data-act="mq" data-d="-1" ${qi===0?'disabled style="opacity:.4"':''}>Previous</button><span style="font-size:.85rem;opacity:.85">${qi+1} of ${qs.length}</span><button data-act="mq" data-d="1" ${qi===qs.length-1?'disabled style="opacity:.4"':''}>Next</button></div></div>
 ${b?`<div class="card" style="margin-top:12px"><div class="lbl">👂 Listen for</div><div class="chips">${b.listen.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`:''}
 <h2>Capture what you hear</h2><div class="cap">${caps.map(([t,e])=>`<button data-act="cap" data-t="${t}" class="${S.cap===t?'on':''}"><span class="em">${e}</span>${t}</button>`).join('')}</div>
 <textarea id="nt" placeholder="${S.cap==='Action'?'Who does what, by when?':'What did you hear?'}"></textarea><button class="cta teal" style="margin-top:10px" data-act="savenote">Save ${S.cap.toLowerCase()}</button>
 ${notes.length?`<h2>Your notes (${notes.length})</h2><div class="card">${notes.slice().reverse().map(n=>`<div class="note"><span class="tag">${n.t}</span><span>${esc(n.x)}</span><button class="del" data-act="delnote" data-id="${n.id}" aria-label="Delete">✕</button></div>`).join('')}</div><div class="row"><button class="cta" data-act="recap">Copy as recap</button><button class="cta ghost" data-act="clearnotes">Clear</button></div>`:''}`};
const ring=(p,col)=>`<svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="var(--${col})" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(p*94.2).toFixed(1)} 100" ${p<=0?'opacity="0"':''} transform="rotate(-90 18 18)"/>${p>=1?'<text x="18" y="23" text-anchor="middle" font-size="14" fill="var(--green)">✓</text>':''}</svg>`;
V.learn=()=>`${top('Learn')}<p class="muted">Five minutes each. Swipe through, then answer one question.</p>${D.decks.map((d,i)=>{const st=S.decks[i]||{};const p=st.done?1:(st.max||0)/d.s.length;return `<button class="deck" data-go="deck/${i}/${st.done?0:(st.max||0)}">${ring(p,d.c==='red'?'red':d.c)}<div><b>${esc(d.t)}</b><span>${d.s.length} cards${st.done?', done':''}</span></div></button>`}).join('')}`;
V.deck=(i,s)=>{i=+i;s=+s||0;const d=D.decks[i];if(!d)return V.learn();s=Math.min(s,d.s.length-1);const st=S.decks[i]=S.decks[i]||{};st.max=Math.max(st.max||0,s);if(s===d.s.length-1)st.done=true;save();const c=d.s[s];
 const body=c.q?`<h3>Your turn</h3><p>${esc(c.q)}</p><button class="tipbtn" data-act="tip">Show a good answer</button><div class="tip" id="tip" hidden>${esc(c.tip)}</div>`:`${c.big?`<div class="big">${esc(c.big)}</div>`:''}<h3>${esc(c.t)}</h3><p>${esc(c.x)}</p>`;
 return `${top(esc(d.t),'learn')}<div class="slide c-${d.c}"><div class="bars">${d.s.map((_,k)=>`<i class="${k<=s?'on':''}"></i>`).join('')}</div>${body}</div>
 <div class="slidenav"><button class="cta ghost" data-go="deck/${i}/${s-1}" ${s===0?'disabled style="opacity:.4"':''}>Back</button>${s<d.s.length-1?`<button class="cta" data-go="deck/${i}/${s+1}">Next</button>`:`<button class="cta teal" data-go="${i<D.decks.length-1?'deck/'+(i+1)+'/0':'learn'}">${i<D.decks.length-1?'Next lesson':'All lessons'}</button>`}</div>`};
V.practice=()=>{const sr=Object.keys(S.sort).length;
 return `${top('Practice')}<p class="muted">Rehearse the moments that matter before they happen.</p>
 <button class="pcard t-indigo" data-go="sims"><span class="em">💬</span><div><b>Conversation simulator</b><span>${D.sims.length} real situations. Pick what you would say, get feedback.</span></div></button>
 <button class="pcard t-violet" data-go="sort"><span class="em">🤖</span><div><b>Is it really AI?</b><span>${sr} of ${D.sort.length} answered. Stop reaching for AI by reflex.</span></div></button>
 <button class="pcard t-amber" data-go="say"><span class="em">🗣️</span><div><b>What would you say?</b><span>Tricky questions and how to answer them well.</span></div></button>`};
V.sims=()=>`${top('Simulator','practice')}<p class="muted">Client responses are practice, not MP Shah facts.</p>${D.sims.map((s,i)=>`<button class="deck" data-act="simstart" data-i="${i}"><span style="font-size:1.6rem">💬</span><div><b>${esc(s.title)}</b><span>${S.sim[s.id]!=null?'Best score '+S.sim[s.id]:esc(s.intro)}</span></div></button>`).join('')}`;
V.sim=()=>{const st=S.simState;if(!st)return V.sims();const sc=D.sims[st.i],nd=sc.nodes[st.at];
 const hist=st.h.map(h=>`<div class="bubble"><small>${esc(h.s)}</small>${esc(h.q)}</div><div class="me">${esc(h.t)}</div><div class="fb ${h.p===2?'good':h.p===1?'mid':'bad'}" style="margin:0 0 14px">${h.p===2?'👍 ':h.p===1?'👌 ':'⚠️ '}${esc(h.f)}</div>`).join('');
 if(nd.end){const sc2=st.h.reduce((a,h)=>a+h.p,0),mx=st.h.length*2;if(S.sim[sc.id]==null||sc2>S.sim[sc.id]){S.sim[sc.id]=sc2;save()}
  return `${top('Simulator','sims')}<h2 style="margin-top:0">${esc(sc.title)}</h2>${hist}<div class="card" style="text-align:center"><div style="font-size:2.4rem;font-weight:800;color:var(--teal)">${sc2} / ${mx}</div><p>${sc2>=mx-1?'Strong. You stayed on the problem and routed work to the right owner.':'Look at the ⚠️ moments: usually a solution too early, or a commitment beyond your role.'}</p></div><div class="row"><button class="cta" data-act="simstart" data-i="${st.i}">Try again</button><button class="cta ghost" data-go="sims">Other situations</button></div>`}
 return `${top('Simulator','sims')}<h2 style="margin-top:0">${esc(sc.title)}</h2><p class="muted">${esc(sc.intro)}</p>${hist}<div class="bubble"><small>${esc(nd.s)}</small>${esc(nd.q)}</div><div class="lbl">What do you say?</div><div class="opts">${nd.c.map((c,k)=>`<button data-act="simpick" data-k="${k}">${esc(c.t)}</button>`).join('')}</div>`};
V.sort=()=>{const i=Math.min(S.si,D.sort.length-1),c=D.sort[i],a=S.sort[i];const right=Object.entries(S.sort).filter(([k,v])=>D.sort[k].a===v).length,done=Object.keys(S.sort).length;
 if(done===D.sort.length&&S.si>=D.sort.length)return `${top('Is it really AI?','practice')}<div class="card" style="text-align:center"><div style="font-size:2.6rem;font-weight:800;color:var(--violet)">${right} / ${D.sort.length}</div><p>Notice how few problems actually needed AI.</p></div><button class="cta" data-act="sortreset">Play again</button>`;
 return `${top('Is it really AI?','practice')}<div class="meter"><i style="width:${done/D.sort.length*100}%"></i></div><p class="muted">${i+1} of ${D.sort.length}. What is the best fix?</p>
 <div class="qcard"><div class="q">${esc(c.x)}</div><div class="opts">${D.buckets.map(b=>`<button data-act="sortpick" data-b="${esc(b)}" class="${a?(b===c.a?'right':b===a?'wrong':''):''}" ${a?'disabled':''}>${esc(b)}</button>`).join('')}</div>${a?`<div class="fb ${a===c.a?'good':'bad'}">${a===c.a?'👍 Right. ':'Best fit: '+esc(c.a)+'. '}${esc(c.w)}</div>`:''}</div>
 ${a?`<button class="cta" data-act="sortnext">${i<D.sort.length-1?'Next problem':'See my score'}</button>`:''}`};
V.say=()=>{const L=D.sayAll,i=((S.yi%L.length)+L.length)%L.length,c=L[i];
 return `${top('What would you say?','practice')}<p class="muted">${i+1} of ${L.length}. Think of your answer first, then reveal.</p><div class="qcard say"><div class="q">${esc(c.s)}</div><button class="cta ghost" data-act="sayshow" id="sbtn">Show the answer</button><div id="sans" hidden>${c.no?`<div class="no"><b>Avoid:</b> ${esc(c.no)}</div>`:''}<div class="yes"><b>Say:</b> ${esc(c.yes)}</div></div></div>
 <div class="row"><button class="cta ghost" data-act="say" data-d="-1">Previous</button><button class="cta" data-act="say" data-d="1">Next</button></div>`};
V.find=()=>`${top('Look up','')}<input type="search" id="q" placeholder="Try: PACS, discharge, Shiraz, price" value="${esc(S.q||'')}" autofocus><div id="res" style="margin-top:12px">${results(S.q||'')}</div>`;
function results(q){q=q.trim().toLowerCase();if(q.length<2)return '<p class="muted">Search glossary terms, departments, people, lessons and phrases.</p>';
 const out=[];const m=s=>String(s).toLowerCase().includes(q);
 D.people.forEach((p,i)=>{if(m(p.n)||m(p.r))out.push(`<button class="res" data-go="brief/p/${i}"><small>Person</small><br><b>${p.i} ${esc(p.n)}</b><br><span class="muted">${esc(p.r)}</span></button>`)});
 D.depts.forEach((x,i)=>{if(m(x.n)||m(x.what))out.push(`<button class="res" data-go="brief/d/${i}"><small>Department</small><br><b>${D.icons[i]} ${esc(x.n)}</b></button>`)});
 D.decks.forEach((d,i)=>{if(m(d.t)||d.s.some(s=>m((s.t||'')+(s.x||'')+(s.q||''))))out.push(`<button class="res" data-go="deck/${i}/0"><small>Lesson</small><br><b>📖 ${esc(d.t)}</b></button>`)});
 D.gloss.forEach(g=>{if(m(g[0])||m(g[1]))out.push(`<div class="res" style="cursor:default"><small>Term</small><br><b>${esc(g[0])}</b><br>${esc(g[1])}</div>`)});
 D.sayAll.forEach((c,i)=>{if(m(c.s)||m(c.yes))out.push(`<button class="res" data-act="sayjump" data-i="${i}"><small>What to say</small><br><b>🗣️ ${esc(c.s)}</b></button>`)});
 return out.length?out.slice(0,40).join(''):'<p class="muted">Nothing found. Try a shorter word.</p>'}
// router
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');const k=p[0]||'home';let h;
 if(k==='brief')h=V.brief(p[1],p[2]);else if(k==='deck')h=V.deck(p[1],p[2]);else h=(V[k]||V.home)();
 $('#app').innerHTML=h;const navk=({brief:'prep',deck:'learn',sims:'practice',sim:'practice',sort:'practice',say:'practice',find:'none'})[k];const cur=navk!==undefined?navk:(k==='home'?'':k);
 $('#bn').innerHTML=NAVS.map(([r,e,l])=>`<a href="#/${r}" class="${cur===r?'on':''}"><span class="em">${e}</span>${l}</a>`).join('');window.scrollTo(0,0);
 if(k==='find'){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
const go=r=>{const h='#/'+r;if(location.hash===h)route();else location.hash=h};
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!g.disabled){go(g.dataset.go);return}
 const an=e.target.closest('nav.bottom a');if(an&&an.getAttribute('href')===location.hash){e.preventDefault();route();return}
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,d=el.dataset;
 if(a==='seg'){S.seg=d.v;save();route()}
 else if(a==='startmeet'){S.ctx={k:d.k,i:+d.i};S.mq=0;save();go('meet')}
 else if(a==='mq'){S.mq=Math.max(0,S.mq+ +d.d);save();route()}
 else if(a==='cap'){S.cap=d.t;save();const t=$('#nt').value;route();$('#nt').value=t;$('#nt').focus()}
 else if(a==='savenote'){const x=$('#nt').value.trim();if(!x){toast('Type what you heard first');$('#nt').focus();return}const c=S.ctx;S.notes.push({id:Date.now(),t:S.cap,x,s:c?brief(c.k,c.i).n:'General'});save();route();toast(S.cap+' saved')}
 else if(a==='delnote'){S.notes=S.notes.filter(n=>String(n.id)!==d.id);save();route()}
 else if(a==='clearnotes'){if(confirm('Clear the notes for this meeting?')){const c=S.ctx,s=c?brief(c.k,c.i).n:'General';S.notes=S.notes.filter(n=>n.s!==s);save();route()}}
 else if(a==='recap'){const c=S.ctx,s=c?brief(c.k,c.i).n:'General';const ns=S.notes.filter(n=>n.s===s);const grp=t=>{const g=ns.filter(n=>n.t===t);return g.length?`\n${t==='Fact'?'Key points':t+'s'}:\n`+g.map(n=>'- '+n.x).join('\n'):''};copyText(`Recap: ${s}, ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`+grp('Fact')+grp('Decision')+grp('Action')+grp('Question'),'Recap copied')}
 else if(a==='tip'){$('#tip').hidden=false;el.remove()}
 else if(a==='simstart'){const sc=D.sims[+d.i];S.simState={i:+d.i,at:sc.start,h:[]};save();go('sim')}
 else if(a==='simpick'){const st=S.simState,sc=D.sims[st.i],nd=sc.nodes[st.at],c=nd.c[+d.k];st.h.push({s:nd.s,q:nd.q,t:c.t,p:c.p,f:c.f});st.at=c.n;save();route();const ls=document.querySelectorAll('.fb');if(ls.length)ls[ls.length-1].scrollIntoView({block:'center'})}
 else if(a==='sortpick'){S.sort[Math.min(S.si,D.sort.length-1)]=d.b;save();route()}
 else if(a==='sortnext'){S.si++;save();route()}
 else if(a==='sortreset'){S.sort={};S.si=0;save();route()}
 else if(a==='sayshow'){$('#sans').hidden=false;el.remove()}
 else if(a==='say'){S.yi=(S.yi||0)+ +d.d;save();route()}
 else if(a==='sayjump'){S.yi=+d.i;save();go('say')}
 else if(a==='settings'){const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div class="in"><h2 style="margin-top:0">Settings</h2><p class="muted">Your progress and notes stay in this browser. Export a backup to move them to another device.</p><div style="display:grid;gap:10px"><button class="cta ghost" data-act="theme">Switch light / dark</button><button class="cta ghost" data-act="export">Export backup</button><label class="cta ghost" style="cursor:pointer">Import backup<input type="file" id="imp" accept="application/json" hidden></label><button class="cta ghost" data-act="wipe" style="color:var(--red)">Reset everything</button><button class="cta" data-act="closesheet">Done</button></div></div>`;s.addEventListener('click',ev=>{if(ev.target===s)s.remove()});document.body.appendChild(s)}
 else if(a==='closesheet'){const s=$('.sheet');if(s)s.remove()}
 else if(a==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('mpshah-theme',r.dataset.theme)}catch(x){}}
 else if(a==='export'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='mpshah-companion-backup.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup downloaded')}
 else if(a==='wipe'){if(confirm('Reset all progress and notes on this device?')){try{localStorage.removeItem(KEY)}catch(x){}location.hash='#/';location.reload()}}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#res').innerHTML=results(S.q)}});
document.addEventListener('change',e=>{if(e.target.id==='imp'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();toast('Backup imported');const s=$('.sheet');if(s)s.remove();route()}catch(x){toast('That file is not a valid backup')}};r.readAsText(e.target.files[0])}});
document.addEventListener('keydown',e=>{if(location.hash.startsWith('#/deck/')){const p=location.hash.split('/');if(e.key==='ArrowRight')go(`deck/${p[2]}/${+p[3]+1}`);if(e.key==='ArrowLeft'&&+p[3]>0)go(`deck/${p[2]}/${+p[3]-1}`)}});
let tx=null;document.addEventListener('touchstart',e=>{if(e.target.closest('.slide'))tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<50)return;const p=location.hash.split('/');const i=+p[2],s=+p[3],n=D.decks[i].s.length;if(dx<0&&s<n-1)go(`deck/${i}/${s+1}`);if(dx>0&&s>0)go(`deck/${i}/${s-1}`)},{passive:true});
try{const t=localStorage.getItem('mpshah-theme');if(t)document.documentElement.dataset.theme=t}catch(x){}
route();
})();
</script></body></html>
