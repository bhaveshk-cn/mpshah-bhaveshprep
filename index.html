<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#F2F5F8;--card:#fff;--ink:#101828;--muted:#667085;--line:#E4E7EC;--teal:#0E7C70;--tealbg:#E3F4F1;--indigo:#4053D6;--indigobg:#EAEDFC;--amber:#E39A0B;--amberbg:#FEF4DE;--violet:#7A5AF8;--violetbg:#F0EBFF;--red:#D92D20;--redbg:#FDECEA;--green:#12A15F;--greenbg:#E4F7EE;--r:20px;--sh:0 4px 18px rgba(16,24,40,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C111D;--card:#161B26;--ink:#F2F4F7;--muted:#98A2B3;--line:#252C3B;--tealbg:#0F2A27;--indigobg:#1A1F3D;--amberbg:#2E2410;--violetbg:#231B3D;--redbg:#341613;--greenbg:#0F2A1E;--teal:#2EC4B1;--indigo:#8B9BFF;--violet:#A58BFF;--amber:#F5B83D;--red:#FF6B5E;--green:#3DD68C;--sh:none}}
:root[data-theme=dark]{--bg:#0C111D;--card:#161B26;--ink:#F2F4F7;--muted:#98A2B3;--line:#252C3B;--tealbg:#0F2A27;--indigobg:#1A1F3D;--amberbg:#2E2410;--violetbg:#231B3D;--redbg:#341613;--greenbg:#0F2A1E;--teal:#2EC4B1;--indigo:#8B9BFF;--violet:#A58BFF;--amber:#F5B83D;--red:#FF6B5E;--green:#3DD68C;--sh:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.shell{max-width:600px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header.top h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.02em}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;font-size:1.15rem}
.back{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:6px 0;font-size:.95rem}
h2{font-size:1.25rem;font-weight:800;margin:22px 0 10px;letter-spacing:-.01em}
p{margin:0 0 .7em}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
/* home */
.hello{font-size:1.05rem;color:var(--muted);margin:4px 0 2px}
.count{display:inline-flex;align-items:baseline;gap:8px;background:var(--amberbg);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;margin:4px 0 16px}
.count b{font-size:1.15rem;color:var(--amber)}
.today{background:var(--teal);color:#fff;border-radius:24px;padding:22px;cursor:pointer;border:0;width:100%;text-align:left;display:block;margin-bottom:16px}
.today small{opacity:.85;font-weight:600}
.today h3{font-size:1.4rem;margin:6px 0 8px;font-weight:800;line-height:1.2}
.today .go{display:inline-block;background:#fff;color:var(--teal);border-radius:999px;padding:7px 16px;font-weight:800;margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:var(--r);padding:18px 16px;text-align:left;cursor:pointer;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.tile .em{font-size:1.8rem}
.tile b{font-size:1.1rem;font-weight:800;display:block}
.tile span{font-size:.86rem;opacity:.85}
.t-teal{background:var(--tealbg);color:var(--ink)}.t-teal b{color:var(--teal)}
.t-indigo{background:var(--indigobg);color:var(--ink)}.t-indigo b{color:var(--indigo)}
.t-amber{background:var(--amberbg);color:var(--ink)}.t-amber b{color:var(--amber)}
.t-violet{background:var(--violetbg);color:var(--ink)}.t-violet b{color:var(--violet)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);margin:14px 0;cursor:text;border:0;width:100%;text-align:left;color:var(--muted)}
/* segmented */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--sh);margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:480px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.pick{background:var(--card);border:0;border-radius:16px;padding:14px;text-align:left;cursor:pointer;box-shadow:var(--sh);min-height:96px;display:flex;flex-direction:column;gap:6px}
.pick .em{font-size:1.5rem}.pick b{font-size:.95rem;line-height:1.25}.pick span{font-size:.8rem;color:var(--muted)}
/* brief */
.bhead{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.bhead .em{font-size:2.2rem;width:64px;height:64px;border-radius:18px;background:var(--tealbg);display:grid;place-items:center;flex:0 0 auto}
.bhead h1{font-size:1.45rem;margin:0;font-weight:800;line-height:1.2}
.lbl{font-size:.82rem;font-weight:800;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.know li{margin:0 0 8px}
ol.ask{padding-left:0;list-style:none;counter-reset:q;margin:0}
ol.ask li{counter-increment:q;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
ol.ask li:last-child{border:0}
ol.ask li:before{content:counter(q);flex:0 0 28px;height:28px;border-radius:50%;background:var(--indigobg);color:var(--indigo);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--amberbg);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600}
.avoid{background:var(--redbg);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.avoid .lbl{color:var(--red)}
.cta{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--indigo);color:#fff;text-align:center}
.cta.teal{background:var(--teal)}.cta.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.row{display:flex;gap:10px}.row>*{flex:1}
/* meeting */
.askbig{background:var(--indigo);color:#fff;border-radius:24px;padding:24px 22px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
.askbig .q{font-size:1.35rem;font-weight:800;line-height:1.3}
.askbig .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.askbig .nav button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.cap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.cap button{border:0;border-radius:14px;padding:12px 4px;font-weight:800;cursor:pointer;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);box-shadow:var(--sh)}
.cap button .em{font-size:1.3rem}
.cap button.on{background:var(--teal);color:#fff}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);min-height:84px;resize:vertical}
input[type=text],input[type=search],select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.note{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.note:last-child{border:0}
.tag{flex:0 0 auto;font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 7px;height:fit-content;background:var(--tealbg);color:var(--teal)}
.del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem}
/* learn */
.deck{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:10px;width:100%;text-align:left;cursor:pointer}
.ring{width:46px;height:46px;flex:0 0 auto}
.deck b{display:block;font-size:1rem}.deck span{font-size:.82rem;color:var(--muted)}
.slide{border-radius:28px;padding:30px 24px;min-height:min(62vh,520px);display:flex;flex-direction:column;justify-content:center;color:#fff;position:relative}
.c-teal{background:linear-gradient(160deg,#0E7C70,#0A5B53)}.c-amber{background:linear-gradient(160deg,#C9800A,#A86500)}.c-red{background:linear-gradient(160deg,#C2382D,#9B2219)}.c-indigo{background:linear-gradient(160deg,#4053D6,#2C3BA8)}.c-violet{background:linear-gradient(160deg,#7A5AF8,#5839D1)}
.bars{display:flex;gap:4px;position:absolute;top:16px;left:20px;right:20px}
.bars i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}.bars i.on{background:#fff}
.slide .big{font-size:clamp(3rem,14vw,4.6rem);font-weight:800;line-height:1;margin-bottom:12px;letter-spacing:-.03em}
.slide h3{font-size:1.6rem;font-weight:800;line-height:1.2;margin:0 0 12px}
.slide p{font-size:1.15rem;line-height:1.5;opacity:.95;margin:0}
.slide .tipbtn{margin-top:20px;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;align-self:flex-start}
.slide .tip{margin-top:18px;background:rgba(255,255,255,.16);border-radius:16px;padding:14px 16px;font-size:1.05rem}
.slidenav{display:flex;gap:10px;margin-top:14px}
.slidenav button{flex:1}
/* practice */
.pcard{display:flex;gap:14px;align-items:center;border:0;border-radius:var(--r);padding:18px;width:100%;text-align:left;cursor:pointer;margin-bottom:12px}
.pcard .em{font-size:2rem}.pcard b{font-size:1.1rem;display:block}.pcard span{font-size:.88rem;color:var(--muted)}
.qcard{background:var(--card);border-radius:24px;padding:24px 20px;box-shadow:var(--sh);margin-bottom:14px}
.qcard .q{font-size:1.25rem;font-weight:800;line-height:1.35;margin-bottom:18px}
.opts{display:grid;gap:8px}
.opts button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-weight:700;cursor:pointer;text-align:left}
.opts button.right{border-color:var(--green);background:var(--greenbg)}.opts button.wrong{border-color:var(--red);background:var(--redbg)}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:.95rem}
.fb.good{background:var(--greenbg)}.fb.bad{background:var(--redbg)}.fb.mid{background:var(--amberbg)}
.bubble{background:var(--indigobg);border-radius:18px 18px 18px 6px;padding:14px 16px;margin:0 0 14px}
.bubble small{display:block;font-weight:800;color:var(--indigo);margin-bottom:4px}
.me{background:var(--tealbg);border-radius:18px 18px 6px 18px;padding:12px 16px;margin:0 0 6px 30px;font-weight:600}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 14px}.meter i{display:block;height:100%;background:var(--teal)}
.say .no,.say .yes{border-radius:14px;padding:12px 14px;margin-top:10px}
.say .no{background:var(--redbg)}.say .yes{background:var(--greenbg)}
/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.bottom .in{display:flex;max-width:600px;width:100%}
nav.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;padding:6px 0;border-radius:12px}
nav.bottom a .em{display:block;font-size:1.3rem;line-height:1.3;filter:grayscale(1);opacity:.7}
nav.bottom a.on{color:var(--teal)}nav.bottom a.on .em{filter:none;opacity:1}
/* search results */
.res{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);border:0;width:100%;text-align:left;cursor:pointer;display:block}
.res small{color:var(--muted);font-weight:700;font-size:.75rem}
.sheet{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;font-size:.9rem}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.steps{position:relative;margin:0;padding:0;list-style:none}
.steps li{position:relative;padding:0 0 16px 44px}
.steps li:before{content:attr(data-n);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.steps li:after{content:'';position:absolute;left:14px;top:32px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child:after{display:none}
.steps b{display:block;font-size:1rem}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;margin:4px 6px 0 0;background:var(--indigobg);color:var(--indigo)}
.pill.sys{background:var(--tealbg);color:var(--teal)}
.pill.v{background:var(--violetbg);color:var(--violet)}
.analogy{font-size:1.15rem;line-height:1.5;font-weight:600}
.term{display:block;width:100%;text-align:left;border:0;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.term b{font-size:1rem}.term span{display:block;color:var(--muted);margin-top:4px}
.term .hint{color:var(--teal);font-size:.8rem;font-weight:700}
.opp{border-left:4px solid var(--violet);padding:8px 12px;margin-bottom:10px;background:var(--bg);border-radius:0 12px 12px 0}
.ev{font-size:.95rem;margin-bottom:8px;padding-left:12px;border-left:3px solid var(--amber)}
.secnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--card);font-size:.75rem;font-weight:800;margin-right:4px}
.done-badge{position:absolute;top:10px;right:12px;font-size:1rem}
.pick{position:relative}
.trackbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.trackbar i{display:block;height:100%;background:var(--teal)}
.concept h3{font-size:.85rem;font-weight:800;color:var(--muted);margin:0 0 6px;text-transform:none}
.mq{margin-top:14px}
.mq .q{font-weight:800;margin-bottom:10px}
.tile.wide{grid-column:1/-1;min-height:110px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.jump{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin-bottom:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--bg);z-index:4}
.jump button{flex:0 0 auto;border:0;background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--ink)}
.src{margin-bottom:14px}.src:last-child{margin-bottom:0}
.src .h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;margin-bottom:6px}
.src ul{margin:0;padding-left:18px}.src li{margin-bottom:5px;font-size:.95rem}
.badge{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px}
.b-str{background:var(--tealbg);color:var(--teal)}.b-gap{background:var(--indigobg);color:var(--indigo)}.b-said{background:var(--violetbg);color:var(--violet)}.b-kz{background:var(--amberbg);color:var(--amber)}
.roles div{padding:8px 0;border-bottom:1px solid var(--line)}.roles div:last-child{border:0}
.roles b{display:block}.roles span{color:var(--muted);font-size:.92rem}
.deep{font-size:1.02rem;line-height:1.65}
.kpi{display:inline-block;background:var(--bg);border-radius:10px;padding:6px 10px;margin:0 6px 6px 0;font-size:.88rem;font-weight:600}
.card[id]{scroll-margin-top:140px}
.para{margin:0 0 12px;line-height:1.65}.para:last-child{margin:0}
.sub{padding:8px 0;border-bottom:1px solid var(--line)}.sub:last-child{border:0}.sub b{display:block}.sub span{color:var(--muted);font-size:.92rem}
details.proc{background:var(--bg);border-radius:12px;padding:10px 14px;margin-bottom:8px}
details.proc summary{font-weight:800;cursor:pointer}
details.proc ol{margin:10px 0 2px;padding-left:20px}details.proc li{margin-bottom:5px}
.aiuse{border-left:4px solid var(--teal);background:var(--bg);border-radius:0 12px 12px 0;padding:8px 12px;margin-bottom:8px}
.aiuse .c{color:var(--amber);font-size:.85rem;font-weight:700;margin-top:4px}
.gl{background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:6px;box-shadow:var(--sh)}
.gl b{display:block}.gl span{color:var(--muted);font-size:.92rem}.gl small{color:var(--teal);font-weight:700;font-size:.72rem}
.chipsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.chipsel button{flex:0 0 auto;border:0;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.8rem;background:var(--card);box-shadow:var(--sh);cursor:pointer;color:var(--ink)}
.chipsel button.on{background:var(--teal);color:#fff}

o 62 tracked actions with owners; 18 quick wins to close within a quarter.","Customer-centric KPIs missing from daily boards; add CSAT, stock-out and post-visit booking KPIs (52 to 56).","Post-visit follow-up has no dedicated owner (49)."],"opp":[["Digital Kaizen board and KPI dashboards","Analytics","Directly supports existing culture"],["Automated post-visit follow-up","Automation, possibly conversational AI","Strategy and Kaizen both call for it"]],"q":["Which Kaizen actions are closed, and which are stuck?","Where do KPI numbers come from today?","Who owns post-visit follow-up now?"],"listen":["\"We count it manually for the board\""],"red":["Ignoring the Kaizen work. Build on it visibly."],"lead":"Virender; you (relationship with quality team)"}],"lessons":[{"a":"Think of an airline call centre: the first voice a customer hears decides whether they trust the airline before they ever fly.","why":"If patients cannot get through, they go to another hospital. Every visit starts here.","steps":[["Call arrives","Telephony system","Queue or IVR"],["Agent answers and identifies the need","Contact centre agent","KATi"],["Book, confirm, transfer or answer","Agent","Scheduling in Kranium/Hospedia"],["Log the call and close","Agent","KATi"],["Peak hours monitored","Supervisor","Reports"]],"terms":[["SLA","Service level: % of calls answered within a target time, e.g. 10 seconds"],["Abandonment","Caller hangs up before being answered"],["Deflection","Handling a call without an agent, e.g. self-service or IVR"],["IVR","Interactive Voice Response: \"press 1 for appointments\""],["First-call resolution","Problem solved in one call"],["ACD","Automatic Call Distribution: routes calls to available agents"],["AHT","Average Handle Time: talk plus after-call work"],["ASA","Average Speed of Answer"],["Occupancy","Share of time agents spend handling contacts"],["Omnichannel","Voice, chat, email and messaging handled in one view"],["Callback","The system calls the patient back instead of holding"],["Wallboard","Screen showing live queue statistics"],["Workforce management","Forecasting and rostering agents to demand"]],"wrong":["Too few agents at peak hours","Agents spend time on simple transfers","Bookings made by phone are not visible at the front desk"],"quiz":[{"q":"A quarter of calls are transfers to other departments. The simplest fix is usually:","o":["An AI voice bot","An IVR menu or directory","Hiring more agents"],"a":1,"w":"Transfers follow a known list of destinations. Simple routing solves most of it."},{"q":"\"Call SLA 68.9%\" means:","o":["68.9% of calls were answered within the target time","68.9% of callers were satisfied","68.9% of calls were bookings"],"a":0,"w":"SLA measures speed of answer against a target."},{"q":"Before automating bookings, you must check:","o":["The colour of the website","Whether the schedule shows real consultant availability","How many agents speak Swahili"],"a":1,"w":"Automating bookings into an unreliable schedule just moves the frustration."},{"q":"In the Hospedia contract, the patient mobile app falls in:","o":["Phase 1","Phase 2"],"a":1,"w":"Shiraz said it was pushed to Phase 2 for customisation."},{"q":"Which strategy pillar does better phone and digital access serve most directly?","o":["Patient-Centric Care","Financial resilience only"],"a":0,"w":"It names digital appointment and communication channels."},{"q":"ASA stands for:","o":["Average Speed of Answer","Automatic Service Agent"],"a":0,"w":"Time to answer."},{"q":"Rostering on daily averages usually fails because:","o":["Demand peaks by hour","Agents prefer averages"],"a":0,"w":"Peaks drive abandonment."},{"q":"A results enquiry should never:","o":["Read sensitive results over the phone","Verify identity"],"a":0,"w":"Privacy."},{"q":"Most contact centre problems often originate in:","o":["Scheduling and data elsewhere in the hospital","The phone handsets"],"a":0,"w":"Root causes are upstream."},{"q":"Omnichannel means:","o":["Voice, chat, email and messaging handled together","Only phone calls"],"a":0,"w":"One view of all channels."}],"roles":[["Contact centre agent","Answers calls, books and confirms appointments, transfers callers, answers pricing and timing questions"],["Contact centre supervisor","Rosters agents, watches call volumes and service levels, handles escalations"],["Customer care desk","Walk-in queries, complaints and general information"],["Marketing / digital team","Website, mobile app content, campaigns that drive calls"]],"data":["Call volumes by hour and reason","Answer times, abandoned calls, call duration","Appointments booked, rescheduled, cancelled","Caller identity and contact details","Complaints and feedback logged"],"strat":["Patient-Centric Care pillar: \"Expanding digital appointment, communication and virtual-care channels\"","HEAL value Accessible: quality care available through physical and digital channels","Differentiation through \"speed at every major patient touchpoint\" and convenient digital access"],"hosp":["Customer Care Help Desk: doctor details and OPD schedule, insurance company details, estimate billing, intercom directory, nursing staff details","Patient engagement via SMS and email alerts","Integration with the hospital website for OPD booking","Patient mobile app (Phase 2): appointments, family profiles, packages, M-Pesa payments, reports and bills"],"gap":["Mobile app: appointment booking, self-registration and payment, reminders, virtual ticketing with geolocation (licence only)","Appointments bookable for doctors, clinics, departments and also modalities such as CT and MRI","Automatic SMS and email reminders when an appointment is booked, rescheduled or cancelled","Next-day appointment lists sent automatically to the doctor or clinic","Web portal for patient self-registration and self-payment"],"said":["Shiraz wants the roadmap to include digital channels and telemedicine, not only AI","The patient app is pushed to Hospedia Phase 2 because standard apps did not meet MP Shah requirements","A UK vendor recently pitched AI voice and conversational solutions to MP Shah"],"kz":["Call SLA 68.9% vs 90% target; around 25% at 10:00 peak (Kaizen).","59% of 7,333 analysed calls deflectable: transfers 24%, bookings 20%, confirmations 6%, pricing 5%, timings 4% (Kaizen)."],"deep":["A hospital contact centre is the front door for most patients before they ever arrive. It handles inbound calls (bookings, confirmations, enquiries about doctors, prices, insurance acceptance and results), outbound calls (reminders, follow-ups, recalls for reviews) and increasingly digital channels such as WhatsApp, web chat, email and social media messages. In larger hospitals it is run like a service operation, with targets for answer speed, abandonment and first-contact resolution.","Demand is uneven. Volumes spike on Monday mornings, after public holidays, at clinic opening times and when results are due. If staffing is planned on averages, the centre fails exactly when most patients call. Good centres forecast volume by hour, roster to the forecast, and route calls by type so specialist questions (insurance, pricing) reach trained agents.","The contact centre depends on other systems being accurate. If doctor schedules in the HIS are wrong, agents book slots that will not be honoured. If price lists are out of date, agents give wrong quotes. Many contact centre problems are really scheduling, data or ownership problems further inside the hospital.","Digital channels change the model. Self-service booking, automated confirmations, WhatsApp bots and IVR menus can take routine work away from agents, but only when the underlying data is reliable and there is always a clear route to a human."],"subs":[["Inbound voice","Calls from patients, families, referring doctors and corporates"],["Outbound","Reminders, confirmations, follow-up and recall calls"],["Digital desk","WhatsApp, web chat, email and social media enquiries"],["Corporate and insurance rivacy controls"],["Demand forecasting","Predicts call volume by hour for rostering","Simple models often enough"]]},{"a":"Like a hotel check-in desk: it creates your guest record, takes payment details and gives you a key card. Get the details wrong here and every later step suffers.","why":"The patient record created here follows the patient everywhere. Bad data here becomes rejected claims later.","steps":[["Patient takes a queue ticket","Patient","QMS"],["New patient registered or old record found","Front desk","Kranium / Hospedia"],["Payer details captured: insurer, scheme, member number","Front desk","HIS"],["UHID and card issued","Front desk","HIS"],["Patient directed to triage or billing","Front desk","QMS"]],"terms":[["UHID","Unique Health ID: one number per patient"],["MPI","Master Patient Index: the list that prevents duplicate patients"],["Scheme","The specific insurance plan a patient is covered under"],["QMS","Queue Management System: tickets and screens"],["Walk-in","Patient without an appointment"],["MRN","Medical Record Number, often used like UHID"],["Demographics","Basic identity data about the patient"],["Eligibility check","Confirming the patient is covered by the insurer"],["Next of kin","Emergency contact recorded at registration"],["OTP","One-time password to verify a phone number"],["Pre-registration","Patient enters details before arrival"],["Token","Queue number issued to a patient"],["Record merge","Combining duplicate patient records under audit"]],"wrong":["Duplicate patient records","Wrong insurer or scheme selected","Free-text fields create messy data","Patients lose track of where to go next"],"quiz":[{"q":"A clerk picks the wrong insurance scheme. When does it usually hurt?","o":["Immediately at the desk","When the insurer rejects the claim weeks later","Never, insurers fix it"],"a":1,"w":"Errors at registration travel down the revenue cycle and surface as rejections."},{"q":"Why do duplicate patient records matter?","o":["They waste disk space","Doctors may miss history, and reports count patients twice","They slow down the internet"],"a":1,"w":"Duplicates are a safety risk and break analytics."},{"q":"Fixing duplicates is mainly:","o":["An AI problem","A process and validation problem","A hardware problem"],"a":1,"w":"Validation rules and discipline at registration come first."},{"q":"Why does the gap register ask for a 10-digit phone validation?","o":["To stop bad contact data entering at source","To speed up the network"],"a":0,"w":"Data quality is cheapest to fix at registration."},{"q":"Hospedia queue management is in:","o":["Phase 1","Phase 2"],"a":1,"w":"Shiraz said QMS moved to Phase 2."},{"q":"The first step before creating a new record is:","o":["Search for an existing record","Print the card"],"a":0,"w":"Avoid duplicates."},{"q":"A duplicate record is mainly a:","o":["Safety and data risk","Printing issue"],"a":0,"w":"Split history."},{"q":"Pre-registration moves work:","o":["Before arrival, to the patient","To the doctor"],"a":0,"w":"Less front desk time."},{"q":"Eligibility check confirms:","o":["The patient is covered","The patient is ill"],"a":0,"w":"Insurance."},{"q":"Record merges must be:","o":["Controlled and audited","Done by any clerk freely"],"a":0,"w":"Safety."}],"roles":[["Front desk / registration clerk","Creates or retrieves patient records, captures insurance and scheme details, issues cards"],["Cashier","Takes deposits or payments, often next to registration"],["Customer care / greeter","Guides patients to the next step"],["Triage nurse","May capture basic details before registration in emergencies"]],"data":["Patient demographics, photo, biometrics","UHID and hospital card number","Insurer, scheme, member number, SHIF number","National ID and phone number","Queue ticket times and service points"],"strat":["Strategy: \"integrated patient identification\" across all locations of a hub-and-spoke network","Data and Digitisation: \"improving data quality, ownership and  A wrong phone number means results, reminders and follow-ups never reach the patient.","Queue management sits beside registration. Tokens are issued, displayed and called at each service point. Modern queue systems use one token for the whole visit so the hospital can measure waiting at each step and patients always know where they are.","Leading hospitals move registration earlier: patients pre-register online, verify phone numbers by OTP and upload insurance cards before arrival, so the front desk only confirms."],"subs":[["Front office","Registration, enquiries, card printing"],["Insurance verification desk","Checks cover and scheme rules"],["Queue management","Token issue, display, calling"],["Admissions desk","Inpatient registration and bed allocation"]],"equip":["HIS registration screens","ID and insurance card scanners","Biometric readers and webcams","Queue kiosks and display screens","Card and wristband printers"],"procs":[{"t":"Registering a new insured patient","s":["Search the patient index by name, phone and ID to avoid duplicates","Capture demographics with validated fields","Capture insurer, scheme and member number; verify eligibility","Issue UHID and card; take photo or biometrics","Explain the next step and issue a queue token"]},{"t":"Merging duplicate records","s":["Identify suspected duplicates by matching rules","Confirm with documents that they are the same person","Merge under a controlled, audited process","Notify departments whose records were linked to the old number"]}],"ke":["National ID and SHA/SHIF numbers are key identifiers","Many patients use mobile money and phone numbers as primary contact","Corporate schemes may require employer authorisation letters"],"good":["Duplicate rate kept very low through search-before-create rules","Most fields structured, with validation, not free text","Insurance verified before the patient reaches billing","Single journey token with measured wait per step"],"ai":[["Identity matching","Probabilistic matching to flag likely duplicates","Always confirmed by a person"],["Document capture","Reads ID and insurance cards to pre-fill fields","Accuracy checks needed"],["Queue prediction","Shows expected wait times to patients","Needs reliable timestamps"]]},{"a":"Like a busy GP surgery or a bank's relationship desk: scheduled slots, a professional who listens, decides and refers you onward.","why":"OPD is where most patients meet doctors. Its delays ripple into lab, radiology and pharmacy.","steps":[["Triage: vitals and brief history","Nurse","Triage form"],["Consultation","Doctor","EMR / doctors module"],["Orders: lab, radiology, prescription","Doctor","Order entry"],["Patient goes for tests","Patient","LIS / RIS"],["Review with results","Doctor","EMR"],["Exit, admit or refer","Doctor","HIS"]],"terms":[["OPD","Outpatient department: patients who go home the same day"],["New vs review patient","First visit vs follow-up visit"],["Triage","Initial check of vitals and urgency"],["Order entry","Doctor requests tests or medicines in the system"],["ICD-10","Standard codes for diagnoses, needed for insurance"],["Chief complaint","The main reason the patient came"],["Provisional diagnosis","Working diagnosis pending tests"],["CPOE","Computerised physician order entry"],["Clinic template","Structured note format for a specialty"],["No-show (DNA)","Patient did not attend a booked appointment"],["Consultant session","A block of clinic time for a specialist"],["Referral","Sending a patient to another doctor or service"],["Follow-up interval","When the patient should return"]],"wrong":["Consultants arrive late, so appointments are not honoured","Doctors cannot see previous results easily","Documentation takes time away from patients"],"quiz":[{"q":"Booked patients wait as long as walk-ins. The root cause is most likely:","o":["The QMS screen colour","Consultant availability and scheduling discipline","Lack of AI"],"a":1,"w":"Kaizen named consultant availability as a cause. That is people and process."},{"q":"A doctor says \"I cannot see last year's report\". This points to:","o":["Integration or data access","Doctor training only","Network speed"],"a":0,"w":"Results stored elsewhere or not linked to the record. Route to Arun."},{"q":"An ambient scribe mainly targets:","o":["Billing errors","Documentation time","Parking"],"a":1,"w":"It drafts clinical notes from conversation, reducing documentation burden."},{"q":"\"Doctors can overwrite other doctors' notes\" is a:","o":["Security and audit requirement","Speed requirement"],"a":0,"w":"Clinical records need ownership and audit trails."},{"q":"Elsevier integration was requested for:","o":["Clinical pathways and treatment suggestions","Billing"],"a":0,"w":"Clinical decision support content."},{"q":"CPOE stands for:","o":["Computerised physician order entry","Clinical patient outcome evaluation"],"a":0,"w":"Electronic orders."},{"q":"A provisional diagnosis is:","o":["A working diagnosis pending tests","A final insurer decision"],"a":0,"w":"Working hypothesis."},{"q":"The consultation is usually:","o":["A small part of total visit time","Most of the visit time"],"a":0,"w":"Waiting dominates."},{"q":"DNA in outpatient context means:","o":["Did not attend","A lab test"],"a":0,"w":"No-show."},{"q":"Why code diagnoses in ICD-10?","o":["For insurance, statistics and continuity","For parking"],"a":0,"w":"Standard coding."}],"roles":[["Consultant","Senior specialist doctor; may be employed or a private doctor with admitting rights"],["Medical officer","Doctor handling general consultations and reviews"],["Clinic nurse","Triage, vitals, preparing patients"],["Clinic coordinator","Manages clinic lists and doctor schedules"],["Private doctor","Independent consultant using hospital facilities; Hospedia scope limits their access to their own patients"]],"data":["Vitals and triage observations","History, examination, diagnosis with ICD-10 codes","Orders for lab, radiology and procedures","Prescriptions","Referral letters","Clinical notes and templates by specialty"],"strat":["Clinical Excellence: \"develop internationally recognised specialist services\" and \"strengthen multidisciplinary clinical capabilities\"","Strengths named in the strategy: specialist clinics, orthopaedics, paediatrics, renal care","Data and Digitisation: \"moving toward a coherent digital clinical record\""],"hosp":["OPD Triage: vitals, general observation, past history","OPD Physician Order Entry: history and examination forms, vaccination history, investigation and medicine prescriptions, ICD-10 diagnosis, notes, referrals","Electronic Medical Record: treatment chart, medication and vaccination history, lab and radiology reports, discharge summary"],"gap":["Show all previous lab and radiology reports on one screen","Hyperlink from the clinic waiting screen straight into the patient encounter","Audit log of everyone who viewed a patient encounter","Stop doctors overwriting other doctors' notes","Abnormal observation values highlighted in colour","Restrict writing notes and prescriptions remotely","Augnito voice dictation for doctors; specialty templates (dental, cardiac, ENT)","Integration with Elsevier for clinical pathways and treatment suggestions","Alerts on the OPD queue when lab results are published","Doctor queue showing patients by status, and each patient's waiting time","Private doctors limited to their own inpatients; medico-legal case checkbox"],"said":["Hospedia struggles with voice commands, for example navigating to the examination tab by speaking (Shiraz)","A UK vendor showed MP Shah an AI ambient scribe that structures conversation into fields for the HMIS"],"kz":["Appointments not honoured at the front desk (Kaizen ID 2).","Consultant availability undermines the appointment system (Kaizen ID 16, CMO/DCMO)."],"deep":["The outpatient department handles patients who do not stay overnight. In a tertiary hospital it includes general clinics and many specialty clinics (cardiology, orthopaedics, gynaecology, paediatrics, ENT, dermatology, renal, oncology and more), often run by consultants on set days. Clinics may be run by employed doctors or private consultants who rent rooms and bring their own patients.","A typical visit has many steps: arrival, registration, triage, billing, consultation, orders, diagnostics, review, pharmacy and exit. The consultation itself may be 10 to 20 minutes of a visit lasting several hours. Waiting comes from mismatches between booked slots and doctor availability, sequencing of tests, and payment steps between each service.","Clinical documentation is central. Doctors record history, examination, diagnosis (coded in ICD-10 for insurance), orders and prescriptions. Poor documentation affects safety, continuity and claims. Doctors often find documentation slow and repetitive, which is why voice, templates and assistants are popular.","Outpatient care is where most patient volume and many first impressions happen. It also feeds admissions, diagnostics and pharmacy revenue, so improving flow here affects the whole hospital."],"subs":[["General OPD","First-contact consultations"],["Specialty clinics","Consultant-led specialties"],["Procedure rooms","Minor procedures, dressings, injections"],["Wellness and screening","Health checks and corporate medicals"],["Physiotherapy and allied health","Therapy services that run like clinics"]],"equip":["Consultation rooms with HIS access","Vital signs devices","Clinic scheduling and queue screens","Templates for specialties","Printers or e-prescription workflows"],"procs":[{"t":"A specialist consultation","s":["Triage: vitals, weight, chief complaint","Consultation: history, examination, provisional diagnosis","Orders: lab, imaging, procedures; prescriptions","Patient goes for tests, returns for review","Final diagnosis coded; plan, follow-up booked","Referral letter or admission if needed"]},{"t":"Booking a follow-up","s":["Doctor records follow-up interval","Slot booked before authorisation screen; patient age changing on reprints of old results","Internal decision needed: recognise lab revenue at requisition or at sample collection"],"said":["The current lab system is separate and not integrated with Kranium (reported in patient journey study and confirmed by context)"],"kz":["4 to 5 tests forgotten daily with no alert (Kaizen ID 6).","Lab system and QMS not integrated with Kranium; physicians unaware when reports ready (Kaizen ID 5)."],"deep":["A hospital laboratory performs tests on blood, urine, tissue and other samples. It is divided into sections: haematology (blood counts), clinical chemistry or biochemistry (kidney, liver, sugar, lipids, enzymes), microbiology (cultures, sensitivities), serology and immunology (antibodies, infections), histopathology and cytology (tissue and cells), and the blood bank (transfusion).","The lab process has three phases: pre-analytical (ordering, collection, labelling, transport), analytical (running the test, quality control) and post-analytical (validation, authorisation, reporting, notification). Most errors happen in the pre-analytical phase: wrong patient, wrong tube, delayed transport, missing request details.","Modern labs connect analysers to the LIS so results flow automatically (bi-directional interfaces receive orders and send results). Without interfaces, results are typed by hand, adding delay and error risk. Labs track turnaround time by test and by stage.","Labs often serve walk-in patients and external referrals as a business line. Quality accreditation and external quality assessment schemes prove reliability."],"subs":[["Haematology","Full blood count, coagulation"],["Biochemistry","Kidney, liver, glucose, lipids, enzymes"],["Microbiology","Cultures, sensitivities, infection"],["Serology and immunology","Antibodies, infectious disease markers"],["Histopathology","Tissue diagnosis by pathologists"],["Blood bank","Donors, grouping, cross-match, issue"]],"equip":["Automated analysers", , MRI, ultrasound"],["PACS","Stores and displays the images"],["RIS","Manages radiology bookings, workflow and reports"],["DICOM","Standard format for medical images"],["Worklist","List of exams sent to a scanner automatically"],["Structured report","Template with fixed sections, easier for analytics and AI"],["Contrast","Substance that makes structures visible"],["Creatinine","Kidney marker checked before contrast"],["Teleradiology","Remote reporting by radiologists elsewhere"],["Addendum","Correction or addition to a signed report"],["MPPS","Modality Performed Procedure Step: scanner reports exam status"],["Dose logging","Recording radiation dose per exam"]],"wrong":["Not enough radiologists for the volume","Patients arrive unprepared","One machine overloaded while others are underused","Reports typed slowly"],"quiz":[{"q":"Non-urgent X-rays are not reported at all. The first fix Kaizen suggested was:","o":["AI fracture detection","A locum tele-radiologist","A new PACS"],"a":1,"w":"A capacity problem first. AI can help prioritise but does not add reporting capacity on its own."},{"q":"Patients arriving without a full bladder is solved by:","o":["Automated preparation reminders","Computer vision","A bigger waiting room"],"a":0,"w":"Rules-based messaging when the exam is booked."},{"q":"For AI that pushes urgent X-rays up the list, the most important metric is:","o":["Recall: catching real urgent cases","Speed of the internet","Number of radiologists"],"a":0,"w":"Missing an urgent case is the dangerous error."},{"q":"Why does radiology want structured report templates?","o":["To enable analytics and AI parsing","To print faster"],"a":0,"w":"Their own stated reason."},{"q":"Who built MP Shah's in-house radiology system?","o":["The head of radiology","ITDOSE"],"a":0,"w":"Per Shiraz."},{"q":"Which modality uses no ionising radiation?","o":["MRI","CT"],"a":0,"w":"Also ultrasound."},{"q":"Before contrast CT you check:","o":["Kidney function and allergies","Parking"],"a": n","Dashboards: TAT by radiologist and modality, workload, utilisation","Exportable research datasets (CSV, JSON, FHIR)","Clinical decision support using ACR Appropriateness Criteria, with AI such as GPT backed by ACR scoring","AI-flagged abnormalities (fractures, nodules, osteoporosis risk), noted as work Shiraz is pursuing"],"said":["The radiology head built his own radiology system with AI-assisted coding; Hospedia accepted it cannot replicate it and discussed sustaining it instead (Shiraz)","He is considering a small language model for pneumothorax detection","MP Shah earlier evaluated a South African teleradiology vendor with plug-and-play fracture detection"],"kz":["Non-urgent X-rays not reported due to limited radiologist availability; CT/MRI reporting up to 7 days; current capacity about 800 to 900 reports per month (Kaizen ID 35).","Ultrasound waits up to 5 hours; one machine end-of-life; procedures and obstetric scans compete for one machine (Kaizen 38, 39)."],"deep":["Radiology produces medical images and reports. Modalities include X-ray (plain films), ultrasound, CT, MRI, mammography, fluoroscopy, DEXA (bone density) and interventional radiology (image-guided procedures). Each has different equipment, preparation, safety rules and reporting complexity.","The workflow runs from order to report: request with clinical details, scheduling, patient preparation (fasting, contrast, full bladder, removing metal), acquisition by radiographers or sonographers, images stored in PACS, reporting by a radiologist (sometimes with a preliminary report first), verification and distribution.","Reporting capacity is often the bottleneck. One radiologist can report a limited number of studies per day, and complex CT and MRI take much longer than plain X-rays. Hospitals use teleradiology (remote radiologists), structured templates, speech recognition and worklist prioritisation to cope.","Safety is central: radiation dose for X-ray and CT, contrast allergies and kidney function for contrast studies, MRI safety for implants and metal, and pregnancy checks."],"subs":[["Plain X-ray","Fast, high volume"],["Ultrasound","No radiation; operator dependent"],["CT","Cross-sectional, fast, uses radiation"],["MRI","Detailed soft tissue, no radiation, long scans"],["Mammography and DEXA","Breast imaging; bone density"],["Interventional","Image-guided procedures and biopsies"]],"equip":["Modalities: X-ray, US, CT, MRI, DEXA, FibroScan","PACS for storage and viewing","RIS for scheduling and reporting","Reporting workstations and speech recognition","DICOM worklist servers"],"procs":[{"t":"CT with contrast","s":["Order with clinical question","Check kidney function (creatinine) and allergies","Schedule; give fasting and preparation instructions","Consent; cannula; scan","Images to PACS","Radiologist reports; critical findings phoned","Report verified and sent"]}],"ke":["Radiation safety is regulated by the Kenya Nuclear Regulatory Authority","Many private hospitals use teleradiology to extend reporting capacity"],"good":["Report TAT targets by modality met","Every study reported, with urgent ones prioritised","Patients prepared before arrival","Critical findings communicated and acknowledged"],"ai":[["Worklist triage","Flags urgent findings (e.g. pneumothorax, bleeds) to read first","Commercial products exist; local validation required"],["Detection aids","Fractures, nodules, mammography support","Radiologist remains accountable"],["Speech recognition","Faster reports","Needs medical vocabulary"]]},{"a":"Like a specialised retail store with a safety officer: stock, dispensing, payment, and a check that the medicines are safe together.","why":"Every patient journey ends here. Pharmacy waits and stock-outs hit satisfaction and safety directly.","steps":[["Prescription received","Pharmacist","EMR / order"],["Prescription checked for safety","Pharmacist","Pharmacy module"],["Billing","Cashier","Billing"],["Dispensing and labelling","Pharmacy technician", ary is:","o":["Approved list of medicines","A billing form"],"a":0,"w":"Medicines policy."},{"q":"Medicines regulator in Kenya:","o":["Pharmacy and Poisons Board","KMPDC"],"a":0,"w":"PPB."},{"q":"Medication reconciliation happens at:","o":["Admission and discharge","Payroll"],"a":0,"w":"Safety."},{"q":"Cold chain matters for:","o":["Vaccines and biologics","Paper records"],"a":0,"w":"Temperature."}],"roles":[["Pharmacist","Checks prescriptions for safety, counsels patients"],["Pharmacy technician","Dispenses and labels"],["Pharmacy manager","Stock, budgets, staffing"],["Procurement / stores","Supplies the pharmacy"]],"data":["Prescriptions and dispensing records","Stock by location, batch and expiry","Interactions flagged","Returns and wastage","Consignment items"],"strat":["Patient safety: medication errors named as a quality metric to track","Patient-Centric Care: reducing avoidable waiting and turnaround times"],"hosp":["Pharmacy Management: GRN receipt and posting, cash sales, patient and vendor returns, expiry management, vendor master, stock ledger"],"gap":["Online prescriptions from OPD and IPD; multiple pharmacy locations; an OTC sales screen","Barcoding and QR scanning for dispensing and stock-take","Drug interaction alerts and mapping; MIMS integration","Unit of measure management, consignment items, chargeable by location","Block dispensing from expired batches; dispense from multiple batches","Prescription history on the dispensing screen; prompt for comments when a pharmacist changes medication","Weight mandatory at triage and shown on dispensing; chronic conditions and allergies on every page","Defects: frequent \"Rolled Back\" errors; paid charges showing as pending; consignment transfers not reducing stock"],"said":[],"kz":["Pharmacy check to billing wait up to 60 minutes (Kaizen time study).","Pharmacy has no visibility of planned discharges (Kaizen ID 30); uses a manual \"black book\" for discharge issues (ID 21)."],"deep":["The pharmacy manages medicines from purchase to patient. It includes outpatient dispensing, inpatient supply to wards, sometimes satellite pharmacies, aseptic preparation (for example chemotherapy), and stores for pharmaceuticals.","Pharmacists check prescriptions for correct dose, interactions, allergies and appropriateness before dispensing. Clinical pharmacists may join ward rounds. Controlled drugs need extra records and security.","Inventory management is a major task: reorder levels, expiry dates, batch tracking, cold chain for vaccines and biologics, consignment stock, and returns. Stock-outs delay care; expired stock wastes money.","Waiting is a frequent complaint because outpatients often pay and collect in separate steps. Many hospitals introduce e-prescriptions, prepayment at the point of care and SMS when medicines are ready."],"subs":[["Outpatient pharmacy","Dispensing to walk-out patients"],["Inpatient pharmacy","Ward supply and discharge medicines"],["Satellite pharmacies","Near theatres or emergency"],["Aseptic unit","Sterile preparation such as chemotherapy"],["Medical stores","Bulk pharmaceutical storage"]],"equip":["Pharmacy module in HIS","Barcode scanners","Cold storage with monitoring","Controlled drug registers","Drug information databases (e.g. MIMS)"],"procs":[{"t":"Outpatient dispensing","s":["Prescription received electronically","Pharmacist clinical check","Payment or insurer approval","Pick, label, double-check","Counsel patient","Record dispensing; stock updated"]},{"t":"Discharge medicines","s":["Discharge prescription written early","Pharmacy alerted","Medicines prepared and checked","Counselling at discharge"]}],"ke":["Pharmacy and Poisons Board regulates medicines and pharmacies","Insurer formularies and co-pays affect what patients receive"],"good":["E-prescriptions with interaction checks","Short dispensing waits with ready alerts","Low stock-outs and expiries","Discharge medicines ready before the patient is"],"ai":[["Demand forecasting","Predicts usage by item","Needs clean stock data"],["Interaction checking","Knowledge-base rules","Licensed content, not custom AI"],["Prescription OCR","Reads paper prescriptions","Accuracy checks"]]},{"a":"Like checking out of a hotel when the bill must be approved by your company first: you are ready to leave, but paperwork holds you at the door.","why":"MP Shah's most measured problem. Slow discharge blocks beds for new patients and frustrates families.","steps":[["Doctor decides to discharge","Doctor","EMR"],["Discharge summary and prescriptions","Doctor","EMR"],["Pending tests cleared","Lab / radiology","LIS / RIS"],["Final bill prepared, doctor charges posted","Billing","Billing"],["Insurer approves final bill","Insurance desk","EDI / email"],["Pharmacy clearance","Pharmacy","Pharmacy module"],["Patient leaves","Ward","ADT"]],"terms":[["Discharge TAT","Time from discharge decision to patient leaving"],["Billing clearance","Final bill finalised and approved"],["Discharge intimation","Formal notice that discharge has begun"],["Pseudo-bed","Virtual bed holding the bill while the patient leaves"],["EDD","Expected date of discharge"],["Discharge before noon","Target to free beds early in the day"],["Discharge lounge","Area where patients wait after leaving the bed"],["Financial clearance","Bill settled or approved"],["Discharge summary","Clinical summary for the patient and next doctor"],["Readmission","Return to hospital within a set period"]],"wrong":["Doctor charges posted on discharge day","Insurer approval slow","Pharmacy and lab not alerted early","Nobody tracks the stages live"],"quiz":[{"q":"Of 309 median minutes, how much is billing clearance?","o":["About 30 minutes","About 195 minutes","About 300 minutes"],"a":1,"w":"Billing clearance is the biggest stage by far."},{"q":"Which would move discharge time most?","o":["AI discharge summaries","Insurance approval tracking and earlier charge posting","A new ward"],"a":1,"w":"Target the largest stage."},{"q":"A pseudo-bed lets:","o":["Two patients share a bed","The patient leave while the bill is finalised","Nurses rest"],"a":1,"w":"The bed is freed while finance finishes."},{"q":"Hospedia's \"checkpoint clearance\" means:","o":["Departments clear the patient before final discharge","Security checks at the gate"],"a":0,"w":"A built-in workflow to use well."},{"q":"Pseudo-beds were requested by:","o":["MP Shah billing users in the gap register","The CEO in the strategy"],"a":0,"w":"Gap register, Billing section."},{"q":"EDD stands for:","o":["Expected date of discharge","Emergency department doctor"],"a":0,"w":"Planning."},{"q":"Financial discharge means:","o":["The bill is settled or approved","The patient is fit"],"a":0,"w":"Billing."},{"q":"Discharge planning should start:","o":["At admission","At exit"],"a":0,"w":"Best practice."},{"q":"A discharge lounge helps by:","o":["Freeing the bed earlier","Adding beds"],"a":0,"w":"Flow."},{"q":"Readmission rate measures:","o":["Patients returning soon after discharge","Admissions per day"],"a":0,"w":"Quality."}],"roles":[["Treating doctor","Decides discharge, writes summary and prescriptions"],["Ward nurse","Prepares the patient and coordinates"],["Billing and insurance desk","Final bill, insurer approval"],["Pharmacy","Discharge medicines"],["Lab and radiology","Clear pending results"]],"data":["Discharge decision time","Summary and prescriptions","Pending investigations","Bill status and insurer response","Exit time"],"strat":["Patient-Centric Care: \"improving discharge planning and continuity after patients leave the hospital\"","Capacity: faster discharge frees beds in a hospital that refers patients out"],"hosp":["IPD Discharge and Transfer (ADT): discharge intimation, checkpoint clearance from various departments before final discharge","EMR discharge summary"],"gap":["Pseudo or virtual beds per ward where bills sit while awaiting financial discharge","Ability to know delays in admission and discharge processes","Discharge intimation nance.","The cycle is requisition, quotation, purchase order, approval, delivery, goods received note (GRN), storage, issue to departments, consumption and reorder. Each step needs controls to avoid fraud, stock-outs and waste.","Asset management tracks equipment from purchase to disposal: location, value, depreciation, maintenance contracts and service history. Biomedical engineering keeps clinical equipment safe and working.","Accurate stock data is the foundation for any forecasting. If system stock differs from shelf stock, forecasts and reorders will be wrong."],"subs":[["Procurement","Buying and supplier management"],["Stores","Receiving, storage, issues"],["Asset management","Register and depreciation"],["Biomedical engineering","Clinical equipment maintenance"]],"equip":["Procurement and inventory modules","Barcode scanners","Asset tags","Maintenance management system"],"procs":[{"t":"Purchase to pay","s":["Requisition raised","Quotations compared","LPO approved","Goods received and inspected (GRN)","Invoice matched to LPO and GRN (three-way match)","Payment"]}],"ke":["Public procurement rules apply to public hospitals; private hospitals set their own policies"],"good":["Stock accuracy high; regular cycle counts","Three-way match enforced","Equipment downtime tracked and low"],"ai":[["Demand forecasting","Predicts consumption","Needs reliable data"],["Predictive maintenance","Anticipates failures from usage","Needs device data"]]},{"a":"Like the housekeeping, kitchen and facilities teams in a hotel: invisible when good, the first complaint when bad.","why":"Food, cleanliness and parking are among the most frequent patient complaints at MP Shah.","steps":[["Meal ordered for patient","Ward","Catering module"],["Meal prepared and delivered","Kitchen","Catering module"],["Cleaning scheduled","Housekeeping","Schedules"],["Linen collected and returned","Laundry","Linen module"],["Feedback collected","Ward / kitchen","Forms"]],"terms":[["Nil by mouth","Patient must not eat or drink"],["Diet order","Meal type set by clinicians"],["Turnaround","Time to return clean linen or a cleaned room"],["Bed turnaround","Time to clean and release a bed"],["Infection control","Practices that prevent infections"],["Hospotel","Hospital with hospitality standards (MP Shah strategy)"]],"wrong":["Cold or poor food","Dirty linen","Meals sent to discharged or nil-by-mouth patients","Parking and wayfinding problems"],"quiz":[{"q":"Serving food to a nil-by-mouth patient is mainly a:","o":["Safety risk solvable with system flags","Taste problem","Parking problem"],"a":0,"w":"A flag in the system prevents it."},{"q":"Most catering complaints are about:","o":["Food quality and temperature","Software","Pricing"],"a":0,"w":"Often not a technology problem."},{"q":"The right instinct here is:","o":["Do not over-technologise quality and staffing problems","Build an app for everything","Ignore it"],"a":0,"w":"Fix what is really broken."},{"q":"Hospedia housekeeping and maintenance modules are in:","o":["Phase 2","Phase 1"],"a":0,"w":"Per Shiraz."},{"q":"The \"Hospotel\" idea in the strategy is about:","o":["Hospitality standards in patient care","A hotel business"],"a":0,"w":"Patient-Centric Care."},{"q":"Bed turnaround affects:","o":["Bed availability","Payroll"],"a":0,"w":"Flow."},{"q":"Nil by mouth means:","o":["No food or drink","No medicines"],"a":0,"w":"Clinical restriction."},{"q":"Hospotel is about:","o":["Hospitality standards in care","A hotel chain"],"a":0,"w":"Strategy."},{"q":"Most support service fixes are:","o":["Process and staffing","AI"],"a":0,"w":"Fit the solution."},{"q":"Cleaning standards affect:","o":["Infection rates","Coding"],"a":0,"w":"Safety."}],"roles":[["Catering manager and chefs","Menus, diets, meal production"],["Dietitian / nutritionist","Clinical diets"],["Housekeeping","Cleaning and room turnaround"],["Laundry","Linen"],["Facilities and transport","Parking, maintenance, ambulances"]],"data":["Diet orders and meal issues","Patient meal feedback","Cleaning schedules","Linen issues and returns","Ambulance movements"],"strat":["Patient-Centric Care: \"incorporating appropriate hospitality principles into healthcare delivery\" and the Hospotel model","HEAL: every non-clinical touchpoint should support healing"],"hosp":["Dietary and Nutritionist: components, menus, diets, issuing by time slot","Linen and Laundry: machines, processing, issue and return, discards","Ambulatory and Transport: ambulance register, tracking, patient shifting","Maintenance and housekeeping modules moved to Phase 2 (Shiraz)"],"gap":["Catering tablets on each ward to order, issue and receive meals","Patients order meals from the patient app","Production report by ward and component","Block meals for discharged and nil-by-mouth patients until the flag is removed","Separate guardian meals (paediatric guardians not charged)","Recipes and costing with automatic stock deduction","Meal feedback before, during and after meals; reasons when meals are not eaten"],"said":[],"kz":["Food quality, cleanliness and linen, parking and navigation repeatedly flagged (Kaizen IDs 57 to 59; many verbatims)."],"deep":["Support services include catering and dietetics, housekeeping and cleaning, laundry and linen, security, transport and ambulances, maintenance and facilities, parking and waste management. They shape the patient experience and infection control.","Clinical links matter: diet orders must match clinical restrictions (diabetic, renal, nil by mouth), cleaning standards affect infection rates, and linen turnaround affects bed availability.","Hospitality matters in private hospitals. MP Shah's strategy describes a \"Hospotel\" model combining hospital care with hospitality standards.","Most improvements here are process, staffing and quality. Technology helps with ordering, tracking and feedback."],"subs":[["Catering and dietetics","Patient and staff meals"],["Housekeeping","Cleaning and room turnaround"],["Laundry","Linen supply"],["Facilities","Maintenance, utilities, parking"],["Waste management","Clinical and general waste"]],"equip":["Diet and catering module","Housekeeping task tools","Linen tracking","Facility management system"],"procs":[{"t":"Patient meal","s":["Diet order from clinicians","Menu choice captured","Meal prepared to diet type","Delivered and confirmed","Feedback captured"]}],"ke":["Waste management is regulated by environmental and health authorities"],"good":["No meals to nil-by-mouth or discharged patients","Fast bed turnaround after discharge","Feedback acted on quickly"],"ai":[["Feedback analysis","Groups comments into themes","Simple NLP"],["Demand planning","Meal volumes by ward","Analytics"]]},{"a":"Like the IT department in any large company, but with life-critical systems that cannot go down.","why":"Every digital change depends on ICT. They own systems, vendors, security and the Hospedia rollout.","steps":[["Requests and incidents logged","Users","Ticketing"],["Support and fixes","ICT team","Systems"],["Vendor coordination","CIO","Contracts"],["Security and access control","ICT","AD"],["Backups and infrastructure","ICT","Servers"]],"terms":[["CIO","Chief Information Officer"],["AD / SSO","One login across systems"],["Sandbox","Safe test copy of a system"],["On-premise","Servers in the hospital"],["Data residency","Where data is physically stored"],["RPO","Recovery point objective: how much data you can afford to lose"],["RTO","Recovery time objective: how fast you must recover"],["DR","Disaster recovery"],["Patch","Security or bug fix update"],["Change control","Formal process for system changes"],["Downtime procedure","How the hospital works when systems are down"]],"wrong":["Heavy dependency on vendors for changes","No test environment","Data spread across old and new systems"],"quiz":[{"q":"With ICT, technical commitments should come from:","o":["Arun","You, to sound confident","The client"],"a":0,"w":"Coordinate; do not absorb."},{"q":"A sandbox is:","o":["A safe test environment","A backup","A server room"],"a":0,"w":"Test without risk."},{"q":"Why does data residency matter at MP Shah?","o":["Kenyan data protection rules may limit where patient data is stored","It does not","For speed only"],"a":0,"w":"Relevant to any cloud hosting."},{"q":"ICT asked for Hospedia hosting on:","o":["AWS","Only paper"],"a":0,"w":"Aurora, CloudFront, S3."},{"q":"Where is the HMIS hosted today?","o":["On MP Shah servers at the main hospital","In India"],"a":0,"w":"Per Shiraz."},{"q":"RTO is:","o":["How fast you must recover","Return to office"],"a":0,"w":"DR."},{"q":"RPO is:","o":["How much data loss is acceptable","A report"],"a":0,"w":"DR."},{"q":"Changes should be tested in:","o":["A non-production environment","Production first"],"a":0,"w":"Safety."},{"q":"Breaches must be reported to:","o":["ODPC","KMPDC"],"a":0,"w":"Data protection."},{"q":"Downtime procedures describe:","o":["How to work when systems are down","Holiday schedules"],"a":0,"w":"Resilience."}],"roles":[["CIO","Runs IT and the Hospedia implementation (name to confirm)"],["Shiraz Dadar","ICT department; leads AI adoption"],["Systems and application team","Configuration, support, vendor liaison"],["Infrastructure and security","Servers, network, backups, access"]],"data":["System and integration inventory","User accounts and roles","Databases: old Kranium, current Kranium, Hospedia","Logs and audit trails","Backups"],"strat":["Data and Digitisation enabler: integrate platforms, data quality and governance, cybersecurity, privacy and resilience, workforce digital capability","\"Digital transformation should reinforce each differentiator rather than operate as a separate technology programme\""],"hosp":["IT Software Administration: user creation, role and rights configuration, masters, database backups, L1 support tools","Ticketing Management for support requests"],"gap":["Access to all masters and configuration; full database access; ability to handle basic configuration in-house","Cloud deployment, AWS if possible: Aurora database, CloudFront application, S3 storage","Group-level rights overriding individual rights; Active Directory authentication","Granular security per feature; detailed audit log; restrict access by IP address; self-service password reset","Redefine clinics, departments and doctors; merge and clean billing categories","Statistics and a daily dashboard (occupancy, revenue, exceptions); waiting-time TAT for every service point"],"said":["One system for all branches on fibre, one database, hosted at the main hospital","Planning a central data lake independent of any HMIS","Deciding whether 16 years of EMR history goes into Hospedia or stays accessible by API","Microsoft 365 Copilot in use; paid generative AI tool used by Shiraz","Kenya Data Protection Act and Digital Health Agency requirements apply"],"kz":[],"deep":["Hospital ICT runs applications (HIS, PACS, LIS, finance, HR), infrastructure (servers, network, storage, end-user devices), security, integration and support. Clinical systems must be highly available; downtime affects patient care.","ICT manages vendors, contracts and licences, and owns change control: testing, approvals and go-lives. During an HIS implementation, ICT is stretched across testing, data migration, training and support.","Security responsibilities include identity and access management, patching, backups, disaster recovery, monitoring, and compliance with data protection law.","Data and integration are increasingly central: interface engines, APIs, data warehouses or lakes, and reporting. The ICT team often lacks capacity for new projects while running core systems."],"subs":[["Applications","HIS, PACS, LIS, ERP"],["Infrastructure","Servers, network, storage, devices"],["Security","Access, monitoring, backups"],["Integration and data","Interfaces, reporting, data platform"],["Service desk","User support"]],"equip":["Servers and storage","Network and Wi-Fi","Active Directory","Backup and DR systems","Monitoring tools"],"procs":[{"t":"Change management","s":["Change requested","Impact assessed","Tested in non-production","Approved","Deployed with rollback plan","Reviewed"]}],"ke":["Data Protection Act requires appropriate security and breach notification to the ODPC"],"good":["Tested backups and DR","Least-privilege access with audit","Documented integrations","Downtime procedures rehearsed"],"ai":[["Service desk assistants","Answer common IT queries","Low risk"],["Security monitoring","Detects anomalies","Specialist tools"]]},{"a":"Like a factory's continuous improvement team: measure, find the cause, fix, check, repeat.","why":"MP Shah has an existing improvement culture (JCI, daily Kaizen boards). Build on it, never around it.","steps":[["KPIs measured","Quality team","Manual / reports"],["Daily Kaizen board reviews","Unit managers","Boards"],["Concern, cause, countermeasure (3C)","Teams","Boards"],["Actions tracked","Quality office","Tracker"],["Audits for JCI","Quality team","Audit tools"]],"terms":[["JCI","Joint Commission International accreditation"],["Kaizen","Continuous improvement"],["3C","Concern, Cause, Countermeasure"],["CSAT","Customer satisfaction score"],["Quick win","Improvement with no capital spend"],["Near miss","Error caught before harm"],["Adverse event","Harm caused by care"],["RCA","Root cause analysis"],["Just culture","Fair approach that encourages reporting"],["PDSA","Plan, Do, Study, Act improvement cycle"],["HAI","Hospital-acquired infection"]],"wrong":["KPIs counted manually","Customer-centric KPIs missing","Post-visit follow-up has no owner"],"quiz":[{"q":"The Board was told to close quick wins:","o":["Before committing capital to large investments","After buying new systems","Never"],"a":0,"w":"Respect this sequencing in our roadmap."},{"q":"\"We count it manually for the board\" signals:","o":["A dashboard opportunity","An AI opportunity","Nothing"],"a":0,"w":"Analytics."},{"q":"Our attitude to the Kaizen study should be:","o":["Build on it visibly","Redo it","Ignore it"],"a":0,"w":"Respect existing work."},{"q":"Which three quality metrics does the strategy name?","o":["Falls, pressure ulcers, medication errors","Revenue, parking, food"],"a":0,"w":"Under Data and Digitisation."},{"q":"JCI-related requests in the gap register include:","o":["Nursing templates","Dark mode"],"a":0,"w":"Nursing section."},{"q":"A near miss is:","o":["An error caught before harm","A harmful event"],"a":0,"w":"Learning opportunity."},{"q":"RCA means:","o":["Root cause analysis","Revenue cycle audit"],"a":0,"w":"Investigation."},{"q":"PDSA stands for:","o":["Plan, Do, Study, Act","Patient data security act"],"a":0,"w":"Improvement."},{"q":"Just culture encourages:","o":["Reporting without blame","Punishment"],"a":0,"w":"Safety."},{"q":"HAI means:","o":["Hospital-acquired infection","Health AI"],"a":0,"w":"Indicator."}],"roles":[["Quality improvement officer (QIO)","Quality programmes and KPIs"],["Quality and risk management (QIRM)","Incidents, risk, audits"],["Unit managers","Run daily improvement boards"],["Patient experience team","Feedback and complaints"]],"data":["KPIs and audit results","Incidents and near misses","Patient satisfaction and complaints","Improvement actions and owners"],"strat":["Strength: \"an established culture of incident reporting and continuous quality improvement\"","Clinical Excellence: \"embed quality, safety and clinical governance in every service\"","Quality metrics to track: patient falls, pressure ulcers, medication errors","JCI accreditation underpins the brand"],"hosp":["No dedicated quality module in the contract list; quality data comes from clinical modules","Algus QMS (reported in our plan) for incidents, audits and documents: to validate"],"gap":["OT incident reporting form","Audit trails across clinical modules (doctors, radiology, finance)","Nursing templates required for JCI accreditation"],"said":["A patient journey study by Kaizen Institute produced a Board report and action tracker; it is one input among several"],"kz":["Kaizen: 59 to 62 tracked actions with owners; 18 quick wins to close within a quarter."],"deep":["Quality and patient safety teams run accreditation (JCI at MP Shah), incident reporting, audits, clinical indicators, infection prevention, patient experience and continuous improvement programmes.","Incident reporting captures adverse events and near misses so the hospital can learn. Root cause analysis investigates serious events. A just culture encourages reporting without blame.","Quality indicators include falls, pressure ulcers, medication errors, hospital-acquired infections, readmissions, mortality, patient satisfaction and turnaround times.","Improvement methods include Lean, Kaizen, Six Sigma and Plan-Do-Study-Act cycles. Daily huddles and boards keep teams focused on measures."],"subs":[["Accreditation","JCI standards and surveys"],["Patient safety and incidents","Reporting and investigation"],["Infection prevention","Surveillance and control"],["Patient experience","Feedback and complaints"],["Improvement","Lean, Kaizen, PDSA projects"]],"equip":["Quality management system (incidents, audits, documents)","Dashboards","Survey tools"],"procs":[{"t":"Incident to learning","s":["Incident reported","Triaged by severity","Investigated (RCA for serious events)","Actions agreed","Learning shared","Effectiveness checked"]}],"ke":["Kenya has national quality and patient safety frameworks; JCI is international"],"good":["High reporting of near misses","Indicators tracked automatically","Actions closed and checked"],"ai":[["Incident classification","Groups reports into themes","Simple NLP"],["Indicator automation","Pulls indicators from systems","Data integration first"]]}],"tracks":[{"t":"MP Shah in context","e":"🏛️","c":"indigo","items":[{"t":"The hospital and its network","s":"MP Shah is a JCI-accredited tertiary hospital in Nairobi, founded in the 1930s, with satellite clinics around the city.","deep":"MP Shah began as a community hospital and grew into a tertiary institution, meaning it treats complex cases referred from elsewhere. It runs a flagship campus plus satellite clinics, which the Hospedia contract lists as Nairobi CBD, Spring Valley, Village Market and The Hub, with more planned. All branches share one system and one patient database, linked by fibre. The strategy plans a hub-and-spoke network: smaller clinics for access, the flagship protected for complex care.","keys":["Tertiary means complex, specialist and referral care","One database across all branches, distinguished only by location","Satellite clinics are the \"spokes\"; the main hospital is the \"hub\"","JCI accreditation is central to its brand and its standards"],"an":"Like a main airport hub with smaller regional airports feeding into it.","h":"A patient seen at a satellite clinic for a scan should have the same record and images available at the main hospital.","m":"Any solution we propose must work across all branches, on one patient identity, and respect JCI standards.","mist":["Treating MP Shah as a single building rather than a network","Forgetting that new branches are planned, so solutions must scale"],"ask":["Which services are offered at each satellite clinic?","How do patients and records move between branches today?"],"qs":[{"q":"A tertiary hospital mainly:","o":["Provides complex and referral care","Only runs pharmacies"],"a":0,"w":"Specialist level."},{"q":"MP Shah's branches share:","o":["One system and one database","Separate systems per branch"],"a":0,"w":"Per Shiraz."},{"q":"The hub-and-spoke model protects the flagship for:","o":["Tertiary and complex care","Parking"],"a":0,"w":"Strategy wording."}]},{"t":"Strategy 2026 to 2031","s":"Two pillars, three enablers, three phases, and one investment test.","deep":"The strategy's two pillars are Clinical Excellence and Patient-Centric Care: they define the value delivered to patients. Three enablers make delivery sustainable: People-Centred Culture, Data and Digitisation, and Sustainability. Delivery runs in three phases: Fix and Transform (core systems, governance, foundations), Scale and Grow (capacity, diagnostics, digital adoption), and Market Leadership (international services, mature analytics and AI-enabled care). Every significant investment is tested on clinical impact, patient safety, affordability, operational feasibility and sustainable value.","keys":["Pillars: Clinical Excellence; Patient-Centric Care","Enablers: People-Centred Culture; Data and Digitisation; Sustainability","Phases: Fix and Transform, then Scale and Grow, then Market Leadership","AI is an enabler, not a substitute for clinical accountability","Digital must reinforce differentiators, not run as a separate programme"],"an":"Like a company's five-year plan: what customers get (pillars), what makes it possible (enablers), and the order of play (phases).","h":"A radiology AI idea maps to Clinical Excellence (advanced diagnostics) and the Data and Digitisation enabler, probably in the later phases.","m":"Every recommendation in our roadmap should name the pillar or enabler it serves, its phase, and how it passes the investment test.","mist":["Recommending mature AI before the foundations the strategy puts first","Using our own priority criteria instead of theirs"],"ask":["Which strategic programmes already have accountable owners?","How is investment approved against this framework?"],"qs":[{"q":"Which is an enabler, not a pillar?","o":["Data and Digitisation","Clinical Excellence"],"a":0,"w":"Three enablers."},{"q":"Mature AI-enabled care sits mainly in which phase?","o":["Market Leadership","Fix and Transform"],"a":0,"w":"The third phase."},{"q":"The investment test includes:","o":["Affordability and patient safety","Brand colours"],"a":0,"w":"Five criteria."}]},{"t":"The Hospedia programme","s":"MP Shah is replacing its Kranium HMIS with Hospedia, implemented by ITDOSE under a signed contract.","deep":"Hospedia is an end-to-end hospital information system: registration, clinical modules, lab, radiology, pharmacy, stores, billing, insurance, finance, HR and a patient app. ITDOSE customises it to MP Shah's requirements, agreed during GAP analysis. It is currently in UAT (testing). Phase 1 covers registration, OPD, doctors module, lab, radiology, pharmacy, inventory and finance; Phase 2 covers queue management, maintenance, housekeeping, the patient app and portals. Users raised a detailed gap register of requirements, and further requirements are held by the Hospedia team.","keys":["Vendor: ITDOSE; system: Hospedia; replaces Kranium","Status: UAT, not live","Phase 1 core clinical and financial; Phase 2 smaller modules and patient-facing apps","Gap register: hundreds of user requirements across 14 departments","Hospedia has no AI today; any AI would sit alongside it"],"an":"Like moving a whole company onto a new ERP while still running the business.","h":"Lab staff test result entry in the Hospedia test system while still using the old lab system in production.","m":"Our job is to complement Hospedia: find what it will not cover and design what sits around it. We never compete with it or criticise it.","mist":["Assuming Hospedia is live","Proposing to build what ITDOSE is already contracted to deliver"],"ask":["What is the go-live date per phase?","Which requirements were accepted, deferred or rejected?"],"qs":[{"q":"Hospedia is currently:","o":["In UAT","Fully live"],"a":0,"w":"Testing stage."},{"q":"The patient app is in:","o":["Phase 2","Phase 1"],"a":0,"w":"Per Shiraz."},{"q":"Our stance on Hospedia is:","o":["Complement it","Replace it"],"a":0,"w":"Vendor neutrality."}]},{"t":"Legacy systems and data","s":"Data sits across old and current Kranium databases, Sage, EnQuest and other tools, on MP Shah's own servers.","deep":"Kranium is the current HMIS, with an older and a newer database. Finance runs partly on Sage; HR and payroll on EnQuest; there is a separat
