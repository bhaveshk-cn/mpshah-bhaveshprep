uardrails","Controls limiting what AI can say or do","AI"],["Hallucination","Confident but false GenAI output","AI"],["Human-in-the-loop","Human reviews or approves AI output","AI"],["LLM","Large language model","AI"],["ML","Machine learning","AI"],["NLP","Natural language processing","AI"],["PoC","Proof of concept","AI"],["Precision","% of flags that are correct","AI"],["RAG","Retrieval-augmented generation","AI"],["Recall / sensitivity","% of true cases caught","AI"],["Silent mode","AI runs without showing outputs, for validation","AI"],["SLM","Small language model, specialised and lighter","AI"],["Specificity","% of negatives correctly cleared","AI"],["Training data","Examples a model learns from","AI"],["Vector database","Store for embeddings used in RAG","AI"],["Acceptance criteria","Conditions proving a requirement is met","Business analysis and commercial"],["AS-IS / TO-BE","Current / future process","Business analysis and commercial"],["Baseline","Current measured performance","Business analysis and commercial"],["Business case","Justification: value, cost, risk","Business analysis and commercial"],["Change request","Formal scope change","Business analysis and commercial"],["Fishbone","Root-cause diagram","Business analysis and commercial"],["Five Whys","Iterative root-cause questioning","Business analysis and commercial"],["Functional requirement","What a system must do","Business analysis and commercial"],["Gap analysis","Difference between current and target","Business analysis and commercial"],["MoM","Minutes of meeting","Business analysis and commercial"],["Non-functional requirement","Performance, security, usability constraints","Business analysis and commercial"],["RACI","Responsible, Accountable, Consulted, Informed","Business analysis and commercial"],["ROI","Return on investment","Business analysis and commercial"],["SoW","Statement of work","Business analysis and commercial"],["Swimlane","Process map lane per role","Business analysis and commercial"],["T&M","Time and materials","Business analysis and commercial"],["User story","As a [role], I want [x], so that [y]","Business analysis and commercial"]],"icons":["📞","🧾","🩺","🚑","🛏️","❤️","🧤","🧪","🩻","💊","🚪","💳","📑","📊","🗂️","👥","📦","🍽️","🖥️","✅"],"people":[{"n":"Shiraz Dadar","i":"🤝","r":"Our main contact, drives AI adoption","know":["Stepped away as head of IT in 2024; now focuses on AI adoption and board consultation.","Candid. Wants on-the-ground discovery, likes Gantt charts.","Shared the strategy, Hospedia scope and regulatory links quickly."],"ask":["How should we involve the CIO before we arrive?","Which departments should we see in the remote week?","Who approves the discovery plan, and by when?","What would make this discovery a success for you?","What is your current title, so we use it correctly?"],"listen":["Names of people we have not met","Anything about budget or the Board","What the CEO cares about"],"avoid":["Repeating his off-record views on Hospedia.","Routing everything through him alone."]},{"n":"The CIO","i":"🖥️","r":"Runs IT and the Hospedia rollout (name unknown)","know":["Owns the Hospedia implementation.","Owns several Kaizen digital actions, including AI call deflection.","Not yet engaged by us. This is our biggest stakeholder gap."],"ask":["What does success look like for Hospedia go-live?","Which integrations worry you most?","What can Hospedia expose to other systems, and on what terms?","What must any new system respect: security, hosting, data?","How much support capacity does ICT have for new tools?"],"listen":["\"We depend on the vendor for every change\"","\"We have no sandbox\"","Go-live dates and pressure points"],"avoid":["Surprising him with vendor criticism.","Making technical promises without Arun."]},{"n":"Dr Thuku","i":"🩻","r":"Head of Radiology (spelling to confirm)","know":["Radiologist with an IT degree.","Built his own radiology system with AI-assisted coding. Hospedia accepted it cannot replicate it.","Wants AI to push urgent X-rays up his list; thinking about a pneumothorax model."],"ask":["What problem were you solving when you built your system?","What data does it use, and where does it run?","Which studies go unreported today, and what happens to those patients?","What should AI do for you, and what must it never do?","How would you check an AI result before trusting it?"],"listen":["Data location and privacy details","\"We only report acute cases\"","How proud he is of what he built"],"avoid":["Calling his system risky or \"vibe coded\".","Promising fracture AI. Ours was a proof of concept."]},{"n":"CEO","i":"🏛️","r":"Approves the discovery plan","know":["Must approve the dates and plan.","The strategy is his frame: two pillars, three enablers, three phases."],"ask":["Which outcome matters most to you in the next 12 months?","What constraints should we respect: budget, people, timing?","How are investment decisions made here?"],"listen":["Strategy words he repeats","Board expectations","Affordability concerns"],"avoid":["Technical detail.","Any price, even a rough one."]},{"n":"Dr John (COO)","i":"⚙️","r":"Operations (named in Feb 2026)","know":["Named as needed for internal alignment.","Silent since. Confirm he is still in role."],"ask":["Where do patients wait longest, in your view?","Which support services cause the most complaints?","What has already been tried to fix patient flow?"],"listen":["Throughput and bed pressure","Food, linen, parking (top Kaizen complaints)"],"avoid":["Saying yes to extra scope in the room."]},{"n":"ITDose (Hospedia)","i":"🏗️","r":"Hospital system vendor","know":["Signed contract; in UAT, not live.","Phase 1: registration, OPD, doctors, lab, radiology, pharmacy, inventory, finance. Phase 2: queues, patient app, portals.","No AI today. Their AI map is aspirational."],"ask":["Module scope and go-live date per phase?","Which APIs exist, read or write, and can third parties build on them?","What is the plan for historical Kranium data?","Will MP Shah data ever be used to train your models?"],"listen":["What is still being customised","What they say is \"out of scope\""],"avoid":["Any criticism. We complement Hospedia.","Hiding our involvement."]},{"n":"Kaizen study team","i":"📈","r":"MP Shah staff who mapped the patient journey","know":["Analysed 963,766 patient journeys.","Built a tracker of 59 to 62 actions with owners.","Told the Board: quick wins before big spending."],"ask":["Which actions are closed, and which are stuck?","Can we use the Excel tracker?","What surprised you most in the study?"],"listen":["Why actions stalled","Which owners are most engaged"],"avoid":["Appearing to redo or criticise their work."]}],"sims":[{"id":"cc","title":"Credit Control: \"Our biggest problem is rejections\"","intro":"You are in a session with the Head of Credit Control. Virender and Arun are with you.","start":"a","nodes":{"a":{"s":"Head of Credit Control","q":"\"Honestly, our biggest headache is insurance rejections. We lose a lot of money there.\"","c":[{"t":"\"Would an AI tool that predicts denials help you?\"","n":"a1","p":0,"f":"You jumped straight to a solution. She now evaluates your idea instead of describing her problem, and you still do not know why claims are rejected."},{"t":"\"What are the most common reasons claims get rejected, and how do you know?\"","n":"b","p":2,"f":"Good. You asked for the cause and the evidence in one question."},{"t":"\"Hospedia will fix most of that, won't it?\"","n":"a2","p":0,"f":"An assumption, and it pulls the vendor into a pain conversation. You also signal you have not looked."}]},"a1":{"s":"Head of Credit Control","q":"\"Maybe? I don't know what that would look like. Can you send a demo?\"","c":[{"t":"Recover: \"Before any demo, help me understand what actually gets rejected.\"","n":"b","p":1,"f":"Good recovery. Always pull back to the problem."}]},"a2":{"s":"Head of Credit Control","q":"\"They say so. We will see. We raised forty requirements.\"","c":[{"t":"Recover: \"Can you walk us through the top rejection reasons today?\"","n":"b","p":1,"f":"Recovered. Note the forty requirements: ask for the list later."}]},"b":{"s":"Head of Credit Control","q":"\"Exclusions billed by mistake, missing documents, and the EDI dropping claims. We track it in Excel.\"","c":[{"t":"\"Could we see that Excel, even a sample?\"","n":"c","p":2,"f":"Excellent. A workaround is evidence. The sheet may give you baselines and categories."},{"t":"\"So you need an AI to catch exclusions.\"","n":"c2","p":0,"f":"Still solutioning. Exclusions are usually rules; you have not checked how they are configured."},{"t":"\"How many rejections a month, and roughly what value?\"","n":"c","p":2,"f":"Good. You are building the business case baseline."}]},"c2":{"s":"Arun","q":"(quietly) \"Let's check how exclusions are mapped to schemes first.\"","c":[{"t":"\"Thanks Arun. Could you show us how an exclusion is set up for a scheme?\"","n":"c","p":1,"f":"Good use of your technical colleague. Let him lead that thread."}]},"c":{"s":"Head of Credit Control","q":"\"Sure. About 180 rejections a month. The EDI ones are the worst, we resubmit manually.\"","c":[{"t":"\"Which EDI causes most problems? Arun, can you pick up the integration side?\"","n":"end","p":2,"f":"You connected a business finding to the technical owner in real time. That is your core job."},{"t":"\"OK, we will design something for that.\"","n":"end","p":0,"f":"An implicit commitment, with no owner and no scope check. Capture instead, then route."}]},"end":{"end":true}}},{"id":"rad","title":"Radiology: the champion and his system","intro":"Dr Thuku has just demonstrated the radiology system he built himself. He is proud of it.","start":"a","nodes":{"a":{"s":"Dr Thuku","q":"\"So, can Capital Numbers make this production-ready and add AI fracture detection?\"","c":[{"t":"\"Yes, we have done fracture detection before. We can do it.\"","n":"a1","p":0,"f":"A commitment you are not authorised to make, plus a capability claim. Our fracture work was a proof of concept. This is Arun's call and then Subhankar's."},{"t":"\"What you have built shows exactly what the department needs. Can you tell us what problem you were solving first?\"","n":"b","p":2,"f":"Respect first, then problem. He feels heard, and you learn his priorities."},{"t":"\"Vibe-coded tools are risky with patient data.\"","n":"a2","p":0,"f":"True in principle, but it lands as dismissive. You risk losing your strongest clinical champion."}]},"a1":{"s":"Dr Thuku","q":"\"Great. When can you start?\"","c":[{"t":"Recover: \"Let me make sure we understand your workflow and data properly first, so whatever we suggest actually works here.\"","n":"b","p":1,"f":"Recovered, but you created an expectation. Note it for Subhankar."}]},"a2":{"s":"Dr Thuku","q":"\"It is working better than anything the vendors gave us.\"","c":[{"t":"Recover: \"That is clear. Help us understand how you built it, and where it runs.\"","n":"b","p":1,"f":"Recovered by switching to curiosity."}]},"b":{"s":"Dr Thuku","q":"\"Reporting backlog. I cannot report every X-ray. Non-urgent ones just do not get reported.\"","c":[{"t":"\"What happens to those patients today? Do the referring doctors read the images themselves?\"","n":"c","p":2,"f":"You went to impact and risk. That is how you size a clinical problem."},{"t":"\"AI can read the X-rays for you.\"","n":"c","p":0,"f":"Overclaim. AI can help prioritise; the radiologist remains accountable. Never imply replacement."}]},"c":{"s":"Dr Thuku","q":"\"Mostly yes. Some are missed. I would like AI to push urgent ones up my list.\"","c":[{"t":"\"Arun, could you explore with Dr Thuku what data and PACS access a prioritisation tool would need?\"","n":"end","p":2,"f":"Clean handover to the technical owner with a specific question."},{"t":"\"We will put that in our proposal.\"","n":"end","p":0,"f":"Premature. Capture as a signal; the roadmap decides."}]},"end":{"end":true}}},{"id":"ceo","title":"The corridor price question","intro":"Onsite day 4. The CEO stops you in the corridor after a session.","start":"a","nodes":{"a":{"s":"CEO","q":"\"Shiraz tells me about this data lake idea. Roughly what would that cost us?\"","c":[{"t":"\"Around fifty to eighty thousand dollars, depending.\"","n":"a1","p":0,"f":"You invented a number. It will become the anchor for every future conversation. Pricing is Subhankar's."},{"t":"\"It depends on scope, data volume and how it connects to Hospedia. We are assessing that now, and we will bring a reliable view with the roadmap.\"","n":"b","p":2,"f":"Honest, confident and not evasive. You explained what drives the cost."},{"t":"\"I am not sure, I will ask.\"","n":"b","p":1,"f":"Honest, but weak. Explain what the answer depends on so you sound in control."}]},"a1":{"s":"CEO","q":"\"That much? We were thinking much less.\"","c":[{"t":"Recover: \"That was a rough guess and I should not have given one. Let us come back with a properly scoped view.\"","n":"b","p":1,"f":"Owning it is right. Tell Subhankar the same day."}]},"b":{"s":"CEO","q":"\"Fine. What would we actually get from it?\"","c":[{"t":"\"One trusted place for data across Kranium and Hospedia, so reports and future AI use the same numbers. Your strategy calls it trusted enterprise data.\"","n":"c","p":2,"f":"Business value in his language, tied to his own strategy."},{"t":"\"A medallion architecture with bronze, silver and gold layers on a lakehouse.\"","n":"c","p":0,"f":"Technically right, but meaningless to a CEO. Translate."}]},"c":{"s":"CEO","q":"\"Good. Make sure it is in the final presentation.\"","c":[{"t":"\"Will do. I will also make sure Subhankar has your interest on record.\"","n":"end","p":2,"f":"You captured an executive signal and routed it to the commercial owner."},{"t":"\"Absolutely, we will prioritise it.\"","n":"end","p":0,"f":"Prioritisation comes from evidence across all opportunities, not one corridor chat."}]},"end":{"end":true}}},{"id":"scope","title":"Scope creep: \"Can you also review procurement?\"","intro":"Onsite day 3. The COO joins the end of a session and makes a request.","start":"a","nodes":{"a":{"s":"COO","q":"\"While you are here, can your team also do a deep review of our procurement process next week?\"","c":[{"t":"\"Of course, we can fit that in.\"","n":"a1","p":0,"f":"An unauthorised scope commitment. It affects timeline, effort and possibly commercials. Only Subhankar can agree this."},{"t":"\"That sounds valuable. What would you want to come out of it, and what prompted it now?\"","n":"b","p":2,"f":"You understood the request before reacting. That is the first step of the scope path."},{"t":"\"Sorry, that is out of scope.\"","n":"a2","p":0,"f":"Rejecting immediately damages the relationship and may miss a real need or a future opportunity."}]},"a1":{"s":"COO","q":"\"Great, I will tell the procurement team to expect you.\"","c":[{"t":"Recover: \"Let me just confirm timing with my lead first, so we do it properly. I will come back to you tomorrow.\"","n":"b","p":1,"f":"Recovered, but you created an expectation. Tell Subhankar today."}]},"a2":{"s":"COO","q":"\"Oh. I thought this was a hospital-wide review.\"","c":[{"t":"Recover: \"It is broad. Let me understand what you need and check how best to cover it.\"","n":"b","p":1,"f":"Recovered by returning to understanding."}]},"b":{"s":"COO","q":"\"Stock-outs keep delaying procedures. I want to know whether the new system will fix it.\"","c":[{"t":"\"Let me capture exactly that, and align internally on how and when we can look at it. I will confirm by tomorrow.\"","n":"c","p":2,"f":"The scope script, used well: capture, align, confirm, with a time commitment you control."},{"t":"\"Hospedia will definitely fix stock-outs.\"","n":"c","p":0,"f":"A claim about the vendor you cannot make. Stock accuracy may be process, data and configuration."}]},"c":{"s":"You, later","q":"(Back at the hotel.) What do you do next?","c":[{"t":"Send Subhankar a short note: request, why, link to strategy and Kaizen, likely effort, options, decision needed by tomorrow.","n":"end","p":2,"f":"Exactly the escalation structure. Material, clear, with a decision deadline."},{"t":"Ask Virender to start on it tomorrow morning.","n":"end","p":0,"f":"You assigned work that has not been agreed. Scope first, then ownership."}]},"end":{"end":true}}},{"id":"contra","title":"Contradiction: \"The lab is fully integrated\"","intro":"Morning: ICT says the lab system is fully integrated. Afternoon: lab staff show you re-typing analyser results by hand.","start":"a","nodes":{"a":{"s":"Lab technologist","q":"\"We type the results from this screen into that one. Every day.\"","c":[{"t":"\"But ICT told us this morning it was integrated.\"","n":"a1","p":0,"f":"You set two teams against each other in front of a junior staff member. Record, do not confront."},{"t":"\"Could you show me which results you re-type, and roughly how many a day?\"","n":"b","p":2,"f":"You gathered evidence neutrally. Observation beats opinion."}]},"a1":{"s":"Lab technologist","q":"\"Well, maybe for some machines. Not these.\"","c":[{"t":"Recover: \"That is really helpful. Which machines are not connected?\"","n":"b","p":1,"f":"Recovered into specifics. Both statements may be true for different analysers."}]},"b":{"s":"Lab technologist","q":"\"The serology and the two chemistry analysers. Maybe 200 results a day.\"","c":[{"t":"Log it as a contradiction: ICT statement vs lab observation, with a possible explanation (some analysers interfaced, some not). Ask Arun to validate with ICT.","n":"end","p":2,"f":"Perfect discovery discipline: both sources recorded, explanation offered, validation owner assigned."},{"t":"Note that ICT was wrong.","n":"end","p":0,"f":"You chose a side without validation, and the note could leak. Different people often experience the same system differently."}]},"end":{"end":true}}},{"id":"cio","title":"Bringing in the CIO","intro":"Two days before onsite. The CIO has not been in any session. You call Shiraz.","start":"a","nodes":{"a":{"s":"Shiraz","q":"\"Hi Bhavesh. All set for next week?\"","c":[{"t":"\"Almost. Should we be talking to the CIO or not? He seems to be missing.\"","n":"a1","p":0,"f":"Blunt and slightly accusatory. It can read as criticism of Shiraz or the CIO."},{"t":"\"Nearly. Since the CIO owns the Hospedia rollout and several Kaizen actions, would it help if we briefed him directly before we arrive?\"","n":"b","p":2,"f":"You gave a reason rooted in his ownership, and offered help rather than a complaint."}]},"a1":{"s":"Shiraz","q":"\"He is very busy with the go-live.\"","c":[{"t":"Recover: \"Completely understand. Even 20 minutes would help us avoid duplicating his work. Would that be possible?\"","n":"b","p":1,"f":"Recovered by making it small and in his interest."}]},"b":{"s":"Shiraz","q":"\"Good idea. He is stretched, but I will ask. What would you cover?\"","c":[{"t":"\"Our plan, what we have learned from the Hospedia scope, and three questions only he can answer. Twenty minutes.\"","n":"c","p":2,"f":"Specific, short, respectful of his time."},{"t":"\"Everything, really. Our full approach.\"","n":"c","p":0,"f":"Vague and long. Busy executives say no to open-ended asks."}]},"c":{"s":"Shiraz","q":"\"Send me a short note I can forward.\"","c":[{"t":"Send a 5-line note Shiraz can forward, and copy Subhankar on the stakeholder gap.","n":"end","p":2,"f":"You made the champion's job easy and kept governance informed."},{"t":"Email the CIO directly, bypassing Shiraz.","n":"end","p":0,"f":"You went around your champion after he offered to help. That costs trust."}]},"end":{"end":true}}}],"sort":[{"x":"Lab tests are forgotten 4 to 5 times a day and nobody is alerted","a":"Automation","w":"Known rules: if an order is pending beyond a time limit, alert. No learning needed."},{"x":"A quarter of all calls are just people asking to be transferred","a":"Automation","w":"An IVR menu or directory routes these. AI is overkill for a known list of destinations."},{"x":"The Board wants to see discharge time broken down by stage, every day","a":"Analytics","w":"The data exists; people need to see it. A dashboard, not a model."},{"x":"Lab results do not reach the HMIS, so doctors do not know they are ready","a":"Integration","w":"Data is not moving between systems. Connect them first."},{"x":"Consultants arrive late, so booked appointments are not honoured","a":"Process fix","w":"The root cause is behaviour and scheduling discipline. Technology cannot fix a late consultant."},{"x":"Sonographers leave the room to type reports, wasting scan time","a":"AI","w":"Speech-to-text understands spoken language. Even dictaphones help; speech AI goes further."},{"x":"Radiologists cannot report every X-ray; urgent ones need to rise to the top","a":"AI","w":"Interpreting images to prioritise needs computer vision. Clinical validation and oversight required."},{"x":"Insurer EDI systems drop claims, causing rejections","a":"Integration","w":"A broken connection between systems. Fix the interface."},{"x":"Patients arrive for scans without fasting or a full bladder","a":"Automation","w":"Send preparation instructions automatically when the scan is booked. Rules, not AI."},{"x":"Pharmacy and billing want to know tonight who will likely go home tomorrow","a":"AI","w":"Predicting discharges from patterns in history is a predictive model. Useful once data is reliable."},{"x":"The reporting desk is empty when transcriptionists all take lunch at once","a":"Process fix","w":"Stagger the breaks. Kaizen listed this as a zero-cost quick win."},{"x":"Finance cannot see profit and loss by department","a":"Analytics","w":"Reporting on existing data, once revenue mapping is clean."},{"x":"Staff ask HR the same policy questions every week","a":"AI","w":"A policy assistant that answers from approved documents (RAG). Only worth it if volume is real and policies are current."},{"x":"The same patient has three different records","a":"Process fix","w":"Mostly registration discipline and validation rules. Matching tools can help, but process comes first."},{"x":"Pharmacy does not know a discharge has started","a":"Integration","w":"The HIS should notify pharmacy when the discharge event happens. An event or webhook, not AI."},{"x":"Doctors spend evenings writing discharge summaries","a":"AI","w":"Generative AI can draft from the record for doctor review. Real value, but it does not touch the 195-minute billing bottleneck."}],"buckets":["AI","Automation","Analytics","Integration","Process fix"],"sayAll":[{"s":"\"How much will it cost?\"","no":"\"Probably around fifty thousand.\"","yes":"\"It depends on scope, integration and data. We will bring a reliable view once those are confirmed, and Subhankar will take you through it.\""},{"s":"Client criticises Hospedia","no":"\"Yes, we noticed the UI looks very dated too.\"","yes":"\"That is helpful context. Our focus is on complementing what Hospedia delivers.\""},{"s":"\"Can your team also look at procurement next week?\"","no":"\"Sure, we will add it.\"","yes":"\"That sounds valuable. Let me capture exactly what you need and align internally on timing before I confirm.\""},{"s":"We captured something wrongly","no":"\"I am so sorry, that is completely our fault, we will be more careful, apologies again.\"","yes":"\"Thank you for pointing that out. We captured it incorrectly and will correct the documents.\""},{"s":"\"Can you start building now?\"","no":"\"Yes, we are ready.\"","yes":"\"We can plan that properly. First we need to confirm a few dependencies so it succeeds.\""},{"s":"\"Why another workshop?\"","no":"\"We just need more information.\"","yes":"\"It closes one specific gap, how insurance approvals flow, which decides whether this is feasible. We will keep it to 45 minutes.\""},{"s":"\"Are you saying our systems are bad?\"","no":"\"Well, there are a lot of gaps.\"","yes":"\"Not at all. Every hospital has gaps between systems. Our job is to find the most valuable ones to close.\""},{"s":"Client asks if you have done this before","no":"\"We have done this many times.\"","yes":"\"We have relevant work, for example a chest X-ray screening project. Let me share what applies and what would be new here.\""},{"s":"Talking about AI accuracy","no":"\"Our model is 95% accurate.\"","yes":"\"In testing on that project it reached around 81% accuracy. It would need validating on MP Shah data before anyone relies on it.\""},{"s":"Calling the schedule","no":"\"Our project plan\"","yes":"\"Our discovery plan\" or \"workshop plan\""},{"s":"Colleague is mid-question when you want to move on","no":"\"Sorry to cut you down, to save time...\"","yes":"Let the thread finish if the client is describing real pain. Note the time and catch up later."},{"s":"Client: \"We need AI\"","no":"\"Great, here are six use cases.\"","yes":"\"What outcome are you hoping AI will help you achieve?\""},{"s":"Arun says: \"Hospedia exposes read APIs only, through a nightly batch export. No FHIR.\" How do you explain it to Shiraz?","no":"","yes":"New tools could read Hospedia data but not update it, and only once a day. That works for dashboards and planning, but not for real-time alerts or anything that writes back. We should ask ITDose whether more is planned."},{"s":"Arun says: \"The model achieved 0.85 recall and 0.78 precision on the validation set.\" How do you explain it to CEO?","no":"","yes":"It caught about 85 of every 100 real cases in testing, and about three in four of its alerts were correct. The radiologist still reviews everything; it would help sort the queue, not replace judgement."},{"s":"Arun says: \"Patient master data has duplicate UHIDs; MPI deduplication is required before analytics.\" How do you explain it to CEO?","no":"","yes":"Some patients exist more than once in the system. Until we clean that up, any report on patient numbers or outcomes will be wrong, so it has to come first."},{"s":"Arun says: \"The integration would need a middleware layer with HL7 v2 listeners because the lab analysers do not support FHIR.\" How do you explain it to Head of Laboratory?","no":"","yes":"Your analysers speak an older standard, so we would need a small connecting system in between. It is common and workable, but it adds some setup time."},{"s":"Arun says: \"Data residency requirements under the DPA may restrict hosting PHI on AWS regions outside Kenya.\" How do you explain it to Shiraz?","no":"","yes":"Kenyan data protection rules may limit storing patient data in cloud centres outside Kenya. Before choosing AWS for anything with patient data, we should confirm what is allowed."},{"s":"Arun says: \"A PoC in silent mode for 6 weeks on retrospective DICOM studies before any clinical exposure.\" How do you explain it to Board member?","no":"","yes":"We would first test the tool quietly on past scans, without any doctor relying on it, to prove it is safe and accurate here before it touches a real patient."}]}</script><script>(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const KEY='mpshah-companion-v4';
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
S=Object.assign({dq:{},cq:{},sort:{},sim:{},si:0,yi:0,seg:'d',terms:{}},S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1700)}
const ymd=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysTo=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(ymd()+'T00:00:00'))/864e5);
const first=s=>{const i=s.indexOf('. ');return (i>20&&i<200?s.slice(0,i+1):s)};
const chip=s=>s.replace(/\s*\([^)]*\)\s*$/,'');
const NAVS=[['','🏠','Home'],['hospital','🏥','Hospital'],['learn','📖','Learn'],['practice','🎯','Practice']];
const top=(t,back)=>`<header class="top"><div>${back!=null?`<button class="back" data-go="${back}">‹ Back</button>`:''}<h1>${t}</h1></div><div style="display:flex;gap:8px"><button class="iconbtn" data-go="find" aria-label="Search">🔍</button><button class="iconbtn" data-act="settings" aria-label="Settings">⚙️</button></div></header>`;
const dDone=i=>{const a=S.dq[i]||{};return D.lessons[i].quiz.every((_,k)=>a[k]!=null)};
const cKey=(t,i)=>t+'-'+i;
const cDone=(t,i)=>{const a=S.cq[cKey(t,i)]||{};return D.tracks[t].items[i].qs.every((_,k)=>a[k]!=null)};
function mcq(q,ans,act,ids){const done=ans!=null;return `<div class="mq"><div class="q">${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<button data-act="${act}" ${ids} data-o="${k}" class="${done?(k===q.a?'right':k===ans?'wrong':''):''}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div>${done?`<div class="fb ${ans===q.a?'good':'bad'}">${ans===q.a?'👍 Right. ':'Not quite. '}${esc(q.w)}</div>`:''}</div>`}
const V={};

 const dd=D.lessons.filter((_,i)=>dDone(i)).length;let ct=0,cd=0;D.tracks.forEach((t,ti)=>t.items.forEach((_,i)=>{ct++;if(cDone(ti,i))cd++}));

 else if(a==='simstart'){const sc=D.sims[+d.i];S.simState={i:+d.i,at:sc.start,h:[]};save();go('sim')}
 else if(a==='simpick'){const st=S.simState,sc=D.sims[st.i],nd=sc.nodes[st.at],c=nd.c[+d.k];st.h.push({s:nd.s,q:nd.q,t:c.t,p:c.p,f:c.f});st.at=c.n;save();route();const ls=document.querySelectorAll('.fb');if(ls.length)ls[ls.length-1].scrollIntoView({block:'center'})}
 else if(a==='sortpick'){S.sort[Math.min(S.si,D.sort.length-1)]=d.b;save();keep()}
 else if(a==='sortnext'){S.si++;save();route()}
 else if(a==='sortreset'){S.sort={};S.si=0;save();route()}
 else if(a==='sayshow'){$('#sans').hidden=false;el.remove()}
 else if(a==='say'){S.yi=(S.yi||0)+ +d.d;save();route()}
 else if(a==='sayjump'){S.yi=+d.i;save();go('say')}
 else if(a==='settings'){const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div class="in"><h2 style="margin-top:0">Settings</h2><p class="muted">Your progress stays in this browser. Export a backup to move it to another device.</p><div style="display:grid;gap:10px"><button class="cta ghost" data-act="theme">Switch light / dark</button><button class="cta ghost" data-act="export">Export backup</button><label class="cta ghost" style="cursor:pointer">Import backup<input type="file" id="imp" accept="application/json" hidden></label><button class="cta ghost" data-act="wipe" style="color:var(--red)">Reset progress</button><button class="cta" data-act="closesheet">Done</button></div></div>`;s.addEventListener('click',ev=>{if(ev.target===s)s.remove()});document.body.appendChild(s)}
 else if(a==='closesheet'){const s=$('.sheet');if(s)s.remove()}
 else if(a==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('mpshah-theme',r.dataset.theme)}catch(x){}}
 else if(a==='export'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='mpshah-companion-backup.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup downloaded')}
 else if(a==='wipe'){if(confirm('Reset all progress on this device?')){try{localStorage.removeItem(KEY)}catch(x){}location.hash='#/';location.reload()}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#res').innerHTML=results(S.q)}});
document.addEventListener('change',e=>{if(e.target.id==='imp'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();toast('Backup imported');const s=$('.sheet');if(s)s.remove();route()}catch(x){toast('That file is not a valid backup')}};r.readAsText(e.target.files[0])}});
try{const t=localStorage.getItem('mpshah-theme');if(t)document.documentElement.dataset.theme=t}catch(x){}
route();
})();
