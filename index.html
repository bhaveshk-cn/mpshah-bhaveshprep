ne relies on it.\""},{"s":"Calling the schedule","no":"\"Our project plan\"","yes":"\"Our discovery plan\" or \"workshop plan\""},{"s":"Colleague is mid-question when you want to move on","no":"\"Sorry to cut you down, to save time...\"","yes":"Let the thread finish if the client is describing real pain. Note the time and catch up later."},{"s":"Client: \"We need AI\"","no":"\"Great, here are six use cases.\"","yes":"\"What outcome are you hoping AI will help you achieve?\""},{"s":"Arun says: \"Hospedia exposes read APIs only, through a nightly batch export. No FHIR.\" How do you explain it to Shiraz?","no":"","yes":"New tools could read Hospedia data but not update it, and only once a day. That works for dashboards and planning, but not for real-time alerts or anything that writes back. We should ask ITDose whether more is planned."},{"s":"Arun says: \"The model achieved 0.85 recall and 0.78 precision on the validation set.\" How do you explain it to CEO?","no":"","yes":"It caught about 85 of every 100 real cases in testing, and about three in four of its alerts were correct. The radiologist still reviews everything; it would help sort the queue, not replace judgement."},{"s":"Arun says: \"Patient master data has duplicate UHIDs; MPI deduplication is required before analytics.\" How do you explain it to CEO?","no":"","yes":"Some patients exist more than once in the system. Until we clean that up, any report on patient numbers or outcomes will be wrong, so it has to come first."},{"s":"Arun says: \"The integration would need a middleware layer with HL7 v2 listeners because the lab analysers do not support FHIR.\" How do you explain it to Head of Laboratory?","no":"","yes":"Your analysers speak an older standard, so we would need a small connecting system in between. It is common and workable, but it adds some setup time."},{"s":"Arun says: \"Data residency requirements under the DPA may restrict hosting PHI on AWS regions outside Kenya.\" How do you explain it to Shiraz?","no":"","yes":"Kenyan data protection rules may limit storing patient data in cloud centres outside Kenya. Before choosing AWS for anything with patient data, we should confirm what is allowed."},{"s":"Arun says: \"A PoC in silent mode for 6 weeks on retrospective DICOM studies before any clinical exposure.\" How do you explain it to Board member?","no":"","yes":"We would first test the tool quietly on past scans, without any doctor relying on it, to prove it is safe and accurate here before it touches a real patient."}]}</script><script>(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const KEY='mpshah-companion-v3';
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
S=Object.assign({dq:{},cq:{},sort:{},sim:{},si:0,yi:0,seg:'d',terms:{}},S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1700)}
const ymd=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysTo=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(ymd()+'T00:00:00'))/864e5);
const first=s=>{const i=s.indexOf('. ');return (i>20&&i<200?s.slice(0,i+1):s)};
const chip=s=>s.replace(/\s*\([^)]*\)\s*$/,'');
const NAVS=[['','🏠','Home'],['hospital','🏥','Hospital'],['learn','📖','Learn'],['practice','🎯','Practice']];
const top=(t,back)=>`<header class="top"><div>${back!=null?`<button class="back" data-go="${back}">‹ Back</button>`:''}<h1>${t}</h1></div><div style="display:flex;gap:8px"><button class="iconbtn" data-go="find" aria-label="Search">🔍</button><button class="iconbtn" data-act="settings" aria-label="Settings">⚙️</button></div></header>`;
const dDone=i=>{const a=S.dq[i]||{};return D.lessons[i].quiz.every((_,k)=>a[k]!=null)};
const cKey=(t,i)=>t+'-'+i;
const cDone=(t,i)=>{const a=S.cq[cKey(t,i)]||{};return D.tracks[t].items[i].qs.every((_,k)=>a[k]!=null)};
function mcq(q,ans,act,ids){const done=ans!=null;return `<div class="mq"><div class="q">${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<button data-act="${act}" ${ids} data-o="${k}" class="${done?(k===q.a?'right':k===ans?'wrong':''):''}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div>${done?`<div class="fb ${ans===q.a?'good':'bad'}">${ans===q.a?'👍 Right. ':'Not quite. '}${esc(q.w)}</div>`:''}</div>`}
const V={};
V.home=()=>{let n=daysTo('2026-10-12'),l='days to the remote week';if(n<=0){n=daysTo('2026-10-21');l='days to Nairobi'}if(n<=0){n=Math.max(0,daysTo('2026-11-15'));l='days left in discovery'}
 const dd=D.lessons.filter((_,i)=>dDone(i)).length;let ct=0,cd=0;D.tracks.forEach((t,ti)=>t.items.forEach((_,i)=>{ct++;if(cDone(ti,i))cd++}));
 let next=null;for(let ti=0;ti<D.tracks.length&&!next;ti++)for(let i=0;i<D.tracks[ti].items.length;i++)if(!cDone(ti,i)){next=[ti,i];break}
 const nd=D.depts.findIndex((_,i)=>!dDone(i));
 return `${top('Hi Bhavesh')}<div class="count"><b>${n}</b> ${l}</div>
 ${next?`<button class="today" data-go="concept/${next[0]}/${next[1]}"><small>Next idea to learn</small><h3>${esc(D.tracks[next[0]].items[next[1]].t)}</h3><span class="go">Learn it</span></button>`:''}
 <div class="tiles">
 <button class="tile t-teal" data-go="${nd>=0?'dept/'+nd:'hospital'}"><span class="em">🏥</span><div><b>Hospital</b><span>${dd} of ${D.depts.length} departments learned</span></div></button>
 <button class="tile t-amber" data-go="learn"><span class="em">📖</span><div><b>Learn</b><span>${cd} of ${ct} ideas understood</span></div></button>
 <button class="tile t-violet wide" data-go="practice"><span class="em">🎯</span><div><b>Practice</b><span>Rehearse real conversations and decisions</span></div></button></div>
 <button class="search" data-go="find">🔍 Look up a term, department or person</button>`};
V.hospital=()=>{const seg=S.seg;const dd=D.lessons.filter((_,i)=>dDone(i)).length;
 const items=seg==='p'?D.people.map((p,i)=>`<button class="pick" data-go="person/${i}"><span class="em">${p.i}</span><b>${esc(p.n)}</b><span>${esc(p.r)}</span></button>`):D.depts.map((x,i)=>`<button class="pick" data-go="dept/${i}">${dDone(i)?'<span class="done-badge">✅</span>':''}<span class="em">${D.icons[i]}</span><b>${esc(x.n)}</b></button>`);
 return `${top('The hospital')}<p class="muted">${seg==='p'?'The people you will work with, and how to approach them.':`Learn each department from zero: what it is, how a day works, the words, what breaks. ${dd} of ${D.depts.length} done.`}</p><div class="seg"><button data-act="seg" data-v="d" class="${seg!=='p'?'on':''}">Departments</button><button data-act="seg" data-v="p" class="${seg==='p'?'on':''}">People</button></div><div class="grid g3">${items.join('')}</div>`};
V.dept=(i)=>{i=+i;const x=D.depts[i],L=D.lessons[i];if(!x)return V.hospital();const a=S.dq[i]||{};const right=L.quiz.filter((q,k)=>a[k]===q.a).length;const sec=(n,t)=>`<div class="lbl"><span class="secnum">${n}</span>${t}</div>`;
 return `${top('','hospital')}<div class="bhead"><span class="em">${D.icons[i]}</span><div><h1>${esc(x.n)}</h1><span class="muted">Department ${i+1} of ${D.depts.length}</span></div></div>
 <div class="card">${sec(1,'In plain words')}<p class="analogy">${esc(L.a)}</p><p class="muted" style="margin:0"><b>Why it matters:</b> ${esc(L.why)}</p></div>
 <div class="card">${sec(2,'How a day works here')}<ol class="steps">${L.steps.map((s,k)=>`<li data-n="${k+1}"><b>${esc(s[0])}</b><span class="pill">${esc(s[1])}</span><span class="pill sys">${esc(s[2])}</span></li>`).join('')}</ol></div>
 <div class="card">${sec(3,'Words you will hear')}<p class="muted" style="font-size:.88rem">Tap a word to see what it means. Try to guess first.</p>${L.terms.map((t,k)=>{const o=S.terms[i+'-'+k];return `<button class="term" data-act="term" data-k="${i}-${k}"><b>${esc(t[0])}</b>${o?`<span>${esc(t[1])}</span>`:'<span class="hint">Tap to reveal</span>'}</button>`}).join('')}</div>
 <div class="card">${sec(4,'What usually goes wrong')}<ul style="padding-left:18px;margin:0">${L.wrong.map(w=>`<li style="margin-bottom:6px">${esc(w)}</li>`).join('')}</ul></div>
 <div class="card">${sec(5,'What MP Shah evidence says')}<p class="muted" style="font-size:.85rem">From Kaizen, the Hospedia gap register and our calls. Client-reported unless stated.</p>${x.ev.slice(0,4).map(e=>`<div class="ev">${esc(first(e))}</div>`).join('')}</div>
 <div class="card">${sec(6,'Where technology helps, and what kind')}${x.opp.map(o=>`<div class="opp"><b>${esc(o[0])}</b><br><span class="pill v">${esc(o[1])}</span><div class="muted" style="font-size:.88rem;margin-top:4px">${esc(o[2])}</div></div>`).join('')}</div>
 <div class="card">${sec(7,'Check yourself')}${L.quiz.map((q,k)=>mcq(q,a[k],'dq',`data-i="${i}" data-k="${k}"`)).join('')}${dDone(i)?`<div class="fb good" style="margin-top:14px">✅ Lesson complete: ${right} of ${L.quiz.length} right.</div>`:''}</div>
 <div class="card">${sec(8,'Before you meet them')}<div class="lbl" style="margin-top:6px">❓ Ask these first</div><ol class="ask">${x.q.slice(0,5).map(q=>`<li>${esc(q)}</li>`).join('')}</ol><div class="avoid" style="margin:12px 0 0"><div class="lbl">⛔ Avoid</div>${x.red.map(r=>`<p style="margin:0 0 4px">${esc(r)}</p>`).join('')}</div><p class="muted" style="margin:10px 0 0;font-size:.88rem">From our side: ${esc(x.lead)}</p></div>
 <div class="row"><button class="cta ghost" data-go="dept/${(i+D.depts.length-1)%D.depts.length}">Previous</button><button class="cta teal" data-go="dept/${(i+1)%D.depts.length}">Next department</button></div>`};
V.person=(i)=>{const p=D.people[+i];if(!p)return V.hospital();
 return `${top('','hospital')}<div class="bhead"><span class="em">${p.i}</span><div><h1>${esc(p.n)}</h1><span class="muted">${esc(p.r)}</span></div></div>
 <div class="card"><div class="lbl">💡 What we know</div><ul style="padding-left:18px;margin:0">${p.know.map(x=>`<li style="margin-bottom:6px">${esc(x)}</li>`).join('')}</ul></div>
 <div class="card"><div class="lbl">❓ Good questions for them</div><ol class="ask">${p.ask.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
 <div class="card"><div class="lbl">👂 Listen for</div><div class="chips">${p.listen.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>
 <div class="avoid"><div class="lbl">⛔ Avoid</div>${p.avoid.map(x=>`<p style="margin:0 0 4px">${esc(x)}</p>`).join('')}</div>`};
V.learn=()=>`${top('Learn')}<p class="muted">Short ideas you need for MP Shah. Each one: a plain explanation, an everyday comparison, how it looks in a hospital, why it matters at MP Shah, and two questions to check yourself.</p>${D.tracks.map((t,ti)=>{const n=t.items.length,d=t.items.filter((_,i)=>cDone(ti,i)).length;return `<button class="deck" data-go="track/${ti}"><span style="font-size:1.8rem">${t.e}</span><div style="flex:1"><b>${esc(t.t)}</b><span>${d} of ${n} ideas</span><div class="trackbar"><i style="width:${d/n*100}%"></i></div></div></button>`}).join('')}`;
V.track=(ti)=>{const t=D.tracks[+ti];if(!t)return V.learn();return `${top(esc(t.t),'learn')}${t.items.map((c,i)=>`<button class="deck" data-go="concept/${ti}/${i}"><span style="font-size:1.4rem">${cDone(+ti,i)?'✅':'⚪'}</span><div><b>${esc(c.t)}</b><span>${esc(c.s.length>80?c.s.slice(0,78)+'...':c.s)}</span></div></button>`).join('')}`};
V.concept=(ti,i)=>{ti=+ti;i=+i;const t=D.tracks[ti],c=t&&t.items[i];if(!c)return V.learn();const a=S.cq[cKey(ti,i)]||{};
 let nx=null;if(i<t.items.length-1)nx=`concept/${ti}/${i+1}`;else if(ti<D.tracks.length-1)nx=`concept/${ti+1}/0`;
 return `${top('',`track/${ti}`)}<div class="slide c-${t.c}" style="min-height:auto;padding:26px 22px;margin-bottom:14px"><span style="opacity:.85;font-weight:700;font-size:.85rem">${esc(t.t)}, ${i+1} of ${t.items.length}</span><h3 style="margin-top:8px">${esc(c.t)}</h3><p>${esc(c.s)}</p></div>
 <div class="card concept"><h3>🧠 Think of it like</h3><p class="analogy" style="margin:0">${esc(c.an)}</p></div>
 <div class="card concept"><h3>🏥 In a hospital</h3><p style="margin:0">${esc(c.h)}</p></div>
 <div class="card concept" style="background:var(--amberbg)"><h3>📍 At MP Shah</h3><p style="margin:0">${esc(c.m)}</p></div>
 <div class="card concept"><h3>✏️ Check yourself</h3>${c.qs.map((q,k)=>mcq(q,a[k],'cq',`data-t="${ti}" data-i="${i}" data-k="${k}"`)).join('')}</div>
 <div class="row"><button class="cta ghost" data-go="track/${ti}">All in this track</button>${nx?`<button class="cta teal" data-go="${nx}">Next idea</button>`:`<button class="cta teal" data-go="learn">Finish</button>`}</div>`};
V.practice=()=>{const sr=Object.keys(S.sort).length;
 return `${top('Practice')}<p class="muted">Rehearse the moments that matter before they happen.</p>
 <button class="pcard t-indigo" data-go="sims"><span class="em">💬</span><div><b>Conversation simulator</b><span>${D.sims.length} real situations. Pick what you would say, get feedback.</span></div></button>
 <button class="pcard t-violet" data-go="sort"><span class="em">🤖</span><div><b>Is it really AI?</b><span>${sr} of ${D.sort.length} answered. Stop reaching for AI by reflex.</span></div></button>
 <button class="pcard t-amber" data-go="say"><span class="em">🗣️</span><div><b>What would you say?</b><span>Tricky questions and how to answer them well.</span></div></button>
 <button class="pcard t-teal" data-go="mix"><span class="em">🎲</span><div><b>Mixed quiz</b><span>10 random questions from everything you have learned.</span></div></button>`};
V.mix=()=>{if(!S.mixQ||S.mixDone){const pool=[];D.lessons.forEach((L,i)=>L.quiz.forEach((q,k)=>pool.push({...q,src:D.depts[i].n})));D.tracks.forEach(t=>t.items.forEach(c=>c.qs.forEach(q=>pool.push({...q,src:c.t}))));for(let j=pool.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[pool[j],pool[r]]=[pool[r],pool[j]]}S.mixQ=pool.slice(0,10);S.mixA={};S.mixI=0;S.mixDone=false;save()}
 const i=S.mixI,q=S.mixQ[i],a=S.mixA[i];
 if(i>=S.mixQ.length){const r=S.mixQ.filter((q,k)=>S.mixA[k]===q.a).length;S.mixDone=true;save();return `${top('Mixed quiz','practice')}<div class="card" style="text-align:center"><div style="font-size:2.6rem;font-weight:800;color:var(--teal)">${r} / 10</div><p>${r>=8?'Strong. You are ready to hold your own in the room.':'Revisit the topics you missed in Hospital and Learn.'}</p></div><button class="cta" data-go="mix">Another 10</button>`}
 return `${top('Mixed quiz','practice')}<div class="meter"><i style="width:${i*10}%"></i></div><p class="muted">${i+1} of 10. From: ${esc(q.src)}</p><div class="qcard">${mcq(q,a,'mixq','')}</div>${a!=null?`<button class="cta" data-act="mixnext">${i<9?'Next':'See my score'}</button>`:''}`};
V.sims=()=>`${top('Simulator','practice')}<p class="muted">Client responses are practice, not MP Shah facts.</p>${D.sims.map((s,i)=>`<button class="deck" data-act="simstart" data-i="${i}"><span style="font-size:1.6rem">💬</span><div><b>${esc(s.title)}</b><span>${S.sim[s.id]!=null?'Best score '+S.sim[s.id]:esc(s.intro)}</span></div></button>`).join('')}`;
V.sim=()=>{const st=S.simState;if(!st)return V.sims();const sc=D.sims[st.i],nd=sc.nodes[st.at];
 const hist=st.h.map(h=>`<div class="bubble"><small>${esc(h.s)}</small>${esc(h.q)}</div><div class="me">${esc(h.t)}</div><div class="fb ${h.p===2?'good':h.p===1?'mid':'bad'}" style="margin:0 0 14px">${h.p===2?'👍 ':h.p===1?'👌 ':'⚠️ '}${esc(h.f)}</div>`).join('');
 if(nd.end){const sc2=st.h.reduce((a,h)=>a+h.p,0),mx=st.h.length*2;if(S.sim[sc.id]==null||sc2>S.sim[sc.id]){S.sim[sc.id]=sc2;save()}
  return `${top('Simulator','sims')}<h2 style="margin-top:0">${esc(sc.title)}</h2>${hist}<div class="card" style="text-align:center"><div style="font-size:2.4rem;font-weight:800;color:var(--teal)">${sc2} / ${mx}</div><p>${sc2>=mx-1?'Strong. You stayed on the problem and routed work to the right owner.':'Look at the ⚠️ moments: usually a solution too early, or a commitment beyond your role.'}</p></div><div class="row"><button class="cta" data-act="simstart" data-i="${st.i}">Try again</button><button class="cta ghost" data-go="sims">Other situations</button></div>`}
 return `${top('Simulator','sims')}<h2 style="margin-top:0">${esc(sc.title)}</h2><p class="muted">${esc(sc.intro)}</p>${hist}<div class="bubble"><small>${esc(nd.s)}</small>${esc(nd.q)}</div><div class="lbl">What do you say?</div><div class="opts">${nd.c.map((c,k)=>`<button data-act="simpick" data-k="${k}">${esc(c.t)}</button>`).join('')}</div>`};
V.sort=()=>{const i=Math.min(S.si,D.sort.length-1),c=D.sort[i],a=S.sort[i];const right=Object.entries(S.sort).filter(([k,v])=>D.sort[k].a===v).length,done=Object.keys(S.sort).length;
 if(done===D.sort.length&&S.si>=D.sort.length)return `${top('Is it really AI?','practice')}<div class="card" style="text-align:center"><div style="font-size:2.6rem;font-weight:800;color:var(--violet)">${right} / ${D.sort.length}</div><p>Notice how few problems actually needed AI.</p></div><button class="cta" data-act="sortreset">Play again</button>`;
 return `${top('Is it really AI?','practice')}<div class="meter"><i style="width:${done/D.sort.length*100}%"></i></div><p class="muted">${i+1} of ${D.sort.length}. What is the best fix?</p>
 <div class="qcard"><div class="q">${esc(c.x)}</div><div class="opts">${D.buckets.map(b=>`<button data-act="sortpick" data-b="${esc(b)}" class="${a?(b===c.a?'right':b===a?'wrong':''):''}" ${a?'disabled':''}>${esc(b)}</button>`).join('')}</div>${a?`<div class="fb ${a===c.a?'good':'bad'}">${a===c.a?'👍 Right. ':'Best fit: '+esc(c.a)+'. '}${esc(c.w)}</div>`:''}</div>
 ${a?`<button class="cta" data-act="sortnext">${i<D.sort.length-1?'Next problem':'See my score'}</button>`:''}`};
V.say=()=>{const L=D.sayAll,i=((S.yi%L.length)+L.length)%L.length,c=L[i];
 return `${top('What would you say?','practice')}<p class="muted">${i+1} of ${L.length}. Think of your answer first, then reveal.</p><div class="qcard say"><div class="q">${esc(c.s)}</div><button class="cta ghost" data-act="sayshow">Show the answer</button><div id="sans" hidden>${c.no?`<div class="no"><b>Avoid:</b> ${esc(c.no)}</div>`:''}<div class="yes"><b>Say:</b> ${esc(c.yes)}</div></div></div>
 <div class="row"><button class="cta ghost" data-act="say" data-d="-1">Previous</button><button class="cta" data-act="say" data-d="1">Next</button></div>`};
V.find=()=>`${top('Look up','')}<input type="search" id="q" placeholder="Try: PACS, discharge, Shiraz, pre-authorisation" value="${esc(S.q||'')}"><div id="res" style="margin-top:12px">${results(S.q||'')}</div>`;
function results(q){q=q.trim().toLowerCase();if(q.length<2)return '<p class="muted">Search terms, departments, people, ideas and phrases.</p>';
 const out=[];const m=s=>String(s).toLowerCase().includes(q);
 D.people.forEach((p,i)=>{if(m(p.n)||m(p.r))out.push(`<button class="res" data-go="person/${i}"><small>Person</small><br><b>${p.i} ${esc(p.n)}</b><br><span class="muted">${esc(p.r)}</span></button>`)});
 D.depts.forEach((x,i)=>{if(m(x.n)||m(x.what)||D.lessons[i].terms.some(t=>m(t[0])))out.push(`<button class="res" data-go="dept/${i}"><small>Department</small><br><b>${D.icons[i]} ${esc(x.n)}</b></button>`)});
 D.tracks.forEach((t,ti)=>t.items.forEach((c,i)=>{if(m(c.t)||m(c.s))out.push(`<button class="res" data-go="concept/${ti}/${i}"><small>Idea</small><br><b>📖 ${esc(c.t)}</b><br><span class="muted">${esc(c.s)}</span></button>`)}));
 const seen=new Set();D.gloss.forEach(g=>{if((m(g[0])||m(g[1]))&&!seen.has(g[0].toLowerCase())){seen.add(g[0].toLowerCase());out.push(`<div class="res" style="cursor:default"><small>Term</small><br><b>${esc(g[0])}</b><br>${esc(g[1])}</div>`)}});
 D.sayAll.forEach((c,i)=>{if(m(c.s)||m(c.yes))out.push(`<button class="res" data-act="sayjump" data-i="${i}"><small>What to say</small><br><b>🗣️ ${esc(c.s)}</b></button>`)});
 return out.length?out.slice(0,40).join(''):'<p class="muted">Nothing found. Try a shorter word.</p>'}
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');const k=p[0]||'home';let h;
 if(k==='dept')h=V.dept(p[1]);else if(k==='person')h=V.person(p[1]);else if(k==='track')h=V.track(p[1]);else if(k==='concept')h=V.concept(p[1],p[2]);else h=(V[k]||V.home)();
 $('#app').innerHTML=h;const map={dept:'hospital',person:'hospital',track:'learn',concept:'learn',sims:'practice',sim:'practice',sort:'practice',say:'practice',mix:'practice',find:'none',home:''};const cur=map[k]!==undefined?map[k]:k;
 $('#bn').innerHTML=NAVS.map(([r,e,l])=>`<a href="#/${r}" class="${cur===r?'on':''}"><span class="em">${e}</span>${l}</a>`).join('');window.scrollTo(0,0)}
const go=r=>{const h='#/'+r;if(location.hash===h)route();else location.hash=h};
const keep=()=>{const y=window.scrollY;route();window.scrollTo(0,y)};
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!g.disabled){go(g.dataset.go);return}
 const an=e.target.closest('nav.bottom a');if(an&&an.getAttribute('href')===location.hash){e.preventDefault();route();return}
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,d=el.dataset;
 if(a==='seg'){S.seg=d.v;save();route()}
 else if(a==='term'){S.terms[d.k]=!S.terms[d.k];save();keep()}
 else if(a==='dq'){S.dq[d.i]=S.dq[d.i]||{};S.dq[d.i][d.k]=+d.o;save();keep();if(dDone(+d.i))toast('Department lesson complete')}
 else if(a==='cq'){const k=cKey(d.t,d.i);S.cq[k]=S.cq[k]||{};S.cq[k][d.k]=+d.o;save();keep()}
 else if(a==='mixq'){S.mixA[S.mixI]=+d.o;save();keep()}
 else if(a==='mixnext'){S.mixI++;save();route()}
 else if(a==='simstart'){const sc=D.sims[+d.i];S.simState={i:+d.i,at:sc.start,h:[]};save();go('sim')}
 else if(a==='simpick'){const st=S.simState,sc=D.sims[st.i],nd=sc.nodes[st.at],c=nd.c[+d.k];st.h.push({s:nd.s,q:nd.q,t:c.t,p:c.p,f:c.f});st.at=c.n;save();route();const ls=document.querySelectorAll('.fb');if(ls.length)ls[ls.length-1].scrollIntoView({block:'center'})}
 else if(a==='sortpick'){S.sort[Math.min(S.si,D.sort.length-1)]=d.b;save();keep()}
 else if(a==='sortnext'){S.si++;save();route()}
 else if(a==='sortreset'){S.sort={};S.si=0;save();route()}
 else if(a==='sayshow'){$('#sans').hidden=false;el.remove()}
 else if(a==='say'){S.yi=(S.yi||0)+ +d.d;save();route()}
 else if(a==='sayjump'){S.yi=+d.i;save();go('say')}
 else if(a==='settings'){const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div class="in"><h2 style="margin-top:0">Settings</h2><p class="muted">Your progress stays in this browser. Export a backup to move it to another device.</p><div style="display:grid;gap:10px"><button class="cta ghost" data-act="theme">Switch light / dark</button><button class="cta ghost" data-act="export">Export backup</button><label class="cta ghost" style="cursor:pointer">Import backup<input type="file" id="imp" accept="application/json" hidden></label><button class="cta ghost" data-act="wipe" style="color:var(--red)">Reset progress</button><button class="cta" data-act="closesheet">Done</button></div></div>`;s.addEventListener('click',ev=>{if(ev.target===s)s.remove()});document.body.appendChild(s)}
 else if(a==='closesheet'){const s=$('.sheet');if(s)s.remove()}
 else if(a==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('mpshah-theme',r.dataset.theme)}catch(x){}}
 else if(a==='export'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='mpshah-companion-backup.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup downloaded')}
 else if(a==='wipe'){if(confirm('Reset all progress on this device?')){try{localStorage.removeItem(KEY)}catch(x){}location.hash='#/';location.reload()}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#res').innerHTML=results(S.q)}});
document.addEventListener('change',e=>{if(e.target.id==='imp'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();toast('Backup imported');const s=$('.sheet');if(s)s.remove();route()}catch(x){toast('That file is not a valid backup')}};r.readAsText(e.target.files[0])}});
try{const t=localStorage.getItem('mpshah-theme');if(t)document.documentElement.dataset.theme=t}catch(x){}
route();
})();
</script></body></html>
