nt pipeline","Performance reviews"],"strat":["People-Centred Culture is one of three strategic enablers","\"Employer of choice\": transparent pay bands, recognition, career pathways","Workforce capability: specialist recruitment, CPD, COSECSA/ECSACOP fellowships, Nursing Clinical Excellence Academy","High-performance culture with performance metrics reported quarterly to the Board","Wellbeing: burnout prevention, flexible scheduling, mental-health support"],"hosp":["HR module: jobs, recruitment, employee details, leave, performance, disciplinary and grievance, payroll, separation","Data migration from EnQuest HR and Payroll, including P9 reports and payslips"],"gap":["No separate HR section in the gap register extract; HR scope comes mainly from the contract and the strategy"],"said":["An HR assistant was one of our earlier ideas, not a client request. It needs evidence of real query volume first"],"kz":["Kaizen: inadequate sonographer coverage; need 4 per day (ID 45)."]},{"a":"Like a warehouse and purchasing team for a small city: buy, receive, store, issue, count, reorder.","why":"Stock-outs delay care; expired stock wastes money; equipment downtime stops services.","steps":[["Requisition raised","Department","Procurement module"],["Purchase order approved","Procurement","LPO"],["Goods received (GRN)","Stores","Inventory"],["Stock issued to departments","Stores","Inventory"],["Stock counted","Stores","Stock take"],["Reorder triggered","Stores","Reorder levels"]],"terms":[["LPO","Local purchase order"],["GRN","Goods received note"],["Reorder level","Stock level that triggers a new order"],["Stock take","Physical count of stock"],["Preventive maintenance","Scheduled servicing to avoid breakdowns"]],"wrong":["System stock differs from shelf stock","Transaction errors and rollbacks","Equipment breaks without planned maintenance"],"quiz":[{"q":"Forecasting on unreliable stock data will:","o":["Give wrong forecasts","Fix the data","Work fine"],"a":0,"w":"Fix data accuracy first."},{"q":"GRN means:","o":["Goods received note","General revenue number","Grand request note"],"a":0,"w":"Proof goods arrived."},{"q":"Frequent \"rolled back\" errors are:","o":["A vendor system issue to log via ICT","A staff training issue only","An AI opportunity"],"a":0,"w":"Escalate through ICT to ITDose."},{"q":"The capex team wants an existing in-house app:","o":["Embedded into Hospedia","Kept forever outside"],"a":0,"w":"To reduce apps outside the system."},{"q":"Repeated transactions after a \"roll back\" are:","o":["A data integrity defect","A training topic only"],"a":0,"w":"Escalate through ICT."}],"roles":[["Procurement officer","Purchase requests, quotations, LPOs"],["Storekeeper","Receipts (GRN), issues, stock-takes"],["Capex / projects team","Asset requisitions and disposals"],["Biomedical engineer","Equipment maintenance and work orders"]],"data":["Purchase requests, quotations, orders","Goods received, issues, returns","Stock by store, batch and expiry","Fixed assets and depreciation","Equipment maintenance logs and contracts"],"strat":["Sustainability: \"disciplined infrastructure and capital planning\"","Strategy: capacity constrained by \"specialist equipment\"; investments must pass affordability tests"],"hosp":["Procurement Management: purchase requests, purchase orders, quotations and comparative study","Inventory Management: GRN, issues to departments and patients, returns, indents, stock ledger, bin card","Fixed Asset Management: acquisition, relocation, disposal, depreciation, verification, barcoding","Equipment Maintenance and Contract Management: equipment and licence masters, AMC scanning, renewal alerts"],"gap":["Defects in medical stores: transactions repeat after \"roll back\", duplicates not flagged, mandatory fields lost after saving, expiry dates changing, decimal rounding errors","Non-medical: emailing LPOs, stock-take module, reorder levels, e-signature on LPO approval, services as a separate category","Capex: embed the existing Power App built in-house (capex requisition, asset disposal) into Hospedia","Capex: approver layers, budget consumption at acquisition, insurance claims from the asset system, contract expiry alerts, preventive maintenance","Biomedical: equipment tracking, work orders with SLAs, material and labour costs"],"said":["MP Shah already builds internal apps on Power Platform; Shiraz will share their scope"],"kz":["Kaizen: end-of-life ultrasound machine with around 2 hours downtime (ID 39)."]},{"a":"Like the housekeeping, kitchen and facilities teams in a hotel: invisible when good, the first complaint when bad.","why":"Food, cleanliness and parking are among the most frequent patient complaints at MP Shah.","steps":[["Meal ordered for patient","Ward","Catering module"],["Meal prepared and delivered","Kitchen","Catering module"],["Cleaning scheduled","Housekeeping","Schedules"],["Linen collected and returned","Laundry","Linen module"],["Feedback collected","Ward / kitchen","Forms"]],"terms":[["Nil by mouth","Patient must not eat or drink"],["Diet order","Meal type set by clinicians"],["Turnaround","Time to return clean linen or a cleaned room"]],"wrong":["Cold or poor food","Dirty linen","Meals sent to discharged or nil-by-mouth patients","Parking and wayfinding problems"],"quiz":[{"q":"Serving food to a nil-by-mouth patient is mainly a:","o":["Safety risk solvable with system flags","Taste problem","Parking problem"],"a":0,"w":"A flag in the system prevents it."},{"q":"Most catering complaints are about:","o":["Food quality and temperature","Software","Pricing"],"a":0,"w":"Often not a technology problem."},{"q":"The right instinct here is:","o":["Do not over-technologise quality and staffing problems","Build an app for everything","Ignore it"],"a":0,"w":"Fix what is really broken."},{"q":"Hospedia housekeeping and maintenance modules are in:","o":["Phase 2","Phase 1"],"a":0,"w":"Per Shiraz."},{"q":"The \"Hospotel\" idea in the strategy is about:","o":["Hospitality standards in patient care","A hotel business"],"a":0,"w":"Patient-Centric Care."}],"roles":[["Catering manager and chefs","Menus, diets, meal production"],["Dietitian / nutritionist","Clinical diets"],["Housekeeping","Cleaning and room turnaround"],["Laundry","Linen"],["Facilities and transport","Parking, maintenance, ambulances"]],"data":["Diet orders and meal issues","Patient meal feedback","Cleaning schedules","Linen issues and returns","Ambulance movements"],"strat":["Patient-Centric Care: \"incorporating appropriate hospitality principles into healthcare delivery\" and the Hospotel model","HEAL: every non-clinical touchpoint should support healing"],"hosp":["Dietary and Nutritionist: components, menus, diets, issuing by time slot","Linen and Laundry: machines, processing, issue and return, discards","Ambulatory and Transport: ambulance register, tracking, patient shifting","Maintenance and housekeeping modules moved to Phase 2 (Shiraz)"],"gap":["Catering tablets on each ward to order, issue and receive meals","Patients order meals from the patient app","Production report by ward and component","Block meals for discharged and nil-by-mouth patients until the flag is removed","Separate guardian meals (paediatric guardians not charged)","Recipes and costing with automatic stock deduction","Meal feedback before, during and after meals; reasons when meals are not eaten"],"said":[],"kz":["Food quality, cleanliness and linen, parking and navigation repeatedly flagged (Kaizen IDs 57 to 59; many verbatims)."]},{"a":"Like the IT department in any large company, but with life-critical systems that cannot go down.","why":"Every digital change depends on ICT. They own systems, vendors, security and the Hospedia rollout.","steps":[["Requests and incidents logged","Users","Ticketing"],["Support and fixes","ICT team","Systems"],["Vendor coordination","CIO","Contracts"],["Security and access control","ICT","AD"],["Backups and infrastructure","ICT","Servers"]],"terms":[["CIO","Chief Information Officer"],["AD / SSO","One login across systems"],["Sandbox","Safe test copy of a system"],["On-premise","Servers in the hospital"],["Data residency","Where data is physically stored"]],"wrong":["Heavy dependency on vendors for changes","No test environment","Data spread across old and new systems"],"quiz":[{"q":"With ICT, technical commitments should come from:","o":["Arun","You, to sound confident","The client"],"a":0,"w":"Coordinate; do not absorb."},{"q":"A sandbox is:","o":["A safe test environment","A backup","A server room"],"a":0,"w":"Test without risk."},{"q":"Why does data residency matter at MP Shah?","o":["Kenyan data protection rules may limit where patient data is stored","It does not","For speed only"],"a":0,"w":"Relevant to any cloud hosting."},{"q":"ICT asked for Hospedia hosting on:","o":["AWS","Only paper"],"a":0,"w":"Aurora, CloudFront, S3."},{"q":"Where is the HMIS hosted today?","o":["On MP Shah servers at the main hospital","In India"],"a":0,"w":"Per Shiraz."}],"roles":[["CIO","Runs IT and the Hospedia implementation (name to confirm)"],["Shiraz Dadar","ICT department; leads AI adoption"],["Systems and application team","Configuration, support, vendor liaison"],["Infrastructure and security","Servers, network, backups, access"]],"data":["System and integration inventory","User accounts and roles","Databases: old Kranium, current Kranium, Hospedia","Logs and audit trails","Backups"],"strat":["Data and Digitisation enabler: integrate platforms, data quality and governance, cybersecurity, privacy and resilience, workforce digital capability","\"Digital transformation should reinforce each differentiator rather than operate as a separate technology programme\""],"hosp":["IT Software Administration: user creation, role and rights configuration, masters, database backups, L1 support tools","Ticketing Management for support requests"],"gap":["Access to all masters and configuration; full database access; ability to handle basic configuration in-house","Cloud deployment, AWS if possible: Aurora database, CloudFront application, S3 storage","Group-level rights overriding individual rights; Active Directory authentication","Granular security per feature; detailed audit log; restrict access by IP address; self-service password reset","Redefine clinics, departments and doctors; merge and clean billing categories","Statistics and a daily dashboard (occupancy, revenue, exceptions); waiting-time TAT for every service point"],"said":["One system for all branches on fibre, one database, hosted at the main hospital","Planning a central data lake independent of any HMIS","Deciding whether 16 years of EMR history goes into Hospedia or stays accessible by API","Microsoft 365 Copilot in use; paid generative AI tool used by Shiraz","Kenya Data Protection Act and Digital Health Agency requirements apply"],"kz":[]},{"a":"Like a factory's continuous improvement team: measure, find the cause, fix, check, repeat.","why":"MP Shah has an existing improvement culture (JCI, daily Kaizen boards). Build on it, never around it.","steps":[["KPIs measured","Quality team","Manual / reports"],["Daily Kaizen board reviews","Unit managers","Boards"],["Concern, cause, countermeasure (3C)","Teams","Boards"],["Actions tracked","Quality office","Tracker"],["Audits for JCI","Quality team","Audit tools"]],"terms":[["JCI","Joint Commission International accreditation"],["Kaizen","Continuous improvement"],["3C","Concern, Cause, Countermeasure"],["CSAT","Customer satisfaction score"],["Quick win","Improvement with no capital spend"]],"wrong":["KPIs counted manually","Customer-centric KPIs missing","Post-visit follow-up has no owner"],"quiz":[{"q":"The Board was told to close quick wins:","o":["Before committing capital to large investments","After buying new systems","Never"],"a":0,"w":"Respect this sequencing in our roadmap."},{"q":"\"We count it manually for the board\" signals:","o":["A dashboard opportunity","An AI opportunity","Nothing"],"a":0,"w":"Analytics."},{"q":"Our attitude to the Kaizen study should be:","o":["Build on it visibly","Redo it","Ignore it"],"a":0,"w":"Respect existing work."},{"q":"Which three quality metrics does the strategy name?","o":["Falls, pressure ulcers, medication errors","Revenue, parking, food"],"a":0,"w":"Under Data and Digitisation."},{"q":"JCI-related requests in the gap register include:","o":["Nursing templates","Dark mode"],"a":0,"w":"Nursing section."}],"roles":[["Quality improvement officer (QIO)","Quality programmes and KPIs"],["Quality and risk management (QIRM)","Incidents, risk, audits"],["Unit managers","Run daily improvement boards"],["Patient experience team","Feedback and complaints"]],"data":["KPIs and audit results","Incidents and near misses","Patient satisfaction and complaints","Improvement actions and owners"],"strat":["Strength: \"an established culture of incident reporting and continuous quality improvement\"","Clinical Excellence: \"embed quality, safety and clinical governance in every service\"","Quality metrics to track: patient falls, pressure ulcers, medication errors","JCI accreditation underpins the brand"],"hosp":["No dedicated quality module in the contract list; quality data comes from clinical modules","Algus QMS (reported in our plan) for incidents, audits and documents: to validate"],"gap":["OT incident reporting form","Audit trails across clinical modules (doctors, radiology, finance)","Nursing templates required for JCI accreditation"],"said":["A patient journey study by Kaizen Institute produced a Board report and action tracker; it is one input among several"],"kz":["Kaizen: 59 to 62 tracked actions with owners; 18 quick wins to close within a quarter."]}],"tracks":[{"t":"MP Shah in context","e":"🏛️","c":"indigo","items":[{"t":"The hospital and its network","s":"MP Shah is a JCI-accredited tertiary hospital in Nairobi, founded in the 1930s, with satellite clinics around the city.","deep":"MP Shah began as a community hospital and grew into a tertiary institution, meaning it treats complex cases referred from elsewhere. It runs a flagship campus plus satellite clinics, which the Hospedia contract lists as Nairobi CBD, Spring Valley, Village Market and The Hub, with more planned. All branches share one system and one patient database, linked by fibre. The strategy plans a hub-and-spoke network: smaller clinics for access, the flagship protected for complex care.","keys":["Tertiary means complex, specialist and referral care","One database across all branches, distinguished only by location","Satellite clinics are the \"spokes\"; the main hospital is the \"hub\"","JCI accreditation is central to its brand and its standards"],"an":"Like a main airport hub with smaller regional airports feeding into it.","h":"A patient seen at a satellite clinic for a scan should have the same record and images available at the main hospital.","m":"Any solution we propose must work across all branches, on one patient identity, and respect JCI standards.","mist":["Treating MP Shah as a single building rather than a network","Forgetting that new branches are planned, so solutions must scale"],"ask":["Which services are offered at each satellite clinic?","How do patients and records move between branches today?"],"qs":[{"q":"A tertiary hospital mainly:","o":["Provides complex and referral care","Only runs pharmacies"],"a":0,"w":"Specialist level."},{"q":"MP Shah's branches share:","o":["One system and one database","Separate systems per branch"],"a":0,"w":"Per Shiraz."},{"q":"The hub-and-spoke model protects the flagship for:","o":["Tertiary and complex care","Parking"],"a":0,"w":"Strategy wording."}]},{"t":"Strategy 2026 to 2031","s":"Two pillars, three enablers, three phases, and one investment test.","deep":"The strategy's two pillars are Clinical Excellence and Patient-Centric Care: they define the value delivered to patients. Three enablers make delivery sustainable: People-Centred Culture, Data and Digitisation, and Sustainability. Delivery runs in three phases: Fix and Transform (core systems, governance, foundations), Scale and Grow (capacity, diagnostics, digital adoption), and Market Leadership (international services, mature analytics and AI-enabled care). Every significant investment is tested on clinical impact, patient safety, affordability, operational feasibility and sustainable value.","keys":["Pillars: Clinical Excellence; Patient-Centric Care","Enablers: People-Centred Culture; Data and Digitisation; Sustainability","Phases: Fix and Transform, then Scale and Grow, then Market Leadership","AI is an enabler, not a substitute for clinical accountability","Digital must reinforce differentiators, not run as a separate programme"],"an":"Like a company's five-year plan: what customers get (pillars), what makes it possible (enablers), and the order of play (phases).","h":"A radiology AI idea maps to Clinical Excellence (advanced diagnostics) and the Data and Digitisation enabler, probably in the later phases.","m":"Every recommendation in our roadmap should name the pillar or enabler it serves, its phase, and how it passes the investment test.","mist":["Recommending mature AI before the foundations the strategy puts first","Using our own priority criteria instead of theirs"],"ask":["Which strategic programmes already have accountable owners?","How is investment approved against this framework?"],"qs":[{"q":"Which is an enabler, not a pillar?","o":["Data and Digitisation","Clinical Excellence"],"a":0,"w":"Three enablers."},{"q":"Mature AI-enabled care sits mainly in which phase?","o":["Market Leadership","Fix and Transform"],"a":0,"w":"The third phase."},{"q":"The investment test includes:","o":["Affordability and patient safety","Brand colours"],"a":0,"w":"Five criteria."}]},{"t":"The Hospedia programme","s":"MP Shah is replacing its Kranium HMIS with Hospedia, implemented by ITDOSE under a signed contract.","deep":"Hospedia is an end-to-end hospital information system: registration, clinical modules, lab, radiology, pharmacy, stores, billing, insurance, finance, HR and a patient app. ITDOSE customises it to MP Shah's requirements, agreed during GAP analysis. It is currently in UAT (testing). Phase 1 covers registration, OPD, doctors module, lab, radiology, pharmacy, inventory and finance; Phase 2 covers queue management, maintenance, housekeeping, the patient app and portals. Users raised a detailed gap register of requirements, and further requirements are held by the Hospedia team.","keys":["Vendor: ITDOSE; system: Hospedia; replaces Kranium","Status: UAT, not live","Phase 1 core clinical and financial; Phase 2 smaller modules and patient-facing apps","Gap register: hundreds of user requirements across 14 departments","Hospedia has no AI today; any AI would sit alongside it"],"an":"Like moving a whole company onto a new ERP while still running the business.","h":"Lab staff test result entry in the Hospedia test system while still using the old lab system in production.","m":"Our job is to complement Hospedia: find what it will not cover and design what sits around it. We never compete with it or criticise it.","mist":["Assuming Hospedia is live","Proposing to build what ITDOSE is already contracted to deliver"],"ask":["What is the go-live date per phase?","Which requirements were accepted, deferred or rejected?"],"qs":[{"q":"Hospedia is currently:","o":["In UAT","Fully live"],"a":0,"w":"Testing stage."},{"q":"The patient app is in:","o":["Phase 2","Phase 1"],"a":0,"w":"Per Shiraz."},{"q":"Our stance on Hospedia is:","o":["Complement it","Replace it"],"a":0,"w":"Vendor neutrality."}]},{"t":"Legacy systems and data","s":"Data sits across old and current Kranium databases, Sage, EnQuest and other tools, on MP Shah's own servers.","deep":"Kranium is the current HMIS, with an older and a newer database. Finance runs partly on Sage; HR and payroll on EnQuest; there is a separate fixed asset system and Power BI dashboards. Radiology uses RadWeb PACS plus the head of radiology's own system. The Hospedia contract includes a data migration strategy for master data, transactions and history. Shiraz is weighing whether to load 16 years of EMR history into Hospedia or keep it accessible through an API, and plans a central data lake.","keys":["Kranium old and current databases","Sage (finance), EnQuest (HR and payroll), fixed asset system, Power BI","RadWeb PACS; in-house radiology system; Power Platform apps","Data migration strategy in the Hospedia contract","Central data lake planned by MP Shah"],"an":"Like moving house while some belongings stay in two old storage units.","h":"A doctor needs a 2015 lab result: is it in Hospedia, in old Kranium, or in a future data lake?","m":"Data availability and history decide which analytics and AI are feasible. The data lake is one of the strongest foundations in the roadmap.","mist":["Assuming all history will be in Hospedia","Ignoring that Sage may or may not remain"],"ask":["Which data will be migrated, and how many years?","Will Sage be retained?"],"qs":[{"q":"MP Shah's legacy HMIS is:","o":["Kranium","Sage"],"a":0,"w":"Sage is finance."},{"q":"HR and payroll run on:","o":["EnQuest","RadWeb"],"a":0,"w":"RadWeb is PACS."},{"q":"Shiraz's dilemma is whether history goes into Hospedia or:","o":["Stays accessible by API","Gets deleted"],"a":0,"w":"Migrate vs API."}]},{"t":"Regulation in Kenya","s":"Health data is sensitive personal data under the Data Protection Act 2019; digital health is shaped by the Digital Health Agency.","deep":"The Data Protection Act 2019 and its 2021 regulations require a lawful basis for processing, purpose limitation, security, registration of data controllers and processors, and rules on transfers abroad. The Office of the Data Protection Commissioner enforces it. The Digital Health Act 2023 created the Digital Health Agency, which runs national registries and works toward health data exchange and certification of health systems. SHA and SHIF replaced NHIF for public insurance. Shiraz also said AI giving medical guidance needs approval from the medical regulator before going live.","keys":["Data Protection Act 2019 and 2021 regulations; ODPC is the regulator","Digital Health Agency: registries, data exchange, system certification","SHA/SHIF: public insurance, already in the gap register","Clinical AI may need regulatory approval: authority to confirm"],"an":"Like aviation rules: you can innovate, but certified procedures and data rules come first.","h":"Hosting patient data on a cloud region outside Kenya needs a check against transfer rules.","m":"Relevant to ICT's AWS preference, any GenAI use with patient data, and vendor data-use terms.","mist":["Assuming cloud is automatically allowed","Naming a regulator for clinical AI without confirming it"],"ask":["Which data processing agreements are in place with vendors?","Has MP Shah assessed DHA certification requirements?"],"qs":[{"q":"Health data under Kenyan law is:","o":["Sensitive personal data","Unregulated"],"a":0,"w":"Higher protection."},{"q":"The data protection regulator is:","o":["ODPC","KRA"],"a":0,"w":"Office of the Data Protection Commissioner."},{"q":"SHA replaced:","o":["NHIF","Hospedia"],"a":0,"w":"Public insurance."}]},{"t":"Our engagement","s":"A holistic AI and digital transformation discovery: remote 12 to 16 Oct, onsite 21 Oct to 3 Nov, consolidation into mid-November.","deep":"Shiraz asked for a holistic view: AI, digitisation, telemedicine, digital modules and data, noting which vendor could deliver each item. The remote week covers the Hospedia vendor and the IT department only; all other departments must be met in person. Capital Numbers' team: Arun (technical discovery), Virender (business discovery), you (engagement lead and coordination), Subhankar (overall leadership, governance and commercial). Outputs include the As-Is assessment, pain point register, To-Be map, architecture, PRD and roadmap.","keys":["Holistic scope, vendor-neutral","Remote week: Hospedia and IT only","Onsite: 10 working days with departments","Your role: coordinate, connect, track, escalate"],"an":"Like a building survey before renovation: you inspect every room before proposing changes.","h":"In week one, Arun leads Hospedia sessions while Virender prepares department question sets.","m":"Scope expansions go to Subhankar; you never commit scope, price or timelines yourself.","mist":["Treating the discovery as an AI-only exercise","Making commitments in the room"],"ask":["Which departments will Shiraz schedule, and when?","Will the CIO join the IT session?"],"qs":[{"q":"Who decides scope changes?","o":["Subhankar","You"],"a":0,"w":"Governance."},{"q":"The remote week covers:","o":["Hospedia and IT only","All departments"],"a":0,"w":"Shiraz's email."},{"q":"Scope is:","o":["Holistic, including telemedicine and data","AI only"],"a":0,"w":"30 Sep call."}]},{"t":"The people","s":"Shiraz drives AI adoption; a CIO runs IT and Hospedia; the head of radiology is an AI-minded builder; leadership approves.","deep":"Shiraz Dadar stepped back from leading IT in 2024 and now focuses on AI adoption and board consultation; he helped define Hospedia requirements. A CIO now runs IT and the Hospedia implementation, but we have not yet met him. The head of radiology is a radiologist with an IT degree who built his own radiology system. The CEO approves the discovery plan; a COO was named in February. Department heads own the day-to-day problems.","keys":["Champion: Shiraz","Technical owner: the CIO (to engage)","Clinical champion: head of radiology","Approver: CEO; leadership team"],"an":"Like a project with a sponsor, a technical lead you have not met yet, and an expert user who built his own tools.","h":"Before onsite, ask Shiraz to bring the CIO into the IT session.","m":"A roadmap without the CIO's input risks lacking its main technical owner.","mist":["Routing everything through one person","Assuming Shiraz has final authority"],"ask":["Who approves investment after the discovery?","How should we involve the CIO?"],"qs":[{"q":"Who runs the Hospedia implementation?","o":["The CIO","Shiraz"],"a":0,"w":"Per Shiraz."},{"q":"The head of radiology:","o":["Built his own radiology system","Works for ITDOSE"],"a":0,"w":"Per Shiraz."},{"q":"Our biggest stakeholder gap is:","o":["The CIO","Shiraz"],"a":0,"w":"Not engaged yet."}]}]},{"t":"How a hospital works","e":"🏥","c":"teal","items":[{"t":"Outpatient vs inpatient","s":"Outpatients come and go the same day. Inpatients stay overnight in a bed.","an":"Like a day visit to a bank branch versus checking into a hotel.","h":"An OPD patient sees a doctor, has tests and goes home. An IPD patient is admitted, cared for on a ward and later discharged.","m":"Hospedia covers both through the Patient Administration and Clinical cum IPD suites. The strategy's capacity concern (critical care, HDU, maternity) is an inpatient issue; most daily volume is outpatient.","qs":[{"q":"A patient admitted for surgery is:","o":["Outpatient","Inpatient"],"a":1,"w":"They stay overnight."},{"q":"Most MP Shah patient journeys are:","o":["Inpatient admissions","Insured review outpatients"],"a":1,"w":"Kaizen: about 53% corporate review outpatients."},{"q":"Bed allocation and wristbands belong to:","o":["Inpatient admission","Outpatient triage"],"a":0,"w":"IPD Admission module."}],"deep":"Outpatient care (OPD) covers consultations, tests and minor procedures where the patient goes home the same day. Inpatient care (IPD) begins with an admission decision, a bed, a wristband and a file, and ends with discharge. The two differ in workflow, billing and risk: inpatients generate daily charges, nursing records, medication rounds and insurer pre-authorisation, while outpatients move quickly through many short handoffs.","keys":["OPD: same-day; many short steps","IPD: admission, bed, ward care, discharge","Billing differs: OPD per service, IPD accumulates daily","Insurance pre-authorisation matters most for IPD"],"mist":["Assuming one workflow fits both","Ignoring that inpatient billing runs over many days"],"ask":["What share of revenue comes from inpatients vs outpatients?","Where do outpatients become admissions?"]},{"t":"The patient journey","s":"The full path a patient takes, from first contact to follow-up. Problems hide in the handoffs.","an":"Like an airport: check-in, security, gate, boarding. Delays happen between steps.","h":"Call, arrive, queue, register, triage, consult, tests, pharmacy, pay, leave, follow up.","m":"The strategy commits to \"simplifying patient pathways from appointment to follow-up\". The Hospedia gap register shows the system side of the same journey: queue tokens, registration validation, result alerts, billing prompts. A patient journey study at MP Shah adds the patient's view.","qs":[{"q":"Where do most delays usually hide?","o":["Inside a single step","In handoffs between steps"],"a":1,"w":"Waiting happens between people and systems."},{"q":"At MP Shah, patient sentiment drops most at:","o":["Arrival","Billing, pharmacy, diagnostics, discharge"],"a":1,"w":"Kaizen emotional mapping."},{"q":"The strategy's phrase for this is:","o":["Simplifying patient pathways from appointment to follow-up","Market leadership"],"a":0,"w":"Patient-Centric Care."}],"deep":"The patient journey is every touchpoint from first contact (call, website) through arrival, registration, triage, consultation, diagnostics, pharmacy, payment and follow-up. Delays and errors hide between steps, where one person or system hands over to another. Mapping the journey from the patient's side reveals problems that no single department sees.","keys":["Map from the patient's point of view","Handoffs are where delays and errors live","Each step has people, systems and data","Follow-up is part of the journey"],"mist":["Mapping only one department","Ignoring what happens after discharge"],"ask":["Where do patients most often get lost or wait?","Who owns the patient between departments?"]},{"t":"The revenue cycle","s":"Every step from first contact to the last payment collected.","an":"Like an online order: cart, payment approval, shipping, invoice, refund handling.","h":"Register, pre-authorise, capture charges, code, bill, submit claim, insurer decides, payment, reconcile, collect.","m":"Credit Control raised the largest block of requirements in the Hospedia gap register: EDI integration, clinical vetting, remittance auto-allocation, SHIF handling and aged debtor reports. The strategy names revenue cycle optimisation under Sustainability.","qs":[{"q":"A wrong scheme at registration usually shows up as:","o":["A rejected claim later","A faster discharge"],"a":0,"w":"Errors travel downstream."},{"q":"Pre-authorisation happens:","o":["Before or during treatment","After payment"],"a":0,"w":"Insurer approves cover first."},{"q":"Revenue cycle optimisation appears in the strategy under:","o":["Sustainability","People-Centred Culture"],"a":0,"w":"Financial resilience."}],"deep":"The revenue cycle runs from the first contact to the last payment. Errors early in the cycle (wrong scheme, missing pre-authorisation, uncoded diagnosis) surface late as rejected or delayed claims. In insured-heavy hospitals the cycle involves many payers with different rules, EDI links and reconciliation work.","keys":["Registration and eligibility","Pre-authorisation","Charge capture and coding","Billing, claim submission, adjudication","Payment, reconciliation, collections"],"mist":["Treating billing and credit control as separate problems","Assuming rejections are an AI problem before checking rules and data"],"ask":["What are the top reasons for claim rejections?","How are remittances matched today?"]},{"t":"Insurance in Kenya","s":"Most private patients are covered by insurers or employers. The public scheme is run by SHA through SHIF.","an":"Like travel insurance: you need approval and paperwork before and after.","h":"Hospitals connect to insurers through EDI providers such as Smart, M-Tiba and Slade for verification and claims.","m":"The gap register asks for all insurer e-claims to be integrated, SHIF rebates handled like any other payer, and stops on billing exclusions. MP Shah's strategy names insured patients and corporate clients as priority populations.","qs":[{"q":"EDI providers connect:","o":["Hospitals and insurers","Doctors and pharmacies"],"a":0,"w":"Electronic data interchange."},{"q":"SHA/SHIF is:","o":["Kenya's public health insurance authority and fund","A private insurer"],"a":0,"w":"Replaced NHIF."},{"q":"Exclusions are:","o":["Services not covered by a scheme","Patients refused entry"],"a":0,"w":"Scheme rules."}],"deep":"Private patients are often covered by insurers or employers, using schemes with exclusions, limits and co-pays. Hospitals verify cover, request pre-authorisation and submit claims, often electronically through EDI providers such as Smart, M-Tiba, Slade and LCT. Public insurance is now run by SHA through SHIF, which replaced NHIF. Each payer behaves differently, which makes claims complex.","keys":["Schemes have exclusions, limits and co-pays","EDI providers connect hospitals and insurers","SHA/SHIF is the public scheme","Pre-authorisation delays affect admission and discharge"],"mist":["Assuming one integration fits all insurers","Ignoring SHIF as a distinct payer"],"ask":["Which EDIs cause the most problems?","How is SHIF handled today?"]},{"t":"Turnaround time (TAT)","s":"How long a step takes. The universal language of hospital efficiency.","an":"Like delivery time on an online order.","h":"Lab TAT: sample to result. Discharge TAT: decision to exit. Report TAT: scan to final report.","m":"ICT asked for waiting-time TAT at every service point, and radiology asked for TAT by radiologist, modality and branch. The current discharge TAT report has blank fields despite data existing (gap register). Discharge timing has also been measured in a patient journey study.","qs":[{"q":"Discharge TAT measures:","o":["Admission to discharge","Discharge decision to patient leaving"],"a":1,"w":"Decision to physical exit."},{"q":"Why break TAT into stages?","o":["To find the real bottleneck","To make reports longer"],"a":0,"w":"Billing clearance alone is 195 minutes."},{"q":"ICT asked for waiting-time TAT at:","o":["Every service point","Only radiology"],"a":0,"w":"Gap register, ICT."}],"deep":"TAT is the time a step or process takes: lab TAT (sample to result), report TAT (scan to signed report), discharge TAT (decision to exit), queue waiting time. Measuring TAT by stage reveals the true bottleneck. A dashboard that shows TAT live is often more valuable than any AI.","keys":["Always define start and end points","Break into stages to find bottlenecks","Live TAT dashboards drive behaviour","TAT is the language operations leaders use"],"mist":["Quoting a TAT without its start and end points","Using averages that hide long tails"],"ask":["Where does this TAT start and stop in the system?","Who looks at it, and how often?"]},{"t":"Who runs a hospital","s":"CEO sets strategy; COO runs operations; CFO runs money; CMO and CNO lead doctors and nurses; CIO runs technology; HODs run departments.","an":"Like a company with a board, executives and branch managers, plus expert professionals who are not managed like normal staff.","h":"A doctor may be a private consultant with admitting rights, not an employee.","m":"At MP Shah: the CEO approves the plan; a CIO runs IT and Hospedia; Shiraz drives AI adoption; a COO was named earlier. Kaizen action owners include CMO, DCMO, CNO, CHRO and HODs, which shows how actions are assigned.","qs":[{"q":"Who owns technology systems and vendors?","o":["CMO","CIO"],"a":1,"w":"Chief Information Officer."},{"q":"A private consultant with admitting rights is:","o":["Always a hospital employee","Often independent, using the hospital to treat patients"],"a":1,"w":"Common in private hospitals."},{"q":"A private consultant with admitting rights:","o":["May use the hospital without being an employee","Must be on payroll"],"a":0,"w":"Common in private hospitals."}],"deep":"A hospital mixes corporate management (CEO, COO, CFO, CIO, CHRO) with clinical leadership (CMO, CNO, department heads) and independent professionals (consultants with admitting rights). Decisions often need both management and clinical agreement. Department heads (HODs) own daily operations and are your best source of real problems.","keys":["Corporate: CEO, COO, CFO, CIO, CHRO","Clinical: CMO, DCMO, CNO, HODs","Private consultants may not be employees","Clinical governance approves clinical change"],"mist":["Assuming the IT contact can approve investment","Ignoring clinical leadership in technology decisions"],"ask":["Who signs off a new clinical system?","Which committee reviews digital investments?"]},{"t":"JCI and patient safety","s":"JCI is an international hospital accreditation. It checks safety, documentation and continuous improvement.","an":"Like ISO certification, but for patient safety.","h":"Correct patient ID, safe medication, infection control, audit trails, incident reporting.","m":"MP Shah is JCI-accredited. The gap register asks for JCI nursing templates, audit logs of who viewed records, report revision trails and incident forms. The strategy names incident reporting culture as a strength.","qs":[{"q":"MP Shah's JCI accreditation means new systems must:","o":["Preserve audit trails and safety processes","Avoid documentation"],"a":0,"w":"Safety and traceability."},{"q":"Incident reporting is:","o":["A strength at MP Shah to build on","Something to bypass"],"a":0,"w":"Named as a strength in the strategy."},{"q":"Audit logs of who viewed a record support:","o":["JCI and data protection","Faster billing"],"a":0,"w":"Traceability."}],"deep":"JCI (Joint Commission International) accredits hospitals against international standards: correct patient identification, safe medication, infection control, documentation, audit trails, incident reporting and continuous improvement. Accreditation is re-surveyed periodically, so any system change must keep the hospital compliant.","keys":["Patient identification and safe medication","Documentation and audit trails","Incident reporting and continuous improvement","Re-surveys mean ongoing compliance"],"mist":["Proposing changes that remove audit trails","Ignoring documentation requirements in new tools"],"ask":["Which JCI standards are most at risk in the Hospedia transition?","When is the next JCI survey?"]}]},{"t":"Systems and data","e":"🖥️","c":"indigo","items":[{"t":"HIS and EMR","s":"The HIS runs the hospital's operations. The EMR is the clinical record inside it.","an":"The HIS is the whole airline booking system; the EMR is each passenger's detailed file.","h":"Registration, orders, wards and billing sit in the HIS. Notes, diagnoses and results sit in the EMR.","m":"MP Shah is moving from Kranium to Hospedia. Hospedia's EMR covers treatment charts, medication and vaccination history, lab and radiology reports and discharge summaries. Doctors asked for specialty templates and voice dictation.","qs":[{"q":"Billing lives in:","o":["The HIS","PACS"],"a":0,"w":"Operations."},{"q":"MP Shah's new HIS is:","o":["Kranium","Hospedia"],"a":1,"w":"Kranium is the legacy system."},{"q":"The national direction toward shared records is called:","o":["EHR","QMS"],"a":0,"w":"Electronic health record."}],"deep":"The HIS (or HMIS) is the operational backbone: registration, orders, wards, billing, stores. The EMR is the clinical record inside it: notes, diagnoses, results, medications. An EHR shares records across organisations. When people say \"the system\", they usually mean the HIS.","keys":["HIS: operations; EMR: clinical record","EHR: shared across organisations","Most other systems connect to the HIS"],"mist":["Using EMR and EHR interchangeably","Assuming the EMR holds all history"],"ask":["Which records will be in the Hospedia EMR at go-live?","Where will old notes live?"]},{"t":"LIS, RIS and PACS","s":"LIS runs the lab. RIS runs radiology bookings and reports. PACS stores and shows images.","an":"RIS is the appointment book and report folder; PACS is the photo archive.","h":"Doctor orders a scan in the RIS, images land in PACS, radiologist reports in RIS.","m":"Hospedia includes LIS and RIS modules, PACS integration and licences for 25 lab equipment integrations. MP Shah's PACS is RadWeb; radiology also has its own in-house system.","qs":[{"q":"Images are stored in:","o":["RIS","PACS"],"a":1,"w":"Picture archive."},{"q":"The radiology report is managed in:","o":["RIS","LIS"],"a":0,"w":"Radiology information system."},{"q":"Hospedia's contract includes licences for how many equipment integrations?","o":["25","100"],"a":0,"w":"Additional licences."}],"deep":"The LIS manages lab orders, samples, results and quality control. The RIS manages radiology bookings, worklists and reports. PACS stores and displays images in DICOM format. Analysers connect to the LIS; scanners connect to PACS through worklists. These systems must link to the HIS so results reach doctors.","keys":["LIS: lab workflow","RIS: radiology workflow and reports","PACS: images","All must integrate with the HIS"],"mist":["Assuming RIS stores images","Ignoring analyser interfaces"],"ask":["Which analysers will be bi-directionally interfaced?","How will RadWeb link to Hospedia?"]},{"t":"APIs","s":"A defined doorway one system uses to ask another for data.","an":"Like a restaurant menu: you order through it, you do not walk into the kitchen.","h":"A new app reads lab results from the HIS through an API.","m":"Our Hospedia queries ask which APIs exist, for which modules, and whether third parties may build on them. Radiology asked Hospedia to expose APIs for add-ons.","qs":[{"q":"Read-only API means a new tool can:","o":["View data but not update records","Update everything"],"a":0,"w":"Look, not change."},{"q":"Why ask about third-party rights?","o":["APIs may exist but be contractually restricted","It is a formality"],"a":0,"w":"Rights decide feasibility."},{"q":"\"Batch\" integration means:","o":["Data moves on a schedule, not instantly","Data never moves"],"a":0,"w":"Periodic."}],"deep":"An API is a defined interface that lets one system request or send data to another. APIs can be read-only or read-write, real-time or batch, documented or not. Even when APIs exist, contracts may limit who can use them. APIs are the main route for adding new tools around an HIS without changing its core.","keys":["Read vs write","Real-time vs batch","Documentation and versioning","Contractual rights to use them"],"mist":["Assuming an API exists because the vendor is modern","Forgetting contractual rights"],"ask":["Is there API documentation?","Can third parties use the APIs, and at what cost?"]},{"t":"HL7, FHIR, DICOM","s":"Shared languages for health data. HL7 v2: older messages. FHIR: modern web APIs. DICOM: images.","an":"Like plugs and sockets: standards let devices from different makers connect.","h":"Lab analysers often send HL7; scanners send DICOM; new apps prefer FHIR.","m":"Radiology asked for HL7 and DICOM Modality Worklist support and FHIR exports for research. The Digital Health Agency's national exchange direction makes standards more important over time.","qs":[{"q":"Medical images use:","o":["FHIR","DICOM"],"a":1,"w":"Imaging standard."},{"q":"The modern web-friendly standard is:","o":["HL7 v2","FHIR"],"a":1,"w":"Fast Healthcare Interoperability Resources."},{"q":"A Modality Worklist is part of:","o":["DICOM","HL7 billing"],"a":0,"w":"Imaging standard."}],"deep":"HL7 v2 is the long-established messaging standard for events like admissions and lab results. FHIR is the modern standard using web APIs and resources such as Patient and Observation. DICOM is the standard for medical images and their metadata, including worklists that send exam details to scanners.","keys":["HL7 v2: traditional hospital messages","FHIR: modern, web-based","DICOM: images and worklists"],"mist":["Assuming every system supports FHIR","Confusing DICOM (images) with HL7 (messages)"],"ask":["Which standards does Hospedia support?","Do analysers use HL7?"]},{"t":"Integration vs interoperability","s":"Integration connects systems. Interoperability means both understand the data the same way.","an":"Integration is a phone line; interoperability is speaking the same language.","h":"Two systems may be connected but use different codes for the same test.","m":"Different stakeholders may describe the same link differently: ICT may say a system is integrated while users still re-enter data. Record both views and validate.","qs":[{"q":"Two systems connected but using different codes have:","o":["Integration without interoperability","Full interoperability"],"a":0,"w":"Plumbing, not shared meaning."},{"q":"ICT says integrated; lab staff re-type results. You:","o":["Record both and ask Arun to validate","Decide ICT is wrong"],"a":0,"w":"Never pick a side without evidence."},{"q":"If users re-enter data that is \"integrated\", you should:","o":["Log both views and validate","Assume users are wrong"],"a":0,"w":"Evidence first."}],"deep":"Integration connects systems so data can move. Interoperability means both systems understand that data the same way, with shared codes and meaning. Two systems can be integrated yet still require manual mapping because codes differ.","keys":["Integration: the connection","Interoperability: shared meaning","Codes and master data matter"],"mist":["Taking \"it is integrated\" at face value","Choosing one stakeholder's version without evidence"],"ask":["When data moves, does anyone re-key or correct it?","Do both systems use the same codes?"]},{"t":"Data quality and the patient index","s":"Data is only useful if it is complete, accurate and linked to one patient identity.","an":"Like a contacts list with three entries for the same person.","h":"Duplicate records, free-text fields and blank values break reports and AI.","m":"The gap register asks for duplicate checks, field validations (phone, National ID), drop-downs instead of free text, mandatory diagnosis fields, and fixes for blank report fields.","qs":[{"q":"Duplicate patient records are mainly fixed by:","o":["Process and validation rules","AI alone"],"a":0,"w":"Registration discipline first."},{"q":"A Master Patient Index ensures:","o":["One identity per patient","Faster billing"],"a":0,"w":"Single identity."},{"q":"The cheapest place to fix data quality is:","o":["At entry, e.g. registration","In the final report"],"a":0,"w":"Source."}],"deep":"Data quality covers completeness, accuracy, consistency and timeliness. A Master Patient Index ensures one identity per patient. Free-text fields, duplicates and missing mandatory data corrupt reports and make AI unreliable. Most fixes are process and validation, not technology.","keys":["Completeness, accuracy, consistency, timeliness","One identity per patient","Validate at the point of entry"],"mist":["Hoping AI will clean bad data","Ignoring registration as the source"],"ask":["How many duplicate records exist?","Which fields are free text?"]},{"t":"Data lake and data platform","s":"One central store for data from many systems, organised so reports and AI use the same numbers.","an":"Like a central warehouse instead of stock scattered across many shops.","h":"Raw copies (bronze), cleaned data (silver), business-ready data (gold).","m":"Shiraz plans a central data lake across old Kranium, current Kranium and Hospedia. Finance wants Power BI rebuilt on new databases. The strategy calls for \"trusted enterprise data\".","qs":[{"q":"Why build a data platform before most AI?","o":["AI needs trusted, joined-up data","It is cheaper"],"a":0,"w":"Foundation first."},{"q":"Gold layer data is:","o":["Raw","Business-ready"],"a":1,"w":"Cleaned and modelled."},{"q":"The strategy phrase this supports is:","o":["Trusted enterprise data","Hospotel"],"a":0,"w":"Success measures."}],"deep":"A data platform brings data from many systems into one governed place. A data lake stores raw data cheaply; a warehouse holds structured, curated data; a lakehouse combines both. Medallion layers organise data from raw (bronze) to cleaned (silver) to business-ready (gold). It is the foundation for reliable dashboards and AI.","keys":["Bronze, silver, gold layers","Governance prevents a \"data swamp\"","Independent of any single HMIS"],"mist":["Building AI before the data foundation","Ignoring governance and ownership"],"ask":["Which sources must feed the platform first?","Who owns data definitions?"]}]},{"t":"AI in healthcare","e":"🤖","c":"violet","items":[{"t":"AI or not AI?","s":"Choose the simplest fix: process, integration, automation, analytics, then AI.","an":"Do not buy a robot to open a door that only needs a handle.","h":"Missed lab tests need an alert rule, not AI.","m":"Many gap register items are configuration, validation, integration or reporting. Radiology's requests include genuine AI candidates (structured reports for AI, AI-flagged abnormalities, appropriateness support).","qs":[{"q":"\"Patients arrive without fasting\" is solved by:","o":["Automated reminders","Computer vision"],"a":0,"w":"Rules."},{"q":"AI is right when the task needs:","o":["Language, images, prediction or generation","Fixed rules"],"a":0,"w":"Simpler options fall short."},{"q":"A reminder SMS when a scan is booked is:","o":["Automation","Computer vision"],"a":0,"w":"Rules."}],"deep":"Most operational problems are solved by simpler means: process fixes, integration, rule-based automation or analytics. AI earns its place when the task requires understanding language, images or speech, predicting outcomes or generating content, and simpler approaches fall short.","keys":["Process, integration, automation, analytics, then AI","AI for language, images, speech, prediction, generation","Honesty about \"not AI\" builds trust"],"mist":["Labelling every idea as AI","Skipping the simple fix"],"ask":["What happens today, and why?","Would a rule or report solve it?"]},{"t":"Types of AI","s":"Predictive models forecast; computer vision reads images; NLP reads text; speech AI transcribes; generative AI writes.","an":"Different tools in a toolbox.","h":"Predict discharges, flag X-rays, extract diagnoses, transcribe dictation, draft summaries.","m":"Radiology points to vision and speech; doctors to speech and generative documentation; finance and operations to analytics and prediction; patient access to conversational AI.","qs":[{"q":"Flagging fractures uses:","o":["Computer vision","NLP"],"a":0,"w":"Images."},{"q":"Drafting a discharge summary uses:","o":["Generative AI","Predictive model"],"a":0,"w":"Text generation."},{"q":"Voice dictation uses:","o":["Speech AI","Computer vision"],"a":0,"w":"ASR."}],"deep":"Predictive models learn from history to forecast; computer vision interprets images; NLP extracts meaning from text; speech AI converts voice to text; generative AI produces text or summaries; agents take actions across systems. Each needs different data and carries different risks.","keys":["Predictive, vision, NLP, speech, generative, agents","Different data needs","Different risk levels"],"mist":["Treating all AI as chatbots","Ignoring data requirements per type"],"ask":["What input does it need: text, images, voice, numbers?","What does it output, and who checks it?"]},{"t":"RAG assistants","s":"An AI that answers questions from approved documents and cites them.","an":"Like a librarian who reads only the hospital's policy books before answering.","h":"A staff assistant answering HR or SOP questions with sources.","m":"Possible uses include staff policy and SOP questions, but need real question volume and current policies. JCI documentation could be a source.","qs":[{"q":"RAG answers from:","o":["Approved documents it retrieves","Its imagination"],"a":0,"w":"Grounded answers."},{"q":"Before building an HR assistant, check:","o":["Question volume and policy accuracy","Screen colours"],"a":0,"w":"Validate need and content."},{"q":"RAG's main safeguard is:","o":["Answering from retrieved sources","Bigger servers"],"a":0,"w":"Grounding."}],"deep":"Retrieval-augmented generation (RAG) lets an AI answer questions from approved documents it retrieves, and cite them. It reduces made-up answers but depends on current, well-organised source documents and clear access controls.","keys":["Answers grounded in approved documents","Citations for trust","Depends on document quality"],"mist":["Building on outdated policies","Assuming staff want a chatbot"],"ask":["How often do staff ask these questions?","Are policies current and centralised?"]},{"t":"Ambient scribe","s":"AI that listens to a consultation and drafts the clinical note for the doctor to approve.","an":"Like a court stenographer who also writes the summary.","h":"Reduces evening documentation for doctors.","m":"Doctors asked for Augnito dictation; Hospedia struggles with voice; a UK vendor pitched an AI layer that structures conversation into HMIS fields.","qs":[{"q":"Who approves the scribe's note?","o":["The doctor","The AI"],"a":0,"w":"Clinician accountability."},{"q":"At MP Shah this space is:","o":["Contested by other vendors","Empty"],"a":0,"w":"A UK vendor pitched it."},{"q":"An ambient scribe's note must be:","o":["Reviewed by the clinician","Filed automatically without review"],"a":0,"w":"Accountability."}],"deep":"An ambient scribe listens to a consultation (with consent), transcribes it and drafts a structured note for the clinician to review and approve. Value depends on accuracy, integration into the EMR and clinician trust.","keys":["Consent and privacy","Clinician reviews every note","EMR integration determines value"],"mist":["Skipping consent","Ignoring how notes enter the EMR"],"ask":["How long do doctors spend documenting?","Would notes need to write back into Hospedia?"]},{"t":"Is the data ready?","s":"Data must exist, be accessible, usable, good quality, have history and labels, flow back, and be governed.","an":"Having ingredients in the cupboard does not mean you can cook the dish tonight.","h":"Denial prediction needs rejection reasons recorded consistently.","m":"Data sits across Kranium databases and soon Hospedia; history may or may not be migrated; rejection reasons may live in Excel. Each affects AI feasibility.","qs":[{"q":"For supervised ML, labels mean:","o":["The correct outcomes are recorded","The data has names"],"a":0,"w":"Training answers."},{"q":"\"Unknown\" in a readiness check is:","o":["A next question for the right owner","A failure"],"a":0,"w":"Turn unknowns into questions."},{"q":"Governed means:","o":["Ownership, purpose and consent are clear","The data is large"],"a":0,"w":"Data protection."}],"deep":"Data readiness has layers: exists, accessible, usable, good quality, enough history, labelled for supervised learning, able to flow back into workflow, and governed for the purpose. \"We have the data\" usually confirms only the first layer.","keys":["Eight layers from exists to governed","Labels are often missing","Unknowns become questions"],"mist":["Assuming access because data exists","Ignoring labels"],"ask":["Where exactly is this data, and who can access it?","How many years exist?"]},{"t":"Judging AI: recall and precision","s":"Recall: did it catch the real cases? Precision: were its alerts right?","an":"A smoke alarm with high recall catches every fire; with low precision it also screams at toast.","h":"For urgent X-ray triage, missing a real case is the dangerous error.","m":"Any radiology AI at MP Shah must be validated on MP Shah images. Our fracture work was a proof of concept; quote no accuracy without context.","qs":[{"q":"A false negative is:","o":["A missed real case","A false alarm"],"a":0,"w":"Dangerous in screening."},{"q":"Low precision causes:","o":["Alert fatigue","Missed cases"],"a":0,"w":"Too many false alarms."},{"q":"Silent mode means:","o":["AI runs without clinicians relying on it, for validation","AI is switched off"],"a":0,"w":"Safe testing."}],"deep":"Recall measures how many real cases the AI catches; precision measures how many of its alerts are correct. In screening, missing real cases (false negatives) is the dangerous error; too many false alarms cause alert fatigue. Performance must be validated on local data before anyone relies on it.","keys":["Recall: real cases caught","Precision: alerts that are right","Validate locally, ideally in silent mode first"],"mist":["Quoting one accuracy number","Skipping local validation"],"ask":["On what data was this measured?","How would we validate it here?"]},{"t":"Clinical vs non-clinical AI","s":"Clinical AI affects diagnosis or treatment; non-clinical AI affects operations.","an":"Autopilot versus the airline's booking chatbot.","h":"Imaging AI needs validation and oversight; an HR assistant needs less.","m":"The strategy says AI must not substitute for clinical accountability. Shiraz said medical guidance AI needs regulatory approval before going live.","qs":[{"q":"Which needs heavier governance?","o":["Radiology triage","HR policy assistant"],"a":0,"w":"Clinical risk."},{"q":"In clinical AI the final decision belongs to:","o":["The clinician","The model"],"a":0,"w":"Accountability."},{"q":"The strategy's stance is that AI:","o":["Supports, never replaces, clinical accountability","Replaces doctors"],"a":0,"w":"Data and Digitisation section."}],"deep":"Clinical AI influences diagnosis or treatment and needs clinical validation, oversight, and possibly regulatory approval. Non-clinical AI supports operations and carries lower but real risk. Patient-facing non-clinical tools can still cause harm if they give wrong information.","keys":["Clinical: heavier governance","Non-clinical: faster to value, still governed","Clinician stays accountable"],"mist":["Treating clinical AI like an IT project","Assuming non-clinical means risk-free"],"ask":["Who would clinically validate this?","Does it need regulatory approval?"]},{"t":"PoC, pilot, production","s":"PoC tests feasibility; pilot tests real use with few users; production is supported and integrated for all.","an":"Recipe test, then a soft launch, then the full restaurant menu.","h":"Silent-mode testing on past scans before any clinician relies on AI.","m":"Proposal V1.1 included indicative PoC hypotheses; the discovery should validate which, if any, justify a PoC.","qs":[{"q":"A PoC proves:","o":["Technical feasibility","Hospital-wide value"],"a":0,"w":"One uncertainty."},{"q":"A good PoC answers:","o":["What will we know after that we do not know now?","How much can we bill?"],"a":0,"w":"Specific question."},{"q":"A pilot mainly tests:","o":["Workflow fit and adoption","Only the model"],"a":0,"w":"Real use."}],"deep":"A proof of concept answers one specific technical question. A pilot tests real workflow use with a small group. Production is integrated, supported and monitored for all intended users. Each stage needs explicit success criteria and a decision at the end.","keys":["PoC: feasibility","Pilot: workflow and adoption","Production: supported and integrated"],"mist":["Calling a pilot a product","Running a PoC with no question to answer"],"ask":["What will we know after this that we do not know today?","What decision follows?"]}]},{"t":"Discovery and analysis","e":"🔍","c":"amber","items":[{"t":"Symptom vs root cause","s":"A symptom is what people complain about. The root cause is why it happens.","an":"A headache is the symptom; dehydration may be the cause.","h":"\"Discharges are slow\" is a symptom; late doctor charges and insurer approvals are causes.","m":"Example from the gap register: \"doctors can overwrite other doctors' notes\" is a symptom of missing access controls; \"blank fields in the discharge TAT report\" may be a reporting defect, not missing data.","qs":[{"q":"\"Staff enter data twice\" is:","o":["A symptom","A root cause"],"a":0,"w":"Ask why."},{"q":"You stop asking \"why\" when:","o":["You reach something actionable, or you are guessing","After exactly five"],"a":0,"w":"Do not invent links."},{"q":"\"Reports have blank fields although data exists\" suggests:","o":["A reporting or mapping defect","No data captured"],"a":0,"w":"ICT gap item."}],"deep":"A symptom is what people complain about; a root cause is why it happens. Solving symptoms creates temporary relief; solving causes changes outcomes. Causes are often process, ownership or data issues rather than technology.","keys":["Ask why until actionable","Validate causes with evidence","Causes are often non-technical"],"mist":["Jumping to a solution after the first complaint","Choosing a cause without evidence"],"ask":["Why does that happen?","How do you know?"]},{"t":"Five Whys","s":"Ask why repeatedly until you reach an actionable cause.","an":"A child asking why, but with discipline.","h":"Slow discharge, billing slow, insurer waits, invoice late, doctor charges late, no reminder.","m":"Use it in every department session, especially when a requirement in the gap register states a solution rather than a problem.","qs":[{"q":"If you are guessing at the third why, you should:","o":["Mark it as an open question","Keep guessing"],"a":0,"w":"Evidence first."},{"q":"Five Whys aims for:","o":["An actionable cause","A long list"],"a":0,"w":"Action."},{"q":"If a gap register item states a solution, you should:","o":["Ask what problem it solves","Accept it as the requirement"],"a":0,"w":"Problem first."}],"deep":"Five Whys is a simple discipline: ask why repeatedly until you reach a cause you can act on. The number five is a guide, not a rule. Stop when you are guessing and record the open question instead.","keys":["Iterate why","Stop at actionable or uncertain","Record gaps as questions"],"mist":["Inventing answers to complete five","Stopping at the first why"],"ask":["Why does that step take so long?","What would have to be true for it to be faster?"]},{"t":"AS-IS and TO-BE","s":"AS-IS is how work happens today, including workarounds. TO-BE is how it should work.","an":"A before-and-after floor plan for a renovation.","h":"Map what people actually do, not what the policy says.","m":"The discovery plan requires MP Shah to approve the AS-IS before TO-BE is finalised. Hospedia's customised workflows, the gap register and existing studies give a head start.","qs":[{"q":"AS-IS should show:","o":["Real practice including Excel and paper","The official policy"],"a":0,"w":"Reality."},{"q":"The gap between AS-IS and TO-BE becomes:","o":["Requirements","Invoices"],"a":0,"w":"What must change."},{"q":"Who approves the AS-IS in our plan?","o":["MP Shah","Capital Numbers"],"a":0,"w":"Plan step."}],"deep":"AS-IS documents how work truly happens today, including paper, Excel and WhatsApp workarounds. TO-BE describes the improved future. The gap between them becomes requirements and opportunities. AS-IS must be validated with the people who do the work.","keys":["Map reality, not policy","Include workarounds","Validate with the client before TO-BE"],"mist":["Mapping from the SOP only","Skipping client validation"],"ask":["Can you show me the actual screen or form?","What happens when the system is down?"]},{"t":"Requirements","s":"Business: the outcome needed. Functional: what the system does. Non-functional: how well.","an":"\"Arrive on time\" (business), \"show live traffic\" (functional), \"update every minute\" (non-functional).","h":"Notify pharmacy when discharge starts; within one minute; audit logged.","m":"Most gap register items are functional requirements written by users; ICT items such as AD authentication, IP restriction and audit logs are non-functional.","qs":[{"q":"\"Notification within one minute\" is:","o":["Non-functional","Business"],"a":0,"w":"How well."},{"q":"A user story looks like:","o":["As a [role], I want [x], so that [y]","A price list"],"a":0,"w":"Standard format."},{"q":"\"Authenticate users via Active Directory\" is:","o":["Non-functional (security)","A business outcome"],"a":0,"w":"ICT requirement."}],"deep":"Business requirements state outcomes; functional requirements state what the system must do; non-functional requirements state how well (speed, security, availability). User stories express needs from a role's point of view. Acceptance criteria define done.","keys":["Business, functional, non-functional","User stories","Acceptance criteria"],"mist":["Treating a solution as a requirement","Forgetting non-functional needs"],"ask":["How will we know this works?","How fast or secure must it be?"]},{"t":"Prioritisation","s":"Rank opportunities on value and feasibility using agreed criteria.","an":"Choosing which house repairs to do first: leaking roof before new curtains.","h":"Quick wins first, foundations next, strategic bets later.","m":"Use MP Shah's own investment test: clinical impact, patient safety, affordability, operational feasibility, sustainable value. Hospedia phases affect timing.","qs":[{"q":"MP Shah's Board was told to start with:","o":["No-capex quick wins","The biggest AI project"],"a":0,"w":"Sequencing."},{"q":"A high-value, low-feasibility item needs:","o":["Foundations fixed first","Immediate build"],"a":0,"w":"Strategic bet."},{"q":"A use case that depends on Hospedia Phase 2 should be:","o":["Sequenced after Phase 2","Started immediately"],"a":0,"w":"Dependency."}],"deep":"Prioritisation ranks opportunities on value and feasibility using agreed, transparent criteria. Quick wins have high value and low effort; strategic bets need foundations first. Sequencing must respect dependencies such as Hospedia go-live.","keys":["Agreed criteria","Quick wins vs strategic bets","Dependencies drive sequence"],"mist":["Prioritising by excitement","Ignoring Hospedia dependency"],"ask":["What must exist before this can start?","Who benefits, and how much?"]},{"t":"Business case and baseline","s":"A business case shows value, cost and risk. A baseline is today's measured performance.","an":"You cannot claim weight loss without weighing yourself first.","h":"\"Billing clearance 195 minutes today; target a third less; validate in a pilot.\"","m":"Baselines can come from Hospedia reports, finance data, departmental logs and existing studies. Always state source and assumptions.","qs":[{"q":"Without a baseline you should say:","o":["Baseline measurement required","Expect 50% savings"],"a":0,"w":"Never fabricate."},{"q":"Who owns pricing?","o":["Subhankar","You"],"a":0,"w":"Commercial ownership."},{"q":"Who owns pricing?","o":["Subhankar","Any team member"],"a":0,"w":"RACI."}],"deep":"A business case sets out value, cost, risk and timing. Value needs a baseline: today's measured performance. Without a baseline, benefits are guesses. Pricing and commercial terms belong to Subhankar.","keys":["Baseline first","Benefits as ranges with assumptions","No invented ROI"],"mist":["Promising savings without data","Quoting prices yourself"],"ask":["How is this measured today?","What would success look like in numbers?"]},{"t":"Evidence labels","s":"Confirmed, client-reported, observed, inference, hypothesis, open question.","an":"A journalist distinguishing verified facts from sources' claims.","h":"\"Shiraz said Hospedia has no AI\" is client-reported, not confirmed.","m":"Shiraz's comments are client-reported; the contract is confirmed; our classification of opportunities is inference.","qs":[{"q":"A stakeholder's statement is:","o":["Client-reported","Confirmed fact"],"a":0,"w":"Until validated."},{"q":"\"Billing likely drives discharge delay\" is:","o":["An inference","A decision"],"a":0,"w":"Reasonable interpretation."},{"q":"A clause in the signed Hospedia contract is:","o":["Confirmed","A hypothesis"],"a":0,"w":"Documented."}],"deep":"Label every finding: confirmed, client-reported, observed, inference, hypothesis or open question. This prevents opinions turning into \"facts\" in the final deck.","keys":["Six labels","Never upgrade silently","Track sources"],"mist":["Writing a client opinion as fact","Losing the source"],"ask":["Where did this come from?","Has anyone verified it?"]}]},{"t":"People and communication","e":"🤝","c":"teal","items":[{"t":"Who decides what","s":"Problem owner, sponsor, technical evaluator, budget owner, approver and procurement are often different people.","an":"Buying a family car: one person needs it, one pays, one checks the engine.","h":"The Head of Radiology owns the problem; the CIO evaluates; the CEO approves.","m":"Known: Shiraz (sponsor, AI adoption), CEO (approver of plan). Unknown: CIO's role, budget owner, procurement path.","qs":[{"q":"Shiraz is best described as:","o":["Champion; authority to confirm","Final approver"],"a":0,"w":"Do not assume."},{"q":"The biggest stakeholder gap now is:","o":["The CIO","The Kaizen team"],"a":0,"w":"Not engaged."},{"q":"The technical evaluator is most likely:","o":["The CIO","The catering manager"],"a":0,"w":"Technology owner."}],"deep":"Buying and change decisions involve several roles: problem owner, sponsor, technical evaluator, budget owner, approver and procurement. They are often different people. Map them early.","keys":["Problem owner, sponsor, evaluator, budget owner, approver","Different people, different concerns"],"mist":["Assuming the sponsor approves","Ignoring procurement"],"ask":["Who else should see this before a decision?","How are digital investments approved?"]},{"t":"Managing a champion","s":"Champions open doors but can narrow your view.","an":"A good friend introducing you at a party: do not only talk to them all night.","h":"Use Shiraz to reach the CIO, clinicians and leaders.","m":"Shiraz is candid and supportive; his off-record views stay off-record. Ask him to bring in the CIO and department heads.","qs":[{"q":"Routing everything through Shiraz:","o":["Narrows your view","Is ideal"],"a":0,"w":"Broaden access."},{"q":"His off-record comments belong in:","o":["Nowhere written","The MoM"],"a":0,"w":"Never repeat."},{"q":"Off-record comments belong:","o":["Nowhere in writing","In the MoM"],"a":0,"w":"Confidentiality."}],"deep":"A champion advocates for you inside the client. Support them with clear, forwardable updates, keep their confidence, and use them to reach others without becoming dependent on one voice.","keys":["Make them look good","Keep confidences","Broaden access"],"mist":["Routing everything through the champion","Repeating private comments"],"ask":["Who else should we involve?","What would help you internally?"]},{"t":"Executive communication","s":"Context, finding, implication, decision. Two to four sentences.","an":"A news headline and first paragraph, not the whole article.","h":"\"Discharge is our biggest issue; billing clearance takes 195 minutes; beds are blocked; we suggest focusing on insurer approvals.\"","m":"Quote the strategy: \"speed at every major patient touchpoint\", \"trusted enterprise data\", \"responsible use of AI\".","qs":[{"q":"Executives first want:","o":["The implication and decision","The architecture"],"a":0,"w":"So what."},{"q":"A number in an executive message needs:","o":["A source","Rounding up"],"a":0,"w":"Traceable."},{"q":"The first thing an executive wants is:","o":["The implication and decision","The tech stack"],"a":0,"w":"So what."}],"deep":"Executives want context, finding, implication and decision in a few sentences, in their language. Numbers need sources. Technical detail is available on request.","keys":["Four beats","Their strategy words","Short and sourced"],"mist":["Leading with architecture","Unsourced numbers"],"ask":["What decision do you need from them?","What will they repeat to the Board?"]},{"t":"Translating technical language","s":"Turn technical facts into what they mean for the business.","an":"A mechanic saying \"your car will be fine for a month, then needs brakes\" instead of part numbers.","h":"\"No write API\" becomes \"new tools can read but not update records\".","m":"Example: \"Hospedia exposes read-only batch exports\" means new tools can see yesterday's data but cannot update records or alert in real time.","qs":[{"q":"\"Batch nightly\" means for users:","o":["Data updates once a day","Real-time alerts"],"a":0,"w":"Daily refresh."},{"q":"Before sharing a technical translation externally:","o":["Check with Arun","Just send it"],"a":0,"w":"Accuracy."},{"q":"Before sharing a translation externally:","o":["Validate with Arun","Send immediately"],"a":0,"w":"Accuracy."}],"deep":"Turn technical facts into business meaning: what changes, for whom, and what decision follows. Check the translation with the technical owner before sharing.","keys":["Fact, meaning, decision","Check with Arun"],"mist":["Oversimplifying into something wrong","Sharing without Arun's check"],"ask":["What does this mean for the user?","What decision does it affect?"]},{"t":"Saying the right level of certainty","s":"Discussed, proposed, indicated, confirmed, agreed are different levels.","an":"\"Maybe dinner\" is not \"booked a table\".","h":"\"MP Shah indicated interest\" is not \"MP Shah agreed\".","m":"Shiraz confirmed the remote week but not the onsite dates in his email; write exactly that.","qs":[{"q":"Shiraz said \"tentatively okay\" to dates. Write:","o":["MP Shah indicated tentative agreement","MP Shah agreed"],"a":0,"w":"Match the evidence."},{"q":"\"Our current understanding is\" signals:","o":["Best evidence, may change","A final decision"],"a":0,"w":"Honest uncertainty."},{"q":"Shiraz \"tentatively\" accepted dates. Write:","o":["Indicated tentative agreement","Agreed"],"a":0,"w":"Precision."}],"deep":"Discussed, proposed, indicated, confirmed and agreed are different. Wrong words in minutes create false commitments or false confidence.","keys":["Match words to evidence","Minutes are records"],"mist":["Writing \"agreed\" for \"discussed\""],"ask":["Did they confirm or indicate?"]},{"t":"Handling scope requests","s":"New requests are captured, understood, taken to Subhankar, then answered.","an":"A builder asked to add a room: they check cost and time before saying yes.","h":"\"Can you also look at procurement?\"","m":"The holistic scope (telemedicine, modules, data) is already a scope question for Subhankar under the proposal's change control.","qs":[{"q":"A COO asks for extra analysis. You say:","o":["Let me capture it and align internally before confirming","Yes, of course"],"a":0,"w":"Scope path."},{"q":"Who decides scope changes?","o":["Subhankar","You"],"a":0,"w":"Governance."},{"q":"The proposal's mechanism for scope changes is:","o":["Change control with written approval","Verbal agreement"],"a":0,"w":"Proposal V1.1."}],"deep":"Capture the request, understand why, take it to Subhankar, decide impact, then respond. Never yes or no in the room.","keys":["Capture, understand, escalate, respond","Scope belongs to Subhankar"],"mist":["Saying yes to please","Saying no to protect"],"ask":["What would you need from it, and by when?"]},{"t":"Vendor neutrality","s":"Respect the client's existing vendors. Position as complementary.","an":"A new contractor does not insult the previous builder in front of the homeowner.","h":"\"We build on what Hospedia delivers.\"","m":"Our Hospedia queries ask about scope, APIs, phases and data use. Finance users' concerns about Hospedia are noted, never amplified.","qs":[{"q":"A manager calls Hospedia \"a disaster\". You:","o":["Acknowledge and stay neutral","Agree"],"a":0,"w":"Neutral."},{"q":"Our questions to ITDose should be:","o":["Factual","Evaluative"],"a":0,"w":"Scope, APIs, phases."},{"q":"If asked whether Hospedia \"can't do this\", you say:","o":["We will confirm with Hospedia what is planned","Hospedia cannot do it"],"a":0,"w":"Neutral."}],"deep":"Respect the client's existing vendors. Ask factual questions, never evaluative ones, and position as complementary. Never hide your involvement.","keys":["Complement, neve
