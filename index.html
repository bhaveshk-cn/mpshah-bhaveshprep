<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MP Shah Companion</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E7C70">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#F2F5F8;--card:#fff;--ink:#101828;--muted:#667085;--line:#E4E7EC;--teal:#0E7C70;--tealbg:#E3F4F1;--indigo:#4053D6;--indigobg:#EAEDFC;--amber:#E39A0B;--amberbg:#FEF4DE;--violet:#7A5AF8;--violetbg:#F0EBFF;--red:#D92D20;--redbg:#FDECEA;--green:#12A15F;--greenbg:#E4F7EE;--r:20px;--sh:0 4px 18px rgba(16,24,40,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C111D;--card:#161B26;--ink:#F2F4F7;--muted:#98A2B3;--line:#252C3B;--tealbg:#0F2A27;--indigobg:#1A1F3D;--amberbg:#2E2410;--violetbg:#231B3D;--redbg:#341613;--greenbg:#0F2A1E;--teal:#2EC4B1;--indigo:#8B9BFF;--violet:#A58BFF;--amber:#F5B83D;--red:#FF6B5E;--green:#3DD68C;--sh:none}}
:root[data-theme=dark]{--bg:#0C111D;--card:#161B26;--ink:#F2F4F7;--muted:#98A2B3;--line:#252C3B;--tealbg:#0F2A27;--indigobg:#1A1F3D;--amberbg:#2E2410;--violetbg:#231B3D;--redbg:#341613;--greenbg:#0F2A1E;--teal:#2EC4B1;--indigo:#8B9BFF;--violet:#A58BFF;--amber:#F5B83D;--red:#FF6B5E;--green:#3DD68C;--sh:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.shell{max-width:600px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header.top h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.02em}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;font-size:1.15rem}
.back{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:6px 0;font-size:.95rem}
h2{font-size:1.25rem;font-weight:800;margin:22px 0 10px;letter-spacing:-.01em}
p{margin:0 0 .7em}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
/* home */
.hello{font-size:1.05rem;color:var(--muted);margin:4px 0 2px}
.count{display:inline-flex;align-items:baseline;gap:8px;background:var(--amberbg);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;margin:4px 0 16px}
.count b{font-size:1.15rem;color:var(--amber)}
.today{background:var(--teal);color:#fff;border-radius:24px;padding:22px;cursor:pointer;border:0;width:100%;text-align:left;display:block;margin-bottom:16px}
.today small{opacity:.85;font-weight:600}
.today h3{font-size:1.4rem;margin:6px 0 8px;font-weight:800;line-height:1.2}
.today .go{display:inline-block;background:#fff;color:var(--teal);border-radius:999px;padding:7px 16px;font-weight:800;margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:var(--r);padding:18px 16px;text-align:left;cursor:pointer;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.tile .em{font-size:1.8rem}
.tile b{font-size:1.1rem;font-weight:800;display:block}
.tile span{font-size:.86rem;opacity:.85}
.t-teal{background:var(--tealbg);color:var(--ink)}.t-teal b{color:var(--teal)}
.t-indigo{background:var(--indigobg);color:var(--ink)}.t-indigo b{color:var(--indigo)}
.t-amber{background:var(--amberbg);color:var(--ink)}.t-amber b{color:var(--amber)}
.t-violet{background:var(--violetbg);color:var(--ink)}.t-violet b{color:var(--violet)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);margin:14px 0;cursor:text;border:0;width:100%;text-align:left;color:var(--muted)}
/* segmented */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--sh);margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:480px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.pick{background:var(--card);border:0;border-radius:16px;padding:14px;text-align:left;cursor:pointer;box-shadow:var(--sh);min-height:96px;display:flex;flex-direction:column;gap:6px}
.pick .em{font-size:1.5rem}.pick b{font-size:.95rem;line-height:1.25}.pick span{font-size:.8rem;color:var(--muted)}
/* brief */
.bhead{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.bhead .em{font-size:2.2rem;width:64px;height:64px;border-radius:18px;background:var(--tealbg);display:grid;place-items:center;flex:0 0 auto}
.bhead h1{font-size:1.45rem;margin:0;font-weight:800;line-height:1.2}
.lbl{font-size:.82rem;font-weight:800;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.know li{margin:0 0 8px}
ol.ask{padding-left:0;list-style:none;counter-reset:q;margin:0}
ol.ask li{counter-increment:q;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
ol.ask li:last-child{border:0}
ol.ask li:before{content:counter(q);flex:0 0 28px;height:28px;border-radius:50%;background:var(--indigobg);color:var(--indigo);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--amberbg);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600}
.avoid{background:var(--redbg);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.avoid .lbl{color:var(--red)}
.cta{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--indigo);color:#fff;text-align:center}
.cta.teal{background:var(--teal)}.cta.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.row{display:flex;gap:10px}.row>*{flex:1}
/* meeting */
.askbig{background:var(--indigo);color:#fff;border-radius:24px;padding:24px 22px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
.askbig .q{font-size:1.35rem;font-weight:800;line-height:1.3}
.askbig .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.askbig .nav button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.cap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.cap button{border:0;border-radius:14px;padding:12px 4px;font-weight:800;cursor:pointer;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);box-shadow:var(--sh)}
.cap button .em{font-size:1.3rem}
.cap button.on{background:var(--teal);color:#fff}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);min-height:84px;resize:vertical}
input[type=text],input[type=search],select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.note{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.note:last-child{border:0}
.tag{flex:0 0 auto;font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 7px;height:fit-content;background:var(--tealbg);color:var(--teal)}
.del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem}
/* learn */
.deck{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:10px;width:100%;text-align:left;cursor:pointer}
.ring{width:46px;height:46px;flex:0 0 auto}
.deck b{display:block;font-size:1rem}.deck span{font-size:.82rem;color:var(--muted)}
.slide{border-radius:28px;padding:30px 24px;min-height:min(62vh,520px);display:flex;flex-direction:column;justify-content:center;color:#fff;position:relative}
.c-teal{background:linear-gradient(160deg,#0E7C70,#0A5B53)}.c-amber{background:linear-gradient(160deg,#C9800A,#A86500)}.c-red{background:linear-gradient(160deg,#C2382D,#9B2219)}.c-indigo{background:linear-gradient(160deg,#4053D6,#2C3BA8)}.c-violet{background:linear-gradient(160deg,#7A5AF8,#5839D1)}
.bars{display:flex;gap:4px;position:absolute;top:16px;left:20px;right:20px}
.bars i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}.bars i.on{background:#fff}
.slide .big{font-size:clamp(3rem,14vw,4.6rem);font-weight:800;line-height:1;margin-bottom:12px;letter-spacing:-.03em}
.slide h3{font-size:1.6rem;font-weight:800;line-height:1.2;margin:0 0 12px}
.slide p{font-size:1.15rem;line-height:1.5;opacity:.95;margin:0}
.slide .tipbtn{margin-top:20px;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;align-self:flex-start}
.slide .tip{margin-top:18px;background:rgba(255,255,255,.16);border-radius:16px;padding:14px 16px;font-size:1.05rem}
.slidenav{display:flex;gap:10px;margin-top:14px}
.slidenav button{flex:1}
/* practice */
.pcard{display:flex;gap:14px;align-items:center;border:0;border-radius:var(--r);padding:18px;width:100%;text-align:left;cursor:pointer;margin-bottom:12px}
.pcard .em{font-size:2rem}.pcard b{font-size:1.1rem;display:block}.pcard span{font-size:.88rem;color:var(--muted)}
.qcard{background:var(--card);border-radius:24px;padding:24px 20px;box-shadow:var(--sh);margin-bottom:14px}
.qcard .q{font-size:1.25rem;font-weight:800;line-height:1.35;margin-bottom:18px}
.opts{display:grid;gap:8px}
.opts button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-weight:700;cursor:pointer;text-align:left}
.opts button.right{border-color:var(--green);background:var(--greenbg)}.opts button.wrong{border-color:var(--red);background:var(--redbg)}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:.95rem}
.fb.good{background:var(--greenbg)}.fb.bad{background:var(--redbg)}.fb.mid{background:var(--amberbg)}
.bubble{background:var(--indigobg);border-radius:18px 18px 18px 6px;padding:14px 16px;margin:0 0 14px}
.bubble small{display:block;font-weight:800;color:var(--indigo);margin-bottom:4px}
.me{background:var(--tealbg);border-radius:18px 18px 6px 18px;padding:12px 16px;margin:0 0 6px 30px;font-weight:600}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 14px}.meter i{display:block;height:100%;background:var(--teal)}
.say .no,.say .yes{border-radius:14px;padding:12px 14px;margin-top:10px}
.say .no{background:var(--redbg)}.say .yes{background:var(--greenbg)}
/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.bottom .in{display:flex;max-width:600px;width:100%}
nav.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;padding:6px 0;border-radius:12px}
nav.bottom a .em{display:block;font-size:1.3rem;line-height:1.3;filter:grayscale(1);opacity:.7}
nav.bottom a.on{color:var(--teal)}nav.bottom a.on .em{filter:none;opacity:1}
/* search results */
.res{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);border:0;width:100%;text-align:left;cursor:pointer;display:block}
.res small{color:var(--muted);font-weight:700;font-size:.75rem}
.sheet{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;font-size:.9rem}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.steps{position:relative;margin:0;padding:0;list-style:none}
.steps li{position:relative;padding:0 0 16px 44px}
.steps li:before{content:attr(data-n);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.steps li:after{content:'';position:absolute;left:14px;top:32px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child:after{display:none}
.steps b{display:block;font-size:1rem}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;margin:4px 6px 0 0;background:var(--indigobg);color:var(--indigo)}
.pill.sys{background:var(--tealbg);color:var(--teal)}
.pill.v{background:var(--violetbg);color:var(--violet)}
.analogy{font-size:1.15rem;line-height:1.5;font-weight:600}
.term{display:block;width:100%;text-align:left;border:0;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.term b{font-size:1rem}.term span{display:block;color:var(--muted);margin-top:4px}
.term .hint{color:var(--teal);font-size:.8rem;font-weight:700}
.opp{border-left:4px solid var(--violet);padding:8px 12px;margin-bottom:10px;background:var(--bg);border-radius:0 12px 12px 0}
.ev{font-size:.95rem;margin-bottom:8px;padding-left:12px;border-left:3px solid var(--amber)}
.secnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--card);font-size:.75rem;font-weight:800;margin-right:4px}
.done-badge{position:absolute;top:10px;right:12px;font-size:1rem}
.pick{position:relative}
.trackbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.trackbar i{display:block;height:100%;background:var(--teal)}
.concept h3{font-size:.85rem;font-weight:800;color:var(--muted);margin:0 0 6px;text-transform:none}
.mq{margin-top:14px}
.mq .q{font-weight:800;margin-bottom:10px}
.tile.wide{grid-column:1/-1;min-height:110px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
</style></head><body>
<div class="shell" id="app"></div><nav class="bottom" aria-label="Main"><div class="in" id="bn"></div></nav><div class="toast" id="toast" role="status"></div>
<script type="application/json" id="data">{"depts":[{"n":"Contact Centre and Pre-Arrival","what":"First point of contact: inbound calls, appointment booking and confirmation, call transfers, enquiries on pricing, timings, results and doctor availability. Often also outbound reminders.","flow":"Call arrives → agent answers (or queue/abandon) → identify purpose → book, confirm, transfer or answer → log in contact centre system (KATi at MP Shah) → close.","people":"Contact centre agents, supervisor, customer care desk, IT for telephony.","sys":"KATi (contact centre), web appointment portal, telephony, Kranium/Hospedia scheduling (Client-reported).","data":"Call volumes by hour, reasons, handle time, abandonment, SLA, bookings made.","kpi":"Call SLA (answered within 10s), abandonment rate, first-call resolution, bookings per agent.","ev":["Call SLA 68.9% vs 90% target; around 25% at 10:00 peak (Kaizen).","59% of 7,333 analysed calls deflectable: transfers 24%, bookings 20%, confirmations 6%, pricing 5%, timings 4% (Kaizen).","Dropped calls over 10% (Kaizen journey maps).","Patient: \"Called the hotline number given in the website, it wasn't picked, so I had to walk in to book.\"","CIO owns Kaizen action ID 8: deflect routine calls using AI or simple automated mechanisms."],"opp":[["IVR menu and directory for transfers","Automation","Transfers are 24%; simple routing may solve most"],["Self-service booking via web/WhatsApp","Software + integration","Depends on Hospedia scheduling APIs; overlaps Hospedia Phase 2 patient app"],["Conversational voice or chat assistant for FAQs and bookings","GenAI + integration","Only where routine queries need natural language; must hand off to humans"],["Automated appointment confirmations and reminders","Automation","SMS exists in Hospedia scope; check configuration first"],["Peak-hour staffing analytics","Analytics","10:00 collapse suggests rostering issue"]],"q":["Walk me through what happens from the moment a call comes in to when it closes.","Which call types take the longest, and which could be answered without an agent?","Why do transfers make up a quarter of calls? Where do callers want to go?","What happens at 10:00 that makes the service level drop?","How do bookings made by phone reach the doctor's schedule, and why are they sometimes not honoured on arrival?","What does KATi record, and can we see a sample export?","Have you tried any self-service or automated options before? What happened?","Which languages do callers use?"],"listen":["\"We just transfer them\" (directory gap)","\"The system does not show the doctor's real availability\" (integration/scheduling root cause)","\"We are short at peak\" (staffing, not technology)","Multilingual needs (Swahili, English, others)"],"red":["Jumping to \"AI voice bot\" before checking whether an IVR or directory solves 24% of volume.","Proposing booking automation when the underlying problem is unreliable consultant availability (Kaizen ID 16)."],"lead":"Virender (process), Arun (telephony, integration, AI feasibility)"},{"n":"Patient Registration, Front Desk and Queue Management","what":"Creates or retrieves the patient record, captures demographics and payer details, issues queue tickets and guides the patient to the next step.","flow":"Arrival → QMS ticket → registration (new) or retrieval (review) → payer verification → issue UHID/card → direct to triage or billing.","people":"Front desk, customer care, cashiers, IT.","sys":"QMS, Kranium registration, Hospedia patient registration (UHID, biometrics, photo), website appointment portal.","data":"Demographics, UHID, insurer and scheme, contact details, visit history, queue timestamps.","kpi":"Registration time, queue wait, duplicate record rate, data completeness.","ev":["QMS used inconsistently across OPD and specialty clinics; recommendation: single ticket for the entire patient journey (Kaizen ID 1, CIO).","Patient emails and mobile numbers not verified; recommend OTP (Kaizen ID 10).","No ma ile tracking","Knowing where every physical file is"]],"wrong":["Files lost or not returned","Incomplete documentation","Coding gaps cause claim rejections"],"quiz":[{"q":"Coding matters for insurance because:","o":["Insurers need standard codes to pay","It looks professional","It saves paper"],"a":0,"w":"Uncoded claims get rejected."},{"q":"Before assuming \"digital records\", ask:","o":["How much is still on paper?","Which font they use","How many printers exist"],"a":0,"w":"Many hospitals are partly paper."},{"q":"A DMS stores:","o":["Scanned documents","Images from scanners","Payroll"],"a":0,"w":"Document management."}]},{"a":"Like HR anywhere, but with shift-based clinical staff, licences and round-the-clock rosters.","why":"The strategy wants MP Shah to be the employer of choice. Staffing limits how fast services can grow.","steps":[["Staff request (leave, payslip, policy)","Employee","HR system"],["Approval","Manager","HR system"],["Records updated","HR","EnQuest"],["Payroll run","Payroll","EnQuest"],["Recruitment and rostering","HR / managers","HR system"]],"terms":[["HRMS","Human resource management system"],["Roster","Shift schedule"],["Attrition","Staff leaving"],["Policy assistant","AI that answers staff questions from approved documents"]],"wrong":["Same questions asked repeatedly","Policies outdated","Shortages in key roles"],"quiz":[{"q":"Before building an HR assistant, check:","o":["How many questions staff actually ask, and whether policies are current","The colour scheme","Payroll totals"],"a":0,"w":"Validate volume and content first."},{"q":"A policy assistant that answers from approved documents uses:","o":["RAG","Computer vision","IVR"],"a":0,"w":"Retrieval-augmented generation."},{"q":"Staffing shortages are mainly solved by:","o":["Recruitment and retention","AI","A dashboard alone"],"a":0,"w":"Technology supports planning, not hiring."}]},{"a":"Like a warehouse and purchasing team for a small city: buy, receive, store, issue, count, reorder. g and wayfinding problems"],"quiz":[{"q":"Serving food to a nil-by-mouth patient is mainly a:","o":["Safety risk solvable with system flags","Taste problem","Parking problem"],"a":0,"w":"A flag in the system prevents it."},{"q":"Most catering complaints are about:","o":["Food quality and temperature","Software","Pricing"],"a":0,"w":"Often not a technology problem."},{"q":"The right instinct here is:","o":["Do not over-technologise quality and staffing problems","Build an app for everything","Ignore it"],"a":0,"w":"Fix what is really broken."}]},{"a":"Like the IT department in any large company, but with life-critical systems that cannot go down.","why":"Every digital change depends on ICT. They own systems, vendors, security and the Hospedia rollout.","steps":[["Requests and incidents logged","Users","Ticketing"],["Support and fixes","ICT team","Systems"],["Vendor coordination","CIO","Contracts"],["Security and access control","ICT","AD"],["Backups and infrastructure","ICT","Servers"]],"terms":[["CIO","Chief Information Officer"],["AD / SSO","One login across systems"],["Sandbox","Safe test copy of a system"],["On-premise","Servers in the hospital"],["Data residency","Where data is physically stored"]],"wrong":["Heavy dependency on vendors for changes","No test environment","Data spread across old and new systems"],"quiz":[{"q":"With ICT, technical commitments should come from:","o":["Arun","You, to sound confident","The client"],"a":0,"w":"Coordinate; do not absorb."},{"q":"A sandbox is:","o":["A safe test environment","A backup","A server room"],"a":0,"w":"Test without risk."},{"q":"Why does data residency matter at MP Shah?","o":["Kenyan data protection rules may limit where patient data is stored","It does not","For speed only"],"a":0,"w":"Relevant to any cloud hosting."}]},{"a":"Like a factory's continuous improvement team: measure, find the cause, fix, check, repeat.","why":"MP Shah has an existing improvement culture (JCI, daily Kaizen boards). Build on it, never around it.","steps":[["KPIs measured","Quality team","Manual / reports"],["Daily Kaizen board reviews","Unit managers","Boards"],["Concern, cause, countermeasure (3C)","Teams","Boards"],["Actions tracked","Quality office","Tracker"],["Audits for JCI","Quality team","Audit tools"]],"terms":[["JCI","Joint Commission International accreditation"],["Kaizen","Continuous improvement"],["3C","Concern, Cause, Countermeasure"],["CSAT","Customer satisfaction score"],["Quick win","Improvement with no capital spend"]],"wrong":["KPIs counted manually","Customer-centric KPIs missing","Post-visit follow-up has no owner"],"quiz":[{"q":"The Board was told to close quick wins:","o":["Before committing capital to large investments","After buying new systems","Never"],"a":0,"w":"Respect this sequencing in our roadmap."},{"q":"\"We count it manually for the board\" signals:","o":["A dashboard opportunity","An AI opportunity","Nothing"],"a":0,"w":"Analytics."},{"q":"Our attitude to the Kaizen study should be:","o":["Build on it visibly","Redo it","Ignore it"],"a":0,"w":"Respect existing work."}]}],"tracks":[{"t":"How a hospital works","e":"🏥","c":"teal","items":[{"t":"Outpatient vs inpatient","s":"Outpatients come and go the same day. Inpatients stay overnight in a bed.","an":"Like a day visit to a bank branch versus checking into a hotel.","h":"An OPD patient sees a doctor, has tests and goes home. An IPD patient is admitted, cared for on a ward and later discharged.","m":"Over half of MP Shah journeys are insured review outpatients. Inpatients are fewer but drive bed pressure.","qs":[{"q":"A patient admitted for surgery is:","o":["Outpatient","Inpatient"],"a":1,"w":"They stay overnight."},{"q":"Most MP Shah patient journeys are:","o":["Inpatient admissions","Insured review outpatients"],"a":1,"w":"Kaizen: about 53% corporate review outpatients."}]},{"t":"The patient journey","s":"The full path a patient takes, from first contact to follow-up. Problems hide in the handoffs.","an":"Like an airport: check-in, security, gate, boarding. Delays happen between steps.","h":"Call, arrive, queue, register, triage, consult, tests, pharmacy, pay, leave, follow up.","m":"Kaizen found sentiment drops at billing, pharmacy, diagnostics and discharge: the stages with most handoffs.","qs":[{"q":"Where do most delays usually hide?","o":["Inside a single step","In handoffs between steps"],"a":1,"w":"Waiting happens between people and systems."},{"q":"At MP Shah, patient sentiment drops most at:","o":["Arrival","Billing, pharmacy, diagnostics, discharge"],"a":1,"w":"Kaizen emotional mapping."}]},{"t":"The revenue cycle","s":"Every step from first contact to the last payment collected.","an":"Like an online order: cart, payment approval, shipping, invoice, refund handling.","h":"Register, pre-authorise, capture charges, code, bill, submit claim, insurer decides, payment, reconcile, collect.","m":"A mistake at registration becomes a rejection weeks later. Credit Control raised the most Hospedia requirements.","qs":[{"q":"A wrong scheme at registration usually shows up as:","o":["A rejected claim later","A faster discharge"],"a":0,"w":"Errors travel downstream."},{"q":"Pre-authorisation happens:","o":["Before or during treatment","After payment"],"a":0,"w":"Insurer approves cover first."}]},{"t":"Insurance in Kenya","s":"Most private patients are covered by insurers or employers. The public scheme is run by SHA through SHIF.","an":"Like travel insurance: you need approval and paperwork before and after.","h":"Hospitals connect to insurers through EDI providers such as Smart, M-Tiba and Slade for verification and claims.","m":"Patients told Kaizen \"SHA is not working\" and asked the hospital to handle insurer paperwork for them.","qs":[{"q":"EDI providers connect:","o":["Hospitals and insurers","Doctors and pharmacies"],"a":0,"w":"Electronic data interchange."},{"q":"SHA/SHIF is:","o":["Kenya's public health insurance authority and fund","A private insurer"],"a":0,"w":"Replaced NHIF."}]},{"t":"Turnaround time (TAT)","s":"How long a step takes. The universal language of hospital efficiency.","an":"Like delivery time on an online order.","h":"Lab TAT: sample to result. Discharge TAT: decision to exit. Report TAT: scan to final report.","m":"Median discharge TAT is 309 minutes; CT/MRI reporting can take 7 days.","qs":[{"q":"Discharge TAT measures:","o":["Admission to discharge","Discharge decision to patient leaving"],"a":1,"w":"Decision to physical exit."},{"q":"Why break TAT into stages?","o":["To find the real bottleneck","To make reports longer"],"a":0,"w":"Billing clearance alone is 195 minutes."}]},{"t":"Who runs a hospital","s":"CEO sets strategy; COO runs operations; CFO runs money; CMO and CNO lead doctors and nurses; CIO runs technology; HODs run departments.","an":"Like a company with a board, executives and branch managers, plus expert professionals who are not managed like normal staff.","h":"A doctor may be a private consultant with admitting rights, not an employee.","m":"MP Shah's CIO runs IT and Hospedia but has not met us. Shiraz drives AI adoption.","qs":[{"q":"Who owns technology systems and vendors?","o":["CMO","CIO"],"a":1,"w":"Chief Information Officer."},{"q":"A private consultant with admitting rights is:","o":["Always a hospital employee","Often independent, using the hospital to treat patients"],"a":1,"w":"Common in private hospitals."}]},{"t":"JCI and patient safety","s":"JCI is an international hospital accreditation. It checks safety, documentation and continuous improvement.","an":"Like ISO certification, but for patient safety.","h":"Correct patient ID, safe medication, infection control, audit trails, incident reporting.","m":"MP Shah is JCI-accredited. Any change touching care must keep these standards intact.","qs":[{"q":"MP Shah's JCI accreditation means new systems must:","o":["Preserve audit trails and safety processes","Avoid documentation"],"a":0,"w":"Safety and traceability."},{"q":"Incident reporting is:","o":["A strength at MP Shah to build on","Something to bypass"],"a":0,"w":"Named as a strength in the strategy."}]}]},{"t":"Systems and data","e":"🖥️","c":"indigo","items":[{"t":"HIS and EMR","s":"The HIS runs the hospital's operations. The EMR is the clinical record inside it.","an":"The HIS is the whole airline booking system; the EMR is each passenger's detailed file.","h":"Registration, orders, wards and billing sit in the HIS. Notes, diagnoses and results sit in the EMR.","m":"MP Shah is moving from Kranium to Hospedia (ITDose), now in testing.","qs":[{"q":"Billing lives in:","o":["The HIS","PACS"],"a":0,"w":"Operations."},{"q":"MP Shah's new HIS is:","o":["Kranium","Hospedia"],"a":1,"w":"Kranium is the legacy system."}]},{"t":"LIS, RIS and PACS","s":"LIS runs the lab. RIS runs radiology bookings and reports. PACS stores and shows images.","an":"RIS is the appointment book and report folder; PACS is the photo archive.","h":"Doctor orders a scan in the RIS, images land in PACS, radiologist reports in RIS.","m":"MP Shah's PACS is RadWeb; the lab system is separate from Kranium today.","qs":[{"q":"Images are stored in:","o":["RIS","PACS"],"a":1,"w":"Picture archive."},{"q":"The radiology report is managed in:","o":["RIS","LIS"],"a":0,"w":"Radiology information system."}]},{"t":"APIs","s":"A defined doorway one system uses to ask another for data.","an":"Like a restaurant menu: you order through it, you do not walk into the kitchen.","h":"A new app reads lab results from the HIS through an API.","m":"We asked ITDose which APIs exist, read or write, and whether third parties may use them.","qs":[{"q":"Read-only API means a new tool can:","o":["View data but not update records","Update everything"],"a":0,"w":"Look, not change."},{"q":"Why ask about third-party rights?","o":["APIs may exist but be contractually restricted","It is a formality"],"a":0,"w":"Rights decide feasibility."}]},{"t":"HL7, FHIR, DICOM","s":"Shared languages for health data. HL7 v2: older messages. FHIR: modern web APIs. DICOM: images.","an":"Like plugs and sockets: standards let devices from different makers connect.","h":"Lab analysers often send HL7; scanners send DICOM; new apps prefer FHIR.","m":"The radiology head asked for FHIR exports and DICOM worklists in the gap register.","qs":[{"q":"Medical images use:","o":["FHIR","DICOM"],"a":1,"w":"Imaging standard."},{"q":"The modern web-friendly standard is:","o":["HL7 v2","FHIR"],"a":1,"w":"Fast Healthcare Interoperability Resources."}]},{"t":"Integration vs interoperability","s":"Integration connects systems. Interoperability means both understand the data the same way.","an":"Integration is a phone line; interoperability is speaking the same language.","h":"Two systems may be connected but use different codes for the same test.","m":"When ICT says \"integrated\", check with users whether data really flows.","qs":[{"q":"Two systems connected but using different codes have:","o":["Integration without interoperability","Full interoperability"],"a":0,"w":"Plumbing, not shared meaning."},{"q":"ICT says integrated; lab staff re-type results. You:","o":["Record both and ask Arun to validate","Decide ICT is wrong"],"a":0,"w":"Never pick a side without evidence."}]},{"t":"Data quality and the patient index","s":"Data is only useful if it is complete, accurate and linked to one patient identity.","an":"Like a contacts list with three entries for the same person.","h":"Duplicate records, free-text fields and blank values break reports and AI.","m":"The gap register shows blank report fields and free-text problems.","qs":[{"q":"Duplicate patient records are mainly fixed by:","o":["Process and validation rules","AI alone"],"a":0,"w":"Registration discipline first."},{"q":"A Master Patient Index ensures:","o":["One identity per patient","Faster billing"],"a":0,"w":"Single identity."}]},{"t":"Data lake and data platform","s":"One central store for data from many systems, organised so reports and AI use the same numbers.","an":"Like a central warehouse instead of stock scattered across many shops.","h":"Raw copies (bronze), cleaned data (silver), business-ready data (gold).","m":"Shiraz plans a data lake; data sits across old Kranium, current Kranium and soon Hospedia.","qs":[{"q":"Why build a data platform before most AI?","o":["AI needs trusted, joined-up data","It is cheaper"],"a":0,"w":"Foundation first."},{"q":"Gold layer data is:","o":["Raw","Business-ready"],"a":1,"w":"Cleaned and modelled."}]}]},{"t":"AI in healthcare","e":"🤖","c":"violet","items":[{"t":"AI or not AI?","s":"Choose the simplest fix: process, integration, automation, analytics, then AI.","an":"Do not buy a robot to open a door that only needs a handle.","h":"Missed lab tests need an alert rule, not AI.","m":"Most MP Shah evidence points to integration, automation and analytics first.","qs":[{"q":"\"Patients arrive without fasting\" is solved by:","o":["Automated reminders","Computer vision"],"a":0,"w":"Rules."},{"q":"AI is right when the task needs:","o":["Language, images, prediction or generation","Fixed rules"],"a":0,"w":"Simpler options fall short."}]},{"t":"Types of AI","s":"Predictive models forecast; computer vision reads images; NLP reads text; speech AI transcribes; generative AI writes.","an":"Different tools in a toolbox.","h":"Predict discharges, flag X-rays, extract diagnoses, transcribe dictation, draft summaries.","m":"Radiology wants vision and speech; finance wants analytics; the contact centre may need little AI.","qs":[{"q":"Flagging fractures uses:","o":["Computer vision","NLP"],"a":0,"w":"Images."},{"q":"Drafting a discharge summary uses:","o":["Generative AI","Predictive model"],"a":0,"w":"Text generation."}]},{"t":"RAG assistants","s":"An AI that answers questions from approved documents and cites them.","an":"Like a librarian who reads only the hospital's policy books before answering.","h":"A staff assistant answering HR or SOP questions with sources.","m":"Only valuable if question volume is real and policies are current.","qs":[{"q":"RAG answers from:","o":["Approved documents it retrieves","Its imagination"],"a":0,"w":"Grounded answers."},{"q":"Before building an HR assistant, check:","o":["Question volume and policy accuracy","Screen colours"],"a":0,"w":"Validate need and content."}]},{"t":"Ambient scribe","s":"AI that listens to a consultation and drafts the clinical note for the doctor to approve.","an":"Like a court stenographer who also writes the summary.","h":"Reduces evening documentation for doctors.","m":"Hospedia struggles with voice; a UK vendor already pitched this to MP Shah.","qs":[{"q":"Who approves the scribe's note?","o":["The doctor","The AI"],"a":0,"w":"Clinician accountability."},{"q":"At MP Shah this space is:","o":["Contested by other vendors","Empty"],"a":0,"w":"A UK vendor pitched it."}]},{"t":"Is the data ready?","s":"Data must exist, be accessible, usable, good quality, have history and labels, flow back, and be governed.","an":"Having ingredients in the cupboard does not mean you can cook the dish tonight.","h":"Denial prediction needs rejection reasons recorded consistently.","m":"\"We have the data\" usually means only that it exists somewhere.","qs":[{"q":"For supervised ML, labels mean:","o":["The correct outcomes are recorded","The data has names"],"a":0,"w":"Training answers."},{"q":"\"Unknown\" in a readiness check is:","o":["A next question for the right owner","A failure"],"a":0,"w":"Turn unknowns into questions."}]},{"t":"Judging AI: recall and precision","s":"Recall: did it catch the real cases? Precision: were its alerts right?","an":"A smoke alarm with high recall catches every fire; with low precision it also screams at toast.","h":"For urgent X-ray triage, missing a real case is the dangerous error.","m":"Say \"around 81% on its data; would need testing on MP Shah images\", never a bare number.","qs":[{"q":"A false negative is:","o":["A missed real case","A false alarm"],"a":0,"w":"Dangerous in screening."},{"q":"Low precision causes:","o":["Alert fatigue","Missed cases"],"a":0,"w":"Too many false alarms."}]},{"t":"Clinical vs non-clinical AI","s":"Clinical AI affects diagnosis or treatment; non-clinical AI affects operations.","an":"Autopilot versus the airline's booking chatbot.","h":"Imaging AI needs validation and oversight; an HR assistant needs less.","m":"MP Shah strategy: AI supports clinicians, never replaces their accountability. Shiraz mentioned medical board approval.","qs":[{"q":"Which needs heavier governance?","o":["Radiology triage","HR policy assistant"],"a":0,"w":"Clinical risk."},{"q":"In clinical AI the final decision belongs to:","o":["The clinician","The model"],"a":0,"w":"Accountability."}]},{"t":"PoC, pilot, production","s":"PoC tests feasibility; pilot tests real use with few users; production is supported and integrated for all.","an":"Recipe test, then a soft launch, then the full restaurant menu.","h":"Silent-mode testing on past scans before any clinician relies on AI.","m":"Our fracture detection work was a proof of concept, not a product.","qs":[{"q":"A PoC proves:","o":["Technical feasibility","Hospital-wide value"],"a":0,"w":"One uncertainty."},{"q":"A good PoC answers:","o":["What will we know after that we do not know now?","How much can we bill?"],"a":0,"w":"Specific question."}]}]},{"t":"Discovery and analysis","e":"🔍","c":"amber","items":[{"t":"Symptom vs root cause","s":"A symptom is what people complain about. The root cause is why it happens.","an":"A headache is the symptom; dehydration may be the cause.","h":"\"Discharges are slow\" is a symptom; late doctor charges and insurer approvals are causes.","m":"Kaizen data separates symptoms from causes by stage.","qs":[{"q":"\"Staff enter data twice\" is:","o":["A symptom","A root cause"],"a":0,"w":"Ask why."},{"q":"You stop asking \"why\" when:","o":["You reach something actionable, or you are guessing","After exactly five"],"a":0,"w":"Do not invent links."}]},{"t":"Five Whys","s":"Ask why repeatedly until you reach an actionable cause.","an":"A child asking why, but with discipline.","h":"Slow discharge, billing slow, insurer waits, invoice late, doctor charges late, no reminder.","m":"Kaizen recommended day-2 charge reminders, exactly where this chain ends.","qs":[{"q":"If you are guessing at the third why, you should:","o":["Mark it as an open question","Keep guessing"],"a":0,"w":"Evidence first."},{"q":"Five Whys aims for:","o":["An actionable cause","A long list"],"a":0,"w":"Action."}]},{"t":"AS-IS and TO-BE","s":"AS-IS is how work happens today, including workarounds. TO-BE is how it should work.","an":"A before-and-after floor plan for a renovation.","h":"Map what people actually do, not what the policy says.","m":"Kaizen already mapped many AS-IS journeys. Build on them.","qs":[{"q":"AS-IS should show:","o":["Real practice including Excel and paper","The official policy"],"a":0,"w":"Reality."},{"q":"The gap between AS-IS and TO-BE becomes:","o":["Requirements","Invoices"],"a":0,"w":"What must change."}]},{"t":"Requirements","s":"Business: the outcome needed. Functional: what the system does. Non-functional: how well.","an":"\"Arrive on time\" (business), \"show live traffic\" (functional), \"update every minute\" (non-functional).","h":"Notify pharmacy when discharge starts; within one minute; audit logged.","m":"Hospedia's gap register is mostly functional requirements written by users.","qs":[{"q":"\"Notification within one minute\" is:","o":["Non-functional","Business"],"a":0,"w":"How well."},{"q":"A user story looks like:","o":["As a [role], I want [x], so that [y]","A price list"],"a":0,"w":"Standard format."}]},{"t":"Prioritisation","s":"Rank opportunities on value and feasibility using agreed criteria.","an":"Choosing which house repairs to do first: leaking roof before new curtains.","h":"Quick wins first, foundations next, strategic bets later.","m":"Use MP Shah's own test: clinical impact, safety, affordability, feasibility, sustainable value. The Board wants no-capex quick wins first.","qs":[{"q":"MP Shah's Board was told to start with:","o":["No-capex quick wins","The biggest AI project"],"a":0,"w":"Sequencing."},{"q":"A high-value, low-feasibility item needs:","o":["Foundations fixed first","Immediate build"],"a":0,"w":"Strategic bet."}]},{"t":"Business case and baseline","s":"A business case shows value, cost and risk. A baseline is today's measured performance.","an":"You cannot claim weight loss without weighing yourself first.","h":"\"Billing clearance 195 minutes today; target a third less; validate in a pilot.\"","m":"Kaizen numbers give us baselines. Never invent ROI; pricing is Subhankar's.","qs":[{"q":"Without a baseline you should say:","o":["Baseline measurement required","Expect 50% savings"],"a":0,"w":"Never fabricate."},{"q":"Who owns pricing?","o":["Subhankar","You"],"a":0,"w":"Commercial ownership."}]},{"t":"Evidence labels","s":"Confirmed, client-reported, observed, inference, hypothesis, open question.","an":"A journalist distinguishing verified facts from sources' claims.","h":"\"Shiraz said Hospedia has no AI\" is client-reported, not confirmed.","m":"Mislabelled evidence is how bad recommendations reach the Board.","qs":[{"q":"A stakeholder's statement is:","o":["Client-reported","Confirmed fact"],"a":0,"w":"Until validated."},{"q":"\"Billing likely drives discharge delay\" is:","o":["An inference","A decision"],"a":0,"w":"Reasonable interpretation."}]}]},{"t":"People and communication","e":"🤝","c":"teal","items":[{"t":"Who decides what","s":"Problem owner, sponsor, technical evaluator, budget owner, approver and procurement are often different people.","an":"Buying a family car: one person needs it, one pays, one checks the engine.","h":"The Head of Radiology owns the problem; the CIO evaluates; the CEO approves.","m":"We know the champion (Shiraz). We do not know the CIO, the budget owner or the approval path.","qs":[{"q":"Shiraz is best described as:","o":["Champion; authority to confirm","Final approver"],"a":0,"w":"Do not assume."},{"q":"The biggest stakeholder gap now is:","o":["The CIO","The Kaizen team"],"a":0,"w":"Not engaged."}]},{"t":"Managing a champion","s":"Champions open doors but can narrow your view.","an":"A good friend introducing you at a party: do not only talk to them all night.","h":"Use Shiraz to reach the CIO, clinicians and leaders.","m":"Keep his off-record views off-record. Give him short updates he can forward.","qs":[{"q":"Routing everything through Shiraz:","o":["Narrows your view","Is ideal"],"a":0,"w":"Broaden access."},{"q":"His off-record comments belong in:","o":["Nowhere written","The MoM"],"a":0,"w":"Never repeat."}]},{"t":"Executive communication","s":"Context, finding, implication, decision. Two to four sentences.","an":"A news headline and first paragraph, not the whole article.","h":"\"Discharge is our biggest issue; billing clearance takes 195 minutes; beds are blocked; we suggest focusing on insurer approvals.\"","m":"Use their strategy words: \"speed at every touchpoint\", \"trusted enterprise data\".","qs":[{"q":"Executives first want:","o":["The implication and decision","The architecture"],"a":0,"w":"So what."},{"q":"A number in an executive message needs:","o":["A source","Rounding up"],"a":0,"w":"Traceable."}]},{"t":"Translating technical language","s":"Turn technical facts into what they mean for the business.","an":"A mechanic saying \"your car will be fine for a month, then needs brakes\" instead of part numbers.","h":"\"No write API\" becomes \"new tools can read but not update records\".","m":"Arun gives the fact; you give the meaning; check with Arun before sharing.","qs":[{"q":"\"Batch nightly\" means for users:","o":["Data updates once a day","Real-time alerts"],"a":0,"w":"Daily refresh."},{"q":"Before sharing a technical translation externally:","o":["Check with Arun","Just send it"],"a":0,"w":"Accuracy."}]},{"t":"Saying the right level of certainty","s":"Discussed, proposed, indicated, confirmed, agreed are different levels.","an":"\"Maybe dinner\" is not \"booked a table\".","h":"\"MP Shah indicated interest\" is not \"MP Shah agreed\".","m":"Wrong certainty words in a MoM become false commitments.","qs":[{"q":"Shiraz said \"tentatively okay\" to dates. Write:","o":["MP Shah indicated tentative agreement","MP Shah agreed"],"a":0,"w":"Match the evidence."},{"q":"\"Our current understanding is\" signals:","o":["Best evidence, may change","A final decision"],"a":0,"w":"Honest uncertainty."}]},{"t":"Handling scope requests","s":"New requests are captured, understood, taken to Subhankar, then answered.","an":"A builder asked to add a room: they check cost and time before saying yes.","h":"\"Can you also look at procurement?\"","m":"Never yes or no in the room. Script: \"Let me capture exactly what you need and align internally before I confirm.\"","qs":[{"q":"A COO asks for extra analysis. You say:","o":["Let me capture it and align internally before confirming","Yes, of course"],"a":0,"w":"Scope path."},{"q":"Who decides scope changes?","o":["Subhankar","You"],"a":0,"w":"Governance."}]},{"t":"Vendor neutrality","s":"Respect the client's existing vendors. Position as complementary.","an":"A new contractor does not insult the previous builder in front of the homeowner.","h":"\"We build on what Hospedia delivers.\"","m":"Never criticise ITDose, never hide our involvement, ask factual questions only.","qs":[{"q":"A manager calls Hospedia \"a disaster\". You:","o":["Acknowledge and stay neutral","Agree"],"a":0,"w":"Neutral."},{"q":"Our questions to ITDose should be:","o":["Factual","Evaluative"],"a":0,"w":"Scope, APIs, phases."}]}]}],"gloss":[["ADT","Admission, Discharge, Transfer events","Hospital operations"],["ALOS","Average length of stay","Hospital operations"],["ANC","Antenatal care (pregnancy clinic)","Hospital operations"],["Bed occupancy","% of beds in use","Hospital operations"],["Casualty","Emergency department","Hospital operations"],["CSSD","Central Sterile Services Department; sterilises instruments","Hospital operations"],["DCMO","Deputy Chief Medical Officer","Hospital operations"],["Discharge intimation","Formal notice that a patient is being discharged","Hospital operations"],["HDU","High Dependency Unit; between ward and ICU","Hospital operations"],["HOD","Head of Department","Hospital operations"],["ICU","Intensive Care Unit","Hospital operations"],["IPD","Inpatient department","Hospital operations"],["KPJ","A tower or clinic block at MP Shah (named in Kaizen data)","Hospital operations"],["Lodger","Patient placed in a ward of a different type due to bed shortage","Hospital operations"],["MRD","Medical Records Department","Hospital operations"],["NICU / PICU","Neonatal / Paediatric ICU","Hospital operations"],["NVA time","Non-value-added time: waiting, walking, re-entry","Hospital operations"],["OPD","Outpatient department","Hospital operations"],["OT","Operating theatre","Hospital operations"],["Porter","Staff who move patients and samples","Hospital operations"],["Pre-anaesthesia check","Assessment before surgery","Hospital operations"],["Pseudo-bed","Virtual bed holding a bill while the patient leaves the physical bed","Hospital operations"],["QMS","Queue management system","Hospital operations"],["Review patient","Returning patient (vs new)","Hospital operations"],["Rounds","Doctor visits to inpatients","Hospital operations"],["Sonographer","Performs ultrasound","Hospital operations"],["TAT","Turnaround time","Hospital operations"],["Triage","Initial assessment and prioritisation","Hospital operations"],["UHID","Unique Health ID for each patient","Hospital operations"],["Walk-in","Patient without appointment","Hospital operations"],["3C","Concern, Cause, Countermeasure problem-solving at Kaizen boards","Clinical and quality"],["ACR Appropriateness Criteria","American College of Radiology guidance on which imaging to order","Clinical and quality"],["CDS / CDSS","Clinical decision support (system)","Clinical and quality"],["Clinical governance","Framework keeping care safe and accountable","Clinical and quality"],["CMO / CNO","Chief Medical Officer / Chief Nursing Officer","Clinical and quality"],["Early warning score","Score from vitals indicating deterioration","Clinical and quality"],["ICD-10","International classification of diseases codes","Clinical and quality"],["JCI","Joint Commission International accreditation","Clinical and quality"],["Kaizen","Continuous improvement method; also Kaizen Institute consultancy","Clinical and quality"],["Medico-legal","Cases with legal implications","Clinical and quality"],["Nil by mouth","Patient must not eat","Clinical and quality"],["Pneumothorax","Collapsed lung, visible on X-ray","Clinical and quality"],["QIO / QIRM","Quality improvement officer / quality improvement and risk management","Clinical and quality"],["SOAP note","Subjective, Objective, Assessment, Plan clinical note format","Clinical and quality"],["Structured reporting","Templates with fixed sections (e.g. BI-RADS) enabling analytics and AI","Clinical and quality"],["Adjudication","Insurer's decision to pay or reject a claim","Revenue and insurance"],["Aged debtors","Unpaid amounts by age","Revenue and insurance"],["Charge capture","Recording every billable item","Revenue and insurance"],["Co-pay","Portion the patient pays","Revenue and insurance"],["Credit control","Department managing insurance and corporate debt","Revenue and insurance"],["Credit note","Reduction of an issued bill","Revenue and insurance"],["Debtor days","Average time to collect","Revenue and insurance"],["Denial / rejection","Claim refused by payer","Revenue and insurance"],["EDI","Electronic data interchange with insurers (Smart, M-Tiba, Slade, LCT)","Revenue and insurance"],["eTIMS","KRA electronic tax invoice management system (applicability to confirm)","Revenue and insurance"],["Exclusion","Service not covered by a scheme","Revenue and insurance"],["LPO","Local purchase order","Revenue and insurance"],["Pre-authorisation","Insurer approval before treatment","Revenue and insurance"],["RCM","Revenue cycle management","Revenue and insurance"],["Remittance","Payment advice from insurer","Revenue and insurance"],["SHA / SHIF","Social Health Authority / Social Health Insurance Fund (Kenya public scheme)","Revenue and insurance"],["Split bill","Bill divided across insurer, corporate and patient","Revenue and insurance"],["TPA","Third-party administrator for claims","Revenue and insurance"],["Write-off","Debt removed as uncollectable","Revenue and insurance"],["API","Interface for systems to exchange data","Technology and data"],["Audit trail","Log of who viewed or changed what","Technology and data"],["Bronze / Silver / Gold","Medallion data layers: raw, cleaned, business-ready","Technology and data"],["Data dictionary","Description of every table and field","Technology and data"],["Data lake","Store for raw data of all types","Technology and data"],["Data residency","Where data is physically stored","Technology and data"],["Data warehouse","Curated store for reporting","Technology and data"],["De-identification","Removing personal identifiers","Technology and data"],["DICOM","Medical imaging standard","Technology and data"],["DMS","Document management system","Technology and data"],["EHR / EMR","Shared health record / one organisation's medical record","Technology and data"],["ETL","Extract, transform, load","Technology and data"],["FHIR","Modern web-based healthcare data standard","Technology and data"],["HIS / HMIS","Hospital (management) information system","Technology and data"],["HL7 v2","Widely used healthcare messaging standard","Technology and data"],["Integration engine","Middleware routing messages between systems","Technology and data"],["Interoperability","Systems exchanging data with shared meaning","Technology and data"],["Lakehouse","Lake flexibility with warehouse structure","Technology and data"],["LIS / LIMS","Laboratory information (management) system","Technology and data"],["Master data","Reference lists (patients, items, tariffs)","Technology and data"],["MPI","Master patient index","Technology and data"],["MWL","DICOM modality worklist","Technology and data"],["On-premise","Hosted in the hospital's own servers","Technology and data"],["PACS","Image archive and viewer","Technology and data"],["RBAC","Role-based access control","Technology and data"],["RIS","Radiology information system","Technology and data"],["Sandbox","Safe test environment","Technology and data"],["SSO / AD","Single sign-on / Active Directory","Technology and data"],["UAT","User acceptance testing before go-live","Technology and data"],["VPN","Secure remote network access","Technology and data"],["Webhook","Push notification from one system to another","Technology and data"],["Agent","AI that plans and takes actions through tools","AI"],["Ambient scribe","Listens to consultation and drafts the note","AI"],["ASR","Automatic speech recognition","AI"],["Bias","Systematic error affecting some groups","AI"],["Computer vision","AI interpreting images","AI"],["Drift","Model performance degrading as data changes","AI"],["Embedding","Numeric representation of text for search","AI"],["F1","Balance of precision and recall","AI"],["False negative","Missed true case","AI"],["False positive","False alarm","AI"],["Fine-tuning","Further training a model on specific data","AI"],["Grounding","Tying GenAI answers to source data","AI"],["Guardrails","Controls limiting what AI can say or do","AI"],["Hallucination","Confident but false GenAI output","AI"],["Human-in-the-loop","Human reviews or approves AI output","AI"],["LLM","Large language model","AI"],["ML","Machine learning","AI"],["NLP","Natural language processing","AI"],["PoC","Proof of concept","AI"],["Precision","% of flags that are correct","AI"],["RAG","Retrieval-augmented generation","AI"],["Recall / sensitivity","% of true cases caught","AI"],["Silent mode","AI runs without showing outputs, for validation","AI"],["SLM","Small language model, specialised and lighter","AI"],["Specificity","% of negatives correctly cleared","AI"],["Training data","Examples a model learns from","AI"],["Vector database","Store for embeddings used in RAG","AI"],["Acceptance criteria","Conditions proving a requirement is met","Business analysis and commercial"],["AS-IS / TO-BE","Current / future process","Business analysis and commercial"],["Baseline","Current measured performance","Business analysis and commercial"],["Business case","Justification: value, cost, risk","Business analysis and commercial"],["Change request","Formal scope change","Business analysis and commercial"],["Fishbone","Root-cause diagram","Business analysis and commercial"],["Five Whys","Iterative root-cause questioning","Business analysis and commercial"],["Functional requirement","What a system must do","Business analysis and commercial"],["Gap analysis","Difference between current and target","Business analysis and commercial"],["MoM","Minutes of meeting","Business analysis and commercial"],["Non-functional requirement","Performance, security, usability constraints","Business analysis and commercial"],["RACI","Responsible, Accountable, Consulted, Informed","Business analysis and commercial"],["ROI","Return on investment","Business analysis and commercial"],["SoW","Statement of work","Business analysis and commercial"],["Swimlane","Process map lane per role","Business analysis and commercial"],["T&M","Time and materials","Business analysis and commercial"],["User story","As a [role], I want [x], so that [y]","Business analysis and commercial"]],"icons":["📞","🧾","🩺","🚑","🛏️","❤️","🧤","🧪","🩻","💊","🚪","💳","📑","📊","🗂️","👥","📦","🍽️","🖥️","✅"],"people":[{"n":"Shiraz Dadar","i":"🤝","r":"Our main contact, drives AI adoption","know":["Stepped away as head of IT in 2024; now focuses on AI adoption and board consultation.","Candid. Wants on-the-ground discovery, likes Gantt charts.","Shared the strategy, Hospedia scope and regulatory links quickly."],"ask":["How should we involve the CIO before we arrive?","Which departments should we see in the remote week?","Who approves the discovery plan, and by when?","What would make this discovery a success for you?","What is your current title, so we use it correctly?"],"listen":["Names of people we have not met","Anything about budget or the Board","What the CEO cares about"],"avoid":["Repeating his off-record views on Hospedia.","Routing everything through him alone."]},{"n":"The CIO","i":"🖥️","r":"Runs IT and the Hospedia rollout (name unknown)","know":["Owns the Hospedia implementation.","Owns several Kaizen digital actions, including AI call deflection.","Not yet engaged by us. This is our biggest stakeholder gap."],"ask":["What does success look like for Hospedia go-live?","Which integrations worry you most?","What can Hospedia expose to other systems, and on what terms?","What must any new system respect: security, hosting, data?","How much support capacity does ICT have for new tools?"],"listen":["\"We depend on the vendor for every change\"","\"We have no sandbox\"","Go-live dates and pressure points"],"avoid":["Surprising him with vendor criticism.","Making technical promises without Arun."]},{"n":"Dr Thuku","i":"🩻","r":"Head of Radiology (spelling to confirm)","know":["Radiologist with an IT degree.","Built his own radiology system with AI-assisted coding. Hospedia accepted it cannot replicate it.","Wants AI to push urgent X-rays up his list; thinking about a pneumothorax model."],"ask":["What problem were you solving when you built your system?","What data does it use, and where does it run?","Which studies go unreported today, and what happens to those patients?","What should AI do for you, and what must it never do?","How would you check an AI result before trusting it?"],"listen":["Data location and privacy details","\"We only report acute cases\"","How proud he is of what he built"],"avoid":["Calling his system risky or \"vibe coded\".","Promising fracture AI. Ours was a proof of concept."]},{"n":"CEO","i":"🏛️","r":"Approves the discovery plan","know":["Must approve the dates and plan.","The strategy is his frame: two pillars, three enablers, three phases."],"ask":["Which outcome matters most to you in the next 12 months?","What constraints should we respect: budget, people, timing?","How are investment decisions made here?"],"listen":["Strategy words he repeats","Board expectations","Affordability concerns"],"avoid":["Technical detail.","Any price, even a rough one."]},{"n":"Dr John (COO)","i":"⚙️","r":"Operations (named in Feb 2026)","know":["Named as needed for internal alignment.","Silent since. Confirm he is still in role."],"ask":["Where do patients wait longest, in your view?","Which support services cause the most complaints?","What has already been tried to fix patient flow?"],"listen":["Throughput and bed pressure","Food, linen, parking (top Kaizen complaints)"],"avoid":["Saying yes to extra scope in the room."]},{"n":"ITDose (Hospedia)","i":"🏗️","r":"Hospital system vendor","know":["Signed contract; in UAT, not live.","Phase 1: registration, OPD, doctors, lab, radiology, pharmacy, inventory, finance. Phase 2: queues, patient app, portals.","No AI today. Their AI map is aspirational."],"ask":["Module scope and go-live date per phase?","Which APIs exist, read or write, and can third parties build on them?","What is the plan for historical Kranium data?","Will MP Shah data ever be used to train your models?"],"listen":["What is still being customised","What they say is \"out of scope\""],"avoid":["Any criticism. We complement Hospedia.","Hiding our involvement."]},{"n":"Kaizen study team","i":"📈","r":"MP Shah staff who mapped the patient journey","know":["Analysed 963,766 patient journeys.","Built a tracker of 59 to 62 actions with owners.","Told the Board: quick wins before big spending."],"ask":["Which actions are closed, and which are stuck?","Can we use the Excel tracker?","What surprised you most in the study?"],"listen":["Why actions stalled","Which owners are most engaged"],"avoid":["Appearing to redo or criticise their work."]}],"sims":[{"id":"cc","title":"Credit Control: \"Our biggest problem is rejections\"","intro":"You are in a session with the Head of Credit Control. Virender and Arun are with you.","start":"a","nodes":{"a":{"s":"Head of Credit Control","q":"\"Honestly, our biggest headache is insurance rejections. We lose a lot of money there.\"","c":[{"t":"\"Would an AI tool that predicts denials help you?\"","n":"a1","p":0,"f":"You jumped straight to a solution. She now evaluates your idea instead of describing her problem, and you still do not know why claims are rejected."},{"t":"\"What are the most common reasons claims get rejected, and how do you know?\"","n":"b","p":2,"f":"Good. You asked for the cause and the evidence in one question."},{"t":"\"Hospedia will fix most of that, won't it?\"","n":"a2","p":0,"f":"An assumption, and it pulls the vendor into a pain conversation. You also signal you have not looked."}]},"a1":{"s":"Head of Credit Control","q":"\"Maybe? I don't know what that would look like. Can you send a demo?\"","c":[{"t":"Recover: \"Before any demo, help me understand what actually gets rejected.\"","n":"b","p":1,"f":"Good recovery. Always pull back to the problem."}]},"a2":{"s":"Head of Credit Control","q":"\"They say so. We will see. We raised forty requirements.\"","c":[{"t":"Recover: \"Can you walk us through the top rejection reasons today?\"","n":"b","p":1,"f":"Recovered. Note the forty requirements: ask for the list later."}]},"b":{"s":"Head of Credit Control","q":"\"Exclusions billed by mistake, missing documents, and the EDI dropping claims. We track it in Excel.\"","c":[{"t":"\"Could we see that Excel, even a sample?\"","n":"c","p":2,"f":"Excellent. A workaround is evidence. The sheet may give you baselines and categories."},{"t":"\"So you need an AI to catch exclusions.\"","n":"c2","p":0,"f":"Still solutioning. Exclusions are usually rules; you have not checked how they are configured."},{"t":"\"How many rejections a month, and roughly what value?\"","n":"c","p":2,"f":"Good. You are building the business case baseline."}]},"c2":{"s":"Arun","q":"(quietly) \"Let's check how exclusions are mapped to schemes first.\"","c":[{"t":"\"Thanks Arun. Could you show us how an exclusion is set up for a scheme?\"","n":"c","p":1,"f":"Good use of your technical colleague. Let him lead that thread."}]},"c":{"s":"Head of Credit Control","q":"\"Sure. About 180 rejections a month. The EDI ones are the worst, we resubmit manually.\"","c":[{"t":"\"Which EDI causes most problems? Arun, can you pick up the integration side?\"","n":"end","p":2,"f":"You connected a business finding to the technical owner in real time. That is your core job."},{"t":"\"OK, we will design something for that.\"","n":"end","p":0,"f":"An implicit commitment, with no owner and no scope check. Capture instead, then route."}]},"end":{"end":true}}},{"id":"rad","title":"Radiology: the champion and his system","intro":"Dr Thuku has just demonstrated the radiology system he built himself. He is proud of it.","start":"a","nodes":{"a":{"s":"Dr Thuku","q":"\"So, can Capital Numbers make this production-ready and add AI fracture detection?\"","c":[{"t":"\"Yes, we have done fracture detection before. We can do it.\"","n":"a1","p":0,"f":"A commitment you are not authorised to make, plus a capability claim. Our fracture work was a proof of concept. This is Arun's call and then Subhankar's."},{"t":"\"What you have built shows exactly what the department needs. Can you tell us what problem you were solving first?\"","n":"b","p":2,"f":"Respect first, then problem. He feels heard, and you learn his priorities."},{"t":"\"Vibe-coded tools are risky with patient data.\"","n":"a2","p":0,"f":"True in principle, but it lands as dismissive. You risk losing your strongest clinical champion."}]},"a1":{"s":"Dr Thuku","q":"\"Great. When can you start?\"","c":[{"t":"Recover: \"Let me make sure we understand your workflow and data properly first, so whatever we suggest actually works here.\"","n":"b","p":1,"f":"Recovered, but you created an expectation. Note it for Subhankar."}]},"a2":{"s":"Dr Thuku","q":"\"It is working better than anything the vendors gave us.\"","c":[{"t":"Recover: \"That is clear. Help us understand how you built it, and where it runs.\"","n":"b","p":1,"f":"Recovered by switching to curiosity."}]},"b":{"s":"Dr Thuku","q":"\"Reporting backlog. I cannot report every X-ray. Non-urgent ones just do not get reported.\"","c":[{"t":"\"What happens to those patients today? Do the referring doctors read the images themselves?\"","n":"c","p":2,"f":"You went to impact and risk. That is how you size a clinical problem."},{"t":"\"AI can read the X-rays for you.\"","n":"c","p":0,"f":"Overclaim. AI can help prioritise; the radiologist remains accountable. Never imply replacement."}]},"c":{"s":"Dr Thuku","q":"\"Mostly yes. Some are missed. I would like AI to push urgent ones up my list.\"","c":[{"t":"\"Arun, could you explore with Dr Thuku what data and PACS access a prioritisation tool would need?\"","n":"end","p":2,"f":"Clean handover to the technical owner with a specific question."},{"t":"\"We will put that in our proposal.\"","n":"end","p":0,"f":"Premature. Capture as a signal; the roadmap decides."}]},"end":{"end":true}}},{"id":"ceo","title":"The corridor price question","intro":"Onsite day 4. The CEO stops you in the corridor after a session.","start":"a","nodes":{"a":{"s":"CEO","q":"\"Shiraz tells me about this data lake idea. Roughly what would that cost us?\"","c":[{"t":"\"Around fifty to eighty thousand dollars, depending.\"","n":"a1","p":0,"f":"You invented a number. It will become the anchor for every future conversation. Pricing is Subhankar's."},{"t":"\"It depends on scope, data volume and how it connects to Hospedia. We are assessing that now, and we will bring a reliable view with the roadmap.\"","n":"b","p":2,"f":"Honest, confident and not evasive. You explained what drives the cost."},{"t":"\"I am not sure, I will ask.\"","n":"b","p":1,"f":"Honest, but weak. Explain what the answer depends on so you sound in control."}]},"a1":{"s":"CEO","q":"\"That much? We were thinking much less.\"","c":[{"t":"Recover: \"That was a rough guess and I should not have given one. Let us come back with a properly scoped view.\"","n":"b","p":1,"f":"Owning it is right. Tell Subhankar the same day."}]},"b":{"s":"CEO","q":"\"Fine. What would we actually get from it?\"","c":[{"t":"\"One trusted place for data across Kranium and Hospedia, so reports and future AI use the same numbers. Your strategy calls it trusted enterprise data.\"","n":"c","p":2,"f":"Business value in his language, tied to his own strategy."},{"t":"\"A medallion architecture with bronze, silver and gold layers on a lakehouse.\"","n":"c","p":0,"f":"Technically right, but meaningless to a CEO. Translate."}]},"c":{"s":"CEO","q":"\"Good. Make sure it is in the final presentation.\"","c":[{"t":"\"Will do. I will also make sure Subhankar has your interest on record.\"","n":"end","p":2,"f":"You captured an executive signal and routed it to the commercial owner."},{"t":"\"Absolutely, we will prioritise it.\"","n":"end","p":0,"f":"Prioritisation comes from evidence across all opportunities, not one corridor chat."}]},"end":{"end":true}}},{"id":"scope","title":"Scope creep: \"Can you also review procurement?\"","intro":"Onsite day 3. The COO joins the end of a session and makes a request.","start":"a","nodes":{"a":{"s":"COO","q":"\"While you are here, can your team also do a deep review of our procurement process next week?\"","c":[{"t":"\"Of course, we can fit that in.\"","n":"a1","p":0,"f":"An unauthorised scope commitment. It affects timeline, effort and possibly commercials. Only Subhankar can agree this."},{"t":"\"That sounds valuable. What would you want to come out of it, and what prompted it now?\"","n":"b","p":2,"f":"You understood the request before reacting. That is the first step of the scope path."},{"t":"\"Sorry, that is out of scope.\"","n":"a2","p":0,"f":"Rejecting immediately damages the relationship and may miss a real need or a future opportunity."}]},"a1":{"s":"COO","q":"\"Great, I will tell the procurement team to expect you.\"","c":[{"t":"Recover: \"Let me just confirm timing with my lead first, so we do it properly. I will come back to you tomorrow.\"","n":"b","p":1,"f":"Recovered, but you created an expectation. Tell Subhankar today."}]},"a2":{"s":"COO","q":"\"Oh. I thought this was a hospital-wide review.\"","c":[{"t":"Recover: \"It is broad. Let me understand what you need and check how best to cover it.\"","n":"b","p":1,"f":"Recovered by returning to understanding."}]},"b":{"s":"COO","q":"\"Stock-outs keep delaying procedures. I want to know whether the new system will fix it.\"","c":[{"t":"\"Let me capture exactly that, and align internally on how and when we can look at it. I will confirm by tomorrow.\"","n":"c","p":2,"f":"The scope script, used well: capture, align, confirm, with a time commitment you control."},{"t":"\"Hospedia will definitely fix stock-outs.\"","n":"c","p":0,"f":"A claim about the vendor you cannot make. Stock accuracy may be process, data and configuration."}]},"c":{"s":"You, later","q":"(Back at the hotel.) What do you do next?","c":[{"t":"Send Subhankar a short note: request, why, link to strategy and Kaizen, likely effort, options, decision needed by tomorrow.","n":"end","p":2,"f":"Exactly the escalation structure. Material, clear, with a decision deadline."},{"t":"Ask Virender to start on it tomorrow morning.","n":"end","p":0,"f":"You assigned work that has not been agreed. Scope first, then ownership."}]},"end":{"end":true}}},{"id":"contra","title":"Contradiction: \"The lab is fully integrated\"","intro":"Morning: ICT says the lab system is fully integrated. Afternoon: lab staff show you re-typing analyser results by hand.","start":"a","nodes":{"a":{"s":"Lab technologist","q":"\"We type the results from this screen into that one. Every day.\"","c":[{"t":"\"But ICT told us this morning it was integrated.\"","n":"a1","p":0,"f":"You set two teams against each other in front of a junior staff member. Record, do not confront."},{"t":"\"Could you show me which results you re-type, and roughly how many a day?\"","n":"b","p":2,"f":"You gathered evidence neutrally. Observation beats opinion."}]},"a1":{"s":"Lab technologist","q":"\"Well, maybe for some machines. Not these.\"","c":[{"t":"Recover: \"That is really helpful. Which machines are not connected?\"","n":"b","p":1,"f":"Recovered into specifics. Both statements may be true for different analysers."}]},"b":{"s":"Lab technologist","q":"\"The serology and the two chemistry analysers. Maybe 200 results a day.\"","c":[{"t":"Log it as a contradiction: ICT statement vs lab observation, with a possible explanation (some analysers interfaced, some not). Ask Arun to validate with ICT.","n":"end","p":2,"f":"Perfect discovery discipline: both sources recorded, explanation offered, validation owner assigned."},{"t":"Note that ICT was wrong.","n":"end","p":0,"f":"You chose a side without validation, and the note could leak. Different people often experience the same system differently."}]},"end":{"end":true}}},{"id":"cio","title":"Bringing in the CIO","intro":"Two days before onsite. The CIO has not been in any session. You call Shiraz.","start":"a","nodes":{"a":{"s":"Shiraz","q":"\"Hi Bhavesh. All set for next week?\"","c":[{"t":"\"Almost. Should we be talking to the CIO or not? He seems to be missing.\"","n":"a1","p":0,"f":"Blunt and slightly accusatory. It can read as criticism of Shiraz or the CIO."},{"t":"\"Nearly. Since the CIO owns the Hospedia rollout and several Kaizen actions, would it help if we briefed him directly before we arrive?\"","n":"b","p":2,"f":"You gave a reason rooted in his ownership, and offered help rather than a complaint."}]},"a1":{"s":"Shiraz","q":"\"He is very busy with the go-live.\"","c":[{"t":"Recover: \"Completely understand. Even 20 minutes would help us avoid duplicating his work. Would that be possible?\"","n":"b","p":1,"f":"Recovered by making it small and in his interest."}]},"b":{"s":"Shiraz","q":"\"Good idea. He is stretched, but I will ask. What would you cover?\"","c":[{"t":"\"Our plan, what we have learned from the Hospedia scope, and three questions only he can answer. Twenty minutes.\"","n":"c","p":2,"f":"Specific, short, respectful of his time."},{"t":"\"Everything, really. Our full approach.\"","n":"c","p":0,"f":"Vague and long. Busy executives say no to open-ended asks."}]},"c":{"s":"Shiraz","q":"\"Send me a short note I can forward.\"","c":[{"t":"Send a 5-line note Shiraz can forward, and copy Subhankar on the stakeholder gap.","n":"end","p":2,"f":"You made the champion's job easy and kept governance informed."},{"t":"Email the CIO directly, bypassing Shiraz.","n":"end","p":0,"f":"You went around your champion after he offered to help. That costs trust."}]},"end":{"end":true}}}],"sort":[{"x":"Lab tests are forgotten 4 to 5 times a day and nobody is alerted","a":"Automation","w":"Known rules: if an order is pending beyond a time limit, alert. No learning needed."},{"x":"A quarter of all calls are just people asking to be transferred","a":"Automation","w":"An IVR menu or directory routes these. AI is overkill for a known list of destinations."},{"x":"The Board wants to see discharge time broken down by stage, every day","a":"Analytics","w":"The data exists; people need to see it. A dashboard, not a model."},{"x":"Lab results do not reach the HMIS, so doctors do not know they are ready","a":"Integration","w":"Data is not moving between systems. Connect them first."},{"x":"Consultants arrive late, so booked appointments are not honoured","a":"Process fix","w":"The root cause is behaviour and scheduling discipline. Technology cannot fix a late consultant."},{"x":"Sonographers leave the room to type reports, wasting scan time","a":"AI","w":"Speech-to-text understands spoken language. Even dictaphones help; speech AI goes further."},{"x":"Radiologists cannot report every X-ray; urgent ones need to rise to the top","a":"AI","w":"Interpreting images to prioritise needs computer vision. Clinical validation and oversight required."},{"x":"Insurer EDI systems drop claims, causing rejections","a":"Integration","w":"A broken connection between systems. Fix the interface."},{"x":"Patients arrive for scans without fasting or a full bladder","a":"Automation","w":"Send preparation instructions automatically when the scan is booked. Rules, not AI."},{"x":"Pharmacy and billing want to know tonight who will likely go home tomorrow","a":"AI","w":"Predicting discharges from patterns in history is a predictive model. Useful once data is reliable."},{"x":"The reporting desk is empty when transcriptionists all take lunch at once","a":"Process fix","w":"Stagger the breaks. Kaizen listed this as a zero-cost quick win."},{"x":"Finance cannot see profit and loss by department","a":"Analytics","w":"Reporting on existing data, once revenue mapping is clean."},{"x":"Staff ask HR the same policy questions every week","a":"AI","w":"A policy assistant that answers from approved documents (RAG). Only worth it if volume is real and policies are current."},{"x":"The same patient has three different records","a":"Process fix","w":"Mostly registration discipline and validation rules. Matching tools can help, but process comes first."},{"x":"Pharmacy does not know a discharge has started","a":"Integration","w":"The HIS should notify pharmacy when the discharge event happens. An event or webhook, not AI."},{"x":"Doctors spend evenings writing discharge summaries","a":"AI","w":"Generative AI can draft from the record for doctor review. Real value, but it does not touch the 195-minute billing bottleneck."}],"buckets":["AI","Automation","Analytics","Integration","Process fix"],"sayAll":[{"s":"\"How much will it cost?\"","no":"\"Probably around fifty thousand.\"","yes":"\"It depends on scope, integration and data. We will bring a reliable view once those are confirmed, and Subhankar will take you through it.\""},{"s":"Client criticises Hospedia","no":"\"Yes, we noticed the UI looks very dated too.\"","yes":"\"That is helpful context. Our focus is on complementing what Hospedia delivers.\""},{"s":"\"Can your team also look at procurement next week?\"","no":"\"Sure, we will add it.\"","yes":"\"That sounds valuable. Let me capture exactly what you need and align internally on timing before I confirm.\""},{"s":"We captured something wrongly","no":"\"I am so sorry, that is completely our fault, we will be more careful, apologies again.\"","yes":"\"Thank you for pointing that out. We captured it incorrectly and will correct the documents.\""},{"s":"\"Can you start building now?\"","no":"\"Yes, we are ready.\"","yes":"\"We can plan that properly. First we need to confirm a few dependencies so it succeeds.\""},{"s":"\"Why another workshop?\"","no":"\"We just need more information.\"","yes":"\"It closes one specific gap, how insurance approvals flow, which decides whether this is feasible. We will keep it to 45 minutes.\""},{"s":"\"Are you saying our systems are bad?\"","no":"\"Well, there are a lot of gaps.\"","yes":"\"Not at all. Every hospital has gaps between systems. Our job is to find the most valuable ones to close.\""},{"s":"Client asks if you have done this before","no":"\"We have done this many times.\"","yes":"\"We have relevant work, for example a chest X-ray screening project. Let me share what applies and what would be new here.\""},{"s":"Talking about AI accuracy","no":"\"Our model is 95% accurate.\"","yes":"\"In testing on that project it reached around 81% accuracy. It would need validating on MP Shah data before anyo
