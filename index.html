e fixed asset system and Power BI dashboards. Radiology uses RadWeb PACS plus the head of radiology's own system. The Hospedia contract includes a data migration strategy for master data, transactions and history. Shiraz is weighing whether to load 16 years of EMR history into Hospedia or keep it accessible through an API, and plans a central data lake.","keys":["Kranium old and current databases","Sage (finance), EnQuest (HR and payroll), fixed asset system, Power BI","RadWeb PACS; in-house radiology system; Power Platform apps","Data migration strategy in the Hospedia contract","Central data lake planned by MP Shah"],"an":"Like moving house while some belongings stay in two old storage units.","h":"A doctor needs a 2015 lab result: is it in Hospedia, in old Kranium, or in a future data lake?","m":"Data availability and history decide which analytics and AI are feasible. The data lake is one of the strongest foundations in the roadmap.","mist":["Assuming all history will be in Hospedia","Ignoring that Sage may or may not remain"],"ask":["Which data will be migrated, and how many years?","Will Sage be retained?"],"qs":[{"q":"MP Shah's legacy HMIS is:","o":["Kranium","Sage"],"a":0,"w":"Sage is finance."},{"q":"HR and payroll run on:","o":["EnQuest","RadWeb"],"a":0,"w":"RadWeb is PACS."},{"q":"Shiraz's dilemma is whether history goes into Hospedia or:","o":["Stays accessible by API","Gets deleted"],"a":0,"w":"Migrate vs API."}]},{"t":"Regulation in Kenya","s":"Health data is sensitive personal data under the Data Protection Act 2019; digital health is shaped by the Digital Health Agency.","deep":"The Data Protection Act 2019 and its 2021 regulations require a lawful basis for processing, purpose limitation, security, registration of data controllers and processors, and rules on transfers abroad. The Office of the Data Protection Commissioner enforces it. The Digital Health Act 2023 created the Digital Health Agency, which runs national registries and works toward health data exchange and certification of health systems. SHA and SHIF replaced NHIF for public insurance. Shiraz also said AI giving medical guidance needs approval from the medical regulator before going live.","keys":["Data Protection Act 2019 and 2021 regulations; ODPC is the regulator","Digital Health Agency: registries, data exchange, system certification","SHA/SHIF: public insurance, already in the gap register","Clinical AI may need regulatory approval: authority to confirm"],"an":"Like aviation rules: you can innovate, but certified procedures and data rules come first.","h":"Hosting patient data on a cloud region outside Kenya needs a check against transfer rules.","m":"Relevant to ICT's AWS preference, any GenAI use with patient data, and vendor data-use terms.","mist":["Assuming cloud is automatically allowed","Naming a regulator for clinical AI without confirming it"],"ask":["Which data processing agreements are in place with vendors?","Has MP Shah assessed DHA certification requirements?"],"qs":[{"q":"Health data under Kenyan law is:","o":["Sensitive personal data","Unregulated"],"a":0,"w":"Higher protection."},{"q":"The data protection regulator is:","o":["ODPC","KRA"],"a":0,"w":"Office of the Data Protection Commissioner."},{"q":"SHA replaced:","o":["NHIF","Hospedia"],"a":0,"w":"Public insurance."}]},{"t":"Our engagement","s":"A holistic AI and digital transformation discovery: remote 12 to 16 Oct, onsite 21 Oct to 3 Nov, consolidation into mid-November.","deep":"Shiraz asked for a holistic view: AI, digitisation, telemedicine, digital modules and data, noting which vendor could deliver each item. The remote week covers the Hospedia vendor and the IT department only; all other departments must be met in person. Capital Numbers' team: Arun (technical discovery), Virender (business discovery), you (engagement lead and coordination), Subhankar (overall leadership, governance and commercial). Outputs include the As-Is assessment, pain point register, To-Be map, architecture, PRD and roadmap.","keys":["Holistic scope, vendor-neutral","Remote week: Hospedia and IT only","Onsite: 10 working days with departments","Your role: coordinate, connect, track, escalate"],"an":"Like a building survey before renovation: you inspect every room before proposing changes.","h":"In week one, Arun leads Hospedia sessions while Virender prepares department question sets.","m":"Scope expansions go to Subhankar; you never commit scope, price or timelines yourself.","mist":["Treating the discovery as an AI-only exercise","Making commitments in the room"],"ask":["Which departments will Shiraz schedule, and when?","Will the CIO join the IT session?"],"qs":[{"q":"Who decides scope changes?","o":["Subhankar","You"],"a":0,"w":"Governance."},{"q":"The remote week covers:","o":["Hospedia and IT only","All departments"],"a":0,"w":"Shiraz's email."},{"q":"Scope is:","o":["Holistic, including telemedicine and data","AI only"],"a":0,"w":"30 Sep call."}]},{"t":"The people","s":"Shiraz drives AI adoption; a CIO runs IT and Hospedia; the head of radiology is an AI-minded builder; leadership approves.","deep":"Shiraz Dadar stepped back from leading IT in 2024 and now focuses on AI adoption and board consultation; he helped define Hospedia requirements. A CIO now runs IT and the Hospedia implementation, but we have not yet met him. The head of radiology is a radiologist with an IT degree who built his own radiology system. The CEO approves the discovery plan; a COO was named in February. Department heads own the day-to-day problems.","keys":["Champion: Shiraz","Technical owner: the CIO (to engage)","Clinical champion: head of radiology","Approver: CEO; leadership team"],"an":"Like a project with a sponsor, a technical lead you have not met yet, and an expert user who built his own tools.","h":"Before onsite, ask Shiraz to bring the CIO into the IT session.","m":"A roadmap without the CIO's input risks lacking its main technical owner.","mist":["Routing everything through one person","Assuming Shiraz has final authority"],"ask":["Who approves investment after the discovery?","How should we involve the CIO?"],"qs":[{"q":"Who runs the Hospedia implementation?","o":["The CIO","Shiraz"],"a":0,"w":"Per Shiraz."},{"q":"The head of radiology:","o":["Built his own radiology system","Works for ITDOSE"],"a":0,"w":"Per Shiraz."},{"q":"Our biggest stakeholder gap is:","o":["The CIO","Shiraz"],"a":0,"w":"Not engaged yet."}]}]},{"t":"How a hospital works","e":"🏥","c":"teal","items":[{"t":"Outpatient vs inpatient","s":"Outpatients come and go the same day. Inpatients stay overnight in a bed.","an":"Like a day visit to a bank branch versus checking into a hotel.","h":"An OPD patient sees a doctor, has tests and goes home. An IPD patient is admitted, cared for on a ward and later discharged.","m":"Hospedia covers both through the Patient Administration and Clinical cum IPD suites. The strategy's capacity concern (critical care, HDU, maternity) is an inpatient issue; most daily volume is outpatient.","qs":[{"q":"A patient admitted for surgery is:","o":["Outpatient","Inpatient"],"a":1,"w":"They stay overnight."},{"q":"Most MP Shah patient journeys are:","o":["Inpatient admissions","Insured review outpatients"],"a":1,"w":"Kaizen: about 53% corporate review outpatients."},{"q":"Bed allocation and wristbands belong to:","o":["Inpatient admission","Outpatient triage"],"a":0,"w":"IPD Admission module."}],"deep":"Outpatient care (OPD) covers consultations, tests and minor procedures where the patient goes home the same day. Inpatient care (IPD) begins with an admission decision, a bed, a wristband and a file, and ends with discharge. The two differ in workflow, billing and risk: inpatients generate daily charges, nursing records, medication rounds and insurer pre-authorisation, while outpatients move quickly through many short handoffs.","keys":["OPD: same-day; many short steps","IPD: admission, bed, ward care, discharge","Billing differs: OPD per service, IPD accumulates daily","Insurance pre-authorisation matters most for IPD"],"mist":["Assuming one workflow fits both","Ignoring that inpatient billing runs over many days"],"ask":["What share of revenue comes from inpatients vs outpatients?","Where do outpatients become admissions?"]},{"t":"The patient journey","s":"The full path a patient takes, from first contact to follow-up. Problems hide in the handoffs.","an":"Like an airport: check-in, security, gate, boarding. Delays happen between steps.","h":"Call, arrive, queue, register, triage, consult, tests, pharmacy, pay, leave, follow up.","m":"The strategy commits to \"simplifying patient pathways from appointment to follow-up\". The Hospedia gap register shows the system side of the same journey: queue tokens, registration validation, result alerts, billing prompts. A patient journey study at MP Shah adds the patient's view.","qs":[{"q":"Where do most delays usually hide?","o":["Inside a single step","In handoffs between steps"],"a":1,"w":"Waiting happens between people and systems."},{"q":"At MP Shah, patient sentiment drops most at:","o":["Arrival","Billing, pharmacy, diagnostics, discharge"],"a":1,"w":"Kaizen emotional mapping."},{"q":"The strategy's phrase for this is:","o":["Simplifying patient pathways from appointment to follow-up","Market leadership"],"a":0,"w":"Patient-Centric Care."}],"deep":"The patient journey is every touchpoint from first contact (call, website) through arrival, registration, triage, consultation, diagnostics, pharmacy, payment and follow-up. Delays and errors hide between steps, where one person or system hands over to another. Mapping the journey from the patient's side reveals problems that no single department sees.","keys":["Map from the patient's point of view","Handoffs are where delays and errors live","Each step has people, systems and data","Follow-up is part of the journey"],"mist":["Mapping only one department","Ignoring what happens after discharge"],"ask":["Where do patients most often get lost or wait?","Who owns the patient between departments?"]},{"t":"The revenue cycle","s":"Every step from first contact to the last payment collected.","an":"Like an online order: cart, payment approval, shipping, invoice, refund handling.","h":"Register, pre-authorise, capture charges, code, bill, submit claim, insurer decides, payment, reconcile, collect.","m":"Credit Control raised the largest block of requirements in the Hospedia gap register: EDI integration, clinical vetting, remittance auto-allocation, SHIF handling and aged debtor reports. The strategy names revenue cycle optimisation under Sustainability.","qs":[{"q":"A wrong scheme at registration usually shows up as:","o":["A rejected claim later","A faster discharge"],"a":0,"w":"Errors travel downstream."},{"q":"Pre-authorisation happens:","o":["Before or during treatment","After payment"],"a":0,"w":"Insurer approves cover first."},{"q":"Revenue cycle optimisation appears in the strategy under:","o":["Sustainability","People-Centred Culture"],"a":0,"w":"Financial resilience."}],"deep":"The revenue cycle runs from the first contact to the last payment. Errors early in the cycle (wrong scheme, missing pre-authorisation, uncoded diagnosis) surface late as rejected or delayed claims. In insured-heavy hospitals the cycle involves many payers with different rules, EDI links and reconciliation work.","keys":["Registration and eligibility","Pre-authorisation","Charge capture and coding","Billing, claim submission, adjudication","Payment, reconciliation, collections"],"mist":["Treating billing and credit control as separate problems","Assuming rejections are an AI problem before checking rules and data"],"ask":["What are the top reasons for claim rejections?","How are remittances matched today?"]},{"t":"Insurance in Kenya","s":"Most private patients are covered by insurers or employers. The public scheme is run by SHA through SHIF.","an":"Like travel insurance: you need approval and paperwork before and after.","h":"Hospitals connect to insurers through EDI providers such as Smart, M-Tiba and Slade for verification and claims.","m":"The gap register asks for all insurer e-claims to be integrated, SHIF rebates handled like any other payer, and stops on billing exclusions. MP Shah's strategy names insured patients and corporate clients as priority populations.","qs":[{"q":"EDI providers connect:","o":["Hospitals and insurers","Doctors and pharmacies"],"a":0,"w":"Electronic data interchange."},{"q":"SHA/SHIF is:","o":["Kenya's public health insurance authority and fund","A private insurer"],"a":0,"w":"Replaced NHIF."},{"q":"Exclusions are:","o":["Services not covered by a scheme","Patients refused entry"],"a":0,"w":"Scheme rules."}],"deep":"Private patients are often covered by insurers or employers, using schemes with exclusions, limits and co-pays. Hospitals verify cover, request pre-authorisation and submit claims, often electronically through EDI providers such as Smart, M-Tiba, Slade and LCT. Public insurance is now run by SHA through SHIF, which replaced NHIF. Each payer behaves differently, which makes claims complex.","keys":["Schemes have exclusions, limits and co-pays","EDI providers connect hospitals and insurers","SHA/SHIF is the public scheme","Pre-authorisation delays affect admission and discharge"],"mist":["Assuming one integration fits all insurers","Ignoring SHIF as a distinct payer"],"ask":["Which EDIs cause the most problems?","How is SHIF handled today?"]},{"t":"Turnaround time (TAT)","s":"How long a step takes. The universal language of hospital efficiency.","an":"Like delivery time on an online order.","h":"Lab TAT: sample to result. Discharge TAT: decision to exit. Report TAT: scan to final report.","m":"ICT asked for waiting-time TAT at every service point, and radiology asked for TAT by radiologist, modality and branch. The current discharge TAT report has blank fields despite data existing (gap register). Discharge timing has also been measured in a patient journey study.","qs":[{"q":"Discharge TAT measures:","o":["Admission to discharge","Discharge decision to patient leaving"],"a":1,"w":"Decision to physical exit."},{"q":"Why break TAT into stages?","o":["To find the real bottleneck","To make reports longer"],"a":0,"w":"Billing clearance alone is 195 minutes."},{"q":"ICT asked for waiting-time TAT at:","o":["Every service point","Only radiology"],"a":0,"w":"Gap register, ICT."}],"deep":"TAT is the time a step or process takes: lab TAT (sample to result), report TAT (scan to signed report), discharge TAT (decision to exit), queue waiting time. Measuring TAT by stage reveals the true bottleneck. A dashboard that shows TAT live is often more valuable than any AI.","keys":["Always define start and end points","Break into stages to find bottlenecks","Live TAT dashboards drive behaviour","TAT is the language operations leaders use"],"mist":["Quoting a TAT without its start and end points","Using averages that hide long tails"],"ask":["Where does this TAT start and stop in the system?","Who looks at it, and how often?"]},{"t":"Who runs a hospital","s":"CEO sets strategy; COO runs operations; CFO runs money; CMO and CNO lead doctors and nurses; CIO runs technology; HODs run departments.","an":"Like a company with a board, executives and branch managers, plus expert professionals who are not managed like normal staff.","h":"A doctor may be a private consultant with admitting rights, not an employee.","m":"At MP Shah: the CEO approves the plan; a CIO runs IT and Hospedia; Shiraz drives AI adoption; a COO was named earlier. Kaizen action owners include CMO, DCMO, CNO, CHRO and HODs, which shows how actions are assigned.","qs":[{"q":"Who owns technology systems and vendors?","o":["CMO","CIO"],"a":1,"w":"Chief Information Officer."},{"q":"A private consultant with admitting rights is:","o":["Always a hospital employee","Often independent, using the hospital to treat patients"],"a":1,"w":"Common in private hospitals."},{"q":"A private consultant with admitting rights:","o":["May use the hospital without being an employee","Must be on payroll"],"a":0,"w":"Common in private hospitals."}],"deep":"A hospital mixes corporate management (CEO, COO, CFO, CIO, CHRO) with clinical leadership (CMO, CNO, department heads) and independent professionals (consultants with admitting rights). Decisions often need both management and clinical agreement. Department heads (HODs) own daily operations and are your best source of real problems.","keys":["Corporate: CEO, COO, CFO, CIO, CHRO","Clinical: CMO, DCMO, CNO, HODs","Private consultants may not be employees","Clinical governance approves clinical change"],"mist":["Assuming the IT contact can approve investment","Ignoring clinical leadership in technology decisions"],"ask":["Who signs off a new clinical system?","Which committee reviews digital investments?"]},{"t":"JCI and patient safety","s":"JCI is an international hospital accreditation. It checks safety, documentation and continuous improvement.","an":"Like ISO certification, but for patient safety.","h":"Correct patient ID, safe medication, infection control, audit trails, incident reporting.","m":"MP Shah is JCI-accredited. The gap register asks for JCI nursing templates, audit logs of who viewed records, report revision trails and incident forms. The strategy names incident reporting culture as a strength.","qs":[{"q":"MP Shah's JCI accreditation means new systems must:","o":["Preserve audit trails and safety processes","Avoid documentation"],"a":0,"w":"Safety and traceability."},{"q":"Incident reporting is:","o":["A strength at MP Shah to build on","Something to bypass"],"a":0,"w":"Named as a strength in the strategy."},{"q":"Audit logs of who viewed a record support:","o":["JCI and data protection","Faster billing"],"a":0,"w":"Traceability."}],"deep":"JCI (Joint Commission International) accredits hospitals against international standards: correct patient identification, safe medication, infection control, documentation, audit trails, incident reporting and continuous improvement. Accreditation is re-surveyed periodically, so any system change must keep the hospital compliant.","keys":["Patient identification and safe medication","Documentation and audit trails","Incident reporting and continuous improvement","Re-surveys mean ongoing compliance"],"mist":["Proposing changes that remove audit trails","Ignoring documentation requirements in new tools"],"ask":["Which JCI standards are most at risk in the Hospedia transition?","When is the next JCI survey?"]}]},{"t":"Clinical basics for non-clinicians","e":"🩺","c":"red","items":[{"t":"Vital signs","s":"The basic body measurements taken at almost every patient contact.","deep":"Vital signs are temperature, pulse (heart rate), respiratory rate, blood pressure and oxygen saturation (SpO2), often with pain score, weight and level of consciousness. Typical adult reference values: heart rate about 60 to 100 per minute, respiratory rate about 12 to 20, blood pressure around 120/80, temperature about 36.5 to 37.5°C, SpO2 above 95%. Changes over time matter more than single readings, which is why early warning scores combine them.","keys":["Temperature, pulse, respiration, blood pressure, SpO2","Trends matter more than one reading","Early warning scores combine vitals"],"an":"Like a car dashboard: speed, fuel, temperature. One warning light is worth checking; several together mean stop.","h":"Triage nurses record vitals; ward nurses repeat them every few hours; ICU monitors them continuously.","m":"Gap register asks for vitals machine integration and out-of-range alerts in graph form.","mist":["Treating a single reading as a diagnosis","Ignoring trends"],"ask":["Are vitals entered by hand or from machines?","How are abnormal values escalated?"],"qs":[{"q":"SpO2 measures:","o":["Oxygen saturation","Sugar"],"a":0,"w":"Pulse oximetry."},{"q":"Normal adult resting heart rate is about:","o":["60 to 100","150 to 200"],"a":0,"w":"Reference range."},{"q":"What matters most in vitals?","o":["Trends over time","One reading"],"a":0,"w":"Deterioration."}]},{"t":"How doctors think","s":"History, examination, investigations, diagnosis, plan.","deep":"Doctors gather a history (symptoms, past illnesses, medicines, allergies), examine the patient, form a list of possible diagnoses (the differential), order tests to narrow it, decide on a diagnosis and plan treatment. Documentation follows the same order. Understanding this helps you see where tools fit: history capture, results review, decision support, prescribing and documentation.","keys":["History, examination, differential, tests, diagnosis, plan","Differential diagnosis is a ranked list of possibilities","Documentation mirrors the reasoning"],"an":"Like a detective: gather clues, list suspects, test theories, conclude.","h":"A patient with chest pain: history, ECG, troponin blood test, chest X-ray, then a decision.","m":"Doctors at MP Shah asked for all previous results on one screen and voice dictation: both support this reasoning flow.","mist":["Assuming AI makes the diagnosis","Ignoring the time doctors spend documenting"],"ask":["Where in your consultation does the system slow you down?","What information do you wish you had faster?"],"qs":[{"q":"A differential diagnosis is:","o":["A list of possible diagnoses","The final bill"],"a":0,"w":"Reasoning."},{"q":"Tests are ordered to:","o":["Narrow the possibilities","Increase revenue only"],"a":0,"w":"Clinical purpose."},{"q":"Documentation usually follows:","o":["History, examination, assessment, plan","Billing order"],"a":0,"w":"SOAP-like."}]},{"t":"Common tests","s":"The tests you will hear named most often.","deep":"Blood: full blood count (FBC/CBC), urea and electrolytes (U&E, kidney), liver function tests (LFT), blood sugar and HbA1c (diabetes), lipid profile, C-reactive protein (inflammation), troponin (heart damage), blood cultures (infection), clotting tests. Urine: urinalysis, cultures. Cardiac: ECG, echocardiogram. Imaging: X-ray, ultrasound, CT, MRI, mammography, DEXA. Microbiology: culture and sensitivity. Pathology: biopsy.","keys":["FBC, U&E, LFT, HbA1c, lipids, CRP, troponin","ECG and echo for the heart","Imaging modalities each answer different questions"],"an":"Like a car diagnostic: different tests check different systems.","h":"A diabetic review usually includes HbA1c, kidney function and lipids.","m":"Lab and radiology make up a large share of MP Shah orders, turnaround complaints and gap register requests.","mist":["Mixing up ECG and echo","Assuming imaging is one service"],"ask":["Which tests drive most volume?","Which have the longest turnaround?"],"qs":[{"q":"Troponin indicates:","o":["Heart muscle damage","Liver disease"],"a":0,"w":"Cardiac."},{"q":"HbA1c reflects:","o":["Average sugar over about three months","Kidney function"],"a":0,"w":"Diabetes."},{"q":"An echocardiogram is:","o":["An ultrasound of the heart","An electrical recording"],"a":0,"w":"ECG is electrical."}]},{"t":"Medical specialties","s":"Who does what in a tertiary hospital.","deep":"Medicine (internal medicine, cardiology, nephrology, gastroenterology, endocrinology, neurology, oncology, pulmonology), surgery (general, orthopaedic, neurosurgery, urology, ENT, plastic, cardiothoracic), women and children (obstetrics and gynaecology, paediatrics, neonatology), diagnostics (radiology, pathology), critical care and anaesthesia, emergency medicine, psychiatry, dermatology, ophthalmology, dentistry, and allied health (physiotherapy, dietetics, pharmacy).","keys":["Medical vs surgical specialties","Diagnostics: radiology and pathology","Allied health supports care"],"an":"Like a law firm with partners in different practice areas.","h":"A kidney patient sees nephrology, gets dialysis in the renal unit, and lab tests monitor kidney function.","m":"MP Shah's strategy names maternal, women's and children's health, advanced surgery and critical care, specialist medicine and diagnostics as priority areas.","mist":["Assuming all doctors use the system the same way","Ignoring allied health"],"ask":["Which specialties are growing fastest?","Which run the busiest clinics?"],"qs":[{"q":"Nephrology treats:","o":["Kidneys","Skin"],"a":0,"w":"Renal."},{"q":"Obstetrics relates to:","o":["Pregnancy and childbirth","Bones"],"a":0,"w":"Maternity."},{"q":"Pathology is:","o":["Diagnosis from tissue and fluids","Surgery"],"a":0,"w":"Diagnostics."}]},{"t":"Medical terminology","s":"Prefixes and suffixes let you decode most medical words.","deep":"Common roots: cardio (heart), nephro or renal (kidney), hepato (liver), gastro (stomach), neuro (nerves), pulmo (lungs), derma (skin), osteo (bone), haem or hem (blood), onco (cancer). Suffixes: -itis (inflammation), -ectomy (removal), -otomy (cutting), -scopy (looking inside), -ology (study of), -algia (pain), -emia (in the blood). Prefixes: hyper (high), hypo (low), brady (slow), tachy (fast).","keys":["Roots identify the organ","Suffixes identify the condition or procedure","hyper/hypo, tachy/brady"],"an":"Like Lego bricks: combine parts to build meaning.","h":"Appendectomy is removal of the appendix; tachycardia is a fast heart rate.","m":"Helps you follow clinical conversations in department sessions without interrupting.","mist":["Pretending to understand","Mixing hyper and hypo"],"ask":["Could you explain that term for our notes?"],"qs":[{"q":"-ectomy means:","o":["Removal","Inflammation"],"a":0,"w":"Surgical removal."},{"q":"Hepato refers to:","o":["Liver","Heart"],"a":0,"w":"Liver."},{"q":"Tachycardia is:","o":["Fast heart rate","Slow heart rate"],"a":0,"w":"Tachy = fast."}]},{"t":"Medical abbreviations","s":"The shorthand used in notes and conversation.","deep":"Orders and timing: STAT (immediately), PRN (as needed), OD (once daily), BD (twice daily), TDS (three times), QID (four times), NPO or NBM (nothing by mouth). Routes: PO (by mouth), IV (intravenous), IM (intramuscular), SC (subcutaneous). Notes: Hx (history), Dx (diagnosis), Rx (prescription), Tx (treatment), c/o (complains of), h/o (history of). Others: DNR (do not resuscitate), LAMA/DAMA (left against medical advice), MLC (medico-legal case), GCS (Glasgow Coma Scale).","keys":["Timing: STAT, PRN, OD, BD, TDS","Routes: PO, IV, IM, SC","Notes: Hx, Dx, Rx, Tx"],"an":"Like texting shorthand among professionals.","h":"\"Paracetamol 1 g PO TDS PRN\" means by mouth, up to three times a day, as needed.","m":"You will see these in Hospedia screens and gap register items (e.g. medico-legal case checkbox).","mist":["Guessing abbreviations","Using them with patients"],"ask":["What does this abbreviation mean in your department?"],"qs":[{"q":"STAT means:","o":["Immediately","Daily"],"a":0,"w":"Urgent."},{"q":"IV means:","o":["Intravenous","Four times"],"a":0,"w":"Route."},{"q":"NBM means:","o":["Nil by mouth","New born male"],"a":0,"w":"Fasting."}]},{"t":"Patient safety fundamentals","s":"The core safety practices every system must respect.","deep":"Patient identification with at least two identifiers, safe medication (right patient, drug, dose, route, time), clear handovers, surgical safety checklists, infection prevention, falls prevention, critical result communication, and incident reporting. JCI builds its International Patient Safety Goals around these.","keys":["Two identifiers","Five rights of medication","Handover, surgery, infection, falls","Report incidents"],"an":"Like aviation checklists: routine steps that prevent rare disasters.","h":"Wristband barcode scanning before giving medicine prevents wrong-patient errors.","m":"MP Shah's JCI status and strategy make these non-negotiable in any design.","mist":["Designing workflows that skip identity checks","Removing audit trails"],"ask":["Which safety checks are paper today?"],"qs":[{"q":"Patient ID needs at least:","o":["Two identifiers","One name"],"a":0,"w":"Standard."},{"q":"Five rights of medication include:","o":["Right patient and right dose","Right price"],"a":0,"w":"Safety."},{"q":"JCI safety goals include:","o":["Correct identification and safe medication","Faster billing"],"a":0,"w":"IPSG."}]}]},{"t":"The Kenyan health system","e":"🇰🇪","c":"teal","items":[{"t":"Levels of care","s":"Kenya organises facilities in six levels.","deep":"Level 1: community services. Level 2: dispensaries and clinics. Level 3: health centres. Level 4: primary and sub-county hospitals. Level 5: county referral hospitals. Level 6: national referral hospitals such as Kenyatta National Hospital and Moi Teaching and Referral Hospital. Private hospitals such as MP Shah provide tertiary-level care alongside public facilities.","keys":["Six levels, community to national referral","Level 6: national referral","Private tertiary hospitals complement the public system"],"an":"Like a school system from village schools to national universities.","h":"A complex cardiac case may be referred from a county hospital to a tertiary hospital.","m":"MP Shah positions itself as a regional referral destination for complex care.","mist":["Assuming all hospitals are similar"],"ask":["Where do MP Shah's referrals come from?"],"qs":[{"q":"Level 6 facilities are:","o":["National referral hospitals","Dispensaries"],"a":0,"w":"Top tier."},{"q":"Level 3 is:","o":["Health centres","National referral"],"a":0,"w":"Primary care."},{"q":"MP Shah provides:","o":["Tertiary care","Only primary care"],"a":0,"w":"Specialist level."}]},{"t":"Devolution and governance","s":"Health services are devolved to 47 counties; national government sets policy.","deep":"Since the 2010 Constitution, counties manage most public health services, while the Ministry of Health sets national policy, standards and runs national referral facilities. Regulators include KMPDC (doctors and facilities), Nursing Council of Kenya, Pharmacy and Poisons Board (medicines and health products), Kenya Medical Laboratory Technicians and Technologists Board, and the Kenya Nuclear Regulatory Authority (radiation). Private hospitals are licensed and inspected.","keys":["47 counties run public services","MoH sets national policy","Multiple professional regulators"],"an":"Like a federal system: national rules, local delivery.","h":"A private hospital must keep facility licences, staff licences and radiation licences current.","m":"Compliance obligations shape any new system: licensing data, audit and reporting.","mist":["Assuming one regulator covers everything"],"ask":["Which regulators audit you most often?"],"qs":[{"q":"Doctors are regulated by:","o":["KMPDC","IRA"],"a":0,"w":"Medical council."},{"q":"Public health services are mostly run by:","o":["Counties","Insurers"],"a":0,"w":"Devolution."},{"q":"Medicines are regulated by:","o":["Pharmacy and Poisons Board","ODPC"],"a":0,"w":"PPB."}]},{"t":"SHA and the three funds","s":"The Social Health Authority replaced NHIF, with three funds.","deep":"The Social Health Insurance Act 2023 created the Social Health Authority (SHA), which took over from NHIF in 2024. It manages the Primary Healthcare Fund (PHCF), the Social Health Insurance Fund (SHIF) for higher-level care, and the Emergency, Chronic and Critical Illness Fund (ECCIF). Facilities must be empanelled and submit claims under SHA rules. Implementation has had teething problems that patients and hospitals report.","keys":["SHA replaced NHIF","Three funds: PHCF, SHIF, ECCIF","Separate claims process and tariffs"],"an":"Like a new national insurer with three wallets for different care.","h":"A renal patient's dialysis may be covered under a SHA fund with its own claim rules.","m":"The gap register asks for SHIF rebates, packages and reports; patients reported SHA problems.","mist":["Treating SHA like a private insurer"],"ask":["How are SHA claims handled today?","Which SHA services cause the most issues?"],"qs":[{"q":"SHA replaced:","o":["NHIF","KRA"],"a":0,"w":"Public insurer."},{"q":"Emergency and chronic illness coverage sits in:","o":["ECCIF","PHCF"],"a":0,"w":"Third fund."},{"q":"SHIF covers:","o":["Higher-level care","Only primary care"],"a":0,"w":"Second fund."}]},{"t":"Private insurance market","s":"Many insurers, intermediaries and EDI platforms.","deep":"Private insurers offer individual and corporate schemes with different benefits, limits, exclusions and co-pays. Medical schemes are often administered by TPAs. EDI platforms (Smart, M-Tiba, Slade, LCT and others) handle member verification, pre-authorisation and claims. The Insurance Regulatory Authority regulates insurers.","keys":["Schemes vary widely","TPAs administer some schemes","EDI platforms connect hospitals and insurers"],"an":"Like many airlines each with different baggage rules.","h":"A corporate employee's scheme may cover outpatient up to a limit and require pre-approval for MRI.","m":"Most MP Shah journeys involve corporate or insured patients; credit control complexity follows.","mist":["Assuming one integration fits all"],"ask":["Which insurers account for most volume?"],"qs":[{"q":"A TPA:","o":["Administers claims for insurers or employers","Is a lab test"],"a":0,"w":"Third party administrator."},{"q":"Private insurers are regulated by:","o":["IRA","KMPDC"],"a":0,"w":"Insurance Regulatory Authority."},{"q":"Smart and Slade are:","o":["EDI and claims platforms","Hospitals"],"a":0,"w":"Intermediaries."}]},{"t":"Digital health policy","s":"The Digital Health Act 2023 and national systems.","deep":"The Digital Health Act 2023 established the Digital Health Agency to build an integrated national health information system, registries (clients, facilities, practitioners) and health data exchange, and to certify health systems. Kenya's public facility reporting uses KHIS, built on DHIS2. The Data Protection Act 2019 governs personal data, with the ODPC as regulator.","keys":["Digital Health Agency: registries, exchange, certification","KHIS for national reporting","Data Protection Act applies to all"],"an":"Like building national roads that every hospital system must connect to.","h":"A future requirement may be to share data with national registries in standard formats.","m":"Shiraz flagged DHA conformance as work in progress for HIS providers and facilities.","mist":["Assuming requirements are final"],"ask":["What has DHA asked of Hospedia so far?"],"qs":[{"q":"The Digital Health Act was passed in:","o":["2023","1990"],"a":0,"w":"Recent."},{"q":"KHIS is built on:","o":["DHIS2","Excel"],"a":0,"w":"National reporting."},{"q":"Data protection regulator:","o":["ODPC","PPB"],"a":0,"w":"Office of the Data Protection Commissioner."}]},{"t":"Private hospital landscape in Nairobi","s":"MP Shah competes and collaborates with other major private hospitals.","deep":"Nairobi's private hospital market includes large tertiary hospitals such as Aga Khan University Hospital, The Nairobi Hospital, MP Shah Hospital, Karen Hospital and Gertrude's Children's Hospital, alongside faith-based and smaller hospitals and growing outpatient networks. Competition centres on specialists, diagnostics, insurer relationships, patient experience and convenience.","keys":["Several large tertiary private hospitals","Competition on specialists, diagnostics and experience","Outpatient networks are expanding"],"an":"Like competing premium airlines on the same routes.","h":"Patients choose based on doctor, insurer acceptance, waiting time and reputation.","m":"MP Shah's strategy aims to be the premier patient-centric tertiary institution in East and Central Africa.","mist":["Criticising competitors in conversation"],"ask":["Who do patients compare MP Shah with?"],"qs":[{"q":"MP Shah's ambition is to be:","o":["Premier patient-centric tertiary institution in East and Central Africa","The cheapest clinic"],"a":0,"w":"Strategy."},{"q":"Competition centres on:","o":["Specialists, diagnostics and experience","Parking only"],"a":0,"w":"Market."},{"q":"In client conversations about competitors, you should:","o":["Stay neutral and factual","Criticise them"],"a":0,"w":"Professionalism."}]}]},{"t":"Systems and data","e":"🖥️","c":"indigo","items":[{"t":"HIS and EMR","s":"The HIS runs the hospital's operations. The EMR is the clinical record inside it.","an":"The HIS is the whole airline booking system; the EMR is each passenger's detailed file.","h":"Registration, orders, wards and billing sit in the HIS. Notes, diagnoses and results sit in the EMR.","m":"MP Shah is moving from Kranium to Hospedia. Hospedia's EMR covers treatment charts, medication and vaccination history, lab and radiology reports and discharge summaries. Doctors asked for specialty templates and voice dictation.","qs":[{"q":"Billing lives in:","o":["The HIS","PACS"],"a":0,"w":"Operations."},{"q":"MP Shah's new HIS is:","o":["Kranium","Hospedia"],"a":1,"w":"Kranium is the legacy system."},{"q":"The national direction toward shared records is called:","o":["EHR","QMS"],"a":0,"w":"Electronic health record."}],"deep":"The HIS (or HMIS) is the operational backbone: registration, orders, wards, billing, stores. The EMR is the clinical record inside it: notes, diagnoses, results, medications. An EHR shares records across organisations. When people say \"the system\", they usually mean the HIS.","keys":["HIS: operations; EMR: clinical record","EHR: shared across organisations","Most other systems connect to the HIS"],"mist":["Using EMR and EHR interchangeably","Assuming the EMR holds all history"],"ask":["Which records will be in the Hospedia EMR at go-live?","Where will old notes live?"]},{"t":"LIS, RIS and PACS","s":"LIS runs the lab. RIS runs radiology bookings and reports. PACS stores and shows images.","an":"RIS is the appointment book and report folder; PACS is the photo archive.","h":"Doctor orders a scan in the RIS, images land in PACS, radiologist reports in RIS.","m":"Hospedia includes LIS and RIS modules, PACS integration and licences for 25 lab equipment integrations. MP Shah's PACS is RadWeb; radiology also has its own in-house system.","qs":[{"q":"Images are stored in:","o":["RIS","PACS"],"a":1,"w":"Picture archive."},{"q":"The radiology report is managed in:","o":["RIS","LIS"],"a":0,"w":"Radiology information system."},{"q":"Hospedia's contract includes licences for how many equipment integrations?","o":["25","100"],"a":0,"w":"Additional licences."}],"deep":"The LIS manages lab orders, samples, results and quality control. The RIS manages radiology bookings, worklists and reports. PACS stores and displays images in DICOM format. Analysers connect to the LIS; scanners connect to PACS through worklists. These systems must link to the HIS so results reach doctors.","keys":["LIS: lab workflow","RIS: radiology workflow and reports","PACS: images","All must integrate with the HIS"],"mist":["Assuming RIS stores images","Ignoring analyser interfaces"],"ask":["Which analysers will be bi-directionally interfaced?","How will RadWeb link to Hospedia?"]},{"t":"APIs","s":"A defined doorway one system uses to ask another for data.","an":"Like a restaurant menu: you order through it, you do not walk into the kitchen.","h":"A new app reads lab results from the HIS through an API.","m":"Our Hospedia queries ask which APIs exist, for which modules, and whether third parties may build on them. Radiology asked Hospedia to expose APIs for add-ons.","qs":[{"q":"Read-only API means a new tool can:","o":["View data but not update records","Update everything"],"a":0,"w":"Look, not change."},{"q":"Why ask about third-party rights?","o":["APIs may exist but be contractually restricted","It is a formality"],"a":0,"w":"Rights decide feasibility."},{"q":"\"Batch\" integration means:","o":["Data moves on a schedule, not instantly","Data never moves"],"a":0,"w":"Periodic."}],"deep":"An API is a defined interface that lets one system request or send data to another. APIs can be read-only or read-write, real-time or batch, documented or not. Even when APIs exist, contracts may limit who can use them. APIs are the main route for adding new tools around an HIS without changing its core.","keys":["Read vs write","Real-time vs batch","Documentation and versioning","Contractual rights to use them"],"mist":["Assuming an API exists because the vendor is modern","Forgetting contractual rights"],"ask":["Is there API documentation?","Can third parties use the APIs, and at what cost?"]},{"t":"HL7, FHIR, DICOM","s":"Shared languages for health data. HL7 v2: older messages. FHIR: modern web APIs. DICOM: images.","an":"Like plugs and sockets: standards let devices from different makers connect.","h":"Lab analysers often send HL7; scanners send DICOM; new apps prefer FHIR.","m":"Radiology asked for HL7 and DICOM Modality Worklist support and FHIR exports for research. The Digital Health Agency's national exchange direction makes standards more important over time.","qs":[{"q":"Medical images use:","o":["FHIR","DICOM"],"a":1,"w":"Imaging standard."},{"q":"The modern web-friendly standard is:","o":["HL7 v2","FHIR"],"a":1,"w":"Fast Healthcare Interoperability Resources."},{"q":"A Modality Worklist is part of:","o":["DICOM","HL7 billing"],"a":0,"w":"Imaging standard."}],"deep":"HL7 v2 is the long-established messaging standard for events like admissions and lab results. FHIR is the modern standard using web APIs and resources such as Patient and Observation. DICOM is the standard for medical images and their metadata, including worklists that send exam details to scanners.","keys":["HL7 v2: traditional hospital messages","FHIR: modern, web-based","DICOM: images and worklists"],"mist":["Assuming every system supports FHIR","Confusing DICOM (images) with HL7 (messages)"],"ask":["Which standards does Hospedia support?","Do analysers use HL7?"]},{"t":"Integration vs interoperability","s":"Integration connects systems. Interoperability means both understand the data the same way.","an":"Integration is a phone line; interoperability is speaking the same language.","h":"Two systems may be connected but use different codes for the same test.","m":"Different stakeholders may describe the same link differently: ICT may say a system is integrated while users still re-enter data. Record both views and validate.","qs":[{"q":"Two systems connected but using different codes have:","o":["Integration without interoperability","Full interoperability"],"a":0,"w":"Plumbing, not shared meaning."},{"q":"ICT says integrated; lab staff re-type results. You:","o":["Record both and ask Arun to validate","Decide ICT is wrong"],"a":0,"w":"Never pick a side without evidence."},{"q":"If users re-enter data that is \"integrated\", you should:","o":["Log both views and validate","Assume users are wrong"],"a":0,"w":"Evidence first."}],"deep":"Integration connects systems so data can move. Interoperability means both systems understand that data the same way, with shared codes and meaning. Two systems can be integrated yet still require manual mapping because codes differ.","keys":["Integration: the connection","Interoperability: shared meaning","Codes and master data matter"],"mist":["Taking \"it is integrated\" at face value","Choosing one stakeholder's version without evidence"],"ask":["When data moves, does anyone re-key or correct it?","Do both systems use the same codes?"]},{"t":"Data quality and the patient index","s":"Data is only useful if it is complete, accurate and linked to one patient identity.","an":"Like a contacts list with three entries for the same person.","h":"Duplicate records, free-text fields and blank values break reports and AI.","m":"The gap register asks for duplicate checks, field validations (phone, National ID), drop-downs instead of free text, mandatory diagnosis fields, and fixes for blank report fields.","qs":[{"q":"Duplicate patient records are mainly fixed by:","o":["Process and validation rules","AI alone"],"a":0,"w":"Registration discipline first."},{"q":"A Master Patient Index ensures:","o":["One identity per patient","Faster billing"],"a":0,"w":"Single identity."},{"q":"The cheapest place to fix data quality is:","o":["At entry, e.g. registration","In the final report"],"a":0,"w":"Source."}],"deep":"Data quality covers completeness, accuracy, consistency and timeliness. A Master Patient Index ensures one identity per patient. Free-text fields, duplicates and missing mandatory data corrupt reports and make AI unreliable. Most fixes are process and validation, not technology.","keys":["Completeness, accuracy, consistency, timeliness","One identity per patient","Validate at the point of entry"],"mist":["Hoping AI will clean bad data","Ignoring registration as the source"],"ask":["How many duplicate records exist?","Which fields are free text?"]},{"t":"Data lake and data platform","s":"One central store for data from many systems, organised so reports and AI use the same numbers.","an":"Like a central warehouse instead of stock scattered across many shops.","h":"Raw copies (bronze), cleaned data (silver), business-ready data (gold).","m":"Shiraz plans a central data lake across old Kranium, current Kranium and Hospedia. Finance wants Power BI rebuilt on new databases. The strategy calls for \"trusted enterprise data\".","qs":[{"q":"Why build a data platform before most AI?","o":["AI needs trusted, joined-up data","It is cheaper"],"a":0,"w":"Foundation first."},{"q":"Gold layer data is:","o":["Raw","Business-ready"],"a":1,"w":"Cleaned and modelled."},{"q":"The strategy phrase this supports is:","o":["Trusted enterprise data","Hospotel"],"a":0,"w":"Success measures."}],"deep":"A data platform brings data from many systems into one governed place. A data lake stores raw data cheaply; a warehouse holds structured, curated data; a lakehouse combines both. Medallion layers organise data from raw (bronze) to cleaned (silver) to business-ready (gold). It is the foundation for reliable dashboards and AI.","keys":["Bronze, silver, gold layers","Governance prevents a \"data swamp\"","Independent of any single HMIS"],"mist":["Building AI before the data foundation","Ignoring governance and ownership"],"ask":["Which sources must feed the platform first?","Who owns data definitions?"]}]},{"t":"Healthcare IT in depth","e":"🔌","c":"indigo","items":[{"t":"HL7 v2 messages","s":"The workhorse of hospital integration.","deep":"HL7 v2 messages are text messages made of segments: MSH (header), PID (patient), PV1 (visit), OBR (order), OBX (result). Common message types: ADT (admit, discharge, transfer, e.g. A01 admit, A03 discharge, A04 register, A08 update), ORM or OML (orders), ORU (results). Most analysers and older systems speak HL7 v2.","keys":["Segments: MSH, PID, PV1, OBR, OBX","ADT, order and result messages","Still dominant in hospitals"],"an":"Like standard shipping labels with fixed fields.","h":"When a patient is admitted, an ADT A01 message tells the lab and pharmacy systems.","m":"Ask whether Hospedia sends ADT messages to other systems such as PACS and the radiology head's system.","mist":["Assuming HL7 v2 is plug and play"],"ask":["Which HL7 messages does Hospedia send and receive?"],"qs":[{"q":"ADT A01 means:","o":["Admit","Discharge"],"a":0,"w":"Event type."},{"q":"Results are sent in:","o":["ORU messages","MSH messages"],"a":0,"w":"Observation result."},{"q":"PID segment holds:","o":["Patient identity","Payment"],"a":0,"w":"Patient."}]},{"t":"FHIR in practice","s":"Modern web APIs for health data.","deep":"FHIR represents data as resources such as Patient, Encounter, Observation, DiagnosticReport, MedicationRequest, Appointment, Practitioner, Coverage and Claim, exchanged over REST APIs in JSON. FHIR R4 is the most widely used version. SMART on FHIR adds secure app launch and authorisation.","keys":["Resources and REST APIs","R4 widely adopted","SMART on FHIR for apps"],"an":"Like a menu of standard dishes any kitchen can prepare.","h":"A patient app reads Appointment and DiagnosticReport resources.","m":"Radiology asked for FHIR exports; DHA direction favours standards.","mist":["Assuming FHIR exists everywhere"],"ask":["Is there a FHIR API in Hospedia?"],"qs":[{"q":"Lab values are typically:","o":["Observation resources","Patient resources"],"a":0,"w":"FHIR."},{"q":"SMART on FHIR handles:","o":["App launch and authorisation","Billing"],"a":0,"w":"Security."},{"q":"The common FHIR version is:","o":["R4","R1"],"a":0,"w":"Widely adopted."}]},{"t":"DICOM and imaging workflow","s":"How images are ordered, captured, stored and shared.","deep":"DICOM defines image formats and services. Studies contain series which contain images. Services include C-STORE (send), C-FIND (query), C-MOVE (retrieve), Modality Worklist (send orders to scanners) and MPPS (scanner reports progress). DICOMweb provides web equivalents (QIDO, WADO, STOW). Image-sharing and AI tools usually connect through these.","keys":["Study, series, image","Worklist and MPPS","DICOMweb"],"an":"Like a photo library with albums and a standard way to request photos.","h":"An AI triage tool receives CT studies from PACS via DICOM and returns a flag.","m":"Radiology asked for DICOM Modality Worklist and API exposure.","mist":["Ignoring PACS vendor capabilities"],"ask":["Does RadWeb support DICOMweb?"],"qs":[{"q":"Modality Worklist sends:","o":["Order details to scanners","Bills"],"a":0,"w":"Imaging."},{"q":"C-STORE is used to:","o":["Send images","Delete images"],"a":0,"w":"DICOM service."},{"q":"A study contains:","o":["Series of images","Patients"],"a":0,"w":"Hierarchy."}]},{"t":"Clinical terminologies","s":"Shared codes so systems mean the same thing.","deep":"ICD-10 and ICD-11 code diagnoses; SNOMED CT is a detailed clinical terminology; LOINC codes lab tests and observations; ATC classifies drugs. Consistent codes make reporting, analytics, claims and interoperability possible.","keys":["ICD for diagnoses","SNOMED CT for clinical concepts","LOINC for tests","ATC for drugs"],"an":"Like a shared dictionary across languages.","h":"Two labs calling the same test by different names cannot be compared without LOINC.","m":"Insurers require ICD-10; analytics benefit from consistent coding.","mist":["Assuming free text can be analysed reliably"],"ask":["Which code systems does Hospedia use?"],"qs":[{"q":"LOINC codes:","o":["Lab tests","Diagnoses"],"a":0,"w":"Observations."},{"q":"ICD codes:","o":["Diagnoses","Drugs"],"a":0,"w":"Disease classification."},{"q":"ATC classifies:","o":["Drugs","Imaging"],"a":0,"w":"Medicines."}]},{"t":"Integration engines","s":"Middleware that routes and transforms messages.","deep":"An integration engine (for example open-source Mirth/NextGen Connect or commercial engines) receives messages from one system, transforms them and sends them to others. It reduces point-to-point connections, adds monitoring and retries, and centralises mappings.","keys":["Hub instead of spaghetti","Transform and route","Monitoring and retries"],"an":"Like a postal sorting centre.","h":"Lab, PACS and HIS all exchange messages via one engine instead of many direct links.","m":"A neutral integration layer could connect Hospedia, PACS, the radiology system and future tools.","mist":["Building many point-to-point links"],"ask":["How are interfaces monitored today?"],"qs":[{"q":"An integration engine mainly:","o":["Routes and transforms messages","Stores images"],"a":0,"w":"Middleware."},{"q":"It reduces:","o":["Point-to-point complexity","Staff"],"a":0,"w":"Architecture."},{"q":"A benefit is:","o":["Central monitoring","More passwords"],"a":0,"w":"Operations."}]},{"t":"Data migration","s":"Moving historical data to a new system safely.","deep":"Migration involves profiling source data, mapping fields, cleansing, transforming, test loads, reconciliation (counts and totals) and sign-off. Choices include migrating everything, only active and recent data, or keeping legacy data accessible in an archive or data lake.","keys":["Profile, map, cleanse, load, reconcile","Choose what to migrate","Archive or data lake for the rest"],"an":"Like moving house: decide what to pack, what to store, what to discard.","h":"Migrating 16 years of EMR history is heavy; keeping it accessible via a data platform is an alternative.","m":"Exactly Shiraz's current dilemma; Hospedia's contract has a migration strategy.","mist":["Skipping reconciliation"],"ask":["How will migrated data be verified?"],"qs":[{"q":"Reconciliation checks:","o":["Counts and totals match","Colours"],"a":0,"w":"Accuracy."},{"q":"A common option for old data is:","o":["Archive or data lake","Delete it all"],"a":0,"w":"Accessibility."},{"q":"Migration starts with:","o":["Profiling source data","Go-live"],"a":0,"w":"Understand first."}]}]},{"t":"Security, cloud and data protection","e":"🔒","c":"red","items":[{"t":"Access control","s":"Who can see and do what.","deep":"Identity and access management covers user accounts, roles, permissions and authentication. Role-based access control (RBAC) gives rights by job role. Multi-factor authentication (MFA) adds a second check. Single sign-on (SSO) via Active Directory, SAML or OpenID Connect gives one login. Least privilege means users get only what they need.","keys":["RBAC and least privilege","MFA","SSO"],"an":"Like hotel key cards that open only your room and shared areas.","h":"Private doctors limited to their own inpatients is role-based access.","m":"ICT asked for AD authentication, group-level rights, IP restriction and granular feature security.","mist":["Shared accounts","Excessive rights"],"ask":["How are rights reviewed when staff change roles?"],"qs":[{"q":"Least privilege means:","o":["Only the access needed","Admin for all"],"a":0,"w":"Security."},{"q":"MFA adds:","o":["A second verification factor","More users"],"a":0,"w":"Authentication."},{"q":"SSO gives:","o":["One login across systems","Free access"],"a":0,"w":"Convenience."}]},{"t":"Encryption, backups and recovery","s":"Protecting data and keeping systems running.","deep":"Encrypt data in transit (TLS) and at rest. Back up regularly using the 3-2-1 approach (three copies, two media, one offsite) and test restores. Disaster recovery plans define RPO (acceptable data loss) and RTO (acceptable downtime).","keys":["TLS and encryption at rest","3-2-1 backups, tested","RPO and RTO"],"an":"Like keeping copies of important documents in a safe and a bank.","h":"A ransomware attack is survivable only with tested offline backups.","m":"All branches rely on one database at the main hospital: resilience matters.","mist":["Untested backups"],"ask":["When was the last restore test?"],"qs":[{"q":"3-2-1 means:","o":["Three copies, two media, one offsite","Three servers"],"a":0,"w":"Backups."},{"q":"TLS protects data:","o":["In transit","On paper"],"a":0,"w":"Encryption."},{"q":"RTO is:","o":["Acceptable downtime","Acceptable cost"],"a":0,"w":"Recovery."}]},{"t":"Cloud hosting","s":"Running systems on providers like AWS, Azure or Google Cloud.","deep":"Cloud offers scalability, managed services and resilience, with a shared responsibility model: the provider secures the infrastructure; the customer secures configuration, access and data. Considerations include data residency, cross-border transfer rules, connectivity, cost control and vendor lock-in. Hybrid models keep some systems on-premise.","keys":["Shared responsibility","Data residency and transfers","Cost and lock-in"],"an":"Like renting space in a secure building: the landlord guards the doors, you lock your office.","h":"Hosting Hospedia on AWS Aurora and S3 was requested by ICT.","m":"Kenyan data protection transfer rules must be checked before moving patient data abroad.","mist":["Assuming cloud is automatically secure"],"ask":["Where would data physically reside?"],"qs":[{"q":"In cloud, who secures configuration and access?","o":["The customer","Only the provider"],"a":0,"w":"Shared responsibility."},{"q":"Data residency is about:","o":["Where data is stored","Who owns servers"],"a":0,"w":"Location."},{"q":"A cloud risk is:","o":["Vendor lock-in","Too much paper"],"a":0,"w":"Dependency."}]},{"t":"Data Protection Act essentials","s":"The rules for personal and health data in Kenya.","deep":"Principles include lawfulness, purpose limitation, data minimisation, accuracy, storage limitation, security and accountability. Health data is sensitive and needs stronger safeguards. Controllers and processors must register with the ODPC. Data protection impact assessments (DPIAs) are expected for high-risk processing. Breaches must be notified. Transfers abroad need appropriate safeguards.","keys":["Principles: purpose, minimisation, security","Sensitive health data","DPIA, registration, breach notification","Transfer safeguards"],"an":"Like rules for handling other people's valuables.","h":"Training an AI model on patient data needs a lawful basis and a DPIA.","m":"Our Hospedia query on whether MP Shah data trains vendor models comes from these rules.","mist":["Using patient data for new purposes without checks"],"ask":["Has a DPIA been done for Hospedia?"],"qs":[{"q":"A DPIA is expected for:","o":["High-risk processing","All emails"],"a":0,"w":"Assessment."},{"q":"Data minimisation means:","o":["Collect only what is needed","Delete everything"],"a":0,"w":"Principle."},{"q":"Controllers register with:","o":["ODPC","KRA"],"a":0,"w":"Regulator."}]},{"t":"Anonymisation and pseudonymisation","s":"Reducing identifiability for analytics and AI.","deep":"Pseudonymisation replaces identifiers with codes but can be reversed with a key; it is still personal data. Anonymisation removes the ability to identify individuals and is harder than it looks, especially with rare conditions or images with embedded metadata. DICOM headers and free text often contain identifiers.","keys":["Pseudonymised is still personal data","True anonymisation is hard","Check image metadata and free text"],"an":"Like replacing names with numbers vs shredding the list.","h":"Before using X-rays for AI development, remove identifiers from DICOM headers and burned-in text.","m":"Relevant to any radiology AI work and to data sharing with vendors.","mist":["Assuming removing names is enough"],"ask":["How are datasets de-identified today?"],"qs":[{"q":"Pseudonymised data is:","o":["Still personal data","Fully anonymous"],"a":0,"w":"Reversible."},{"q":"DICOM headers may contain:","o":["Patient identifiers","Nothing"],"a":0,"w":"Metadata."},{"q":"True anonymisation is:","o":["Harder than it looks","Trivial"],"a":0,"w":"Re-identification risk."}]}]},{"t":"AI in healthcare","e":"🤖","c":"violet","items":[{"t":"AI or not AI?","s":"Choose the simplest fix: process, integration, automation, analytics, then AI.","an":"Do not buy a robot to open a door that only needs a handle.","h":"Missed lab tests need an alert rule, not AI.","m":"Many gap register items are configuration, validation, integration or reporting. Radiology's requests include genuine AI candidates (structured reports for AI, AI-flagged abnormalities, appropriateness support).","qs":[{"q":"\"Patients arrive without fasting\" is solved by:","o":["Automated reminders","Computer vision"],"a":0,"w":"Rules."},{"q":"AI is right when the task needs:","o":["Language, images, prediction or generation","Fixed rules"],"a":0,"w":"Simpler options fall short."},{"q":"A reminder SMS when a scan is booked is:","o":["Automation","Computer vision"],"a":0,"w":"Rules."}],"deep":"Most operational problems are solved by simpler means: process fixes, integration, rule-based automation or analytics. AI earns its place when the task requires understanding language, images or speech, predicting outcomes or generating content, and simpler approaches fall short.","keys":["Process, integration, automation, analytics, then AI","AI for language, images, speech, prediction, generation","Honesty about \"not AI\" builds trust"],"mist":["Labelling every idea as AI","Skipping the simple fix"],"ask":["What happens today, and why?","Would a rule or report solve it?"]},{"t":"Types of AI","s":"Predictive models forecast; computer vision reads images; NLP reads text; speech AI transcribes; generative AI writes.","an":"Different tools in a toolbox.","h":"Predict discharges, flag X-rays, extract diagnoses, transcribe dictation, draft summaries.","m":"Radiology points to vision and speech; doctors to speech and generative documentation; finance and operations to analytics and prediction; patient access to conversational AI.","qs":[{"q":"Flagging fractures uses:","o":["Computer vision","NLP"],"a":0,"w":"Images."},{"q":"Drafting a discharge summary uses:","o":["Generative AI","Predictive model"],"a":0,"w":"Text generation."},{"q":"Voice dictation uses:","o":["Speech AI","Computer vision"],"a":0,"w":"ASR."}],"deep":"Predictive models learn from history to forecast; computer vision interprets images; NLP extracts meaning from text; speech AI converts voice to text; generative AI produces text or summaries; agents take actions across systems. Each needs different data and carries different risks.","keys":["Predictive, vision, NLP, speech, generative, agents","Different data needs","Different risk levels"],"mist":["Treating all AI as chatbots","Ignoring data requirements per type"],"ask":["What input does it need: text, images, voice, numbers?","What does it output, and who checks it?"]},{"t":"RAG assistants","s":"An AI that answers questions from approved documents and cites them.","an":"Like a librarian who reads only the hospital's policy books before answering.","h":"A staff assistant answering HR or SOP questions with sources.","m":"Possible uses include staff policy and SOP questions, but need real question volume and current policies. JCI documentation could be a source.","qs":[{"q":"RAG answers from:","o":["Approved documents it retrieves","Its imagination"],"a":0,"w":"Grounded answers."},{"q":"Before building an HR assistant, check:","o":["Question volume and policy accuracy","Screen colours"],"a":0,"w":"Validate need and content."},{"q":"RAG's main safeguard is:","o":["Answering from retrieved sources","Bigger servers"],"a":0,"w":"Grounding."}],"deep":"Retrieval-augmented generation (RAG) lets an AI answer questions from approved documents it retrieves, and cite them. It reduces made-up answers but depends on current, well-organised source documents and clear access controls.","keys":["Answers grounded in approved documents","Citations for trust","Depends on document quality"],"mist":["Building on outdated policies","Assuming staff want a chatbot"],"ask":["How often do staff ask these questions?","Are policies current and centralised?"]},{"t":"Ambient scribe","s":"AI that listens to a consultation and drafts the clinical note for the doctor to approve.","an":"Like a court stenographer who also writes the summary.","h":"Reduces evening documentation for doctors.","m":"Doctors asked for Augnito dictation; Hospedia struggles with voice; a UK vendor pitched an AI layer that structures conversation into HMIS fields.","qs":[{"q":"Who approves the scribe's note?","o":["The doctor","The AI"],"a":0,"w":"Clinician accountability."},{"q":"At MP Shah this space is:","o":["Contested by other vendors","Empty"],"a":0,"w":"A UK vendor pitched it."},{"q":"An ambient scribe's note must be:","o":["Reviewed by the clinician","Filed automatically without review"],"a":0,"w":"Accountability."}],"deep":"An ambient scribe listens to a consultation (with consent), transcribes it and drafts a structured note for the clinician to review and approve. Value depends on accuracy, integration into the EMR and clinician trust.","keys":["Consent and privacy","Clinician reviews every note","EMR integration determines value"],"mist":["Skipping consent","Ignoring how notes enter the EMR"],"ask":["How long do doctors spend documenting?","Would notes need to write back into Hospedia?"]},{"t":"Is the data ready?","s":"Data must exist, be accessible, usable, good quality, have history and labels, flow back, and be governed.","an":"Having ingredients in the cupboard does not mean you can cook the dish tonight.","h":"Denial prediction needs rejection reasons recorded consistently.","m":"Data sits across Kranium databases and soon Hospedia; history may or may not be migrated; rejection reasons may live in Excel. Each affects AI feasibility.","qs":[{"q":"For supervised ML, labels mean:","o":["The correct outcomes are recorded","The data has names"],"a":0,"w":"Training answers."},{"q":"\"Unknown\" in a readiness check is:","o":["A next question for the right owner","A failure"],"a":0,"w":"Turn unknowns into questions."},{"q":"Governed means:","o":["Ownership, purpose and consent are clear","The data is large"],"a":0,"w":"Data protection."}],"deep":"Data readiness has layers: exists, accessible, usable, good quality, enough history, labelled for supervised learning, able to flow back into workflow, and governed for the purpose. \"We have the data\" usually confirms only the first layer.","keys":["Eight layers from exists to governed","Labels are often missing","Unknowns become questions"],"mist":["Assuming access because data exists","Ignoring labels"],"ask":["Where exactly is this data, and who can access it?","How many years exist?"]},{"t":"Judging AI: recall and precision","s":"Recall: did it catch the real cases? Precision: were its alerts right?","an":"A smoke alarm with high recall catches every fire; with low precision it also screams at toast.","h":"For urgent X-ray triage, missing a real case is the dangerous error.","m":"Any radiology AI at MP Shah must be validated on MP Shah images. Our fracture work was a proof of concept; quote no accuracy without context.","qs":[{"q":"A false negative is:","o":["A missed real case","A false alarm"],"a":0,"w":"Dangerous in screening."},{"q":"Low precision causes:","o":["Alert fatigue","Missed cases"],"a":0,"w":"Too many false alarms."},{"q":"Silent mode means:","o":["AI runs without clinicians relying on it, for validation","AI is switched off"],"a":0,"w":"Safe testing."}],"deep":"Recall measures how many real cases the AI catches; precision measures how many of its alerts are correct. In screening, missing real cases (false negatives) is the dangerous error; too many false alarms cause alert fatigue. Performance must be validated on local data before anyone relies on it.","keys":["Recall: real cases caught","Precision: alerts that are right","Validate locally, ideally in silent mode first"],"mist":["Quoting one accuracy number","Skipping local validation"],"ask":["On what data was this measured?","How would we validate it here?"]},{"t":"Clinical vs non-clinical AI","s":"Clinical AI affects diagnosis or treatment; non-clinical AI affects operations.","an":"Autopilot versus the airline's booking chatbot.","h":"Imaging AI needs validation and oversight; an HR assistant needs less.","m":"The strategy says AI must not substitute for clinical accountability. Shiraz said medical guidance AI needs regulatory approval before going live.","qs":[{"q":"Which needs heavier governance?","o":["Radiology triage","HR policy assistant"],"a":0,"w":"Clinical risk."},{"q":"In clinical AI the final decision belongs to:","o":["The clinician","The model"],"a":0,"w":"Accountability."},{"q":"The strategy's stance is that AI:","o":["Supports, never replaces, clinical accountability","Replaces doctors"],"a":0,"w":"Data and Digitisation section."}],"deep":"Clinical AI influences diagnosis or treatment and needs clinical validation, oversight, and possibly regulatory approval. Non-clinical AI supports operations and carries lower but real risk. Patient-facing non-clinical tools can still cause harm if they give wrong information.","keys":["Clinical: heavier governance","Non-clinical: faster to value, still governed","Clinician stays accountable"],"mist":["Treating clinical AI like an IT project","Assuming non-clinical means risk-free"],"ask":["Who would clinically validate this?","Does it need regulatory approval?"]},{"t":"PoC, pilot, production","s":"PoC tests feasibility; pilot tests real use with few users; production is supported and integrated for all.","an":"Recipe test, then a soft launch, then the full restaurant menu.","h":"Silent-mode testing on past scans before any clinician relies on AI.","m":"Proposal V1.1 included indicative PoC hypotheses; the discovery should validate which, if any, justify a PoC.","qs":[{"q":"A PoC proves:","o":["Technical feasibility","Hospital-wide value"],"a":0,"w":"One uncertainty."},{"q":"A good PoC answers:","o":["What will we know after that we do not know now?","How much can we bill?"],"a":0,"w":"Specific question."},{"q":"A pilot mainly tests:","o":["Workflow fit and adoption","Only the model"],"a":0,"w":"Real use."}],"deep":"A proof of concept answers one specific technical question. A pilot tests real workflow use with a small group. Production is integrated, supported and monitored for all intended users. Each stage needs explicit success criteria and a decision at the end.","keys":["PoC: feasibility","Pilot: workflow and adoption","Production: supported and integrated"],"mist":["Calling a pilot a product","Running a PoC with no question to answer"],"ask":["What will we know after this that we do not know today?","What decision follows?"]}]},{"t":"AI in depth","e":"🧠","c":"violet","items":[{"t":"How machine learning works","s":"Learning patterns from examples.","deep":"A model learns from training data, is tuned on validation data, and is tested on unseen test data. Features are inputs; labels are correct answers. Overfitting means memorising training data and failing on new data. Performance must be measured on data like the real setting.","keys":["Train, validate, test","Features and labels","Overfitting"],"an":"Like a student who memorises past papers vs one who understands the subject.","h":"A no-show model trained on 2023 data may fail after scheduling changes.","m":"Any MP Shah model must be tested on MP Shah data.","mist":["Testing on training data"],"ask":["What data was the model tested on?"],"qs":[{"q":"Overfitting means:","o":["Doing well on training but poorly on new data","Too little data storage"],"a":0,"w":"Generalisation."},{"q":"Labels are:","o":["Correct answers","Column names"],"a":0,"w":"Supervised learning."},{"q":"Test data should be:","o":["Unseen during training","The training set"],"a":0,"w":"Honest evaluation."}]},{"t":"Large language models","s":"The engines behind chat assistants.","deep":"LLMs predict text token by token, trained on huge text corpora. Key concepts: tokens (word pieces), context window (how much text fits), temperature (randomness), prompts (instructions), hallucination (confident errors). They can summarise, draft, extract and answer, but need grounding and checks in healthcare.","keys":["Tokens and context window","Prompts and temperature","Hallucination risk"],"an":"Like a very well-read intern who writes fluently but sometimes invents.","h":"An LLM drafts a discharge summary; the doctor reviews.","m":"Shiraz uses Copilot and a paid GenAI tool; MP Shah staff may already use LLMs informally.","mist":["Trusting outputs without review","Pasting patient data into public tools"],"ask":["Which GenAI tools do staff use today, and with what data?"],"qs":[{"q":"A context window is:","o":["How much text the model can consider","A screen size"],"a":0,"w":"Capacity."},{"q":"Hallucination is:","o":["Confident but false output","A hardware fault"],"a":0,"w":"Risk."},{"q":"Higher temperature means:","o":["More random outputs","Faster outputs"],"a":0,"w":"Setting."}]},{"t":"RAG vs fine-tuning","s":"Two ways to make an LLM use your knowledge.","deep":"RAG retrieves relevant documents at question time and asks the model to answer from them, with citations; updating knowledge means updating documents. Fine-tuning changes the model's weights with examples; it suits style and format more than fast-changing facts. Most enterprise assistants start with RAG.","keys":["RAG: retrieve then generate","Fine-tuning: change the model","Start with RAG for knowledge"],"an":"RAG is an open-book exam; fine-tuning is studying until you remember.","h":"A policy assistant using RAG updates instantly when a policy changes.","m":"Policies, SOPs and JCI documents would be RAG sources.","mist":["Fine-tuning for frequently changing facts"],"ask":["How often do these documents change?"],"qs":[{"q":"RAG retrieves:","o":["Relevant documents at question time","New model weights"],"a":0,"w":"Grounding."},{"q":"Fine-tuning suits:","o":["Style and format","Daily-changing facts"],"a":0,"w":"Use case."},{"q":"Most assistants start with:","o":["RAG","Training from scratch"],"a":0,"w":"Practical."}]},{"t":"Agents and tool use","s":"AI that takes actions, not just answers.","deep":"Agents plan steps and call tools (APIs, databases, systems) to complete tasks, such as booking appointments or updating records. They need strict permissions, approvals for sensitive actions, logging and the ability to undo. Read-only agents are much safer than agents that write to clinical systems.","keys":["Plan and call tools","Permissions and approvals","Read-only first"],"an":"Like giving an assistant your calendar vs your bank card.","h":"An agent that books appointments must not double-book or override clinician blocks.","m":"Agents would need Hospedia APIs with write access and strong governance.","mist":["Granting broad write access"],"ask":["What actions would it take, and who approves?"],"qs":[{"q":"Safest agents are:","o":["Read-only","Full write access"],"a":0,"w":"Risk."},{"q":"Agents need:","o":["Logging and approvals","No oversight"],"a":0,"w":"Governance."},{"q":"Agents call:","o":["Tools and APIs","Only humans"],"a":0,"w":"Actions."}]},{"t":"Evaluating AI systems","s":"Proving it works before and after go-live.","deep":"Use a golden test set reflecting real cases, define success metrics (accuracy, recall, time saved, user satisfaction), compare with current practice, run silent mode, then a controlled pilot. After go-live, monitor drift, errors and usage. For GenAI, use human review of samples and track hallucination rates.","keys":["Golden test set","Silent mode, then pilot","Monitor drift"],"an":"Like a driving test followed by ongoing road checks.","h":"A radiology triage tool is run silently for weeks and compared with radiologist reports.","m":"Any proposal should include an evaluation plan, not just a demo.","mist":["Judging by demos"],"ask":["How will we know it works here?"],"qs":[{"q":"Drift means:","o":["Performance changes as data changes","Model speed"],"a":0,"w":"Monitoring."},{"q":"A golden set is:","o":["A curated test set","A premium licence"],"a":0,"w":"Evaluation."},{"q":"Demos prove:","o":["Little about real performance","Everything"],"a":0,"w":"Validation."}]},{"t":"Bias, fairness and explainability","s":"Making sure AI works for everyone and can be understood.","deep":"Models can perform worse for some groups if training data under-represents them. Fairness checks compare performance across groups. Explainability shows why a model made a prediction, which helps clinicians trust and challenge it. Models trained abroad may not reflect Kenyan populations.","keys":["Check performance by group","Local populations differ","Explain outputs where possible"],"an":"Like a uniform that fits some body types badly.","h":"A skin model trained mostly on lighter skin may underperform on darker skin.","m":"Validate any imported model on MP Shah patients.","mist":["Assuming global models fit locally"],"ask":["Was it validated on African populations?"],"qs":[{"q":"Bias can arise from:","o":["Unrepresentative training data","Fast servers"],"a":0,"w":"Data."},{"q":"Explainability helps:","o":["Clinicians trust and challenge outputs","Reduce costs only"],"a":0,"w":"Trust."},{"q":"Imported models should be:","o":["Validated locally","Used as is"],"a":0,"w":"Fit."}]},{"t":"Software as a medical device","s":"When AI software is regulated like a device.","deep":"Software that diagnoses, treats or influences clinical decisions may be regulated as a medical device (SaMD) in many jurisdictions, with evidence and approval requirements. In Kenya, health products are regulated by the Pharmacy and Poisons Board; clinical practice by KMPDC. Requirements for AI are evolving, so check before deploying clinical AI.","keys":["Clinical AI may be a medical device","Approval needs evidence","Kenyan rules evolving"],"an":"Like a new drug needing approval before sale.","h":"An AI that flags fractures for treatment decisions may need regulatory clearance.","m":"Shiraz mentioned medical regulator approval for AI giving medical guidance.","mist":["Treating clinical AI as ordinary software"],"ask":["Which regulator would review this here?"],"qs":[{"q":"SaMD stands for:","o":["Software as a medical device","Standard medical data"],"a":0,"w":"Regulation."},{"q":"In Kenya, health products are regulated by:","o":["Pharmacy and Poisons Board","IRA"],"a":0,"w":"PPB."},{"q":"Clinical AI requirements are:","o":["Evolving","Fixed forever"],"a":0,"w":"Check current rules."}]}]},{"t":"Hospital finance and operations metrics","e":"📊","c":"amber","items":[{"t":"Bed metrics","s":"Occupancy, length of stay and turnover define inpatient capacity.","deep":"Bed occupancy is the share of beds filled; sustained levels above roughly 85% usually cause flow problems. Average length of stay (ALOS) is average inpatient days. Bed turnover is admissions per bed over a period. Shorter, appropriate stays increase capacity without new beds.","keys":["Occupancy","ALOS","Bed turnover"],"an":"Like hotel occupancy and average nights per guest.","h":"Cutting ALOS by half a day in a busy ward can free several beds.","m":"MP Shah refers patients out due to capacity: bed metrics link directly to strategy.","mist":["Treating high occupancy as always good"],"ask":["What is occupancy by ward?","What drives long stays?"],"qs":[{"q":"ALOS is:","o":["Average inpatient days","Annual loss"],"a":0,"w":"Length of stay."},{"q":"Occupancy above about 85% often means:","o":["Flow problems","Spare capacity"],"a":0,"w":"Pressure."},{"q":"Reducing ALOS mainly:","o":["Frees capacity","Reduces staff"],"a":0,"w":"Capacity."}]},{"t":"Revenue metrics","s":"How hospitals measure income.","deep":"Common measures: revenue by department and service line, average revenue per occupied bed (ARPOB), revenue per outpatient visit, payer mix (share by insurer, corporate, cash, SHA), case mix (complexity of cases), and conversion (OPD to admission, consultation to diagnostics).","keys":["ARPOB","Payer mix","Case mix","Conversion rates"],"an":"Like a retailer tracking revenue per store and per customer.","h":"A shift towards complex surgery raises case mix and ARPOB.","m":"The strategy targets diversified revenue and attracting complex regional referrals.","mist":["Focusing on volume only"],"ask":["Which service lines grow fastest?"],"qs":[{"q":"Payer mix is:","o":["Share of revenue by payer type","Staff mix"],"a":0,"w":"Revenue."},{"q":"Case mix reflects:","o":["Complexity of cases","Number of beds"],"a":0,"w":"Acuity."},{"q":"ARPOB rises when:","o":["More revenue per occupied bed","Fewer beds exist"],"a":0,"w":"Yield."}]},{"t":"Revenue cycle metrics","s":"How well the hospital turns care into cash.","deep":"Clean claim rate (claims accepted first time), denial rate, days in accounts receivable (DSO), unbilled revenue, charge lag (time from service to charge), collection rate, and write-offs. Small improvements in these can be worth more than new services.","keys":["Clean claim rate","Denial rate","DSO","Charge lag"],"an":"Like a business chasing invoices: faster, cleaner billing means healthier cash.","h":"A late surgeon charge increases charge lag and discharge time.","m":"Credit Control's gap register requests are almost all about these metrics.","mist":["Ignoring revenue cycle in favour of clinical AI"],"ask":["What is your denial rate by payer?"],"qs":[{"q":"DSO is:","o":["Days to collect payment","Doctor ses
